[package]
name = "trillionnium-dbus"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[features]
default = []
# Historical generic plan/approval/effect service entrypoints. Android product
# builds use measured Direct adapters and leave this feature disabled.
legacy-plan-execution = ["trillionnium-tool-runtime/legacy-authority-effects"]

[dependencies]
trillionnium-audit-sqlite.workspace = true
trillionnium-os-types.workspace = true
trillionnium-policy-system.workspace = true
trillionnium-task-registry.workspace = true
trillionnium-tool-runtime.workspace = true
serde_json.workspace = true

[dev-dependencies]
trillionnium-tool-runtime = { workspace = true, features = ["legacy-authority-effects"] }
