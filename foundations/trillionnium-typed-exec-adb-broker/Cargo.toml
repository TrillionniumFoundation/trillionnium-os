[package]
name = "trillionnium-typed-exec-adb-broker-foundation"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

# This is deliberately a standalone source foundation. It is not a member of
# the Trillionnium OS product workspace and cannot enter an Android image by
# merely existing in this repository.
[workspace]

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
trillionnium-os-types = { path = "../../crates/trillionnium-os-types" }
