# Install as a drop-in for the desktop Actions runner service:
#   actions.runner.TrillionniumFoundation.desktop.service.d/external-disk.conf
#
# The runner workspace is a symlink into the canonical removable filesystem.
# Keep the listener stopped unless that mount is present, and stop all worker
# descendants if it disappears while a job is running.
[Unit]
RequiresMountsFor=/data/toshiba-dev
After=data-toshiba\x2ddev.mount network-online.target
BindsTo=data-toshiba\x2ddev.mount
ConditionPathIsMountPoint=/data/toshiba-dev

[Service]
KillMode=control-group
