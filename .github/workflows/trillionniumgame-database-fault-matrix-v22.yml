name: TrillionniumGame database fault matrix v22

on:
  push:
    branches: [ci/trillionniumgame-exact-head-relay-v1]
    paths: ['.github/workflows/trillionniumgame-database-fault-matrix-v22.yml']
  workflow_dispatch:

permissions:
  contents: read

env:
  TARGET_REPOSITORY: TrillionniumFoundation/TrillionniumGame
  EXPECTED_HEAD: 45bab742b536f62c8d4d8b4df13207fac9fae97e
  POSTGRES_IMAGE: postgres:17.6-alpine3.22@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
  COCKROACH_IMAGE: cockroachdb/cockroach:v24.1.2@sha256:e0358aa9025310a94e7d7b69a4564249dd326fddd8049410f487f1243e6ea5a3

jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ env.TARGET_REPOSITORY }}
          ref: ${{ env.EXPECTED_HEAD }}
          path: source
          fetch-depth: 1
          persist-credentials: false
      - name: Install exact Rust
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.85.1
      - name: Validate source and tests
        working-directory: source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          cargo fmt --all -- --check
          cargo test --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          python3 -m compileall -q scripts/check-pgwire-catalog.py
          python3 scripts/check-pgwire-persistence-adapter.py
          git diff --check
          test -z "$(git status --porcelain --untracked-files=no)"

  database:
    strategy:
      fail-fast: false
      matrix:
        profile: [postgresql, cockroachdb]
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ env.TARGET_REPOSITORY }}
          ref: ${{ env.EXPECTED_HEAD }}
          path: source
          fetch-depth: 1
          persist-credentials: false
      - name: Install exact Rust
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal
          rustup default 1.85.1
      - name: Run rollback, response-loss, restart and catalog matrix
        working-directory: source
        shell: bash
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          evidence="evidence/${PROFILE}"
          mkdir -p "$evidence"
          container="trnm-fault-${PROFILE}-${GITHUB_RUN_ID}"
          cleanup() { docker rm -f "$container" >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          if [[ "$PROFILE" == postgresql ]]; then
            image="$POSTGRES_IMAGE"
            port=55432
            migration=migrations/postgresql/0001_foundation_up.sql
            database_url="postgres://trnm:trnm-pass@127.0.0.1:${port}/trnm"
            docker run -d --name "$container" -p "${port}:5432" \
              -e POSTGRES_USER=trnm -e POSTGRES_PASSWORD=trnm-pass -e POSTGRES_DB=trnm \
              "$image" > "$evidence/container-id.txt"
            for attempt in $(seq 1 90); do
              docker exec "$container" pg_isready -U trnm -d trnm >/dev/null 2>&1 && break
              sleep 1
            done
            docker exec "$container" pg_isready -U trnm -d trnm
            docker exec -i "$container" psql -v ON_ERROR_STOP=1 -U trnm -d trnm < "$migration" \
              > "$evidence/migration.log" 2>&1
            sql() { docker exec "$container" psql -v ON_ERROR_STOP=1 -At -U trnm -d trnm -c "$1"; }
          else
            image="$COCKROACH_IMAGE"
            port=52657
            migration=migrations/cockroachdb/0001_foundation_up.sql
            database_url="postgres://root@127.0.0.1:${port}/trnm?sslmode=disable"
            docker run -d --name "$container" -p "${port}:26257" \
              "$image" start-single-node --insecure --store=type=mem,size=1GiB \
              --listen-addr=0.0.0.0:26257 --http-addr=0.0.0.0:8080 \
              > "$evidence/container-id.txt"
            for attempt in $(seq 1 120); do
              docker exec "$container" cockroach sql --insecure --host=127.0.0.1:26257 \
                --execute='SELECT 1' >/dev/null 2>&1 && break
              sleep 1
            done
            docker exec "$container" cockroach sql --insecure --host=127.0.0.1:26257 \
              --execute='CREATE DATABASE IF NOT EXISTS trnm' >/dev/null
            docker exec -i "$container" cockroach sql --insecure --host=127.0.0.1:26257 \
              --database=trnm --set=errexit=true < "$migration" > "$evidence/migration.log" 2>&1
            sql() { docker exec "$container" cockroach sql --insecure --host=127.0.0.1:26257 \
              --database=trnm --format=tsv --execute="$1" | tail -n +2; }
          fi

          docker inspect "$container" > "$evidence/container-inspect.json"
          docker image inspect "$image" > "$evidence/image-inspect.json"
          sql 'SELECT version()' > "$evidence/database-version.txt"

          TRNM_DATABASE_URL="$database_url" TRNM_DATABASE_PROFILE="$PROFILE" \
            cargo test -p trnm-persistence-pg --test fault_matrix --locked -- --nocapture \
            2>&1 | tee "$evidence/fault-matrix.log"

          TRNM_DATABASE_URL="$database_url" TRNM_DATABASE_PROFILE="$PROFILE" \
            TRNM_RECOVERY_PHASE=seed cargo test -p trnm-persistence-pg --test recovery --locked -- --nocapture \
            2>&1 | tee "$evidence/recovery-seed.log"
          docker restart "$container" > "$evidence/restart.log"
          if [[ "$PROFILE" == postgresql ]]; then
            for attempt in $(seq 1 90); do docker exec "$container" pg_isready -U trnm -d trnm >/dev/null 2>&1 && break; sleep 1; done
          else
            for attempt in $(seq 1 120); do docker exec "$container" cockroach sql --insecure --host=127.0.0.1:26257 --execute='SELECT 1' >/dev/null 2>&1 && break; sleep 1; done
          fi
          TRNM_DATABASE_URL="$database_url" TRNM_DATABASE_PROFILE="$PROFILE" \
            TRNM_RECOVERY_PHASE=verify cargo test -p trnm-persistence-pg --test recovery --locked -- --nocapture \
            2>&1 | tee "$evidence/recovery-verify.log"

          sql "SELECT table_name FROM information_schema.tables WHERE table_schema='public' ORDER BY table_name" > "$evidence/tables.txt"
          sql "SELECT table_name || '|' || column_name FROM information_schema.columns WHERE table_schema='public' ORDER BY table_name, ordinal_position" > "$evidence/columns.txt"
          sql "SELECT table_name || '|' || constraint_name || '|' || constraint_type FROM information_schema.table_constraints WHERE table_schema='public' ORDER BY table_name, constraint_name" > "$evidence/constraints.txt"
          if [[ "$PROFILE" == postgresql ]]; then
            sql "SELECT tablename || '|' || indexname || '|' || indexdef FROM pg_indexes WHERE schemaname='public' ORDER BY tablename,indexname" > "$evidence/indexes.txt"
          else
            docker exec "$container" cockroach sql --insecure --host=127.0.0.1:26257 --database=trnm \
              --format=tsv --execute='SHOW CREATE ALL TABLES' > "$evidence/indexes.txt"
          fi
          python3 scripts/check-pgwire-catalog.py \
            --tables "$evidence/tables.txt" --columns "$evidence/columns.txt" \
            --constraints "$evidence/constraints.txt" --indexes "$evidence/indexes.txt" \
            | tee "$evidence/catalog-check.log"

          if sql "INSERT INTO trnm_entity_heads(entity_id,revision,last_event_sequence,authority_generation,state_digest,updated_at_ms) VALUES ('x',0,0,1,'x',0)" > "$evidence/invalid-row.log" 2>&1; then
            echo 'invalid row unexpectedly accepted' >&2
            exit 1
          fi
          if [[ "$PROFILE" == postgresql ]]; then
            if docker exec -i "$container" psql -v ON_ERROR_STOP=1 -U trnm -d trnm < "$migration" > "$evidence/reapply.log" 2>&1; then
              echo 'migration reapply unexpectedly succeeded' >&2; exit 1
            fi
          else
            if docker exec -i "$container" cockroach sql --insecure --host=127.0.0.1:26257 --database=trnm --set=errexit=true < "$migration" > "$evidence/reapply.log" 2>&1; then
              echo 'migration reapply unexpectedly succeeded' >&2; exit 1
            fi
          fi
          printf '{"schema":"trillionnium.pgwire-fault-matrix.v2","profile":"%s","transaction_rollback":true,"response_loss_replay":true,"restart_recovery":true,"catalog_verified":true,"negative_constraints":true,"migration_reapply_rejected":true,"backup_restore":false,"failover":false}\n' "$PROFILE" > "$evidence/summary.json"
          find "$evidence" -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > "$evidence/SHA256SUMS"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trillionniumgame-database-fault-v22-${{ matrix.profile }}-${{ env.EXPECTED_HEAD }}
          path: source/evidence/${{ matrix.profile }}
          if-no-files-found: error
          retention-days: 30

  all-gates:
    if: always()
    needs: [static, database]
    runs-on: ubuntu-24.04
    steps:
      - env:
          STATIC: ${{ needs.static.result }}
          DATABASE: ${{ needs.database.result }}
        run: |
          set -euo pipefail
          printf 'static=%s\ndatabase=%s\n' "$STATIC" "$DATABASE"
          test "$STATIC" = success
          test "$DATABASE" = success
