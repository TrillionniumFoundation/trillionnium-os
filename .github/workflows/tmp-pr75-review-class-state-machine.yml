name: Temporary PR75 review-class state-machine repair

on:
  push:
    branches:
      - ops/pr75-review-class-state-machine-v1-20260910

permissions:
  contents: write
  actions: read

concurrency:
  group: temporary-pr75-review-class-state-machine-v1
  cancel-in-progress: true

env:
  REVIEWED_HEAD: 06925e9b29a160ebcc2650c02d366a86bed3c555
  BASE_SHA: b681cd856fccac1189496576f25d259752d2dcce
  CANDIDATE_BRANCH: codex/executable-module-contracts-v3-main-20260910
  PATCH_XZ_SHA256: 7d5373d45827b70c3f3fe3f4c583a5945bd8f8570339202489e2f5939fb5701e
  PATCH_SHA256: d6fe8f3b84e4154ceee797dbe1e4318a79502b52cf019fd9690f3ec314158d4f
  PYTHONDONTWRITEBYTECODE: "1"
  CARGO_TERM_COLOR: always

jobs:
  repair-qualify-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out immutable controller
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: true

      - name: Authenticate controller and recover patcher
        shell: bash
        run: |
          set -euo pipefail
          git --no-replace-objects merge-base --is-ancestor "$REVIEWED_HEAD" HEAD
          observed="$(git --no-replace-objects diff --name-only "$REVIEWED_HEAD"...HEAD | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/tmp-pr75-review-class-state-machine.yml' \
            'ops/patch-pr75-review-class-state-machine.py.xz' | LC_ALL=C sort)"
          test "$observed" = "$expected"
          PATCH_XZ="${RUNNER_TEMP:?}/patch-pr75-review-class-state-machine.py.xz"
          PATCH="${RUNNER_TEMP:?}/patch-pr75-review-class-state-machine.py"
          cp -- ops/patch-pr75-review-class-state-machine.py.xz "$PATCH_XZ"
          printf '%s  %s\n' "$PATCH_XZ_SHA256" "$PATCH_XZ" | sha256sum --check --strict
          xz --decompress --stdout -- "$PATCH_XZ" > "$PATCH"
          printf '%s  %s\n' "$PATCH_SHA256" "$PATCH" | sha256sum --check --strict
          chmod 500 "$PATCH"
          git --no-replace-objects checkout --detach "$REVIEWED_HEAD"
          test "$(git --no-replace-objects merge-base "$BASE_SHA" HEAD)" = "$BASE_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all --ignore-submodules=none)"
          printf 'reviewed_head=%s\nreviewed_tree=%s\n' \
            "$(git --no-replace-objects rev-parse HEAD)" \
            "$(git --no-replace-objects rev-parse HEAD^{tree})"

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"

      - name: Set up Rust 1.93
        uses: dtolnay/rust-toolchain@d8dfd7155fea72af4ad34a8fe97364d210e2d020
        with:
          toolchain: "1.93.0"
          components: rustfmt,clippy

      - name: Install declared source-test tools
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/sudo /usr/bin/apt-get -o Acquire::Retries=2 update
          /usr/bin/sudo /usr/bin/apt-get install --yes --no-install-recommends acl
          python3 -I -c 'import sys; assert sys.version_info[:2] == (3, 13), sys.version'
          rustc --version | grep -F 'rustc 1.93.0 '

      - name: Apply closed one-shot review-class state machine
        shell: bash
        run: |
          set -euo pipefail
          python3 "${RUNNER_TEMP:?}/patch-pr75-review-class-state-machine.py"
          python3 -m py_compile \
            tools/contracts/generate_module_contracts.py \
            tools/tests/test_module_contracts.py
          git diff --check
          changed="$(git diff --name-only | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            'tools/contracts/generate_module_contracts.py' \
            'tools/tests/test_module_contracts.py' | LC_ALL=C sort)"
          test "$changed" = "$expected"

      - name: Regenerate and verify every bound artifact
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/contracts/generate_module_contracts.py --write
          python3 tools/contracts/generate_module_contracts.py --check
          python3 tools/contracts/generate_module_contracts.py --verify
          python3 tools/contracts/check_module_contract_compatibility.py --base-ref "$BASE_SHA"
          python3 android-integration/module-contracts/verify_vectors.py
          git diff --check

      - name: Execute focused review-class hostile matrix
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest \
            tools.tests.test_module_contracts.ModuleContractTest.test_change_review_state_machine_is_closed_and_one_shot \
            tools.tests.test_module_contracts.ModuleContractTest.test_initial_introduction_uses_provenance_not_reusable_change_class \
            -v
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path

          path = Path('tools/contracts/check_module_contract_compatibility.py')
          spec = importlib.util.spec_from_file_location('_checker_review', path)
          assert spec and spec.loader
          checker = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(checker)
          assert checker.CHANGE_REVIEW_CLASSES == {'NO_CHANGE', 'BREAKING_MIGRATION'}
          for invalid in ('INITIAL_V1', 'ARBITRARY_APPROVAL', '', None):
              metadata = {
                  'introduction_review_class': 'INITIAL_V1',
                  'migration_review': {'strategy': 'none'},
                  'rollback_review': {'fail_closed': True},
                  'change_review': {
                      'class': invalid,
                      'contracts': [],
                      'families': [],
                      'review_id': None,
                      'migration_plan': None,
                      'rollback_plan': None,
                      'migration_review_sha256': checker.sha256_bytes(
                          checker.canonical({'strategy': 'none'})
                      ),
                      'rollback_review_sha256': checker.sha256_bytes(
                          checker.canonical({'fail_closed': True})
                      ),
                      'base_catalog_sha256': None,
                      'base_contract_sha256': {},
                      'target_contract_sha256': {},
                  },
              }
              try:
                  checker.validate_change_review(metadata, 'hostile-review-class')
              except ValueError:
                  pass
              else:
                  raise SystemExit(f'accepted invalid review class: {invalid!r}')
          PY

      - name: Execute complete source and planned matrices
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo test --locked --all-targets
          cargo clippy --locked --all-targets -- -D warnings
          cargo fmt --manifest-path planned/Cargo.toml --all -- --check
          cargo test --locked --manifest-path planned/Cargo.toml --workspace --all-targets
          cargo clippy --locked --manifest-path planned/Cargo.toml --workspace --all-targets -- -D warnings
          python3 tools/docs/generate_global_docs.py --check
          python3 tools/docs/verify_global_docs.py
          python3 tools/docs/verify_repository_authority.py
          python3 -m unittest discover -s tools/tests -p 'test*.py' -v
          python3 tools/contracts/generate_module_contracts.py --check
          python3 tools/contracts/generate_module_contracts.py --verify
          python3 tools/contracts/check_module_contract_compatibility.py --base-ref "$BASE_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all --ignore-submodules=none | grep -E '^\?\?' || true)"
          git diff --check

      - name: Publish repaired exact head through immutable lease
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Qian QI'
          git config user.email '102159240+ProfHepta@users.noreply.github.com'
          git add -A
          test -n "$(git diff --cached --name-only)"
          git diff --cached --check
          test -z "$(git diff --cached --name-only | grep -E '^ops/|^\.github/workflows/tmp-' || true)"
          git commit \
            -m 'fix(contracts): make breaking-change review closed and one-shot' \
            -m 'Separate immutable INITIAL_V1 provenance from the active review class; admit only NO_CHANGE or content-addressed BREAKING_MIGRATION; bind exact changed contracts, semantic families, base/target schema digests, migration and rollback metadata; and reject stale, arbitrary or reused review authority. Preserve automatic_redispatch=false and the L1-only claim ceiling.'
          final="$(git --no-replace-objects rev-parse HEAD)"
          tree="$(git --no-replace-objects rev-parse HEAD^{tree})"
          test "$(git --no-replace-objects rev-parse HEAD^)" = "$REVIEWED_HEAD"
          git push \
            --force-with-lease="refs/heads/${CANDIDATE_BRANCH}:${REVIEWED_HEAD}" \
            origin "HEAD:refs/heads/${CANDIDATE_BRANCH}"
          printf 'published_head=%s\npublished_tree=%s\n' "$final" "$tree"
