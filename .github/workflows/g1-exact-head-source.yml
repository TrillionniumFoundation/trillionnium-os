name: G1 exact-head source qualification

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: g1-source-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
  EVENT_PR_NUMBER: ${{ github.event.pull_request.number || '' }}
  CARGO_TERM_COLOR: always
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  docs-graph:
    name: L1 graph, documentation, broker and MCP source closure
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact source head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ env.SOURCE_HEAD_SHA }}
          persist-credentials: false
      - name: Assert exact clean checkout
        run: |
          set -euo pipefail
          test "$(git --no-replace-objects rev-parse HEAD)" = "$SOURCE_HEAD_SHA"
          test -n "$(git --no-replace-objects rev-parse HEAD^{tree})"
          if ! worktree_status="$(git --no-replace-objects -C "${GITHUB_WORKSPACE:?}" status --porcelain=v1 --untracked-files=all --ignore-submodules=none)"; then
            printf '%s\n' 'Cannot verify repository worktree state' >&2
            exit 1
          fi
          test -z "$worktree_status"
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Verify G1 machine truth and generated documents
        run: |
          set -euo pipefail
          python3 -m py_compile \
            tools/docs/generate_global_docs.py \
            tools/docs/verify_global_docs.py
          python3 tools/docs/generate_global_docs.py --check
          python3 tools/docs/verify_global_docs.py
          python3 -m unittest tools.tests.test_verify_global_docs_contracts -v
          python3 -m unittest tools.tests.test_owner_open_workflow_exact_head -v
          python3 -m compileall -q tools
      - name: Verify bounded broker mux and protocol contracts
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools/tests -p 'test_owner_open_broker*.py' -v
          python3 -m unittest discover -s tools/tests -p 'test_owner_open_connection_broker.py' -v
          python3 -m unittest discover -s tools/tests -p 'test_owner_open_ingress_contract.py' -v
          python3 -m unittest tools.tests.test_jsonl_provider_runtime tools.tests.test_execute_codex_exec_plan -v
          if ! worktree_status="$(git --no-replace-objects -C "${GITHUB_WORKSPACE:?}" status --porcelain=v1 --untracked-files=all --ignore-submodules=none)"; then
            printf '%s\n' 'Cannot verify repository worktree state' >&2
            exit 1
          fi
          test -z "$worktree_status"
      - name: Capture locked source graph
        run: |
          set -euo pipefail
          METADATA_PATH="${RUNNER_TEMP}/g1-cargo-metadata.json"
          TREE_PATH="${RUNNER_TEMP}/g1-cargo-tree.txt"
          cargo metadata --locked --format-version 1 > "$METADATA_PATH"
          cargo tree --locked -e features > "$TREE_PATH"
          test -s "$METADATA_PATH"
          test -s "$TREE_PATH"
          if ! worktree_status="$(git --no-replace-objects -C "${GITHUB_WORKSPACE:?}" status --porcelain=v1 --untracked-files=all --ignore-submodules=none)"; then
            printf '%s\n' 'Cannot verify repository worktree state' >&2
            exit 1
          fi
          test -z "$worktree_status"
      - name: Upload locked source graph
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: g1-locked-source-graph-${{ env.SOURCE_HEAD_SHA }}
          if-no-files-found: error
          retention-days: 30
          path: |
            ${{ runner.temp }}/g1-cargo-metadata.json
            ${{ runner.temp }}/g1-cargo-tree.txt

  rust-runtime:
    name: L1 Rust 1.93 selected Host, job, flow and recovery closure
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out exact source head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ env.SOURCE_HEAD_SHA }}
          persist-credentials: false
      - name: Assert exact clean checkout
        run: |
          set -euo pipefail
          test "$(git --no-replace-objects rev-parse HEAD)" = "$SOURCE_HEAD_SHA"
          if ! worktree_status="$(git --no-replace-objects -C "${GITHUB_WORKSPACE:?}" status --porcelain=v1 --untracked-files=all --ignore-submodules=none)"; then
            printf '%s\n' 'Cannot verify repository worktree state' >&2
            exit 1
          fi
          test -z "$worktree_status"
      - name: Set up Rust 1.93
        uses: dtolnay/rust-toolchain@d8dfd7155fea72af4ad34a8fe97364d210e2d020
        with:
          toolchain: "1.93.0"
          components: rustfmt,clippy
      - name: Verify lockfile, formatting, tests and strict Clippy
        run: |
          set -euo pipefail
          test -s Cargo.lock
          cp Cargo.lock /tmp/g1-reviewed-Cargo.lock
          cargo fmt --all -- --check
          cargo test --locked --all-targets
          cargo clippy --locked --all-targets -- -D warnings
          cmp --silent Cargo.lock /tmp/g1-reviewed-Cargo.lock
          git --no-replace-objects diff --exit-code -- Cargo.lock
          if ! worktree_status="$(git --no-replace-objects -C "${GITHUB_WORKSPACE:?}" status --porcelain=v1 --untracked-files=all --ignore-submodules=none)"; then
            printf '%s\n' 'Cannot verify repository worktree state' >&2
            exit 1
          fi
          test -z "$worktree_status"

  planned-candidates:
    name: L1 planned control, telemetry and baseline source checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact source head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ env.SOURCE_HEAD_SHA }}
          persist-credentials: false
      - name: Assert exact clean checkout
        run: |
          set -euo pipefail
          test "$(git --no-replace-objects rev-parse HEAD)" = "$SOURCE_HEAD_SHA"
          if ! worktree_status="$(git --no-replace-objects -C "${GITHUB_WORKSPACE:?}" status --porcelain=v1 --untracked-files=all --ignore-submodules=none)"; then
            printf '%s\n' 'Cannot verify repository worktree state' >&2
            exit 1
          fi
          test -z "$worktree_status"
      - name: Set up Rust 1.93
        uses: dtolnay/rust-toolchain@d8dfd7155fea72af4ad34a8fe97364d210e2d020
        with:
          toolchain: "1.93.0"
          components: rustfmt,clippy
      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Verify planned workspaces with locked tests and strict Clippy
        run: |
          set -euo pipefail
          test -s planned/Cargo.lock
          cp planned/Cargo.lock "${RUNNER_TEMP}/g1-reviewed-planned-Cargo.lock"
          cargo fmt --manifest-path planned/Cargo.toml --all -- --check
          cargo test --locked --manifest-path planned/Cargo.toml --workspace --all-targets
          cargo clippy --locked --manifest-path planned/Cargo.toml --workspace --all-targets -- -D warnings
          cmp --silent planned/Cargo.lock "${RUNNER_TEMP}/g1-reviewed-planned-Cargo.lock"
          git --no-replace-objects diff --exit-code -- planned/Cargo.lock
      - name: Verify bounded global baseline harness
        run: |
          set -euo pipefail
          BASELINE_PATH="${RUNNER_TEMP}/g1-global-baseline.json"
          export BASELINE_PATH
          python3 -m unittest tools.tests.test_run_global_baseline -v
          python3 tools/perf/run_global_baseline.py \
            --output "$BASELINE_PATH" \
            --repetitions 1
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["BASELINE_PATH"])
          artifact = json.loads(path.read_text(encoding="utf-8"))
          clone = dict(artifact)
          clone["artifact_digest"] = ""
          encoded = json.dumps(
              clone, sort_keys=True, separators=(",", ":"), ensure_ascii=True
          ).encode()
          assert artifact["artifact_digest"] == hashlib.sha256(encoded).hexdigest()
          assert artifact["qualification"] == "SOURCE_EVIDENCE_ONLY"
          assert artifact["gate"]["passed"] is False
          PY
      - name: Ensure source checks did not mutate the checkout
        run: |
          set -euo pipefail
          if ! worktree_status="$(git --no-replace-objects -C "${GITHUB_WORKSPACE:?}" status --porcelain=v1 --untracked-files=all --ignore-submodules=none)"; then
            printf '%s\n' 'Cannot verify repository worktree state' >&2
            exit 1
          fi
          test -z "$worktree_status"

  governance:
    name: L1 protected-main and exact-head independent-review readiness
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact source head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ env.SOURCE_HEAD_SHA }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Verify governance source readiness
        run: |
          set -euo pipefail
          test "$(git --no-replace-objects rev-parse HEAD)" = "$SOURCE_HEAD_SHA"
          python3 tools/docs/verify_global_docs.py
          grep -Fq "/docs/machine/" .github/CODEOWNERS
          grep -Fq "/.github/workflows/" .github/CODEOWNERS
          grep -Fq "Historical development documents must not be reintroduced" CONTRIBUTING.md
          test -z "$(find docs -type d \( -name archive -o -name plan -o -name status -o -name evidence -o -name audits \) -print -quit)"
          if ! worktree_status="$(git --no-replace-objects -C "${GITHUB_WORKSPACE:?}" status --porcelain=v1 --untracked-files=all --ignore-submodules=none)"; then
            printf '%s\n' 'Cannot verify repository worktree state' >&2
            exit 1
          fi
          test -z "$worktree_status"

  android-packaging-source:
    name: L1 Android and packaging source-contract closure
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact source head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ env.SOURCE_HEAD_SHA }}
          persist-credentials: false
      - name: Assert exact clean checkout
        run: |
          set -euo pipefail
          test "$(git --no-replace-objects rev-parse HEAD)" = "$SOURCE_HEAD_SHA"
          test -n "$(git --no-replace-objects rev-parse HEAD^{tree})"
          if ! worktree_status="$(git --no-replace-objects -C "${GITHUB_WORKSPACE:?}" status --porcelain=v1 --untracked-files=all --ignore-submodules=none)"; then
            printf '%s\n' 'Cannot verify repository worktree state' >&2
            exit 1
          fi
          test -z "$worktree_status"
      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Verify Android source and packaging contracts
        run: |
          set -euo pipefail
          python3 tools/verify-owner-open-android-source-closure-v2.py
          # Real local process groups; not installed-target qualification.
          python3 -m unittest tools.tests.test_owner_open_rootlinux_supervisor -v
          python3 tools/verify-owner-open-android-profile-v3.py
          SOURCE_HEAD="$(git --no-replace-objects rev-parse HEAD)"
          python3 tools/verify-owner-open-adbroot-evaluated-graph.py \
            --repo-root . \
            --source-commit "$SOURCE_HEAD" \
            --evaluation-kind source_head \
            --output /tmp/owner-open-adbroot-evaluated-graph.json
          python3 -m json.tool /tmp/owner-open-adbroot-evaluated-graph.json >/dev/null
          python3 tools/verify-owner-open-product-entrypoint.py --json > /tmp/owner-open-product-entrypoint-report.json
          python3 tools/verify-owner-open-rootfs-payload-selection.py --json > /tmp/owner-open-rootfs-payload-selection-report.json
          python3 -m json.tool packaging/owner-open-product/product-entrypoint.contract.json >/dev/null
          python3 -m json.tool packaging/owner-open-product/install-manifest.template.json >/dev/null
          python3 -m json.tool packaging/owner-open-rootfs/payload-selection.contract.json >/dev/null
          python3 -m unittest \
            tools.tests.test_verify_owner_open_android_source_closure \
            tools.tests.test_verify_owner_open_android_profile \
            tools.tests.test_verify_owner_open_product_entrypoint \
            tools.tests.test_verify_owner_open_rootfs_payload_selection -v
          python3 -m unittest \
            tools.tests.test_verify_owner_open_materialized_payload \
            tools.tests.test_owner_open_bootstrap_manifest_contract \
            tools.tests.test_android_ci_source_package \
            tools.tests.test_android_ci_device_smoke -v
          # Packaging checks are host-only metadata/source contracts.  They do
          # not build, sign, install or flash an Android image.
          for test_file in \
            packaging/android-release-gate/tests/test_verify_android_bom_preflight.py \
            packaging/android-release-gate/tests/test_verify_android_release.py \
            packaging/android-release-gate/tests/test_verify_source_bom_binding.py \
            packaging/codex-android/tests/test_integrity_launcher.py \
            packaging/operation-replay-sync-static/tests/test_operation_replay_sync_static.py \
            packaging/operation-replay-sync-static/tests/test_public_hold_guards.py \
            packaging/operation-replay-sync-static/tests/test_publication_custody_model.py \
            packaging/provider-post-exec-bootstrap/tests/test_build_provider_payload.py \
            packaging/provider-post-exec-bootstrap/tests/test_provider_build_supervisor.py; do
            python3 "$test_file" -q
          done
          if ! worktree_status="$(git --no-replace-objects -C "${GITHUB_WORKSPACE:?}" status --porcelain=v1 --untracked-files=all --ignore-submodules=none)"; then
            printf '%s\n' 'Cannot verify repository worktree state' >&2
            exit 1
          fi
          test -z "$worktree_status"

  aggregate:
    name: L1 exact-source-head aggregate candidate
    needs:
      - docs-graph
      - rust-runtime
      - planned-candidates
      - governance
      - android-packaging-source
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Require all source jobs
        env:
          DOCS_RESULT: ${{ needs.docs-graph.result }}
          RUST_RESULT: ${{ needs.rust-runtime.result }}
          PLANNED_RESULT: ${{ needs.planned-candidates.result }}
          GOVERNANCE_RESULT: ${{ needs.governance.result }}
          ANDROID_PACKAGING_RESULT: ${{ needs.android-packaging-source.result }}
        run: |
          set -euo pipefail
          test "$DOCS_RESULT" = success
          test "$RUST_RESULT" = success
          test "$PLANNED_RESULT" = success
          test "$GOVERNANCE_RESULT" = success
          test "$ANDROID_PACKAGING_RESULT" = success
      - name: Check out exact source head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ env.SOURCE_HEAD_SHA }}
          persist-credentials: false
      - name: Set up Python 3.13 for live aggregate binding
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Bind ordered-merge, Android and evidence workflow families
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git --no-replace-objects rev-parse HEAD)" = "$SOURCE_HEAD_SHA"
          python3 -m py_compile tools/verify-g1-pr-aggregate.py
          python3 -m unittest tools.tests.test_g1_pr_aggregate -v
          python3 tools/verify-g1-pr-aggregate.py \
            --repository "$GITHUB_REPOSITORY" \
            --pr-number "$EVENT_PR_NUMBER" \
            --base-commit "$EVENT_BASE_SHA" \
            --head-commit "$SOURCE_HEAD_SHA" \
            --repo-root . \
            --timeout-seconds 1200 \
            --poll-seconds 10 \
            --output "${RUNNER_TEMP}/g1-pr-workflow-aggregate.json"
          python3 -m json.tool "${RUNNER_TEMP}/g1-pr-workflow-aggregate.json" >/dev/null
          if ! worktree_status="$(git --no-replace-objects -C "${GITHUB_WORKSPACE:?}" status --porcelain=v1 --untracked-files=all --ignore-submodules=none)"; then
            printf '%s\n' 'Cannot verify repository worktree state' >&2
            exit 1
          fi
          test -z "$worktree_status"
      - name: Emit exact-head evidence manifest
        run: |
          set -euo pipefail
          SOURCE_TREE="$(git --no-replace-objects rev-parse HEAD^{tree})"
          LOCK_SHA="$(sha256sum Cargo.lock | awk '{print $1}')"
          cat > g1-exact-head-evidence.json <<EOF
          {
            "schema": "org.trillionnium.g1-exact-head-evidence.v1",
            "program_revision": "2026-08-31-g1",
            "repository": "${GITHUB_REPOSITORY}",
            "commit": "${SOURCE_HEAD_SHA}",
            "tree": "${SOURCE_TREE}",
            "cargo_lock_sha256": "${LOCK_SHA}",
            "workflow_run_id": "${GITHUB_RUN_ID}",
            "workflow_attempt": "${GITHUB_RUN_ATTEMPT}",
            "result": "L1_SOURCE_CLOSURE_PASSED",
            "claim_ceiling": "EXACT_COMMIT_SOURCE_GATES_PASSED_NOT_INSTALLED_TARGET",
            "automatic_redispatch": false,
            "public_release": false
          }
          EOF
          python3 -m json.tool g1-exact-head-evidence.json >/dev/null
      - name: Upload exact-head evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: g1-exact-head-${{ env.SOURCE_HEAD_SHA }}
          if-no-files-found: error
          retention-days: 30
          path: |
            g1-exact-head-evidence.json
            ${{ runner.temp }}/g1-pr-workflow-aggregate.json
