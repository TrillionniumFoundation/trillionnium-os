name: G1 exact-head source qualification

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g1-source-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  CARGO_TERM_COLOR: always
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  docs-graph:
    name: L1 graph, documentation, broker and MCP source closure
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact source head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ env.SOURCE_HEAD_SHA }}
          persist-credentials: false
      - name: Assert exact clean checkout
        run: |
          set -euo pipefail
          test "$(git --no-replace-objects rev-parse HEAD)" = "$SOURCE_HEAD_SHA"
          test -n "$(git --no-replace-objects rev-parse HEAD^{tree})"
          test -z "$(git --no-replace-objects status --porcelain=v1 --untracked-files=all)"
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Verify G1 machine truth and generated documents
        run: |
          set -euo pipefail
          python3 -m py_compile \
            tools/docs/generate_global_docs.py \
            tools/docs/verify_global_docs.py
          python3 tools/docs/generate_global_docs.py --check
          python3 tools/docs/verify_global_docs.py
          python3 -m compileall -q tools
      - name: Verify bounded broker mux and protocol contracts
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools/tests -p 'test_owner_open_broker*.py' -v
          python3 -m unittest discover -s tools/tests -p 'test_owner_open_connection_broker.py' -v
          python3 -m unittest discover -s tools/tests -p 'test_owner_open_ingress_contract.py' -v
          test -z "$(git --no-replace-objects status --porcelain=v1 --untracked-files=all)"
      - name: Capture locked source graph
        run: |
          set -euo pipefail
          METADATA_PATH="${RUNNER_TEMP}/g1-cargo-metadata.json"
          TREE_PATH="${RUNNER_TEMP}/g1-cargo-tree.txt"
          cargo metadata --locked --format-version 1 > "$METADATA_PATH"
          cargo tree --locked -e features > "$TREE_PATH"
          test -s "$METADATA_PATH"
          test -s "$TREE_PATH"
          test -z "$(git --no-replace-objects status --porcelain=v1 --untracked-files=all)"
      - name: Upload locked source graph
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: g1-locked-source-graph-${{ env.SOURCE_HEAD_SHA }}
          if-no-files-found: error
          retention-days: 30
          path: |
            ${{ runner.temp }}/g1-cargo-metadata.json
            ${{ runner.temp }}/g1-cargo-tree.txt

  rust-runtime:
    name: L1 Rust 1.93 selected Host, job, flow and recovery closure
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out exact source head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ env.SOURCE_HEAD_SHA }}
          persist-credentials: false
      - name: Assert exact clean checkout
        run: |
          set -euo pipefail
          test "$(git --no-replace-objects rev-parse HEAD)" = "$SOURCE_HEAD_SHA"
          test -z "$(git --no-replace-objects status --porcelain=v1 --untracked-files=all)"
      - name: Set up Rust 1.93
        uses: dtolnay/rust-toolchain@d8dfd7155fea72af4ad34a8fe97364d210e2d020
        with:
          toolchain: "1.93.0"
          components: rustfmt,clippy
      - name: Verify lockfile, formatting, tests and strict Clippy
        run: |
          set -euo pipefail
          test -s Cargo.lock
          cp Cargo.lock /tmp/g1-reviewed-Cargo.lock
          cargo fmt --all -- --check
          cargo test --locked --all-targets
          cargo clippy --locked --all-targets -- -D warnings
          cmp --silent Cargo.lock /tmp/g1-reviewed-Cargo.lock
          git --no-replace-objects diff --exit-code -- Cargo.lock
          test -z "$(git --no-replace-objects status --porcelain=v1 --untracked-files=all)"

  planned-candidates:
    name: L1 planned control, telemetry and baseline source checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact source head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ env.SOURCE_HEAD_SHA }}
          persist-credentials: false
      - name: Assert exact clean checkout
        run: |
          set -euo pipefail
          test "$(git --no-replace-objects rev-parse HEAD)" = "$SOURCE_HEAD_SHA"
          test -z "$(git --no-replace-objects status --porcelain=v1 --untracked-files=all)"
      - name: Set up Rust 1.93
        uses: dtolnay/rust-toolchain@d8dfd7155fea72af4ad34a8fe97364d210e2d020
        with:
          toolchain: "1.93.0"
          components: rustfmt,clippy
      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Verify planned workspaces with locked tests and strict Clippy
        run: |
          set -euo pipefail
          test -s planned/Cargo.lock
          cp planned/Cargo.lock "${RUNNER_TEMP}/g1-reviewed-planned-Cargo.lock"
          cargo fmt --manifest-path planned/Cargo.toml --all -- --check
          cargo test --locked --manifest-path planned/Cargo.toml --workspace --all-targets
          cargo clippy --locked --manifest-path planned/Cargo.toml --workspace --all-targets -- -D warnings
          cmp --silent planned/Cargo.lock "${RUNNER_TEMP}/g1-reviewed-planned-Cargo.lock"
          git --no-replace-objects diff --exit-code -- planned/Cargo.lock
      - name: Verify bounded global baseline harness
        run: |
          set -euo pipefail
          BASELINE_PATH="${RUNNER_TEMP}/g1-global-baseline.json"
          export BASELINE_PATH
          python3 -m unittest tools.tests.test_run_global_baseline -v
          python3 tools/perf/run_global_baseline.py \
            --output "$BASELINE_PATH" \
            --repetitions 1
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["BASELINE_PATH"])
          artifact = json.loads(path.read_text(encoding="utf-8"))
          clone = dict(artifact)
          clone["artifact_digest"] = ""
          encoded = json.dumps(
              clone, sort_keys=True, separators=(",", ":"), ensure_ascii=True
          ).encode()
          assert artifact["artifact_digest"] == hashlib.sha256(encoded).hexdigest()
          assert artifact["qualification"] == "SOURCE_EVIDENCE_ONLY"
          assert artifact["gate"]["passed"] is False
          PY
      - name: Ensure source checks did not mutate the checkout
        run: |
          set -euo pipefail
          test -z "$(git --no-replace-objects status --porcelain=v1 --untracked-files=all)"

  governance:
    name: L1 protected-main and exact-head independent-review readiness
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact source head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ env.SOURCE_HEAD_SHA }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Verify governance source readiness
        run: |
          set -euo pipefail
          test "$(git --no-replace-objects rev-parse HEAD)" = "$SOURCE_HEAD_SHA"
          python3 tools/docs/verify_global_docs.py
          grep -Fq "/docs/machine/" .github/CODEOWNERS
          grep -Fq "/.github/workflows/" .github/CODEOWNERS
          grep -Fq "Historical development documents must not be reintroduced" CONTRIBUTING.md
          test -z "$(find docs -type d \( -name archive -o -name plan -o -name status -o -name evidence -o -name audits \) -print -quit)"
          test -z "$(git --no-replace-objects status --porcelain=v1 --untracked-files=all)"

  aggregate:
    name: L1 exact-source-head aggregate candidate
    needs:
      - docs-graph
      - rust-runtime
      - planned-candidates
      - governance
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Require all source jobs
        env:
          DOCS_RESULT: ${{ needs.docs-graph.result }}
          RUST_RESULT: ${{ needs.rust-runtime.result }}
          PLANNED_RESULT: ${{ needs.planned-candidates.result }}
          GOVERNANCE_RESULT: ${{ needs.governance.result }}
        run: |
          set -euo pipefail
          test "$DOCS_RESULT" = success
          test "$RUST_RESULT" = success
          test "$PLANNED_RESULT" = success
          test "$GOVERNANCE_RESULT" = success
      - name: Check out exact source head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ env.SOURCE_HEAD_SHA }}
          persist-credentials: false
      - name: Emit exact-head evidence manifest
        run: |
          set -euo pipefail
          SOURCE_TREE="$(git --no-replace-objects rev-parse HEAD^{tree})"
          LOCK_SHA="$(sha256sum Cargo.lock | awk '{print $1}')"
          cat > g1-exact-head-evidence.json <<EOF
          {
            "schema": "org.trillionnium.g1-exact-head-evidence.v1",
            "program_revision": "2026-08-31-g1",
            "repository": "${GITHUB_REPOSITORY}",
            "commit": "${SOURCE_HEAD_SHA}",
            "tree": "${SOURCE_TREE}",
            "cargo_lock_sha256": "${LOCK_SHA}",
            "workflow_run_id": "${GITHUB_RUN_ID}",
            "workflow_attempt": "${GITHUB_RUN_ATTEMPT}",
            "result": "L1_SOURCE_CLOSURE_PASSED",
            "claim_ceiling": "EXACT_COMMIT_SOURCE_GATES_PASSED_NOT_INSTALLED_TARGET",
            "automatic_redispatch": false,
            "public_release": false
          }
          EOF
          python3 -m json.tool g1-exact-head-evidence.json >/dev/null
      - name: Upload exact-head evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: g1-exact-head-${{ env.SOURCE_HEAD_SHA }}
          if-no-files-found: error
          retention-days: 30
          path: g1-exact-head-evidence.json
