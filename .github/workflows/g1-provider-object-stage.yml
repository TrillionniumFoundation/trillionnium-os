name: G1 Provider fixed-object staging
on:
  push:
    branches: [ops/g1-provider-recovery-20260905]
permissions:
  contents: read
jobs:
  stage-fixed-blobs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Read immutable driver without stored credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: driver
          persist-credentials: false
      - name: Read pinned base as inert source data
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: f434d2a53bfc208b5b4356417778111bf7e6cd68
          path: candidate
          persist-credentials: false
      - name: Verify and stage six exact blobs without executing candidate code
        env:
          OBJECT_STAGING_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          unset PYTHONPATH PYTHONHOME
          /usr/bin/python3 -I - <<'PY'
          import base64, gzip, hashlib, json, os, subprocess, urllib.request
          from pathlib import Path
          root = Path(os.environ['GITHUB_WORKSPACE'])
          candidate = root / 'candidate'
          base = 'f434d2a53bfc208b5b4356417778111bf7e6cd68'
          expected_tree = '6fee55ed6fa0711d6387af02df59db9739fee3ed'
          expected = {
              '.github/workflows/g1-exact-head-source.yml': ('100644', '1c5a347c1ef2b484d19101d2b9b607f8a6f6d438'),
              'docs/modules/MOD-PROVIDER.md': ('100644', '7b358f0005c17c92a7d1b2e13c4c89ffc830520f'),
              'tools/owner-open/execute_codex_exec_plan.py': ('100644', '6aa952482782a74ed32cf01a9f476f6afb0caf1f'),
              'tools/owner-open/jsonl_provider_runtime.py': ('100644', 'eecb204e05eb71ed273ef6ea061b1d0772260a2d'),
              'tools/tests/test_execute_codex_exec_plan.py': ('100644', '07b2c98285e3451d836268634c4eafbe9b13ae37'),
              'tools/tests/test_jsonl_provider_runtime.py': ('100644', 'ca5ba4e57d359b98486bcc08424f201a857d0ef2'),
          }
          encoded = (root / 'driver/build-support/g1-provider-repair.b64').read_bytes().strip()
          packed = base64.b64decode(encoded, validate=True)
          assert hashlib.sha256(packed).hexdigest() == 'ffeb523e4a470c76be5c33d00e4debaa6c2950755849bc4720b8ee34eeca88a4'
          patch = gzip.decompress(packed)
          assert hashlib.sha256(patch).hexdigest() == 'bf5763ed1b6a1ec3371de8064e4a7bfb63d1bf93eea7726e1ba9ac550a6cfa59'
          patch_file = Path(os.environ['RUNNER_TEMP']) / 'verified-provider.patch'
          patch_file.write_bytes(patch)
          def git(*args):
              return subprocess.check_output(['/usr/bin/git', '--no-replace-objects', '-C', str(candidate), *args])
          assert git('rev-parse', 'HEAD').decode().strip() == base
          assert git('rev-parse', 'HEAD^{tree}').decode().strip() == '599a89e3c5cd6df5ad46b0998893bb7ae6e86247'
          assert not git('status', '--porcelain=v1', '--untracked-files=all').strip()
          git('apply', '--check', '--index', str(patch_file))
          git('apply', '--index', str(patch_file))
          git('diff', '--cached', '--check')
          assert git('write-tree').decode().strip() == expected_tree
          paths = [x.decode() for x in git('diff', '--cached', '--name-only', '-z').split(b'\0') if x]
          assert len(paths) == 6 and set(paths) == set(expected)
          entries = []
          for path in paths:
              metadata, actual_path = git('ls-tree', '-z', expected_tree, '--', path)[:-1].split(b'\t', 1)
              mode, kind, sha = metadata.decode().split()
              assert actual_path.decode() == path and kind == 'blob' and (mode, sha) == expected[path]
              data = git('cat-file', 'blob', sha)
              assert hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest() == sha
              request = urllib.request.Request(
                  'https://api.github.com/repos/TrillionniumFoundation/trillionnium-os/git/blobs',
                  data=json.dumps({'content': base64.b64encode(data).decode(), 'encoding': 'base64'}).encode(),
                  method='POST', headers={'Authorization': 'Bearer ' + os.environ['OBJECT_STAGING_TOKEN'],
                  'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json',
                  'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  result = json.load(response)
              assert result['sha'] == sha
              entries.append({'path': path, 'mode': mode, 'type': kind, 'sha': sha})
          report = {'base_commit': base, 'candidate_tree': expected_tree, 'blobs': entries,
              'candidate_code_executed': False, 'tests_run_in_this_job': False,
              'source_qualification': False, 'tree_published': False, 'commit_created': False,
              'ref_updated': False, 'independent_review': False, 'target_evidence': False,
              'gap_promotion': False, 'public_release': False, 'run_id': os.environ['GITHUB_RUN_ID']}
          (Path(os.environ['RUNNER_TEMP']) / 'provider-staged-blobs.json').write_text(json.dumps(report, indent=2) + '\n')
          print(json.dumps(report, indent=2))
          PY
      - name: Retain non-authorizing source-object report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: g1-provider-staged-blobs
          retention-days: 7
          if-no-files-found: error
          path: ${{ runner.temp }}/provider-staged-blobs.json
