name: TrillionniumGame backup restore v26

on:
  push:
    branches: [ci/trillionniumgame-exact-head-relay-v1]
    paths: ['.github/workflows/trillionniumgame-backup-restore-v26.yml']
  workflow_dispatch:

permissions:
  contents: read

env:
  TARGET_REPOSITORY: TrillionniumFoundation/TrillionniumGame
  EXPECTED_HEAD: 46c7245db7239e32221adc4c4ba225a33e584e18

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ env.TARGET_REPOSITORY }}
          ref: ${{ env.EXPECTED_HEAD }}
          persist-credentials: false
      - run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python3 scripts/check-pgwire-backup-restore.py
          bash -n scripts/ci-pgwire-backup-restore.sh
          python3 -m compileall -q scripts/check-pgwire-backup-restore.py
          git diff --check
          test -z "$(git status --porcelain --untracked-files=no)"

  restore:
    strategy:
      fail-fast: false
      matrix:
        profile: [postgresql, cockroachdb]
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ env.TARGET_REPOSITORY }}
          ref: ${{ env.EXPECTED_HEAD }}
          path: source
          persist-credentials: false
      - name: Install exact Rust
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal
          rustup default 1.85.1
      - name: Run committed harness
        working-directory: source
        env:
          TRNM_EVIDENCE_ROOT: evidence
          TRNM_RUN_ID: ${{ github.run_id }}-${{ matrix.profile }}
        run: bash scripts/ci-pgwire-backup-restore.sh '${{ matrix.profile }}'
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trillionniumgame-backup-restore-v26-${{ matrix.profile }}-${{ env.EXPECTED_HEAD }}
          path: source/evidence/${{ matrix.profile }}
          if-no-files-found: error
          retention-days: 30

  all-gates:
    if: always()
    needs: [source, restore]
    runs-on: ubuntu-24.04
    steps:
      - env:
          SOURCE: ${{ needs.source.result }}
          RESTORE: ${{ needs.restore.result }}
        run: |
          set -euo pipefail
          printf 'source=%s\nrestore=%s\n' "$SOURCE" "$RESTORE"
          test "$SOURCE" = success
          test "$RESTORE" = success
