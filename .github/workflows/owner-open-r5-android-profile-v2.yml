name: owner-open R5 Android profile v2

on:
  pull_request:
    paths:
      - "android-integration/owner-open-profile/**"
      - "android-integration/working-tree/vendor/trillionnium/config/common.mk"
      - "tools/generate-owner-open-android-profile-v2.py"
      - "tools/verify-owner-open-android-profile.py"
      - "tools/verify-owner-open-android-profile-v2.py"
      - "tools/tests/test_verify_owner_open_android_profile.py"
      - "tools/tests/test_verify_owner_open_android_profile_v2.py"
      - "docs/plan/owner-open-r5-batch-e-android-profile-split.md"
      - ".github/workflows/owner-open-r5-android-profile-v2.yml"
  push:
    branches:
      - main
      - "codex/**"
    paths:
      - "android-integration/owner-open-profile/**"
      - "android-integration/working-tree/vendor/trillionnium/config/common.mk"
      - "tools/generate-owner-open-android-profile-v2.py"
      - "tools/verify-owner-open-android-profile.py"
      - "tools/verify-owner-open-android-profile-v2.py"
      - "tools/tests/test_verify_owner_open_android_profile.py"
      - "tools/tests/test_verify_owner_open_android_profile_v2.py"
      - "docs/plan/owner-open-r5-batch-e-android-profile-split.md"
      - ".github/workflows/owner-open-r5-android-profile-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: owner-open-r5-android-profile-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  profile-contract-v2:
    name: Android owner-open profile consistency and holds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact source-head checkout
        env:
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_HEAD_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Parse and compile canonical source
        run: |
          python3 -m json.tool android-integration/owner-open-profile/profile.json >/dev/null
          python3 -m py_compile \
            tools/generate-owner-open-android-profile-v2.py \
            tools/verify-owner-open-android-profile.py \
            tools/verify-owner-open-android-profile-v2.py \
            tools/tests/test_verify_owner_open_android_profile.py \
            tools/tests/test_verify_owner_open_android_profile_v2.py
      - name: Check generated package fragment
        run: python3 tools/generate-owner-open-android-profile-v2.py --check
      - name: Verify foundation consistency and capture exact holds
        run: |
          python3 tools/verify-owner-open-android-profile-v2.py --json \
            | tee owner-open-r5-android-profile-v2-foundation.json
      - name: Prove current unselected tree cannot be promoted as strict
        run: |
          set +e
          python3 tools/verify-owner-open-android-profile-v2.py --strict --json \
            > owner-open-r5-android-profile-v2-strict.json 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "current unselected/unbound Android profile unexpectedly passed strict verification" >&2
            exit 1
          fi
      - name: Run Android profile state-machine tests
        run: |
          python3 -m unittest \
            tools.tests.test_verify_owner_open_android_profile \
            tools.tests.test_verify_owner_open_android_profile_v2 \
            -v 2>&1 | tee owner-open-r5-android-profile-v2-tests.txt
      - uses: actions/upload-artifact@v4
        with:
          name: owner-open-r5-android-profile-v2-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            owner-open-r5-android-profile-v2-foundation.json
            owner-open-r5-android-profile-v2-strict.json
            owner-open-r5-android-profile-v2-tests.txt
