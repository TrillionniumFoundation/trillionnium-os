name: TrillionniumGame exact-head relay

on:
  push:
    branches:
      - ci/trillionniumgame-exact-head-relay-v1
    paths:
      - '.github/workflows/trillionniumgame-exact-head-relay.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trillionniumgame-exact-head-relay-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rust-exact-head:
    name: ${{ matrix.label }} / Rust 1.85.1
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: pr37-canonical
            ref: d768772b5d366a2718296d10182fba9d66e23891

    steps:
      - name: Check out exact TrillionniumGame head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: TrillionniumFoundation/TrillionniumGame
          ref: ${{ matrix.ref }}
          path: source
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact source identity
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ matrix.ref }}'
          printf 'commit=%s\n' "$(git rev-parse HEAD)"
          printf 'tree=%s\n' "$(git rev-parse HEAD^{tree})"

      - name: Install exact Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.85.1
          rustc --version --verbose
          cargo --version --verbose

      - name: Emit formatting repair, then run tests and strict Clippy
        working-directory: source
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p relay-evidence/formatted
          rustc --version --verbose > relay-evidence/rustc-version.txt
          cargo --version --verbose > relay-evidence/cargo-version.txt
          git rev-parse HEAD > relay-evidence/commit.txt
          git rev-parse HEAD^{tree} > relay-evidence/tree.txt

          set +e
          cargo fmt --all 2>&1 | tee relay-evidence/cargo-fmt-apply.log
          fmt_apply_status=${PIPESTATUS[0]}
          git diff --binary -- . ':(exclude)relay-evidence' > relay-evidence/cargo-fmt.patch
          git diff --name-only -- . ':(exclude)relay-evidence' > relay-evidence/cargo-fmt-files.txt
          if [[ -s relay-evidence/cargo-fmt-files.txt ]]; then
            while IFS= read -r path; do
              mkdir -p "relay-evidence/formatted/$(dirname "$path")"
              cp "$path" "relay-evidence/formatted/$path"
            done < relay-evidence/cargo-fmt-files.txt
            source_format_clean=1
          else
            source_format_clean=0
          fi
          cargo fmt --all -- --check 2>&1 | tee relay-evidence/cargo-fmt-check.log
          fmt_check_status=${PIPESTATUS[0]}
          cargo test --workspace --all-targets --locked 2>&1 | tee relay-evidence/cargo-test.log
          test_status=${PIPESTATUS[0]}
          cargo clippy --workspace --all-targets --locked -- -D warnings 2>&1 | tee relay-evidence/cargo-clippy.log
          clippy_status=${PIPESTATUS[0]}
          python3 scripts/test-canonical-framing.py 2>&1 | tee relay-evidence/canonical-reference.log
          reference_status=${PIPESTATUS[0]}
          set -e

          python3 - <<PY
          import json
          from pathlib import Path
          statuses = {
              'cargo_fmt_apply': int('${fmt_apply_status}'),
              'cargo_fmt_check_after_apply': int('${fmt_check_status}'),
              'source_format_clean': int('${source_format_clean}'),
              'cargo_test': int('${test_status}'),
              'cargo_clippy': int('${clippy_status}'),
              'canonical_reference': int('${reference_status}'),
          }
          value = {
              'schema': 'trillionnium.game.exact-head-relay.v3',
              'repository': 'TrillionniumFoundation/TrillionniumGame',
              'label': '${{ matrix.label }}',
              'commit': '${{ matrix.ref }}',
              'statuses': statuses,
              'format_patch_required': statuses['source_format_clean'] != 0,
              'all_logic_passed': all(statuses[key] == 0 for key in [
                  'cargo_fmt_apply', 'cargo_fmt_check_after_apply',
                  'cargo_test', 'cargo_clippy', 'canonical_reference'
              ]),
              'claims': {
                  'same_repository_actions_unblocked': False,
                  'compatibility_credit': False,
                  'production_ready': False,
              },
          }
          Path('relay-evidence/summary.json').write_text(
              json.dumps(value, sort_keys=True, separators=(',', ':')) + '\n',
              encoding='utf-8',
          )
          PY
          find relay-evidence -type f ! -name SHA256SUMS -print0 \
            | sort -z \
            | xargs -0 sha256sum > relay-evidence/SHA256SUMS

          if (( fmt_apply_status || fmt_check_status || test_status || clippy_status || reference_status )); then
            exit 1
          fi

      - name: Upload exact-head relay evidence and repair files
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trillionniumgame-${{ matrix.label }}-${{ matrix.ref }}-run-${{ github.run_number }}
          path: source/relay-evidence
          if-no-files-found: error
          retention-days: 30

  publish-repair-objects:
    if: always()
    needs: rust-exact-head
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out relay branch with write credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ci/trillionniumgame-exact-head-relay-v1
          fetch-depth: 1
          persist-credentials: true

      - name: Download all exact-head evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: trillionniumgame-*-run-${{ github.run_number }}
          path: downloaded
          merge-multiple: false

      - name: Publish immutable repair objects into relay audit history
        shell: bash
        run: |
          set -euo pipefail
          destination="relay-repairs/run-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ID}"
          mkdir -p "$destination"
          find downloaded -mindepth 1 -maxdepth 1 -type d -print0 | sort -z | while IFS= read -r -d '' artifact; do
            name=$(basename "$artifact")
            mkdir -p "$destination/$name"
            for path in summary.json cargo-fmt.patch cargo-fmt-files.txt SHA256SUMS commit.txt tree.txt; do
              [[ -f "$artifact/$path" ]] && cp "$artifact/$path" "$destination/$name/$path"
            done
            if [[ -d "$artifact/formatted" ]]; then
              cp -R "$artifact/formatted" "$destination/$name/formatted"
            fi
          done
          printf '%s\n' "$GITHUB_RUN_ID" > "$destination/run-id.txt"
          printf '%s\n' "$GITHUB_SHA" > "$destination/relay-head.txt"
          find "$destination" -type f -print0 | sort -z | xargs -0 sha256sum > "$destination/SHA256SUMS"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$destination"
          git commit -m "ci(relay): publish TrillionniumGame repair objects run ${GITHUB_RUN_NUMBER}"
          git push origin HEAD:ci/trillionniumgame-exact-head-relay-v1
