name: owner-open R5 fix validator anchor

on:
  push:
    branches:
      - "codex/owner-open-r5-tool-loop-20260827"
    paths:
      - ".github/workflows/owner-open-r5-fix-validator-anchor.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/owner-open-r5-tool-loop-20260827
          persist-credentials: true
          fetch-depth: 1
      - name: Replace the over-broad exact anchor
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/owner-open-r5-diagnose-next.yml')
          text = path.read_text(encoding='utf-8')
          old = '              insert_after(path, "import os\\n", "import shutil\\n")\n'
          new = '              insert_after(path, "from pathlib import Path\\n", "import shutil\\n")\n'
          if text.count(old) != 1:
              raise SystemExit(f'expected one validator anchor, observed {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/owner-open-r5-diagnose-next.yml
          git commit -m "ci: use unique Python import anchor in R5 validator"
          git push origin HEAD:refs/heads/codex/owner-open-r5-tool-loop-20260827
