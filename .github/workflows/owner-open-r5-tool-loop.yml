name: Owner-open R5 compatibility source routing

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: owner-open-r5-alias-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  ALIAS_AUTHORITY: ALIAS_ONLY_NO_EVIDENCE_AUTHORITY
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  compatibility-source-route:
    name: R5 alias to canonical G1 source checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact source head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ env.SOURCE_HEAD_SHA }}
          persist-credentials: false
      - name: Assert exact immutable checkout
        run: |
          set -euo pipefail
          test "$(git --no-replace-objects rev-parse HEAD)" = "$SOURCE_HEAD_SHA"
          test -z "$(git --no-replace-objects status --porcelain=v1 --untracked-files=all)"
      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Verify canonical machine truth and real repository topology
        run: |
          set -euo pipefail
          test "$ALIAS_AUTHORITY" = ALIAS_ONLY_NO_EVIDENCE_AUTHORITY
          python3 tools/docs/generate_global_docs.py --check
          python3 tools/docs/verify_global_docs.py
          python3 tools/docs/verify_module_documentation.py
          python3 tools/verify_g1_repository_closure.py --json > "${RUNNER_TEMP}/repository-closure.json"
          python3 -m json.tool "${RUNNER_TEMP}/repository-closure.json" >/dev/null
          python3 -m unittest tools.tests.test_verify_g1_repository_closure -v
          test -z "$(git --no-replace-objects status --porcelain=v1 --untracked-files=all)"
      - name: Publish non-authorizing compatibility report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: owner-open-r5-alias-${{ env.SOURCE_HEAD_SHA }}
          if-no-files-found: error
          retention-days: 7
          path: ${{ runner.temp }}/repository-closure.json
