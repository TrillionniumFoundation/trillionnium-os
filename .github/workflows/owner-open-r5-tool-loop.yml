name: L1 owner-open R5 source and gap closure

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "README.md"
      - "apps/trillionnium-owner-open-host/**"
      - "crates/trillionnium-owner-open-*/**"
      - "docs/TRILLIONNIUM_OWNER_OPEN_R5_EXECUTION_PLAN.md"
      - "docs/OWNER_OPEN_R5_START_HERE.md"
      - "docs/README.md"
      - "docs/status/owner-open-r5-*"
      - "docs/contracts/owner-open-forbidden-default-graph-v*.json"
      - "docs/architecture/2026-08-29-owner-open-*.md"
      - "docs/operations/owner-open-*.md"
      - "docs/qualification/owner-open-*.md"
      - "docs/implementation/owner-open-*.md"
      - "docs/protocols/owner-open-*.md"
      - "docs/plan/owner-open-r5-*.md"
      - "docs/evidence/2026-08-28-owner-open-*.md"
      - "tools/generate-owner-open-types.py"
      - "tools/verify-owner-open-r5.py"
      - "tools/verify-owner-open-r5-gap-evidence.py"
      - "tools/owner_open_r5_evidence_bundle.py"
      - "tools/finalize-owner-open-r5-evidence-bundle.py"
      - "tools/verify-owner-open-r5-evidence-bundle.py"
      - "tools/capture-owner-open-r5-target-evidence.py"
      - "tools/promote-owner-open-r5-evidence.py"
      - "tools/verify-owner-open-r5-governance-readiness.py"
      - "tools/verify-owner-open-r5-workflow-boundaries.py"
      - "tools/owner-open/**"
      - "tools/tests/test_verify_owner_open_r5*.py"
      - "tools/tests/test_generate_owner_open_l1_candidate.py"
      - "tools/tests/test_codex_owner_open_mcp.py"
      - "tools/tests/test_codex_mcp_qualification_lifecycle.py"
      - "tools/tests/test_*broker*.py"
      - "tools/tests/test_verify_owner_open_r5_workflow_boundaries.py"
      - "tools/tests/test_owner_open_r5_evidence_bundle.py"
      - "tools/tests/test_promote_owner_open_r5_evidence.py"
      - "tools/tests/test_verify_owner_open_r5_governance_readiness.py"
      - "docs/contracts/owner-open-r5-*.json"
      - "docs/operations/owner-open-r5-external-evidence-capture-and-promotion.md"
      - "evidence/owner-open-r5/**"
      - ".github/workflows/owner-open-r5-target-evidence-capture.yml"
      - ".github/workflows/owner-open-r5-governance-readiness.yml"
      - ".github/workflows/owner-open-r5-tool-loop.yml"
  push:
    branches:
      - main
      - "codex/**"
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "README.md"
      - "apps/trillionnium-owner-open-host/**"
      - "crates/trillionnium-owner-open-*/**"
      - "docs/TRILLIONNIUM_OWNER_OPEN_R5_EXECUTION_PLAN.md"
      - "docs/OWNER_OPEN_R5_START_HERE.md"
      - "docs/README.md"
      - "docs/status/owner-open-r5-*"
      - "docs/contracts/owner-open-forbidden-default-graph-v*.json"
      - "docs/architecture/2026-08-29-owner-open-*.md"
      - "docs/operations/owner-open-*.md"
      - "docs/qualification/owner-open-*.md"
      - "docs/implementation/owner-open-*.md"
      - "docs/protocols/owner-open-*.md"
      - "docs/plan/owner-open-r5-*.md"
      - "docs/evidence/2026-08-28-owner-open-*.md"
      - "tools/generate-owner-open-types.py"
      - "tools/verify-owner-open-r5.py"
      - "tools/verify-owner-open-r5-gap-evidence.py"
      - "tools/owner_open_r5_evidence_bundle.py"
      - "tools/finalize-owner-open-r5-evidence-bundle.py"
      - "tools/verify-owner-open-r5-evidence-bundle.py"
      - "tools/capture-owner-open-r5-target-evidence.py"
      - "tools/promote-owner-open-r5-evidence.py"
      - "tools/verify-owner-open-r5-governance-readiness.py"
      - "tools/verify-owner-open-r5-workflow-boundaries.py"
      - "tools/owner-open/**"
      - "tools/tests/test_verify_owner_open_r5*.py"
      - "tools/tests/test_generate_owner_open_l1_candidate.py"
      - "tools/tests/test_codex_owner_open_mcp.py"
      - "tools/tests/test_codex_mcp_qualification_lifecycle.py"
      - "tools/tests/test_*broker*.py"
      - "tools/tests/test_verify_owner_open_r5_workflow_boundaries.py"
      - "tools/tests/test_owner_open_r5_evidence_bundle.py"
      - "tools/tests/test_promote_owner_open_r5_evidence.py"
      - "tools/tests/test_verify_owner_open_r5_governance_readiness.py"
      - "docs/contracts/owner-open-r5-*.json"
      - "docs/operations/owner-open-r5-external-evidence-capture-and-promotion.md"
      - "evidence/owner-open-r5/**"
      - ".github/workflows/owner-open-r5-target-evidence-capture.yml"
      - ".github/workflows/owner-open-r5-governance-readiness.yml"
      - ".github/workflows/owner-open-r5-tool-loop.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: owner-open-r5-l1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  l1-graph-docs-python:
    name: L1 graph, documentation, broker and MCP source closure
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Assert exact source-head checkout
        env:
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git --no-replace-objects rev-parse HEAD)" = "$SOURCE_HEAD_SHA"
          test -n "$(git --no-replace-objects rev-parse HEAD^{tree})"
          test -z "$(git --no-replace-objects status --porcelain=v1 --untracked-files=all)"
      - name: Parse machine contracts and compile Python
        run: |
          set -euo pipefail
          python3 -m json.tool docs/contracts/owner-open-forbidden-default-graph-v1.json >/dev/null
          python3 -m json.tool docs/contracts/owner-open-forbidden-default-graph-v2.json >/dev/null
          python3 -m json.tool docs/status/owner-open-r5-status.json >/dev/null
          python3 -m json.tool docs/status/owner-open-r5-gap-closure.json >/dev/null
          python3 -m compileall -q \
            tools/owner-open \
            tools/tests \
            tools/verify-owner-open-r5.py \
            tools/verify-owner-open-r5-gap-evidence.py \
            tools/owner_open_r5_evidence_bundle.py \
            tools/finalize-owner-open-r5-evidence-bundle.py \
            tools/verify-owner-open-r5-evidence-bundle.py \
            tools/capture-owner-open-r5-target-evidence.py \
            tools/promote-owner-open-r5-evidence.py \
            tools/verify-owner-open-r5-governance-readiness.py \
            tools/verify-owner-open-r5-workflow-boundaries.py
      - name: Verify generated codec constants
        run: python3 tools/generate-owner-open-types.py --check
      - name: Verify permanent workflow and exact-head boundaries
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/owner-open-r5-l1-graph-docs-python-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          mkdir -m 0700 -p "$EVIDENCE_DIR"
          python3 tools/verify-owner-open-r5-workflow-boundaries.py --json \
            | tee "$EVIDENCE_DIR/owner-open-r5-workflow-boundaries.json"
      - name: Verify exact R5 graph, active plan and gap evidence
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/owner-open-r5-l1-graph-docs-python-${{ github.run_id }}-${{ github.run_attempt }}
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir -m 0700 -p "$EVIDENCE_DIR"
          SOURCE_HEAD_TREE="$(git --no-replace-objects rev-parse HEAD^{tree})"
          test "$(git --no-replace-objects rev-parse HEAD)" = "$SOURCE_HEAD_SHA"
          python3 tools/verify-owner-open-r5.py \
            --expected-commit "$SOURCE_HEAD_SHA" \
            --expected-tree "$SOURCE_HEAD_TREE" \
            --json | tee "$EVIDENCE_DIR/owner-open-r5-verification.json"
          python3 tools/verify-owner-open-r5-gap-evidence.py \
            --expected-commit "$SOURCE_HEAD_SHA" \
            --expected-tree "$SOURCE_HEAD_TREE" \
            --json | tee "$EVIDENCE_DIR/owner-open-r5-gap-evidence.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          evidence_dir = Path(os.environ["EVIDENCE_DIR"])
          value = json.loads((evidence_dir / "owner-open-r5-verification.json").read_text())
          assert value.get("ok") is True, value
          facts = value.get("facts", {})
          assert facts.get("active_plan_revision") == "2026-08-29-r6", facts
          assert facts.get("zero_gap") is False, facts
          gap = json.loads((evidence_dir / "owner-open-r5-gap-evidence.json").read_text())
          assert gap.get("ok") is True, gap
          assert gap.get("facts", {}).get("zero_gap") is False, gap
          PY
      - name: Run R5 verifier and evidence-binding tests
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/owner-open-r5-l1-graph-docs-python-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python3 -m unittest \
            tools.tests.test_verify_owner_open_r5 \
            tools.tests.test_verify_owner_open_r5_gap_closure \
            tools.tests.test_verify_owner_open_r5_gap_evidence \
            tools.tests.test_generate_owner_open_l1_candidate \
            tools.tests.test_owner_open_r5_evidence_bundle \
            tools.tests.test_promote_owner_open_r5_evidence \
            tools.tests.test_verify_owner_open_r5_governance_readiness \
            tools.tests.test_verify_owner_open_r5_workflow_boundaries \
            -v 2>&1 | tee "$EVIDENCE_DIR/owner-open-r5-verifier-tests.txt"
      - name: Run Codex STDIO MCP job bridge tests
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/owner-open-r5-l1-graph-docs-python-${{ github.run_id }}-${{ github.run_attempt }}
          PYTHONWARNINGS: error::ResourceWarning
        run: python3 -m unittest tools.tests.test_codex_owner_open_mcp -v 2>&1 | tee "$EVIDENCE_DIR/owner-open-r5-mcp-tests.txt"
      - name: Run installed-Codex qualification lifecycle fixtures
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/owner-open-r5-l1-graph-docs-python-${{ github.run_id }}-${{ github.run_attempt }}
          PYTHONWARNINGS: error::ResourceWarning
        run: python3 -m unittest tools.tests.test_codex_mcp_qualification_lifecycle -v 2>&1 | tee "$EVIDENCE_DIR/owner-open-r5-qualification-fixtures.txt"
      - name: Run multi-connection broker source tests
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/owner-open-r5-l1-graph-docs-python-${{ github.run_id }}-${{ github.run_attempt }}
          PYTHONWARNINGS: error::ResourceWarning
        run: python3 -m unittest discover -s tools/tests -p 'test_*broker*.py' -v 2>&1 | tee "$EVIDENCE_DIR/owner-open-r5-broker-tests.txt"
      - name: Prove tracked checkout remained clean
        run: |
          set -euo pipefail
          test -z "$(git --no-replace-objects status --porcelain=v1 --untracked-files=all)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: owner-open-r5-l1-graph-docs-python-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: ${{ runner.temp }}/owner-open-r5-l1-graph-docs-python-${{ github.run_id }}-${{ github.run_attempt }}/

  l1-rust:
    name: L1 Rust 1.93 selected Host, job, flow and recovery closure
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d8dfd7155fea72af4ad34a8fe97364d210e2d020
        with:
          components: rustfmt, clippy
      - name: Assert exact source-head checkout
        env:
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git --no-replace-objects rev-parse HEAD)" = "$SOURCE_HEAD_SHA"
          test -n "$(git --no-replace-objects rev-parse HEAD^{tree})"
          test -z "$(git --no-replace-objects status --porcelain=v1 --untracked-files=all)"
      - name: Verify reviewed dependency lock without mutation
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/owner-open-r5-l1-rust-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          mkdir -m 0700 -p "$EVIDENCE_DIR"
          test -s Cargo.lock
          cp Cargo.lock "$EVIDENCE_DIR/owner-open-r5-reviewed-Cargo.lock"
          cargo metadata --locked --format-version 1 > "$EVIDENCE_DIR/owner-open-r5-cargo-metadata.json"
          cmp --silent Cargo.lock "$EVIDENCE_DIR/owner-open-r5-reviewed-Cargo.lock"
          git --no-replace-objects diff --exit-code -- Cargo.lock
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Test exact owner-open default closure
        run: cargo test --locked --all-targets
      - name: Deny Clippy warnings in the exact default closure
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Capture exact feature graph and prove lock immutability
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/owner-open-r5-l1-rust-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          cmp --silent Cargo.lock "$EVIDENCE_DIR/owner-open-r5-reviewed-Cargo.lock"
          git --no-replace-objects diff --exit-code -- Cargo.lock
          : > "$EVIDENCE_DIR/owner-open-r5-cargo-tree.txt"
          for package in \
            trillionnium-owner-open-types \
            trillionnium-owner-open-runtime \
            trillionnium-owner-open-call-registry \
            trillionnium-owner-open-event-store \
            trillionnium-owner-open-job-registry \
            trillionnium-owner-open-job-runtime \
            trillionnium-owner-open-stream-window \
            trillionnium-owner-open-tool-bridge \
            trillionnium-owner-open-turn-loop \
            trillionnium-owner-open-provider-jsonl \
            trillionnium-owner-open-host
          do
            cargo tree --locked -e features -p "$package" >> "$EVIDENCE_DIR/owner-open-r5-cargo-tree.txt"
          done
          git --no-replace-objects diff -- Cargo.lock > "$EVIDENCE_DIR/owner-open-r5-cargo-lock.patch"
          test ! -s "$EVIDENCE_DIR/owner-open-r5-cargo-lock.patch"
          cp Cargo.lock "$EVIDENCE_DIR/Cargo.lock"
          test -z "$(git --no-replace-objects status --porcelain=v1 --untracked-files=all)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: owner-open-r5-l1-rust-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: ${{ runner.temp }}/owner-open-r5-l1-rust-${{ github.run_id }}-${{ github.run_attempt }}/

  l1-candidate:
    name: L1 exact-source-head aggregate candidate
    needs:
      - l1-graph-docs-python
      - l1-rust
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Assert exact source-head checkout
        env:
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git --no-replace-objects rev-parse HEAD)" = "$SOURCE_HEAD_SHA"
          test -n "$(git --no-replace-objects rev-parse HEAD^{tree})"
          test -z "$(git --no-replace-objects status --porcelain=v1 --untracked-files=all)"
      - name: Generate aggregate exact-source-head manifest
        env:
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SOURCE_HEAD_REF: ${{ github.head_ref || github.ref_name }}
          WORKFLOW_TRIGGER_SHA: ${{ github.sha }}
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_NAME: L1 owner-open R5 source and gap closure
        run: |
          set -euo pipefail
          python3 tools/owner-open/generate_owner_open_l1_candidate.py \
            --repository "$GITHUB_REPOSITORY" \
            --source-head-sha "$SOURCE_HEAD_SHA" \
            --source-head-ref "$SOURCE_HEAD_REF" \
            --workflow-trigger-sha "$WORKFLOW_TRIGGER_SHA" \
            --pull-request-base-sha "$PULL_REQUEST_BASE_SHA" \
            --event-name "$EVENT_NAME" \
            --workflow-name "$WORKFLOW_NAME" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --output owner-open-r5-l1-candidate.json
          python3 -m json.tool owner-open-r5-l1-candidate.json >/dev/null
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: owner-open-r5-l1-candidate-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: owner-open-r5-l1-candidate.json
