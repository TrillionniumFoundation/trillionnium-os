name: Temporary module-contract v3 carrier diagnostic

on:
  push:
    branches:
      - ops/module-contracts-v3-preflight-fix-20260910

permissions:
  contents: read

concurrency:
  group: temporary-module-contract-v3-carrier-diagnostic
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_XZ_SHA256: 96dbc9a46bb632915f4c80d0588c443d60f771d80a9f77e4ac3e54a2030eb88f
      EXPECTED_TAR_SHA256: c3d175853a44194beeb1a4739f036f8e05fff48965d0b38f4ac6bd131149e28f
    steps:
      - name: Check out exact diagnostic subject
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify carrier bytes, digests and archive inventory
        shell: bash
        run: |
          set -euo pipefail
          b64="${RUNNER_TEMP:?}/module-contracts-v3-source.tar.xz.b64"
          xz_file="${RUNNER_TEMP:?}/module-contracts-v3-source.tar.xz"
          tar_file="${RUNNER_TEMP:?}/module-contracts-v3-source.tar"
          : > "$b64"
          for suffix in 00 01 02 03; do
            part="ops/module-contracts-v3-source.tar.xz.b64.${suffix}"
            test -f "$part"
            test ! -L "$part"
            cat -- "$part" >> "$b64"
          done
          observed_b64_bytes="$(wc -c < "$b64" | tr -d ' ')"
          observed_b64_sha256="$(sha256sum "$b64" | cut -d' ' -f1)"
          printf 'carrier_b64_bytes=%s\n' "$observed_b64_bytes"
          printf 'carrier_b64_sha256=%s\n' "$observed_b64_sha256"
          test "$observed_b64_bytes" = 25468
          python3 - "$b64" "$xz_file" <<'PY'
          from pathlib import Path
          import base64, binascii, sys
          source, target = map(Path, sys.argv[1:])
          raw = source.read_bytes()
          if any(byte in b" \t\r\n" for byte in raw):
              raise SystemExit("carrier contains whitespace")
          try:
              decoded = base64.b64decode(raw, validate=True)
          except binascii.Error as exc:
              raise SystemExit(f"invalid base64 carrier: {exc}") from exc
          target.write_bytes(decoded)
          PY
          observed_xz_sha256="$(sha256sum "$xz_file" | cut -d' ' -f1)"
          printf 'carrier_xz_sha256=%s\n' "$observed_xz_sha256"
          test "$observed_xz_sha256" = "$EXPECTED_XZ_SHA256"
          xz --test -- "$xz_file"
          xz --decompress --stdout -- "$xz_file" > "$tar_file"
          observed_tar_sha256="$(sha256sum "$tar_file" | cut -d' ' -f1)"
          printf 'carrier_tar_sha256=%s\n' "$observed_tar_sha256"
          test "$observed_tar_sha256" = "$EXPECTED_TAR_SHA256"
          python3 - "$tar_file" <<'PY'
          from pathlib import Path, PurePosixPath
          import hashlib, json, sys, tarfile
          archive = Path(sys.argv[1])
          with tarfile.open(archive, mode="r:") as tar:
              members = tar.getmembers()
              names = [member.name for member in members]
              expected = ["MANIFEST.json", "generator.py", "test_module_contracts.py"]
              if names != expected or len(names) != len(set(names)):
                  raise SystemExit(f"archive inventory differs: {names!r}")
              for member in members:
                  pure = PurePosixPath(member.name)
                  if pure.is_absolute() or member.name != pure.as_posix() or "." in pure.parts or ".." in pure.parts:
                      raise SystemExit(f"unsafe archive member: {member.name}")
                  if not member.isfile() or member.issym() or member.islnk():
                      raise SystemExit(f"unsupported archive member: {member.name}")
              manifest_raw = tar.extractfile("MANIFEST.json").read()
              manifest = json.loads(manifest_raw)
              print(f"manifest_sha256={hashlib.sha256(manifest_raw).hexdigest()}")
              print(f"manifest_schema={manifest.get('schema')}")
              print(f"manifest_base_commit={manifest.get('base_commit')}")
              print(f"manifest_automatic_redispatch={str(manifest.get('automatic_redispatch')).lower()}")
              print(f"manifest_public_release={str(manifest.get('public_release')).lower()}")
          PY
