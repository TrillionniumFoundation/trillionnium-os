name: owner-open R5 final gap diagnostic

on:
  push:
    branches:
      - "codex/owner-open-r5-tool-loop-20260827"
    paths:
      - ".github/workflows/owner-open-r5-final-gap-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: owner-open-r5-final-gap-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    name: Capture exact public bundle and source bytes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact diagnostic checkout
        env:
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git --no-replace-objects rev-parse HEAD)" = "$SOURCE_HEAD_SHA"
          test -n "$(git --no-replace-objects rev-parse HEAD^{tree})"
          test -z "$(git --no-replace-objects status --porcelain=v1 --untracked-files=all)"
      - name: Capture exact checkout identity and public Cosign bundles
        run: |
          set -euo pipefail
          git --no-replace-objects rev-parse HEAD > owner-open-r5-diagnostic-head.txt
          git --no-replace-objects rev-parse HEAD^{tree} > owner-open-r5-diagnostic-tree.txt
          mkdir -m 0700 owner-open-r5-public-bundles owner-open-r5-public-archives
          for arch in aarch64 x86_64; do
            for suffix in tar.gz sigstore; do
              name="codex-${arch}-unknown-linux-musl.${suffix}"
              curl --proto '=https' --tlsv1.2 --fail --show-error --silent \
                --location --retry 4 --retry-all-errors --connect-timeout 20 --max-time 1200 \
                --output "owner-open-r5-public-$([ "$suffix" = sigstore ] && echo bundles || echo archives)/${name}" \
                "https://github.com/openai/codex/releases/download/rust-v0.150.1/${name}"
            done
          done
          sha256sum owner-open-r5-public-bundles/* > owner-open-r5-public-bundles.sha256
          sha256sum owner-open-r5-public-archives/* > owner-open-r5-public-archives.sha256
          python3 - <<'PY' > owner-open-r5-rekor-member-binding.json
          import base64
          import hashlib
          import json
          from pathlib import Path
          import tarfile

          records = []
          for bundle in sorted(Path('owner-open-r5-public-bundles').glob('*.sigstore')):
              stem = bundle.name.removesuffix('.sigstore')
              archive = Path('owner-open-r5-public-archives') / f'{stem}.tar.gz'
              document = json.loads(bundle.read_text())
              body = json.loads(base64.b64decode(document['rekorBundle']['Payload']['body']))
              rekor = body['spec']['data']['hash']['value']
              with tarfile.open(archive, 'r:gz') as handle:
                  members = [member for member in handle.getmembers() if member.isfile()]
                  if len(members) != 1:
                      raise SystemExit(f'{archive}: expected one regular member')
                  source = handle.extractfile(members[0])
                  if source is None:
                      raise SystemExit(f'{archive}: cannot read member')
                  digest = hashlib.sha256()
                  while chunk := source.read(1024 * 1024):
                      digest.update(chunk)
              member = digest.hexdigest()
              records.append({
                  'archive': archive.name,
                  'archive_sha256': hashlib.sha256(archive.read_bytes()).hexdigest(),
                  'member': members[0].name,
                  'member_sha256': member,
                  'rekor_sha256': rekor,
                  'rekor_matches_member': rekor == member,
              })
          print(json.dumps(records, sort_keys=True, indent=2))
          if not records or not all(item['rekor_matches_member'] for item in records):
              raise SystemExit('Rekor entry does not bind exact extracted member')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: owner-open-r5-final-gap-diagnostic-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: error
          retention-days: 2
          path: |
            owner-open-r5-diagnostic-head.txt
            owner-open-r5-diagnostic-tree.txt
            owner-open-r5-public-bundles.sha256
            owner-open-r5-public-archives.sha256
            owner-open-r5-rekor-member-binding.json
            owner-open-r5-public-bundles/*.sigstore
            crates/trillionnium-owner-open-job-runtime/src/manager.rs
            crates/trillionnium-owner-open-job-runtime/src/journal.rs
            apps/trillionnium-owner-open-host/tests/r5_jobs.rs
            .github/workflows/owner-open-r5-codex-artifacts.yml
            .github/workflows/owner-open-source-slices.yml
