name: owner-open R5 final gap diagnostic

on:
  push:
    branches:
      - "codex/owner-open-r5-tool-loop-20260827"
    paths:
      - ".github/workflows/owner-open-r5-final-gap-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: owner-open-r5-final-gap-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    name: Capture exact public bundle and source bytes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Capture exact checkout identity and public Cosign bundles
        run: |
          set -euo pipefail
          git rev-parse HEAD > owner-open-r5-diagnostic-head.txt
          mkdir -m 0700 owner-open-r5-public-bundles
          for name in \
            codex-aarch64-unknown-linux-musl.sigstore \
            codex-x86_64-unknown-linux-musl.sigstore
          do
            curl --proto '=https' --tlsv1.2 --fail --show-error --silent \
              --location --retry 4 --retry-all-errors --connect-timeout 20 --max-time 120 \
              --output "owner-open-r5-public-bundles/${name}" \
              "https://github.com/openai/codex/releases/download/rust-v0.150.1/${name}"
          done
          sha256sum owner-open-r5-public-bundles/* > owner-open-r5-public-bundles.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: owner-open-r5-final-gap-diagnostic-${{ github.sha }}
          if-no-files-found: error
          retention-days: 2
          path: |
            owner-open-r5-diagnostic-head.txt
            owner-open-r5-public-bundles.sha256
            owner-open-r5-public-bundles/*.sigstore
            crates/trillionnium-owner-open-job-runtime/src/manager.rs
            crates/trillionnium-owner-open-job-runtime/src/journal.rs
            apps/trillionnium-owner-open-host/tests/r5_jobs.rs
            .github/workflows/owner-open-r5-codex-artifacts.yml
            .github/workflows/owner-open-source-slices.yml
