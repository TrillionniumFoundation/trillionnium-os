name: Temporary module-contract v3 Clippy template inspect

on:
  push:
    branches:
      - ops/module-contracts-v3-preflight-fix-20260910
    paths:
      - .github/workflows/tmp-module-contracts-v3-clippy-inspect.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact controller
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Authenticate, extract and inspect Clippy anchor
        shell: bash
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP:?}/module-contracts-v3-clippy-inspect"
          mkdir -m 0700 -p "$root/src"
          {
            head -c 5500 -- ops/module-contracts-v3-source.tar.xz.b64.00
            cat -- \
              ops/module-contracts-v3-source.tar.xz.b64.01 \
              ops/module-contracts-v3-source.tar.xz.b64.02 \
              ops/module-contracts-v3-source.tar.xz.b64.03
          } > "$root/bundle.b64"
          test "$(wc -c < "$root/bundle.b64" | tr -d ' ')" = 20968
          test "$(sha256sum "$root/bundle.b64" | cut -d' ' -f1)" = 7ad6edd6696b7ebc2047952d6723426eaab4357a2d9ed304220e61db1d3bfcf9
          base64 --decode -- "$root/bundle.b64" > "$root/bundle.tar.xz"
          test "$(sha256sum "$root/bundle.tar.xz" | cut -d' ' -f1)" = 96dbc9a46bb632915f4c80d0588c443d60f771d80a9f77e4ac3e54a2030eb88f
          xz --test -- "$root/bundle.tar.xz"
          xz --decompress --stdout -- "$root/bundle.tar.xz" > "$root/bundle.tar"
          test "$(sha256sum "$root/bundle.tar" | cut -d' ' -f1)" = c3d175853a44194beeb1a4739f036f8e05fff48965d0b38f4ac6bd131149e28f
          tar -xf "$root/bundle.tar" -C "$root/src"
          test "$(sha256sum "$root/src/MANIFEST.json" | cut -d' ' -f1)" = 19d5d89864d2ff0fdbfec825dae588ed032392bc2f0befaa7bd5b525b920c689
          python3 - "$root/src/generator.py" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          lines = path.read_text(encoding="utf-8").splitlines()
          needles = [
              "let mut limits = MechanicalLimits::default();",
              "limits.max_frame_bytes = MAX_MODULE_CONTRACT_JSON_BYTES;",
          ]
          for needle in needles:
              matches = [index for index, line in enumerate(lines) if needle in line]
              print(f"NEEDLE {needle!r} MATCHES {len(matches)}")
              if len(matches) != 1:
                  raise SystemExit(f"anchor count differs for {needle!r}")
              index = matches[0]
              start = max(0, index - 15)
              end = min(len(lines), index + 25)
              print(f"--- {path.name} lines {start + 1}-{end} ---")
              for line_number in range(start, end):
                  print(f"{line_number + 1:05d}:{lines[line_number]}")
          PY
