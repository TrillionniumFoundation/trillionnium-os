name: Owner-Open R15 bounded failure extractor

on:
  push:
    branches:
      - ops/owner-open-r15-source-materializer-20260831

permissions:
  actions: read
  contents: read

concurrency:
  group: owner-open-r15-failure-extractor
  cancel-in-progress: true

jobs:
  extract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      TARGET_JOB_ID: "99389332725"
    steps:
      # Keep the diagnostic output bounded so the connector can retrieve it.
      - name: Print bounded diagnostics from failed materializer job
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          log=/tmp/owner-open-r15-failed-job.log
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/jobs/$TARGET_JOB_ID/logs" \
            --output "$log"
          python3 - "$log" <<'PY'
          import re
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          raw = path.read_bytes()
          text = raw.decode("utf-8", errors="replace")
          ansi = re.compile(r"\x1b\[[0-?]*[ -/]*[@-~]")
          lines = [ansi.sub("", line) for line in text.splitlines()]
          needles = (
              "##[error]",
              "error:",
              "FAILED",
              "failures:",
              "panicked at",
              "Process completed with exit code",
              "build failed",
              "test result: FAILED",
              "could not compile",
          )
          hits = [
              index
              for index, line in enumerate(lines)
              if any(needle.lower() in line.lower() for needle in needles)
          ]
          selected: set[int] = set()
          for index in hits[-24:]:
              selected.update(range(max(0, index - 7), min(len(lines), index + 9)))
          if not selected:
              selected.update(range(max(0, len(lines) - 240), len(lines)))
          ordered = sorted(selected)
          if len(ordered) > 320:
              ordered = ordered[-320:]
          print(f"R15_DIAGNOSTIC_BYTES={len(raw)}")
          print(f"R15_DIAGNOSTIC_MATCHES={len(hits)}")
          previous = None
          for index in ordered:
              if previous is not None and index != previous + 1:
                  print("... omitted ...")
              print(f"{index + 1:06d}: {lines[index]}")
              previous = index
          PY
