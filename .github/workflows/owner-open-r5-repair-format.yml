name: owner-open R5 repair and rustfmt artifact

on:
  workflow_dispatch:
  push:
    branches:
      - "codex/owner-open-r5-tool-loop-20260827"
    paths:
      - ".github/workflows/owner-open-r5-repair-format.yml"

permissions:
  contents: write

concurrency:
  group: owner-open-r5-repair-format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair-and-format:
    name: Generate and commit reviewed Python repair and Rust 1.93 format bytes
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/owner-open-r5-tool-loop-20260827
          persist-credentials: true
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Set up Rust 1.93 rustfmt
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.93.0
          components: rustfmt

      - name: Apply exact reviewed Python repairs
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str, expected: int = 1) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != expected:
                  raise SystemExit(
                      f"{path}: expected {expected} exact replacements, observed {count}"
                  )
              target.write_text(text.replace(old, new), encoding="utf-8")

          image_test = "tools/tests/test_build_owner_open_rootfs_image_release_v2.py"
          replace_exact(
              image_test,
              "    def run(self, command: list[str], timeout: float = 30) -> subprocess.CompletedProcess[bytes]:\n",
              "    def run_command(\n        self, command: list[str], timeout: float = 30\n    ) -> subprocess.CompletedProcess[bytes]:\n",
          )
          replace_exact(image_test, "self.run(", "self.run_command(", expected=7)

          replace_exact(
              "tools/tests/test_build_codex_only_raw_elf_set.py",
              "        self.assertEqual(BUILDER.derive_control_root(), ROOT.parent.resolve())\n",
              "        self.assertEqual(BUILDER.derive_control_root(), ROOT.resolve())\n",
          )

          boundary_test = "tools/tests/test_agent_exec_adb_windows_product_boundary.py"
          old = '''    def test_canonical_documents_bind_the_same_direction(self) -> None:\n        documents = (\n            ADR_PATH.read_text(encoding="utf-8"),\n            CURRENT_STATE_PATH.read_text(encoding="utf-8"),\n            README_PATH.read_text(encoding="utf-8"),\n        )\n        for document in documents:\n            normalized = " ".join(document.split()).casefold()\n            self.assertIn("codex", normalized)\n            self.assertIn("off-device", normalized)\n            self.assertIn("shell", normalized)\n            self.assertIn("adb", normalized)\n            self.assertIn("hold", normalized)\n        self.assertIn("only built-in Agent", documents[0])\n        self.assertIn("Codex is the single built-in", documents[2])\n'''
          new = '''    def test_canonical_documents_preserve_history_and_bind_owner_open(self) -> None:\n        adr = ADR_PATH.read_text(encoding="utf-8")\n        current_state = CURRENT_STATE_PATH.read_text(encoding="utf-8")\n        readme = README_PATH.read_text(encoding="utf-8")\n\n        historical = " ".join(adr.split()).casefold()\n        for token in ("codex", "off-device", "shell", "adb"):\n            self.assertIn(token, historical)\n        self.assertIn("only built-in Agent", adr)\n        self.assertIn("implementation work", historical)\n\n        for document in (current_state, readme):\n            normalized = " ".join(document.split()).casefold()\n            for token in ("codex", "owner-open", "shell", "adb"):\n                self.assertIn(token, normalized)\n        self.assertIn("supersedes older semantic", current_state)\n        self.assertIn("Codex is the single semantic", readme)\n        self.assertIn("Explicitly not claimed", readme)\n'''
          replace_exact(boundary_test, old, new)
          PY

      - name: Format the complete Rust workspace
        run: cargo fmt --all

      - name: Validate generated working-tree patch
        run: |
          git diff --check
          cargo fmt --all -- --check
          python3 -m py_compile \
            tools/tests/test_agent_exec_adb_windows_product_boundary.py \
            tools/tests/test_build_codex_only_raw_elf_set.py \
            tools/tests/test_build_owner_open_rootfs_image_release_v2.py

      - name: Run the three repaired regression slices
        run: |
          python3 -m unittest \
            tools.tests.test_agent_exec_adb_windows_product_boundary \
            tools.tests.test_build_codex_only_raw_elf_set \
            tools.tests.test_build_owner_open_rootfs_image_release_v2 -v

      - name: Package exact formatted source bytes
        run: |
          mkdir -p owner-open-r5-repair/files
          git diff --binary > owner-open-r5-repair/repair-and-rustfmt.patch
          git diff --name-only > owner-open-r5-repair/changed-files.txt
          while IFS= read -r path; do
            test -n "$path" || continue
            mkdir -p "owner-open-r5-repair/files/$(dirname "$path")"
            cp -- "$path" "owner-open-r5-repair/files/$path"
          done < owner-open-r5-repair/changed-files.txt
          git diff --stat > owner-open-r5-repair/diff-stat.txt
          git rev-parse HEAD > owner-open-r5-repair/base-head.txt
          sha256sum owner-open-r5-repair/repair-and-rustfmt.patch \
            > owner-open-r5-repair/repair-and-rustfmt.patch.sha256
          tar -C owner-open-r5-repair -czf owner-open-r5-repair.tar.gz .

      - name: Commit and push the exact validated repair bytes
        run: |
          test -s owner-open-r5-repair/changed-files.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "chore: apply R5 runner repairs and rustfmt"
          git push origin HEAD:refs/heads/codex/owner-open-r5-tool-loop-20260827

      - name: Upload exact repair artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: owner-open-r5-repair-rustfmt-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          path: |
            owner-open-r5-repair.tar.gz
            owner-open-r5-repair/
