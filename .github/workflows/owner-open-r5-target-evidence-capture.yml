name: Owner-open R5 independently administered target evidence capture

on:
  workflow_dispatch:
    inputs:
      evidence_kind:
        description: Exact independently administered evidence lane
        required: true
        type: choice
        options:
          - installed_root_linux_process_matrix
          - installed_codex_same_turn
          - clean_android_target_files
          - physical_android_adb
          - destructive_fault_matrix
          - signed_public_release
      source_commit:
        description: Exact 40-character promoted source commit
        required: true
        type: string
      source_tree:
        description: Exact 40-character source tree
        required: true
        type: string
      authorization_ticket:
        description: External authorization reference; L5 must start DESTRUCTIVE-, L6 must start RELEASE-
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: owner-open-r5-target-${{ inputs.evidence_kind }}-${{ inputs.source_commit }}
  cancel-in-progress: false

jobs:
  route:
    name: Validate closed-choice evidence route
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      level: ${{ steps.route.outputs.level }}
      runner_label: ${{ steps.route.outputs.runner_label }}
      environment: ${{ steps.route.outputs.environment }}
      harness: ${{ steps.route.outputs.harness }}
      attestation: ${{ steps.route.outputs.attestation }}
    steps:
      - name: Bind kind to one fixed level, runner, environment and root-owned input
        id: route
        env:
          KIND: ${{ inputs.evidence_kind }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          SOURCE_TREE: ${{ inputs.source_tree }}
          AUTHORIZATION_TICKET: ${{ inputs.authorization_ticket }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_TREE" =~ ^[0-9a-f]{40}$ ]]
          test -n "$AUTHORIZATION_TICKET"
          case "$KIND" in
            installed_root_linux_process_matrix|installed_codex_same_turn)
              level=L2
              runner_label=owner-open-r5-l2
              environment=owner-open-r5-l2
              ;;
            clean_android_target_files)
              level=L3
              runner_label=owner-open-r5-l3
              environment=owner-open-r5-l3
              ;;
            physical_android_adb)
              level=L4
              runner_label=owner-open-r5-l4
              environment=owner-open-r5-l4
              ;;
            destructive_fault_matrix)
              level=L5
              runner_label=owner-open-r5-l5
              environment=owner-open-r5-l5
              [[ "$AUTHORIZATION_TICKET" == DESTRUCTIVE-* ]]
              ;;
            signed_public_release)
              level=L6
              runner_label=owner-open-r5-l6
              environment=owner-open-r5-l6
              [[ "$AUTHORIZATION_TICKET" == RELEASE-* ]]
              ;;
            *) exit 64 ;;
          esac
          harness="/opt/owner-open-r5/harnesses/$KIND"
          attestation="/etc/owner-open-r5/attestations/$KIND.json"
          {
            echo "level=$level"
            echo "runner_label=$runner_label"
            echo "environment=$environment"
            echo "harness=$harness"
            echo "attestation=$attestation"
          } >> "$GITHUB_OUTPUT"

  capture:
    name: Capture ${{ needs.route.outputs.level }} ${{ inputs.evidence_kind }}
    needs: route
    runs-on:
      - self-hosted
      - linux
      - x64
      - ${{ needs.route.outputs.runner_label }}
    environment:
      name: ${{ needs.route.outputs.environment }}
    timeout-minutes: 180
    steps:
      - name: Check out the exact promoted source commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_commit }}
          persist-credentials: false
      - name: Revalidate source commit and tree before target contact
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          SOURCE_TREE: ${{ inputs.source_tree }}
        run: |
          set -euo pipefail
          test "$(git --no-replace-objects rev-parse HEAD)" = "$SOURCE_COMMIT"
          test "$(git --no-replace-objects rev-parse HEAD^{tree})" = "$SOURCE_TREE"
          test -z "$(git --no-replace-objects status --porcelain=v1 --untracked-files=all)"
      - name: Validate immutable independently administered harness and target attestation
        env:
          HARNESS: ${{ needs.route.outputs.harness }}
          ATTESTATION: ${{ needs.route.outputs.attestation }}
        run: |
          set -euo pipefail
          test -f "$HARNESS" && test ! -L "$HARNESS" && test -x "$HARNESS"
          test -f "$ATTESTATION" && test ! -L "$ATTESTATION"
          test "$(stat -c %u "$HARNESS")" = 0
          test "$(stat -c %u "$ATTESTATION")" = 0
          test "$(stat -c %h "$HARNESS")" = 1
          test "$(stat -c %h "$ATTESTATION")" = 1
          harness_mode=$(stat -c %a "$HARNESS")
          attestation_mode=$(stat -c %a "$ATTESTATION")
          test $((8#$harness_mode & 8#022)) -eq 0
          test $((8#$attestation_mode & 8#022)) -eq 0
          python3 -m json.tool "$ATTESTATION" >/dev/null
      - name: Execute the fixed external harness once
        env:
          KIND: ${{ inputs.evidence_kind }}
          LEVEL: ${{ needs.route.outputs.level }}
          HARNESS: ${{ needs.route.outputs.harness }}
          ATTESTATION: ${{ needs.route.outputs.attestation }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          SOURCE_TREE: ${{ inputs.source_tree }}
          AUTHORIZATION_TICKET: ${{ inputs.authorization_ticket }}
        run: |
          set -euo pipefail
          evidence_dir="${RUNNER_TEMP}/owner-open-target-evidence"
          install -d -m 0700 "$evidence_dir"
          output="$evidence_dir/raw-capture.json"
          "$HARNESS" \
            --repository "$GITHUB_REPOSITORY" \
            --evidence-kind "$KIND" \
            --evidence-level "$LEVEL" \
            --source-commit "$SOURCE_COMMIT" \
            --source-tree "$SOURCE_TREE" \
            --target-attestation "$ATTESTATION" \
            --authorization-ticket "$AUTHORIZATION_TICKET" \
            --synthetic=false \
            --output "$output"
          test -s "$output" && test ! -L "$output"
          chmod 0600 "$output"
      - name: Fail closed on synthetic, under-bound or inflated capture output
        env:
          KIND: ${{ inputs.evidence_kind }}
          LEVEL: ${{ needs.route.outputs.level }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          SOURCE_TREE: ${{ inputs.source_tree }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "owner-open-target-evidence"
          raw_path = root / "raw-capture.json"
          raw = raw_path.read_bytes()
          value = json.loads(raw)
          assert isinstance(value, dict)
          assert value.get("synthetic") is False
          assert value.get("repository") == os.environ["GITHUB_REPOSITORY"]
          assert value.get("evidence_kind") == os.environ["KIND"]
          assert value.get("evidence_level") == os.environ["LEVEL"]
          assert value.get("source_commit") == os.environ["SOURCE_COMMIT"]
          assert value.get("source_tree") == os.environ["SOURCE_TREE"]
          assert value.get("promotion_authorized") is False
          assert value.get("public_release") is False
          assert value.get("raw_observations")
          manifest = {
              "schema": "org.trillionnium.target-capture-envelope.v1",
              "status": "CAPTURED_PENDING_INDEPENDENT_REVIEW",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "evidence_kind": os.environ["KIND"],
              "evidence_level": os.environ["LEVEL"],
              "source_commit": os.environ["SOURCE_COMMIT"],
              "source_tree": os.environ["SOURCE_TREE"],
              "raw_capture_sha256": hashlib.sha256(raw).hexdigest(),
              "raw_capture_bytes": len(raw),
              "synthetic": False,
              "promotion_authorized": False,
              "public_release": False,
          }
          (root / "capture-envelope.json").write_text(
              json.dumps(manifest, sort_keys=True, indent=2) + "\n", encoding="utf-8"
          )
          PY
          sha256sum "${RUNNER_TEMP}/owner-open-target-evidence/"*.json \
            > "${RUNNER_TEMP}/owner-open-target-evidence/SHA256SUMS"
          chmod 0600 "${RUNNER_TEMP}/owner-open-target-evidence/"*
      - name: Upload capture for independent review; never promote from this workflow
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: owner-open-${{ needs.route.outputs.level }}-${{ inputs.evidence_kind }}-${{ inputs.source_commit }}
          if-no-files-found: error
          retention-days: 30
          path: ${{ runner.temp }}/owner-open-target-evidence/
