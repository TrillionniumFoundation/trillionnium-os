name: L2-L6 owner-open target evidence capture

on:
  workflow_dispatch:
    inputs:
      kind:
        description: Fixed evidence kind to execute
        required: true
        type: choice
        options:
          - installed_root_linux_process_matrix
          - installed_codex_same_turn
          - clean_android_target_files
          - physical_android_adb
          - destructive_fault_matrix
          - signed_public_release
      source_branch:
        description: Branch whose exact source commit passed the permanent L1 gate
        required: true
        type: string
      source_commit:
        description: Exact lowercase 40-hex qualified source commit
        required: true
        type: string
      source_tree:
        description: Exact lowercase 40-hex qualified source tree
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: owner-open-r5-target-${{ inputs.kind }}-${{ inputs.source_commit }}
  cancel-in-progress: false

jobs:
  l2-rootlinux:
    if: inputs.kind == 'installed_root_linux_process_matrix'
    name: L2 installed Root Linux process matrix capture
    runs-on: [self-hosted, owner-open-r5-l2]
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.source_commit }}
      - name: Revalidate qualified source identity
        env:
          EXPECTED_COMMIT: ${{ inputs.source_commit }}
          EXPECTED_TREE: ${{ inputs.source_tree }}
        run: |
          set -euo pipefail
          test "$(git --no-replace-objects rev-parse HEAD)" = "$EXPECTED_COMMIT"
          test "$(git --no-replace-objects rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          test -z "$(git --no-replace-objects status --porcelain --untracked-files=no)"
          python3 --version
      - name: Execute fixed target-owned L2 harness
        env:
          SOURCE_BRANCH: ${{ inputs.source_branch }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          SOURCE_TREE: ${{ inputs.source_tree }}
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/owner-open-r5-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python3 tools/capture-owner-open-r5-target-evidence.py \
            --kind installed_root_linux_process_matrix \
            --gap-id R5-GAP-PROCESS-LIFECYCLE-001 \
            --gap-id R5-GAP-STREAM-RECOVERY-001 \
            --gap-id R5-GAP-BROKER-CORRELATION-001 \
            --gap-id R5-GAP-ROOTLINUX-PLACEMENT-001 \
            --bundle-dir "$output" \
            --branch "$SOURCE_BRANCH" \
            --source-commit "$SOURCE_COMMIT" \
            --source-tree "$SOURCE_TREE" \
            --claim-ceiling INSTALLED_ROOT_LINUX_PROCESS_MATRIX_L2_CAPTURE_ONLY \
            --producer-login "$GITHUB_ACTOR" \
            --workflow "$GITHUB_WORKFLOW" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --job "$GITHUB_JOB" \
            --negative-claim not_installed_codex_same_turn \
            --negative-claim not_clean_android_image \
            --negative-claim not_physical_device \
            --negative-claim not_public_release \
            | tee "$RUNNER_TEMP/capture-result.json"
          echo "CAPTURE_DIR=$output" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: owner-open-r5-l2-rootlinux-${{ inputs.source_commit }}-${{ github.run_attempt }}
          path: |
            ${{ env.CAPTURE_DIR }}/
            ${{ runner.temp }}/capture-result.json
          if-no-files-found: error
          retention-days: 30

  l2-codex:
