name: owner-open R5 final gap repair

on:
  pull_request:
    paths:
      - ".github/workflows/owner-open-r5-final-gap-repair.yml"
  push:
    branches:
      - "codex/owner-open-r5-tool-loop-20260827"
    paths:
      - ".github/workflows/owner-open-r5-final-gap-repair.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: owner-open-r5-final-gap-repair-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    name: Repair durable terminal publication ordering
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/owner-open-r5-tool-loop-20260827
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.93.0
        with:
          components: rustfmt
      - name: Apply exact fail-closed ordering repair
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('crates/trillionnium-owner-open-job-runtime/src/manager.rs')
          text = path.read_text()
          old = '''                            let _ =
                                manager
                                    .inner
                                    .registry
                                    .complete(&key, generation, terminal.clone());
                            let event = RuntimeJobEventKind::Terminal {
                                generation,
                                terminal_kind,
                                exit_code,
                                signal,
                                observation_sha256,
                                stdout_bytes,
                                stderr_bytes,
                            };
                            if let Ok(seq) =
                                manager.push_runtime_event(&key, &request, event.clone())
                            {
                                let _ = manager.inner.journal.record_job_terminal(
                                    &key,
                                    &request,
                                    seq,
                                    serde_json::to_value(event).unwrap_or(Value::Null),
                                );
                            }
'''
          new = '''                            let event = RuntimeJobEventKind::Terminal {
                                generation,
                                terminal_kind,
                                exit_code,
                                signal,
                                observation_sha256,
                                stdout_bytes,
                                stderr_bytes,
                            };
                            if let Ok(seq) =
                                manager.push_runtime_event(&key, &request, event.clone())
                                && manager
                                    .inner
                                    .journal
                                    .record_job_terminal(
                                        &key,
                                        &request,
                                        seq,
                                        serde_json::to_value(event).unwrap_or(Value::Null),
                                    )
                                    .is_ok()
                            {
                                let _ = manager
                                    .inner
                                    .registry
                                    .complete(&key, generation, terminal);
                            }
'''
          if text.count(old) != 1:
              raise SystemExit('exact terminal-ordering preimage was not found once')
          path.write_text(text.replace(old, new))
          PY
          cargo fmt --all -- --check || cargo fmt --all
          git diff --check
      - name: Prove restart does not redispatch a completed job
        run: |
          cargo test --locked --package trillionnium-owner-open-host \
            --test r5_jobs completed_job_is_not_redispatched_after_a_new_core_process \
            -- --exact --nocapture
          cargo test --locked --package trillionnium-owner-open-job-runtime --all-targets
      - name: Commit exact repair
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          set -euo pipefail
          test "$HEAD_BRANCH" = "codex/owner-open-r5-tool-loop-20260827"
          git config user.name "owner-open-r5-repair[bot]"
          git config user.email "owner-open-r5-repair[bot]@users.noreply.github.com"
          git add crates/trillionnium-owner-open-job-runtime/src/manager.rs
          git diff --cached --exit-code && exit 0 || true
          git commit -m "fix(jobs): persist terminal before publishing completion"
          git push origin HEAD:"$HEAD_BRANCH"
