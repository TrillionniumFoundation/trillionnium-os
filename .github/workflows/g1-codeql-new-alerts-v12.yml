name: G1 CodeQL new-alert closure v12

on:
  push:
    branches:
      - ops/g1-codeql-new-alerts-v12-20260906
    paths:
      - .github/workflows/g1-codeql-new-alerts-v12.yml
      - .g1/g1-codeql-new-alerts-v12.patch
  workflow_dispatch:

permissions: {}

concurrency:
  group: g1-codeql-new-alerts-v12
  cancel-in-progress: false

env:
  TARGET_HEAD: bf8671a0ccc3d511e33a696f4406d7d06a0613de
  TARGET_BRANCH: codex/g1-all-gap-closure-20260904
  MATERIALIZED_BRANCH: ops/g1-codeql-new-alerts-materialized-v12-20260906
  PATCH_SHA256: cb78da0fe3f6570bb79151a9292a749790687653830528d4efe0c75899b2f198
  PYTHONDONTWRITEBYTECODE: "1"
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Read-only exact CodeQL alert-source validation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      result_tree: ${{ steps.bind.outputs.result_tree }}
      staged_patch_sha256: ${{ steps.bind.outputs.staged_patch_sha256 }}
      paths_sha256: ${{ steps.bind.outputs.paths_sha256 }}
    steps:
      - name: Check out isolated control source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          persist-credentials: false
          path: control

      - name: Check out exact target head without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ github.repository }}
          ref: ${{ env.TARGET_HEAD }}
          fetch-depth: 1
          persist-credentials: false
          path: target

      - name: Verify immutable inputs and construct candidate
        shell: bash
        run: |
          set -euo pipefail
          patch="$GITHUB_WORKSPACE/control/.g1/g1-codeql-new-alerts-v12.patch"
          test "$(sha256sum "$patch" | awk '{print $1}')" = "$PATCH_SHA256"
          cd "$GITHUB_WORKSPACE/target"
          test "$(git --no-replace-objects rev-parse HEAD)" = "$TARGET_HEAD"
          test "$(git hash-object apps/trillionniumd/src/android_agent_api.rs)" = dbff9478244b8e7a3e868cd653a107da58d7ea28
          test "$(git hash-object crates/trillionnium-agent-direct-tools/src/trusted_context.rs)" = 3152fee519e8511a44d37a3b61658b3a41e10b0b
          test "$(git hash-object tools/tests/test_verify_owner_open_r5_workflow_boundaries.py)" = 21aefa12c6bc36c6fd16fdb221569a73a68834b1
          test "$(git hash-object tools/verify-owner-open-r5-workflow-boundaries.py)" = e9c05df18174526a1662f72e11d0087356072f06
          git apply --check "$patch"
          git apply "$patch"
          git diff --check
          test "$(git hash-object apps/trillionniumd/src/android_agent_api.rs)" = 9a9d64b6cb6d08f5258010eab6763bb9367e3630
          test "$(git hash-object crates/trillionnium-agent-direct-tools/src/trusted_context.rs)" = b48d5306df8b8ecc7fe0634cf606d203f5090731
          test "$(git hash-object tools/tests/test_verify_owner_open_r5_workflow_boundaries.py)" = 4e4e43f792b30e006c6cb040ec835f729cdb030b
          test "$(git hash-object tools/verify-owner-open-r5-workflow-boundaries.py)" = 6bd028f1efd7ee4e28d1e5aa46a3ba909b8fb8fe
          git status --porcelain=v1 --untracked-files=all | sed -E 's/^.. //; s/.* -> //' | LC_ALL=C sort > "$RUNNER_TEMP/actual-paths"
          cat > "$RUNNER_TEMP/expected-paths" <<'EOF'
          apps/trillionniumd/src/android_agent_api.rs
          crates/trillionnium-agent-direct-tools/src/trusted_context.rs
          tools/tests/test_verify_owner_open_r5_workflow_boundaries.py
          tools/verify-owner-open-r5-workflow-boundaries.py
          EOF
          diff -u "$RUNNER_TEMP/expected-paths" "$RUNNER_TEMP/actual-paths"

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"

      - name: Set up Rust 1.93
        uses: dtolnay/rust-toolchain@d8dfd7155fea72af4ad34a8fe97364d210e2d020
        with:
          toolchain: "1.93.0"
          components: rustfmt,clippy

      - name: Verify URL-host boundary and repository policy
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            tools/verify-owner-open-r5-workflow-boundaries.py \
            tools/tests/test_verify_owner_open_r5_workflow_boundaries.py
          python3 -m unittest tools.tests.test_verify_owner_open_r5_workflow_boundaries -v
          python3 tools/verify-owner-open-r5-workflow-boundaries.py --root . --json > "$RUNNER_TEMP/workflow-boundary.json"
          python3 -m json.tool "$RUNNER_TEMP/workflow-boundary.json" >/dev/null
          python3 tools/docs/generate_global_docs.py --check
          python3 tools/docs/verify_global_docs.py
          python3 tools/docs/verify_module_documentation.py

      - name: Verify exact Rust test branches without sensitive diagnostics
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          for test_name in \
            authenticated_android_ui_boundary_is_user_zero_only \
            legacy_provider_ready_reopen_is_terminal_without_plan_or_authority_dispatch \
            poisoned_direct_provider_ready_with_legacy_submission_is_quarantined \
            malformed_codex_direct_manifest_and_evidence_are_quarantined_on_recovery \
            provider_ready_reopen_survives_same_manifest_reprovision_timestamp_change \
            legacy_v1_saga_is_quarantined_without_blocking_v2_reconciliation \
            provider_pending_reopen_becomes_fixed_indeterminate_without_plan_or_dispatch
          do
            cargo test -p trillionniumd --lib "$test_name" -- --exact
          done
          cargo test -p trillionnium-agent-direct-tools \
            replay_sync_authoritative_dispositions_compact_and_reopen_idempotently
          cargo clippy -p trillionniumd -p trillionnium-agent-direct-tools \
            --all-targets -- -D warnings

      - name: Bind exact tested tree and staged patch
        id: bind
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git add -A -- .
          test -z "$(git diff --name-only)"
          git diff --cached --binary --full-index > "$RUNNER_TEMP/g1-codeql-v12-staged.patch"
          git diff --cached --name-only > "$RUNNER_TEMP/g1-codeql-v12-paths"
          result_tree="$(git --no-replace-objects write-tree)"
          staged_patch_sha256="$(sha256sum "$RUNNER_TEMP/g1-codeql-v12-staged.patch" | awk '{print $1}')"
          paths_sha256="$(sha256sum "$RUNNER_TEMP/g1-codeql-v12-paths" | awk '{print $1}')"
          {
            echo "result_tree=$result_tree"
            echo "staged_patch_sha256=$staged_patch_sha256"
            echo "paths_sha256=$paths_sha256"
          } >> "$GITHUB_OUTPUT"

  publish:
    name: Reconstruct without target execution and publish materialized commit
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out isolated control source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          persist-credentials: false
          path: control

      - name: Check out exact target head without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ github.repository }}
          ref: ${{ env.TARGET_HEAD }}
          fetch-depth: 1
          persist-credentials: false
          path: target

      - name: Reconstruct and bind the validated tree without running target programs
        id: commit
        working-directory: target
        shell: bash
        env:
          EXPECTED_TREE: ${{ needs.validate.outputs.result_tree }}
          EXPECTED_STAGED_PATCH: ${{ needs.validate.outputs.staged_patch_sha256 }}
          EXPECTED_PATHS: ${{ needs.validate.outputs.paths_sha256 }}
        run: |
          set -euo pipefail
          patch="$GITHUB_WORKSPACE/control/.g1/g1-codeql-new-alerts-v12.patch"
          test "$(sha256sum "$patch" | awk '{print $1}')" = "$PATCH_SHA256"
          test "$(git --no-replace-objects rev-parse HEAD)" = "$TARGET_HEAD"
          test "$(git hash-object apps/trillionniumd/src/android_agent_api.rs)" = dbff9478244b8e7a3e868cd653a107da58d7ea28
          test "$(git hash-object crates/trillionnium-agent-direct-tools/src/trusted_context.rs)" = 3152fee519e8511a44d37a3b61658b3a41e10b0b
          test "$(git hash-object tools/tests/test_verify_owner_open_r5_workflow_boundaries.py)" = 21aefa12c6bc36c6fd16fdb221569a73a68834b1
          test "$(git hash-object tools/verify-owner-open-r5-workflow-boundaries.py)" = e9c05df18174526a1662f72e11d0087356072f06
          git apply --check "$patch"
          git apply "$patch"
          git diff --check
          test "$(git hash-object apps/trillionniumd/src/android_agent_api.rs)" = 9a9d64b6cb6d08f5258010eab6763bb9367e3630
          test "$(git hash-object crates/trillionnium-agent-direct-tools/src/trusted_context.rs)" = b48d5306df8b8ecc7fe0634cf606d203f5090731
          test "$(git hash-object tools/tests/test_verify_owner_open_r5_workflow_boundaries.py)" = 4e4e43f792b30e006c6cb040ec835f729cdb030b
          test "$(git hash-object tools/verify-owner-open-r5-workflow-boundaries.py)" = 6bd028f1efd7ee4e28d1e5aa46a3ba909b8fb8fe
          git status --porcelain=v1 --untracked-files=all | sed -E 's/^.. //; s/.* -> //' | LC_ALL=C sort > "$RUNNER_TEMP/actual-paths"
          cat > "$RUNNER_TEMP/expected-paths" <<'EOF'
          apps/trillionniumd/src/android_agent_api.rs
          crates/trillionnium-agent-direct-tools/src/trusted_context.rs
          tools/tests/test_verify_owner_open_r5_workflow_boundaries.py
          tools/verify-owner-open-r5-workflow-boundaries.py
          EOF
          diff -u "$RUNNER_TEMP/expected-paths" "$RUNNER_TEMP/actual-paths"
          git add -A -- .
          test -z "$(git diff --name-only)"
          git diff --cached --binary --full-index > "$RUNNER_TEMP/g1-codeql-v12-publish.patch"
          git diff --cached --name-only > "$RUNNER_TEMP/g1-codeql-v12-publish.paths"
          test "$(sha256sum "$RUNNER_TEMP/g1-codeql-v12-publish.patch" | awk '{print $1}')" = "$EXPECTED_STAGED_PATCH"
          test "$(sha256sum "$RUNNER_TEMP/g1-codeql-v12-publish.paths" | awk '{print $1}')" = "$EXPECTED_PATHS"
          test "$(git --no-replace-objects write-tree)" = "$EXPECTED_TREE"
          git config user.name 'OpenAI Codex'
          git config user.email 'noreply@openai.com'
          git commit \
            -m 'fix(security): close CodeQL new-alert diagnostics' \
            -m 'Stop formatting sensitive recovery values and Android peer UIDs into test failures. Replace GitHub API hostname substring matching with parsed exact-host recognition, retaining symbolic endpoint detection and adding hostile suffix/path regressions. The isolated read-only job validates exact input/output blobs, policy tests, targeted Rust recovery branches, formatting and strict Clippy. No external evidence or release authority is claimed.' \
            -m 'Signed-off-by: OpenAI Codex <noreply@openai.com>'
          result_commit="$(git --no-replace-objects rev-parse HEAD)"
          test "$(git --no-replace-objects rev-parse HEAD^)" = "$TARGET_HEAD"
          test "$(git --no-replace-objects rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          echo "result_commit=$result_commit" >> "$GITHUB_OUTPUT"
          printf '{"result_commit":"%s","result_tree":"%s","parent":"%s","source_patch_sha256":"%s","staged_patch_sha256":"%s","paths_sha256":"%s","target_execution_in_publish_job":false}\n' \
            "$result_commit" "$EXPECTED_TREE" "$TARGET_HEAD" "$PATCH_SHA256" "$EXPECTED_STAGED_PATCH" "$EXPECTED_PATHS" \
            > "$RUNNER_TEMP/g1-codeql-v12-result.json"

      - name: Publish only to the isolated materialized branch with exact leases
        working-directory: target
        shell: bash
        env:
          RESULT_COMMIT: ${{ steps.commit.outputs.result_commit }}
          G1_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$G1_TOKEN" | base64 -w0)"
          target_observed="$(git -c "http.extraheader=AUTHORIZATION: basic ${auth}" ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk 'NR==1 {print $1}')"
          output_observed="$(git -c "http.extraheader=AUTHORIZATION: basic ${auth}" ls-remote origin "refs/heads/${MATERIALIZED_BRANCH}" | awk 'NR==1 {print $1}')"
          test "$target_observed" = "$TARGET_HEAD"
          test "$output_observed" = "$TARGET_HEAD"
          git -c "http.extraheader=AUTHORIZATION: basic ${auth}" push \
            "--force-with-lease=refs/heads/${MATERIALIZED_BRANCH}:${TARGET_HEAD}" \
            origin "${RESULT_COMMIT}:refs/heads/${MATERIALIZED_BRANCH}"
          unset G1_TOKEN auth

      - name: Upload exact materialization receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: g1-codeql-new-alerts-v12-${{ steps.commit.outputs.result_commit }}
          path: ${{ runner.temp }}/g1-codeql-v12-result.json
          if-no-files-found: error
          retention-days: 30
