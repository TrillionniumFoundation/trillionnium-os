name: G1 synthetic-merge qualification

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:
    inputs:
      base_sha:
        description: Exact base parent (40 lowercase hex)
        required: true
        type: string
      head_sha:
        description: Exact source parent (40 lowercase hex)
        required: true
        type: string
      head_repository:
        description: Exact source repository (OWNER/REPOSITORY, required for manual runs)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: g1-synthetic-merge-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  # Never fall back to the workflow-trigger SHA for a manual run: the source
  # repository and both immutable parents must be supplied explicitly.
  EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.base_sha || 'INVALID_BASE_SHA' }}
  EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha || inputs.head_sha || 'INVALID_HEAD_SHA' }}
  EVENT_BASE_REF: ${{ github.event.pull_request.base.ref || '' }}
  EVENT_HEAD_REF: ${{ github.event.pull_request.head.ref || '' }}
  EVENT_PR_NUMBER: ${{ github.event.pull_request.number || '' }}
  EVENT_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || inputs.head_repository || 'invalid/empty-head-repository' }}
  CARGO_TERM_COLOR: always
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  synthetic-merge:
    name: L1 exact two-parent merge source qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      # A pull request's canonical hidden ref is served by the base repository
      # and remains fetchable even when the fork branch is renamed or private.
      # Keep the manual path separate so an explicitly supplied repository/SHA
      # is still required for workflow_dispatch.
      - name: Check out the exact pull-request source parent
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          fetch-depth: 0
          ref: refs/pull/${{ github.event.pull_request.number }}/head
          persist-credentials: false

      - name: Check out the exact manually selected source parent
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          token: ${{ github.token }}
          repository: ${{ env.EVENT_HEAD_REPOSITORY }}
          fetch-depth: 0
          ref: ${{ env.EVENT_HEAD_SHA }}
          persist-credentials: false

      - name: Construct and bind the immutable synthetic merge
        id: merge
        env:
          G1_GIT_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          MERGE_DIR="${RUNNER_TEMP}/g1-synthetic-merge"
          sha_re='^[0-9a-f]{40}$'
          repo_re='^[A-Za-z0-9][A-Za-z0-9_.-]{0,99}/[A-Za-z0-9][A-Za-z0-9_.-]{0,99}$'
          [[ "$EVENT_BASE_SHA" =~ $sha_re ]]
          [[ "$EVENT_HEAD_SHA" =~ $sha_re ]]
          test "$EVENT_BASE_SHA" != "$EVENT_HEAD_SHA"
          [[ "$GITHUB_REPOSITORY" =~ $repo_re ]]
          [[ "$EVENT_HEAD_REPOSITORY" =~ $repo_re ]]
          [[ "$GITHUB_REPOSITORY" != *..* ]]
          [[ "$EVENT_HEAD_REPOSITORY" != *..* ]]
          if [[ "${GITHUB_EVENT_NAME:-}" == "pull_request" ]]; then
            [[ "$EVENT_PR_NUMBER" =~ ^[1-9][0-9]{0,8}$ ]]
          fi

          # Keep both provenance fetches explicit and namespaced.  PR heads
          # are fetched from the base repository's canonical hidden ref; a
          # manual run fetches the explicitly supplied source repository/SHA.
          # Credentials are supplied only to this process; checkout
          # credentials remain non-persistent and are not available to later
          # source-test steps.
          base_remote_url="${GITHUB_SERVER_URL:-https://github.com}/${GITHUB_REPOSITORY}.git"
          if [[ "${GITHUB_EVENT_NAME:-}" == "pull_request" ]]; then
            head_remote_url="$base_remote_url"
            head_refspec="+refs/pull/$EVENT_PR_NUMBER/head:refs/g1/head"
          else
            head_remote_url="${GITHUB_SERVER_URL:-https://github.com}/${EVENT_HEAD_REPOSITORY}.git"
            head_refspec="+$EVENT_HEAD_SHA:refs/g1/head"
          fi
          git remote add g1-base "$base_remote_url"
          git remote add g1-head "$head_remote_url"
          git_fetch() {
            local remote="$1"
            shift
            if [[ -n "${G1_GIT_TOKEN:-}" ]]; then
              local auth_header
              auth_header="$(printf 'x-access-token:%s' "$G1_GIT_TOKEN" | base64 -w0)"
              git -c "http.extraheader=AUTHORIZATION: basic ${auth_header}" \
                fetch --no-tags "$remote" "$@"
            else
              git fetch --no-tags "$remote" "$@"
            fi
          }
          git_fetch g1-base "+$EVENT_BASE_SHA:refs/g1/base"
          git_fetch g1-head "$head_refspec"
          # The token is needed only for immutable provenance fetches.  Do not
          # carry it into Git checkout/merge operations or any later command
          # that may process files supplied by an untrusted source head.
          unset G1_GIT_TOKEN
          test "$(git --no-replace-objects rev-parse refs/g1/base^{commit})" = "$EVENT_BASE_SHA"
          test "$(git --no-replace-objects rev-parse refs/g1/head^{commit})" = "$EVENT_HEAD_SHA"
          base_tree="$(git --no-replace-objects rev-parse refs/g1/base^{tree})"
          head_tree="$(git --no-replace-objects rev-parse refs/g1/head^{tree})"
          test -n "$base_tree"
          test -n "$head_tree"

          # The runner temp directory should be fresh.  Refuse to reuse or
          # recursively delete an existing path: a stale worktree could point
          # outside the intended checkout and make provenance ambiguous.
          if [[ -e "$MERGE_DIR" || -L "$MERGE_DIR" ]]; then
            echo "merge worktree path already exists: $MERGE_DIR" >&2
            exit 1
          fi
          git worktree add --detach "$MERGE_DIR" refs/g1/base
          git -C "$MERGE_DIR" config user.name g1-synthetic-merge
          git -C "$MERGE_DIR" config user.email g1-synthetic-merge@invalid
          if ! git -C "$MERGE_DIR" merge --no-commit --no-ff refs/g1/head; then
            git -C "$MERGE_DIR" merge --abort || true
            echo 'base/head synthetic merge has conflicts' >&2
            exit 1
          fi
          merge_tree="$(git -C "$MERGE_DIR" --no-replace-objects write-tree)"
          merge_commit="$(printf 'G1 synthetic merge %s + %s\n' "$EVENT_BASE_SHA" "$EVENT_HEAD_SHA" | git -C "$MERGE_DIR" --no-replace-objects commit-tree "$merge_tree" -p "$EVENT_BASE_SHA" -p "$EVENT_HEAD_SHA")"
          git -C "$MERGE_DIR" --no-replace-objects reset --hard "$merge_commit"
          test "$(git -C "$MERGE_DIR" --no-replace-objects rev-parse HEAD)" = "$merge_commit"
          test "$(git -C "$MERGE_DIR" --no-replace-objects rev-parse HEAD^1)" = "$EVENT_BASE_SHA"
          test "$(git -C "$MERGE_DIR" --no-replace-objects rev-parse HEAD^2)" = "$EVENT_HEAD_SHA"
          test "$(git -C "$MERGE_DIR" --no-replace-objects rev-parse HEAD^{tree})" = "$merge_tree"
          test "$(git -C "$MERGE_DIR" --no-replace-objects rev-parse "$EVENT_BASE_SHA^{tree}")" = "$base_tree"
          test "$(git -C "$MERGE_DIR" --no-replace-objects rev-parse "$EVENT_HEAD_SHA^{tree}")" = "$head_tree"
          if ! worktree_status="$(git --no-replace-objects -C "${MERGE_DIR:?}" status --porcelain=v1 --untracked-files=all --ignore-submodules=none)"; then
            printf '%s\n' 'Cannot verify repository worktree state' >&2
            exit 1
          fi
          test -z "$worktree_status"
          {
            echo "merge_commit=$merge_commit"
            echo "merge_tree=$merge_tree"
            echo "base_tree=$base_tree"
            echo "head_tree=$head_tree"
          } >> "$GITHUB_OUTPUT"

      - name: Reject moving pull-request parents
        if: ${{ github.event_name == 'pull_request' }}
        env:
          G1_GIT_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          sha_re='^[0-9a-f]{40}$'
          test -n "$EVENT_BASE_REF"
          test -n "$EVENT_HEAD_REF"
          test -n "$EVENT_PR_NUMBER"
          base_remote_url="${GITHUB_SERVER_URL:-https://github.com}/${GITHUB_REPOSITORY}.git"
          git_ls_remote() {
            if [[ -n "${G1_GIT_TOKEN:-}" ]]; then
              local auth_header
              auth_header="$(printf 'x-access-token:%s' "$G1_GIT_TOKEN" | base64 -w0)"
              git -c "http.extraheader=AUTHORIZATION: basic ${auth_header}" \
                ls-remote "$@"
            else
              git ls-remote "$@"
            fi
          }
          base_tip="$(git_ls_remote "$base_remote_url" "refs/heads/$EVENT_BASE_REF" | awk 'NR==1 {print $1}')"
          # GitHub's canonical PR ref is served by the base repository even
          # when the head lives in a fork (including a private fork).  It is
          # the only parent check that does not depend on anonymous access to
          # the fork URL or on a mutable fork branch name.
          head_tip="$(git_ls_remote "$base_remote_url" "refs/pull/$EVENT_PR_NUMBER/head" | awk 'NR==1 {print $1}')"
          [[ "$base_tip" =~ $sha_re ]]
          [[ "$head_tip" =~ $sha_re ]]
          test "$base_tip" = "$EVENT_BASE_SHA"
          test "$head_tip" = "$EVENT_HEAD_SHA"

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"

      - name: Set up Rust 1.93
        uses: dtolnay/rust-toolchain@d8dfd7155fea72af4ad34a8fe97364d210e2d020
        with:
          toolchain: "1.93.0"
          components: rustfmt,clippy

      - name: Run the complete source and planned matrix on the merge object
        working-directory: ${{ runner.temp }}/g1-synthetic-merge
        shell: bash
        run: |
          set -euo pipefail
          test "$(git --no-replace-objects rev-parse HEAD)" = "${{ steps.merge.outputs.merge_commit }}"
          test "$(git --no-replace-objects rev-parse HEAD^1)" = "$EVENT_BASE_SHA"
          test "$(git --no-replace-objects rev-parse HEAD^2)" = "$EVENT_HEAD_SHA"

          python3 -m py_compile tools/docs/generate_global_docs.py tools/docs/verify_global_docs.py
          python3 tools/docs/generate_global_docs.py --check
          python3 tools/docs/verify_global_docs.py
          # Run every repository-contained Python contract on the exact
          # synthetic merge object.  The focused invocations below retain
          # readable logs for the highest-risk broker/document boundaries.
          python3 -m unittest discover -s tools/tests -p 'test*.py' -q
          python3 -m unittest discover -s tools/tests -p 'test_verify_global_docs_contracts.py' -v
          python3 -m unittest discover -s tools/tests -p 'test_owner_open_broker*.py' -v
          python3 -m unittest discover -s tools/tests -p 'test_owner_open_connection_broker.py' -v
          python3 -m unittest discover -s tools/tests -p 'test_owner_open_ingress_contract.py' -v
          python3 -m unittest tools.tests.test_run_global_baseline -v
          # Real local process groups; not installed-target qualification.
          python3 -m unittest tools.tests.test_owner_open_rootlinux_supervisor -v

          cargo fmt --all -- --check
          cargo test --locked --all-targets
          cargo clippy --locked --all-targets -- -D warnings
          test -s Cargo.lock
          cargo fmt --manifest-path planned/Cargo.toml --all -- --check
          cargo test --locked --manifest-path planned/Cargo.toml --workspace --all-targets
          cargo clippy --locked --manifest-path planned/Cargo.toml --workspace --all-targets -- -D warnings
          python3 tools/perf/run_global_baseline.py --output "${RUNNER_TEMP}/g1-merge-baseline.json" --repetitions 1
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          path = Path(__import__('os').environ['RUNNER_TEMP']) / 'g1-merge-baseline.json'
          artifact = json.loads(path.read_text(encoding='utf-8'))
          clone = dict(artifact)
          clone['artifact_digest'] = ''
          encoded = json.dumps(clone, sort_keys=True, separators=(',', ':'), ensure_ascii=True).encode()
          assert artifact['artifact_digest'] == hashlib.sha256(encoded).hexdigest()
          assert artifact['qualification'] == 'SOURCE_EVIDENCE_ONLY'
          assert artifact['gate']['passed'] is False
          PY
          if ! worktree_status="$(git --no-replace-objects -C "${RUNNER_TEMP:?}/g1-synthetic-merge" status --porcelain=v1 --untracked-files=all --ignore-submodules=none)"; then
            printf '%s\n' 'Cannot verify repository worktree state' >&2
            exit 1
          fi
          test -z "$worktree_status"

      - name: Emit merge-bound evidence manifest
        shell: bash
        run: |
          set -euo pipefail
          MERGE_DIR="${RUNNER_TEMP}/g1-synthetic-merge"
          receipt="${RUNNER_TEMP}/g1-synthetic-merge-evidence.json"
          lock_sha="$(sha256sum "$MERGE_DIR/Cargo.lock" | awk '{print $1}')"
          export RECEIPT_PATH="$receipt" LOCK_SHA="$lock_sha"
          export MERGE_BASE_TREE="${{ steps.merge.outputs.base_tree }}"
          export MERGE_HEAD_TREE="${{ steps.merge.outputs.head_tree }}"
          export MERGE_COMMIT="${{ steps.merge.outputs.merge_commit }}"
          export MERGE_TREE="${{ steps.merge.outputs.merge_tree }}"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          def optional(name):
              value = os.environ.get(name, "")
              return value or None

          receipt = {
              "schema": "org.trillionnium.g1-synthetic-merge-evidence.v1",
              "program_revision": "2026-08-31-g1",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "head_repository": os.environ["EVENT_HEAD_REPOSITORY"],
              "event_name": os.environ["GITHUB_EVENT_NAME"],
              "pull_request_number": optional("EVENT_PR_NUMBER"),
              "base_ref": optional("EVENT_BASE_REF"),
              "head_ref": optional("EVENT_HEAD_REF"),
              "base_commit": os.environ["EVENT_BASE_SHA"],
              "base_tree": os.environ["MERGE_BASE_TREE"],
              "head_commit": os.environ["EVENT_HEAD_SHA"],
              "head_tree": os.environ["MERGE_HEAD_TREE"],
              "parent_commits": [
                  os.environ["EVENT_BASE_SHA"],
                  os.environ["EVENT_HEAD_SHA"],
              ],
              "merge_commit": os.environ["MERGE_COMMIT"],
              "merge_tree": os.environ["MERGE_TREE"],
              "cargo_lock_sha256": os.environ["LOCK_SHA"],
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "workflow_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "result": "L1_SYNTHETIC_MERGE_SOURCE_CLOSURE_PASSED",
              "claim_ceiling": "EXACT_TWO_PARENT_SOURCE_MERGE_GATES_PASSED_NOT_INSTALLED_TARGET",
              "automatic_redispatch": False,
              "public_release": False,
          }
          Path(os.environ["RECEIPT_PATH"]).write_text(
              json.dumps(receipt, indent=2, sort_keys=True, allow_nan=False) + "\n",
              encoding="utf-8",
          )
          PY
          python3 -m json.tool "$receipt" >/dev/null
          if ! worktree_status="$(git --no-replace-objects -C "${MERGE_DIR:?}" status --porcelain=v1 --untracked-files=all --ignore-submodules=none)"; then
            printf '%s\n' 'Cannot verify repository worktree state' >&2
            exit 1
          fi
          test -z "$worktree_status"

      - name: Upload merge-bound evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: g1-synthetic-merge-${{ steps.merge.outputs.merge_commit }}
          if-no-files-found: error
          retention-days: 30
          path: |
            ${{ runner.temp }}/g1-synthetic-merge-evidence.json
            ${{ runner.temp }}/g1-merge-baseline.json
