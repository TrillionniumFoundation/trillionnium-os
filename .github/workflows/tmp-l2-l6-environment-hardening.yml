name: Temporary L2-L6 protected-environment hardening

on:
  push:
    branches:
      - ops/l2-l6-environment-hardening-20260911

permissions:
  contents: read
  issues: write

concurrency:
  group: temporary-l2-l6-environment-hardening
  cancel-in-progress: true

jobs:
  configure-and-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ADMIN_TOKEN: ${{ secrets.OWNER_OPEN_R5_ADMIN_TOKEN }}
      COMMENT_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      API: ${{ github.api_url }}
    steps:
      - name: Configure protected environments only with dedicated administration authority
        shell: bash
        env:
          REPORT: ${{ runner.temp }}/l2-l6-environment-hardening.json
        run: |
          set -euo pipefail
          /usr/bin/python3 -I - <<'PY'
          from datetime import datetime, timezone
          import json
          import os
          from pathlib import Path
          import urllib.error
          import urllib.parse
          import urllib.request

          api = os.environ["API"].rstrip("/")
          repository = os.environ["REPOSITORY"]
          token = os.environ.get("ADMIN_TOKEN", "")
          output = Path(os.environ["REPORT"])
          reviewer_ids = [273670192, 273673612]
          names = [f"owner-open-r5-l{level}" for level in range(2, 7)]
          report = {
              "schema": "org.trillionnium.l2-l6-environment-hardening.v1",
              "repository": repository,
              "observed_at": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
              "status": "BLOCKED_ADMIN_TOKEN_MISSING",
              "configuration_applied": False,
              "secret_value_disclosed": False,
              "target_contact_performed": False,
              "evidence_promoted": False,
              "automatic_redispatch": False,
              "public_release": False,
              "environments": [],
          }

          def save():
              output.write_text(json.dumps(report, sort_keys=True, indent=2) + "\n", encoding="utf-8")

          if not token:
              save()
              raise SystemExit(0)

          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "Content-Type": "application/json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "trillionnium-l2-l6-environment-hardener-v2",
          }

          def call(method, path, payload=None):
              request = urllib.request.Request(
                  f"{api}/repos/{repository}{path}",
                  method=method,
                  headers=headers,
                  data=None if payload is None else json.dumps(payload).encode("utf-8"),
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      raw = response.read()
                      return response.status, json.loads(raw) if raw else None
              except urllib.error.HTTPError as error:
                  raw = error.read()
                  try:
                      value = json.loads(raw) if raw else None
                  except json.JSONDecodeError:
                      value = {"message": "non-json GitHub error"}
                  return error.code, value

          all_applied = True
          report["status"] = "BLOCKED_ADMIN_PERMISSION_OR_POLICY"
          payload = {
              "wait_timer": 0,
              "prevent_self_review": True,
              "reviewers": [{"type": "User", "id": value} for value in reviewer_ids],
              "deployment_branch_policy": {
                  "protected_branches": True,
                  "custom_branch_policies": False,
              },
          }
          for name in names:
              encoded = urllib.parse.quote(name, safe="")
              put_status, _ = call("PUT", f"/environments/{encoded}", payload)
              get_status, value = call("GET", f"/environments/{encoded}")
              observed_ids = set()
              prevent_self_review = None
              if get_status == 200 and isinstance(value, dict):
                  prevent_self_review = value.get("prevent_self_review")
                  for rule in value.get("protection_rules") or []:
                      if not isinstance(rule, dict) or rule.get("type") != "required_reviewers":
                          continue
                      if isinstance(rule.get("prevent_self_review"), bool):
                          prevent_self_review = rule["prevent_self_review"]
                      for row in rule.get("reviewers") or []:
                          reviewer = row.get("reviewer") if isinstance(row, dict) else None
                          if isinstance(reviewer, dict) and isinstance(reviewer.get("id"), int):
                              observed_ids.add(reviewer["id"])
              applied = (
                  put_status in {200, 201}
                  and get_status == 200
                  and set(reviewer_ids).issubset(observed_ids)
                  and prevent_self_review is True
              )
              all_applied = all_applied and applied
              report["environments"].append({
                  "name": name,
                  "status": "APPLIED" if applied else "BLOCKED",
                  "put_http_status": put_status,
                  "verify_http_status": get_status,
                  "required_reviewer_ids": reviewer_ids,
                  "observed_reviewer_ids": sorted(observed_ids),
                  "prevent_self_review": prevent_self_review,
              })

          if all_applied:
              report["status"] = "APPLIED_PROTECTED_ENVIRONMENTS"
              report["configuration_applied"] = True
          save()
          PY

      - name: Publish exact non-secret result to authorization ledger
        if: ${{ always() }}
        shell: bash
        env:
          REPORT: ${{ runner.temp }}/l2-l6-environment-hardening.json
        run: |
          set -euo pipefail
          /usr/bin/python3 -I - <<'PY'
          import json
          import os
          from pathlib import Path
          import urllib.request

          report = json.loads(Path(os.environ["REPORT"]).read_text(encoding="utf-8"))
          rows = [
              f"| `{item['name']}` | `{item['status']}` | {item.get('put_http_status', 'n/a')} | {item.get('verify_http_status', 'n/a')} |"
              for item in report.get("environments", [])
          ]
          table = "\n".join(rows) or "| none | not attempted | n/a | n/a |"
          body = f"""## L2-L6 protected-environment hardening result

```text
run: {os.environ['GITHUB_RUN_ID']}
status: {report['status']}
configuration_applied: {str(report['configuration_applied']).lower()}
secret_value_disclosed: false
target_contact_performed: false
evidence_promoted: false
automatic_redispatch: false
public_release: false
```

| Environment | Result | PUT | Verify GET |
|---|---|---:|---:|
{table}

Only environment protection metadata was eligible for mutation. No adapter identity, target identity, authorization ticket, nonce, target execution, evidence package, gap transition, signing operation or release state was fabricated. A missing administration secret or rejected administration request remains a hard blocker.
"""
          request = urllib.request.Request(
              f"{os.environ['API'].rstrip('/')}/repos/{os.environ['REPOSITORY']}/issues/68/comments",
              method="POST",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['COMMENT_TOKEN']}",
                  "Content-Type": "application/json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "trillionnium-l2-l6-environment-hardener-v2",
              },
              data=json.dumps({"body": body}).encode("utf-8"),
          )
          with urllib.request.urlopen(request, timeout=30):
              pass
          PY

      - name: Fail closed unless every environment is protected
        shell: bash
        env:
          REPORT: ${{ runner.temp }}/l2-l6-environment-hardening.json
        run: |
          set -euo pipefail
          /usr/bin/python3 -I - <<'PY'
          import json
          import os
          from pathlib import Path
          report = json.loads(Path(os.environ["REPORT"]).read_text(encoding="utf-8"))
          if report["status"] != "APPLIED_PROTECTED_ENVIRONMENTS":
              raise SystemExit(f"environment hardening blocked: {report['status']}")
          PY
