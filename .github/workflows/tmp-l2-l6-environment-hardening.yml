name: Temporary L2-L6 protected-environment hardening

on:
  push:
    branches:
      - ops/l2-l6-environment-hardening-20260911

permissions:
  contents: read
  issues: write

concurrency:
  group: temporary-l2-l6-environment-hardening
  cancel-in-progress: true

jobs:
  configure-and-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ADMIN_TOKEN: ${{ secrets.OWNER_OPEN_R5_ADMIN_TOKEN }}
      COMMENT_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      API: ${{ github.api_url }}
      REPORT: ${{ runner.temp }}/l2-l6-environment-hardening.json
    steps:
      - name: Configure protected environments only with dedicated administration authority
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -I - <<'PY'
          from __future__ import annotations

          from datetime import datetime, timezone
          import json
          import os
          from pathlib import Path
          import urllib.error
          import urllib.parse
          import urllib.request

          api = os.environ["API"].rstrip("/")
          repository = os.environ["REPOSITORY"]
          token = os.environ.get("ADMIN_TOKEN", "")
          report_path = Path(os.environ["REPORT"])
          environments = [f"owner-open-r5-l{level}" for level in range(2, 7)]
          required_reviewers = {
              273670192: "Franksudoman",
              273673612: "Tomasrgbsf",
          }
          report = {
              "schema": "org.trillionnium.l2-l6-environment-hardening.v1",
              "repository": repository,
              "observed_at": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
              "status": "BLOCKED_ADMIN_TOKEN_MISSING",
              "configuration_applied": False,
              "secret_value_disclosed": False,
              "target_contact_performed": False,
              "evidence_promoted": False,
              "automatic_redispatch": False,
              "public_release": False,
              "environments": [],
          }

          def write_report() -> None:
              report_path.write_text(
                  json.dumps(report, sort_keys=True, indent=2) + "\n",
                  encoding="utf-8",
              )

          if not token:
              write_report()
              raise SystemExit(0)

          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "trillionnium-l2-l6-environment-hardener-v1",
          }

          def request(method: str, path: str, payload: dict | None = None) -> tuple[int, object | None]:
              body = None if payload is None else json.dumps(payload).encode("utf-8")
              req = urllib.request.Request(
                  f"{api}/repos/{repository}{path}",
                  method=method,
                  headers=headers,
                  data=body,
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      raw = response.read()
                      return response.status, json.loads(raw) if raw else None
              except urllib.error.HTTPError as error:
                  raw = error.read()
                  try:
                      value = json.loads(raw) if raw else None
                  except json.JSONDecodeError:
                      value = {"message": "non-json GitHub error"}
                  return error.code, value

          report["status"] = "BLOCKED_ADMIN_PERMISSION_OR_POLICY"
          all_applied = True
          for name in environments:
              encoded = urllib.parse.quote(name, safe="")
              get_status, current = request("GET", f"/environments/{encoded}")
              existing_reviewer_ids: set[int] = set()
              wait_timer = 0
              branch_policy: dict[str, bool] | None = {
                  "protected_branches": True,
                  "custom_branch_policies": False,
              }
              if get_status == 200 and isinstance(current, dict):
                  for rule in current.get("protection_rules") or []:
                      if not isinstance(rule, dict):
                          continue
                      if rule.get("type") == "wait_timer" and isinstance(rule.get("wait_timer"), int):
                          wait_timer = rule["wait_timer"]
                      if rule.get("type") == "required_reviewers":
                          for reviewer in rule.get("reviewers") or []:
                              value = reviewer.get("reviewer") if isinstance(reviewer, dict) else None
                              if isinstance(value, dict) and isinstance(value.get("id"), int):
                                  existing_reviewer_ids.add(value["id"])
                  policy = current.get("deployment_branch_policy")
                  if isinstance(policy, dict):
                      protected = policy.get("protected_branches")
                      custom = policy.get("custom_branch_policies")
                      if isinstance(protected, bool) and isinstance(custom, bool):
                          branch_policy = {
                              "protected_branches": protected,
                              "custom_branch_policies": custom,
                          }
              elif get_status != 404:
                  all_applied = False
                  report["environments"].append({
                      "name": name,
                      "status": "GET_FAILED",
                      "http_status": get_status,
                  })
                  continue

              reviewer_ids = sorted(existing_reviewer_ids | set(required_reviewers))
              payload = {
                  "wait_timer": wait_timer,
                  "prevent_self_review": True,
                  "reviewers": [
                      {"type": "User", "id": reviewer_id}
                      for reviewer_id in reviewer_ids
                  ],
                  "deployment_branch_policy": branch_policy,
              }
              put_status, _ = request("PUT", f"/environments/{encoded}", payload)
              verify_status, verified = request("GET", f"/environments/{encoded}")
              observed_ids: set[int] = set()
              prevent_self_review = None
              if verify_status == 200 and isinstance(verified, dict):
                  prevent_self_review = verified.get("prevent_self_review")
                  for rule in verified.get("protection_rules") or []:
                      if isinstance(rule, dict) and rule.get("type") == "required_reviewers":
                          for reviewer in rule.get("reviewers") or []:
                              value = reviewer.get("reviewer") if isinstance(reviewer, dict) else None
                              if isinstance(value, dict) and isinstance(value.get("id"), int):
                                  observed_ids.add(value["id"])
              applied = (
                  put_status in {200, 201}
                  and verify_status == 200
                  and set(required_reviewers).issubset(observed_ids)
                  and prevent_self_review is True
              )
              all_applied = all_applied and applied
              report["environments"].append({
                  "name": name,
                  "status": "APPLIED" if applied else "BLOCKED",
                  "get_http_status": get_status,
                  "put_http_status": put_status,
                  "verify_http_status": verify_status,
                  "required_reviewer_ids": sorted(required_reviewers),
                  "observed_reviewer_ids": sorted(observed_ids),
                  "prevent_self_review": prevent_self_review,
              })

          if all_applied:
              report["status"] = "APPLIED_PROTECTED_ENVIRONMENTS"
              report["configuration_applied"] = True
          write_report()
          PY

      - name: Publish exact non-secret result to the authorization ledger
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -I - <<'PY'
          import json
          import os
          from pathlib import Path
          import urllib.request

          report = json.loads(Path(os.environ["REPORT"]).read_text(encoding="utf-8"))
          rows = []
          for item in report.get("environments", []):
              rows.append(
                  f"| `{item['name']}` | `{item['status']}` | "
                  f"{item.get('put_http_status', 'n/a')} | "
                  f"{item.get('verify_http_status', 'n/a')} |"
              )
          table = "\n".join(rows) if rows else "| none | not attempted | n/a | n/a |"
          body = f"""## L2-L6 protected-environment hardening result

```text
run: {os.environ['GITHUB_RUN_ID']}
status: {report['status']}
configuration_applied: {str(report['configuration_applied']).lower()}
secret_value_disclosed: false
target_contact_performed: false
evidence_promoted: false
automatic_redispatch: false
public_release: false
```

| Environment | Result | PUT | Verify GET |
|---|---|---:|---:|
{table}

Only environment protection metadata was eligible for mutation. No adapter identity, target identity, authorization ticket, nonce, target execution, evidence package, gap transition, signing operation or release state was fabricated. A missing administration secret or rejected administration request remains a hard blocker.
"""
          request = urllib.request.Request(
              f"{os.environ['API'].rstrip('/')}/repos/{os.environ['REPOSITORY']}/issues/68/comments",
              method="POST",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['COMMENT_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "trillionnium-l2-l6-environment-hardener-v1",
                  "Content-Type": "application/json",
              },
              data=json.dumps({"body": body}).encode("utf-8"),
          )
          with urllib.request.urlopen(request, timeout=30):
              pass
          PY

      - name: Fail closed unless every environment is protected
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -I - <<'PY'
          import json
          import os
          from pathlib import Path
          report = json.loads(Path(os.environ["REPORT"]).read_text(encoding="utf-8"))
          if report["status"] != "APPLIED_PROTECTED_ENVIRONMENTS":
              raise SystemExit(f"environment hardening blocked: {report['status']}")
          PY
