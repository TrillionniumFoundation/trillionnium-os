name: Ops telemetry durability binding repair

on:
  push:
    branches:
      - "ops/telemetry-durability-binding-20260912"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Rust 1.93
        uses: dtolnay/rust-toolchain@d8dfd7155fea72af4ad34a8fe97364d210e2d020
        with:
          toolchain: 1.93.0
          components: rustfmt,clippy
      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Bind durability receipt to exact projection
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*'
          git show HEAD:ops/telemetry_durability_patch.py > "${RUNNER_TEMP}/telemetry_durability_patch.py"
          TARGET=codex/observe-shadow-telemetry-v3-20260912
          git checkout -B work "origin/${TARGET}"
          python3 "${RUNNER_TEMP}/telemetry_durability_patch.py"
          cargo fmt --manifest-path planned/Cargo.toml --all
          cargo test --locked --manifest-path planned/Cargo.toml -p trillionnium-telemetry --all-targets
          cargo clippy --locked --manifest-path planned/Cargo.toml -p trillionnium-telemetry --all-targets -- -D warnings
          python3 tools/contracts/generate_module_contracts.py --write
          python3 tools/contracts/generate_module_contracts.py --check
          python3 tools/docs/verify_global_docs.py
          git add -A
          test -z "$(git diff --cached --name-only | grep '^.github/workflows/' || true)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(telemetry): bind durability receipts to exact projections'
          git push origin HEAD:"refs/heads/${TARGET}"
