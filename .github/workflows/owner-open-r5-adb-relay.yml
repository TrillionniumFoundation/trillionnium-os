name: owner-open R5 ADB relay

on:
  pull_request:
    paths:
      - "tools/owner-open/owner_open_adb_relay.py"
      - "tools/tests/test_owner_open_adb_relay.py"
      - "docs/protocols/owner-open-adb-smart-socket-relay-v1.md"
      - "docs/status/owner-open-r5-*"
      - ".github/workflows/owner-open-r5-adb-relay.yml"
  push:
    branches:
      - main
      - "codex/**"
    paths:
      - "tools/owner-open/owner_open_adb_relay.py"
      - "tools/tests/test_owner_open_adb_relay.py"
      - "docs/protocols/owner-open-adb-smart-socket-relay-v1.md"
      - "docs/status/owner-open-r5-*"
      - ".github/workflows/owner-open-r5-adb-relay.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: owner-open-r5-adb-relay-${{ github.ref }}
  cancel-in-progress: true

jobs:
  byte-transparent-relay:
    name: Byte-transparent ADB smart-socket relay
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact source-head checkout
        env:
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git --no-replace-objects rev-parse HEAD)" = "$SOURCE_HEAD_SHA"
          test -n "$(git --no-replace-objects rev-parse HEAD^{tree})"
          test -z "$(git --no-replace-objects status --porcelain=v1 --untracked-files=all)"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Compile relay source and tests
        run: |
          python3 -m py_compile \
            tools/owner-open/owner_open_adb_relay.py \
            tools/tests/test_owner_open_adb_relay.py
      - name: Run relay process fixtures
        env:
          PYTHONWARNINGS: error::ResourceWarning
        run: |
          python3 -m unittest tools.tests.test_owner_open_adb_relay -v \
            2>&1 | tee owner-open-r5-adb-relay-tests.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: owner-open-r5-adb-relay-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: owner-open-r5-adb-relay-tests.txt
