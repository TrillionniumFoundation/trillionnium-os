name: Isolated telemetry review repair validation
on:
  push:
    branches: [workbench/telemetry-review-repair-20260912]
permissions:
  contents: read
concurrency:
  group: telemetry-review-repair-${{ github.ref }}
  cancel-in-progress: false
env:
  SOURCE_HEAD: 4ed6a8fc03ce23dede3c71cf113e804e1a4e2cb2
  MAIN_HEAD: b6cb785d4fde6427a1ae99ffc12f0679353aaaff
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: control
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.SOURCE_HEAD }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@d8dfd7155fea72af4ad34a8fe97364d210e2d020
        with:
          toolchain: '1.93.0'
          components: rustfmt,clippy
      - name: Verify and apply exact review-repair input
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/repair-results"
          python3 - <<'PY'
          import base64, hashlib, pathlib, subprocess, zlib
          root = pathlib.Path.cwd()
          names = [f'telemetry-{i:02}.b64' for i in range(7)]
          parts = root/'control/.dev-patches'
          assert sorted(p.name for p in parts.iterdir()) == names
          encoded = ''.join((parts/name).read_text() for name in names)
          assert len(encoded) == 12872
          decoder = zlib.decompressobj()
          patch = decoder.decompress(base64.b64decode(encoded, validate=True), 1048576)
          assert decoder.eof and not decoder.unused_data and not decoder.unconsumed_tail
          assert len(patch) == 38866
          assert hashlib.sha256(patch).hexdigest() == '1e8207d5d06f733bf910fd097c94b0010226e40a98cfc4eb923cc276a1a2a9a1'
          subprocess.run(['git','apply','--index','--whitespace=error','-'], input=patch, cwd=root/'source', check=True)
          PY
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_HEAD"
          test "$(id -u)" != 0
          rustc --version | tee "$RUNNER_TEMP/repair-results/toolchain.txt"
          cargo --version | tee -a "$RUNNER_TEMP/repair-results/toolchain.txt"
          python3 --version | tee -a "$RUNNER_TEMP/repair-results/toolchain.txt"
      - name: Format only the four declared source paths
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path planned/Cargo.toml --all
          git add docs/modules/MOD-TELEMETRY.md planned/crates/trillionnium-telemetry/src/catalog.rs planned/crates/trillionnium-telemetry/src/catalog/admission.rs planned/crates/trillionnium-telemetry/src/catalog/tests/hostile.rs
          python3 - <<'PY'
          import subprocess
          expected = {'docs/modules/MOD-TELEMETRY.md','planned/crates/trillionnium-telemetry/src/catalog.rs','planned/crates/trillionnium-telemetry/src/catalog/admission.rs','planned/crates/trillionnium-telemetry/src/catalog/tests/hostile.rs'}
          actual = set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          assert actual == expected, (actual,expected)
          assert not subprocess.check_output(['git','diff','--name-only'])
          assert not subprocess.check_output(['git','ls-files','--others','--exclude-standard'])
          PY
          git diff --cached --check
          git diff --cached --binary --full-index > "$RUNNER_TEMP/repair-results/formatted.patch"
          sha256sum "$RUNNER_TEMP/repair-results/formatted.patch" > "$RUNNER_TEMP/repair-results/formatted.patch.sha256"
      - name: Planned Rust tests including hostile regressions
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path planned/Cargo.toml --workspace --all-targets 2>&1 | tee "$RUNNER_TEMP/repair-results/planned-tests.log"
          cargo clippy --locked --manifest-path planned/Cargo.toml --workspace --all-targets -- -D warnings 2>&1 | tee "$RUNNER_TEMP/repair-results/planned-clippy.log"
          cargo fmt --manifest-path planned/Cargo.toml --all -- --check
      - name: Source documentation and catalog regression checks
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          {
            python3 tools/docs/generate_global_docs.py --check
            python3 tools/docs/verify_global_docs.py
            python3 tools/docs/verify_module_documentation.py
            python3 tools/docs/verify_component_documentation.py
            python3 -m unittest tools.tests.test_metric_catalog -v
          } 2>&1 | tee "$RUNNER_TEMP/repair-results/documentation.log"
          git diff --exit-code
          git diff --cached --check
      - name: Retain bounded source diagnostics, never target evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: telemetry-repair-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/repair-results/
          if-no-files-found: error
          retention-days: 7
  export:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.SOURCE_HEAD }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: telemetry-repair-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: result
      - name: Construct source-only commit without executing candidate code
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, pathlib, subprocess
          p = pathlib.Path('result/formatted.patch')
          raw = p.read_bytes()
          assert 0 < len(raw) < 1048576
          expected = pathlib.Path('result/formatted.patch.sha256').read_text().split()[0]
          assert hashlib.sha256(raw).hexdigest() == expected
          subprocess.run(['git','-C','source','apply','--index','--whitespace=error','-'],input=raw,check=True)
          expected_paths = {'docs/modules/MOD-TELEMETRY.md','planned/crates/trillionnium-telemetry/src/catalog.rs','planned/crates/trillionnium-telemetry/src/catalog/admission.rs','planned/crates/trillionnium-telemetry/src/catalog/tests/hostile.rs'}
          actual = set(subprocess.check_output(['git','-C','source','diff','--cached','--name-only'],text=True).splitlines())
          assert actual == expected_paths
          PY
          git -C source config user.name 'github-actions[bot]'
          git -C source config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C source -c core.hooksPath=/dev/null commit -m 'fix(telemetry): enforce catalog admission and transactional retention' -m 'Repairs the four exact-head PR #77 review findings. Source-only candidate; no independent approval, target qualification, active control or release authority.'
          test "$(git -C source rev-parse HEAD^)" = "$SOURCE_HEAD"
          test -z "$(git -C source status --porcelain=v1 --untracked-files=all)"
      - name: Publish unique development branch only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          ASKPASS="$RUNNER_TEMP/repair-askpass"
          printf '%s\n' '#!/bin/sh' 'case "$1" in *Username*) printf "%s\n" x-access-token;; *) printf "%s\n" "$GH_TOKEN";; esac' > "$ASKPASS"
          chmod 700 "$ASKPASS"
          trap 'rm -f "$ASKPASS"' EXIT
          export GIT_ASKPASS="$ASKPASS" GIT_TERMINAL_PROMPT=0
          URL="https://github.com/${GITHUB_REPOSITORY}.git"
          test "$(git ls-remote "$URL" refs/heads/main | cut -f1)" = "$MAIN_HEAD"
          test "$(git ls-remote "$URL" refs/heads/codex/observe-shadow-telemetry-v2-20260911 | cut -f1)" = "$SOURCE_HEAD"
          BRANCH="codex/export-telemetry-repair-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test -z "$(git ls-remote "$URL" "refs/heads/$BRANCH")"
          git -C source -c core.hooksPath=/dev/null push "$URL" "HEAD:refs/heads/$BRANCH"
          {
            echo "branch=$BRANCH"
            echo "commit=$(git -C source rev-parse HEAD)"
            echo "tree=$(git -C source rev-parse HEAD^{tree})"
            echo "parent=$SOURCE_HEAD"
            echo 'source_validation_only=true'
            echo 'independent_approval=false'
            echo 'automatic_redispatch=false'
            echo 'active_control=false'
            echo 'zero_gap=false'
            echo 'public_release=false'
          } | tee "$RUNNER_TEMP/export.txt" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: telemetry-repair-export-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/export.txt
          if-no-files-found: error
          retention-days: 7
