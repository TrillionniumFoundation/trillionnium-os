name: ChatGPT protected external qualification protocol integrator

on:
  push:
    branches:
      - ops/chatgpt-source-export-20260908
    paths:
      - .github/workflows/chatgpt-external-protocol-protected-integrator.yml

permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: read
  actions: read

concurrency:
  group: chatgpt-external-protocol-protected-integrator
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      SOURCE_BRANCH: external/qualification-protocol-v5-20260909
      TARGET_BRANCH: external/qualification-protocol-v6-20260909
      DEPENDENCY_ISSUE: '57'
    steps:
      - name: Wait for all L1 source predecessors
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS+4800))
          while ((SECONDS<deadline)); do
            if test "$(gh api "repos/${GITHUB_REPOSITORY}/issues/${DEPENDENCY_ISSUE}" --jq '.state')" = closed; then
              main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq '.commit.sha')"
              printf '%s\n' "$main_sha" > "${RUNNER_TEMP}/base"
              exit 0
            fi
            sleep 15
          done
          exit 1

      - name: Check out exact current main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: main
          persist-credentials: true

      - name: Extract only qualification protocol source
        shell: bash
        run: |
          set -euo pipefail
          base="$(cat "${RUNNER_TEMP}/base")"; test "$(git rev-parse HEAD)" = "$base"
          git ls-remote --exit-code --heads origin "$SOURCE_BRANCH" >/dev/null
          git fetch --no-tags origin "$SOURCE_BRANCH"
          source_head="$(git rev-parse "origin/${SOURCE_BRANCH}^{commit}")"; source_tree="$(git rev-parse "${source_head}^{tree}")"; source_base="$(git merge-base "$base" "$source_head")"
          git diff --name-only "$source_base..$source_head" > "${RUNNER_TEMP}/source-paths"
          test -s "${RUNNER_TEMP}/source-paths"
          if grep -E '^(ops/|\.github/workflows/chatgpt-|governance/pr41-review-index)' "${RUNNER_TEMP}/source-paths"; then exit 1; fi
          if grep -Ev '^(\.github/workflows/owner-open-external-|tools/qualification/|tools/tests/|docs/|schemas/|governance/|evidence/)' "${RUNNER_TEMP}/source-paths"; then exit 1; fi
          git diff --binary "$source_base..$source_head" > "${RUNNER_TEMP}/protocol.patch"
          printf '%s\n' "$source_head" > "${RUNNER_TEMP}/source-head"; printf '%s\n' "$source_tree" > "${RUNNER_TEMP}/source-tree"; printf '%s\n' "$source_base" > "${RUNNER_TEMP}/source-base"
          git switch -c "$TARGET_BRANCH"; git apply --3way --index "${RUNNER_TEMP}/protocol.patch"; git diff --cached --check
          git config user.name 'Qian QI'; git config user.email '102159240+ProfHepta@users.noreply.github.com'; git commit -m 'qualification: add fail-closed external evidence protocol'

      - name: Verify protocol, hostile bounds and non-promotion ceiling
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/workflows/owner-open-external-qualification-v4.yml
          test -f .github/workflows/owner-open-external-evidence-intake-v4.yml
          test -d tools/qualification
          grep -q 'workflow_dispatch' .github/workflows/owner-open-external-qualification-v4.yml
          grep -q 'automatic_redispatch' .github/workflows/owner-open-external-qualification-v4.yml
          grep -q 'VERIFIED_NOT_PROMOTED' .github/workflows/owner-open-external-evidence-intake-v4.yml
          grep -Rqs 'run_attempt' tools/qualification .github/workflows/owner-open-external-*
          grep -Rqs 'artifact.*sha256\|archive.*sha256' tools/qualification
          grep -Rqs 'symlink\|path traversal\|duplicate JSON\|duplicate.*member' tools/qualification tools/tests
          grep -Rqs 'TERM\|SIGTERM' tools/qualification
          grep -Rqs 'SIGKILL\|KILL' tools/qualification
          grep -Rqs 'public_release.*false\|"public_release"[[:space:]]*:[[:space:]]*false' tools/qualification .github/workflows/owner-open-external-*
          mapfile -t py < <(find tools/qualification -type f -name '*.py' | sort); test "${#py[@]}" -gt 0; python3 -m py_compile "${py[@]}"
          mapfile -t tests < <(find tools/tests -maxdepth 1 -type f \( -iname '*qualification*.py' -o -iname '*external*evidence*.py' -o -iname '*intake*.py' \) -printf '%f\n' | sed 's/\.py$//' | sort -u); test "${#tests[@]}" -gt 0
          modules=(); for t in "${tests[@]}"; do modules+=("tools.tests.${t}"); done; python3 -m unittest "${modules[@]}" -v
          python3 tools/docs/generate_global_docs.py --check
          python3 tools/docs/verify_repository_authority.py
          python3 tools/docs/verify_global_docs.py
          if test -f host-binary/.github/scripts/validate_action_pins.py; then python3 host-binary/.github/scripts/validate_action_pins.py; fi
          if ! status="$(git status --porcelain=v1 --untracked-files=all --ignore-submodules=none)"; then exit 1; fi; test -z "$status"

      - name: Publish exact draft protocol PR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base="$(cat "${RUNNER_TEMP}/base")"; source_head="$(cat "${RUNNER_TEMP}/source-head")"; source_tree="$(cat "${RUNNER_TEMP}/source-tree")"; source_base="$(cat "${RUNNER_TEMP}/source-base")"; head="$(git rev-parse HEAD)"; tree="$(git rev-parse HEAD^{tree})"
          git push origin "HEAD:$TARGET_BRANCH"
          pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls?state=all&head=${GITHUB_REPOSITORY_OWNER}%3A${TARGET_BRANCH}" --jq '.[0].number // empty')"; if test -z "$pr"; then pr="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/pulls" -f title='qualification: add fail-closed external L2-L6 evidence protocol' -f head="$TARGET_BRANCH" -f base=main -F draft=true -f body='Exact external-qualification protocol candidate.' --jq '.number')"; fi
          printf '%s\n' "$pr" > "${RUNNER_TEMP}/pr"; printf '%s\n' "$head" > "${RUNNER_TEMP}/head"
          merge_sha=""; for _ in $(seq 1 30); do merge_sha="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr}" --jq '.merge_commit_sha // empty')"; test -n "$merge_sha" && break; sleep 1; done; test -n "$merge_sha"
          base_tree="$(git rev-parse "${base}^{tree}")"; count="$(git diff --name-only "$base...$head"|wc -l|tr -d ' ')"
          cat > "${RUNNER_TEMP}/body.md" <<EOF
          Parent program: #51
          External evidence umbrella: #22, #67, #68
          Depends on protected L1 source closure through #57

          ## Exact subject

          \`\`\`text
          base:                    main@${base}
          base tree:               ${base_tree}
          source candidate:        ${source_head}
          source candidate tree:   ${source_tree}
          source merge base:       ${source_base}
          head:                    ${head}
          head tree:               ${tree}
          GitHub prospective merge:${merge_sha}
          changed paths:           ${count}
          \`\`\`

          ## Delivered protocol

          Hosted admission validates protected-main ancestry, exact source/tree, merged promotion lineage, current independent reviews, required source checks, protected environment, one-use ticket/expiry/nonce and all prior intake identities before allocating an external runner. The adapter is absolute/canonical/regular/non-writable and exact-SHA-bound, receives no repository credential, executes without a shell under one deadline and performs whole-session TERM/KILL cleanup. Receipts bind run/attempt, runner, target, operator, adapter, authorization, prior receipts and every evidence byte. Strict JSON/ZIP/path/symlink/cardinality/digest rules fail closed.

          Intake independently revalidates the qualification run, exact attempt/jobs, admission/evidence artifacts and receipt bytes, then emits only \`VERIFIED_NOT_PROMOTED\`. It never edits the canonical gap register, promotes evidence or sets public release.

          ## Claim ceiling

          This PR creates execution and verification mechanics only. It does not claim that any L2-L6 target, device, destructive test, signer or release authorization exists. \`zero_gap=false\` and \`public_release=false\` remain mandatory until genuine receipts are independently promoted. Fresh exact-head review by \`Tomasrgbsf\` and \`Franksudoman\` is required.
          EOF
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/pulls/${pr}" -f body="$(cat "${RUNNER_TEMP}/body.md")" >/dev/null

      - name: Qualify, review and merge normally
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pr="$(cat "${RUNNER_TEMP}/pr")"; head="$(cat "${RUNNER_TEMP}/head")"
          required=('L1 graph, documentation, broker and MCP source closure' 'L1 Rust 1.93 selected Host, job, flow and recovery closure' 'L1 exact-head direct-source aggregate' 'L1 exact two-parent merge source qualification' 'L1 exact-source-head aggregate candidate' 'L1 protected-main and exact-head independent-review readiness')
          deadline=$((SECONDS+2100)); passed=false
          while ((SECONDS<deadline)); do
            test "$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr}" --jq '.head.sha')" = "$head"; gh api --paginate "repos/${GITHUB_REPOSITORY}/commits/${head}/check-runs?per_page=100" --jq '.check_runs[]|[.name,.status,(.conclusion//""),.id]|@tsv' > "${RUNNER_TEMP}/checks"
            if python3 - "${RUNNER_TEMP}/checks" "${required[@]}" <<'PY'
          from pathlib import Path
          import sys
          latest={}
          for line in Path(sys.argv[1]).read_text().splitlines():
              n,s,c,i=line.split('\t'); v=(int(i),s,c)
              if n not in latest or v[0]>latest[n][0]: latest[n]=v
          failures=[n for n,(_,s,c) in latest.items() if s=='completed' and c not in {'success','neutral','skipped'}]
          if failures: print(failures); raise SystemExit(2)
          if not all(latest.get(n,(0,'',''))[1:]==('completed','success') for n in sys.argv[2:]): raise SystemExit(1)
          PY
            then passed=true; break; else rc=$?; test "$rc" -ne 2 || exit 1; fi; sleep 15
          done; test "$passed" = true
          node="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr}" --jq '.node_id')"; gh api graphql -f query='mutation($id:ID!){markPullRequestReadyForReview(input:{pullRequestId:$id}){pullRequest{number}}}' -f id="$node" >/dev/null; gh api --method POST "repos/${GITHUB_REPOSITORY}/pulls/${pr}/requested_reviewers" -f reviewers[]='Tomasrgbsf' -f reviewers[]='Franksudoman' >/dev/null
          deadline=$((SECONDS+1200)); states=''; while ((SECONDS<deadline)); do test "$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr}" --jq '.head.sha')" = "$head"; states="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${pr}/reviews?per_page=100" --jq '.[]|select(.commit_id=="'"$head"'")|[.user.login,.state,.id]|@tsv'|sort -k1,1 -k3,3n|awk -F'\t' '$1=="Tomasrgbsf"||$1=="Franksudoman"{s[$1]=$2} END{print s["Tomasrgbsf"],s["Franksudoman"]}')"; test "$states" = 'APPROVED APPROVED' && break; sleep 15; done; test "$states" = 'APPROVED APPROVED'
          unresolved="$(gh api graphql -f owner="${GITHUB_REPOSITORY_OWNER}" -f name="${GITHUB_REPOSITORY#*/}" -F number="$pr" -f query='query($owner:String!,$name:String!,$number:Int!){repository(owner:$owner,name:$name){pullRequest(number:$number){reviewThreads(first:100){nodes{isResolved}}}}}' --jq '[.data.repository.pullRequest.reviewThreads.nodes[]|select(.isResolved==false)]|length')"; test "$unresolved" = 0
          result="$(gh api --method PUT "repos/${GITHUB_REPOSITORY}/pulls/${pr}/merge" -f merge_method=squash -f sha="$head" -f commit_title='qualification: add fail-closed external evidence protocol' -f commit_message='Integrate execution/intake mechanics only. No L2-L6 evidence, gap transition or public release is claimed.')"; jq -e '.merged==true'<<<"$result" >/dev/null
          merge_sha="$(jq -r '.sha'<<<"$result")"; for issue in 22 58 59 60 61 62 67 68; do gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${issue}/comments" -f body="External qualification protocol source integrated at ${merge_sha}. This grants no evidence; genuine level-specific execution/intake remains required." >/dev/null; done
