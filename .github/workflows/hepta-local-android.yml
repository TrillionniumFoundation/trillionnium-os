name: Hepta local Android candidate

on:
  pull_request:
    paths:
      - 'projects/razr60/phone-local-v150/android-local/lfm3-controller/**'
      - 'projects/razr60/phone-local-v150/android-local/validation/**'
      - '.github/workflows/hepta-local-android.yml'
  push:
    branches:
      - 'codex/razr60-local-r3-*'
      - 'codex/razr-local-profiles-*'
    paths:
      - 'projects/razr60/phone-local-v150/android-local/lfm3-controller/**'
      - 'projects/razr60/phone-local-v150/android-local/validation/**'
      - '.github/workflows/hepta-local-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  owned-generation-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      HEPTA_SOURCE: projects/razr60/phone-local-v150/android-local/lfm3-controller
      PYTHONDONTWRITEBYTECODE: '1'
      SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the exact candidate source for independent process visibility evidence
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify complete source closure
        working-directory: ${{ env.HEPTA_SOURCE }}
        run: python -B tools/verify_source.py
      - name: Fetch and verify the pinned host JSON dependency
        run: |
          set -euo pipefail
          hepta_json_jar="$RUNNER_TEMP/hepta-json-20240303.jar"
          curl --fail --location --proto '=https' --tlsv1.2 --connect-timeout 15 --max-time 60 \
            --output "$hepta_json_jar" \
            'https://repo.maven.apache.org/maven2/org/json/json/20240303/json-20240303.jar'
          printf '%s  %s\n' \
            '3cf6cd6892e32e2b4c1c39e0f52f5248a2f5b37646fdfbb79a66b46b618414ed' "$hepta_json_jar" \
            | sha256sum --check --strict
      - name: Run the unchanged complete generation gate with host-only visibility tracing
        run: |
          set -euo pipefail
          python -B "$GITHUB_WORKSPACE/$HEPTA_SOURCE/tests/owned-generation-cleanup/run_host.py" \
            --source "$GITHUB_WORKSPACE/$HEPTA_SOURCE" \
            --output "$RUNNER_TEMP/hepta-owned-generation-diagnostic" \
            --java-home "$JAVA_HOME" \
            --json-jar "$RUNNER_TEMP/hepta-json-20240303.jar" \
            --python "$(command -v python)" --cc "$(command -v cc)"
      - name: Run the focused mixed-UID classification and two-read exclusion gate
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          python -B "$GITHUB_WORKSPACE/$HEPTA_SOURCE/tests/owned-generation-mixed-uid/run_host.py" \
            --source "$GITHUB_WORKSPACE/$HEPTA_SOURCE" \
            --output "$RUNNER_TEMP/hepta-owned-generation-mixed-uid" \
            --cc "$(command -v cc)"
      - name: Preserve independent generation diagnostics even when the original gate rejects
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-owned-generation-diagnostic-${{ github.event.pull_request.head.sha || github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/hepta-owned-generation-diagnostic/**
            ${{ runner.temp }}/hepta-owned-generation-mixed-uid/**

  mnn-runtime:
    runs-on: macos-15-intel
    timeout-minutes: 45
    env:
      HEPTA_SOURCE: projects/razr60/phone-local-v150/android-local/lfm3-controller
      HEPTA_RUNTIME_SOURCE: hepta-runtime-producer/projects/razr60/phone-local-v150/android-local/lfm3-controller
      HEPTA_SDK_FETCH_SOURCE: hepta-sdk-fetch-source/projects/razr60/phone-local-v150/android-local/lfm3-controller
      PYTHONDONTWRITEBYTECODE: '1'
      SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the exact candidate source for the macOS runtime build
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check out the unchanged frozen runtime producer independently
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: cc4a7035760383a126e4510002139d88667e0b97
          path: hepta-runtime-producer
          persist-credentials: false
      - name: Check out the original fixed SDK fetcher independently
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 815e203fda5edb1cc5b6ef799cfc7559c288025a
          path: hepta-sdk-fetch-source
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Set up Java for the Android SDK manager
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify complete source closure
        working-directory: ${{ env.HEPTA_SOURCE }}
        run: python -B tools/verify_source.py
      - name: Test independent producer and consumer source binding
        working-directory: projects/razr60/phone-local-v150/android-local/validation/runtime-consumer-binding-v1
        run: python -B -m unittest -v test_bind_consumer.py
      - name: Verify both complete source trees and unchanged runtime contracts
        run: |
          python -B projects/razr60/phone-local-v150/android-local/validation/runtime-consumer-binding-v1/bind_consumer.py check-sources \
            --consumer-root "$GITHUB_WORKSPACE" --producer-root "$GITHUB_WORKSPACE/hepta-runtime-producer" \
            --source-head "$SOURCE_HEAD_SHA" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            > "$RUNNER_TEMP/hepta-runtime-source-pair.json"
      - name: Verify the unchanged SDK transport and its fixed source
        run: |
          python -B - <<'PY'
          import os
          from pathlib import Path
          import runpy
          root = Path(os.environ["GITHUB_WORKSPACE"])
          helper = root / "projects/razr60/phone-local-v150/android-local/validation/geniex-ci-transport-v1/fetch_verified_runtime.py"
          api = runpy.run_path(str(helper), run_name="hepta_sdk_transport_preflight")
          api["verify_helper_closure"](helper.parent)
          api["load_frozen_source"](root / os.environ["HEPTA_SDK_FETCH_SOURCE"])
          print("Original SDK transport closure and fixed fetch source admitted.")
          PY
      - name: Install and identify the original macOS NDK compiler
        run: |
          hepta_sdk="${ANDROID_HOME:?Android SDK missing on runner}"
          "$hepta_sdk/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$hepta_sdk" 'ndk;28.1.13356709'
          hepta_ndk="$hepta_sdk/ndk/28.1.13356709"
          python -B projects/razr60/phone-local-v150/android-local/validation/mobimind-ci-host-split-v8/qualify_macos_compiler.py \
            --ndk "$hepta_ndk" --output "$RUNNER_TEMP/hepta-ndk-identity.json"
          printf '%s\n' "ANDROID_NDK_ROOT=$hepta_ndk" >> "$GITHUB_ENV"
      - name: Check out the fixed public MNN source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: doulujiyao12/mobiinfer
          ref: bce7456ce60b5e51b4d3b357f303515860353d8c
          path: hepta-mnn-upstream
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Rebuild and match all three original runtime files on macOS
        run: |
          python -B projects/razr60/phone-local-v150/android-local/validation/mobimind-runtime-rebuild-v8/rebuild_exact_runtime.py \
            --app-source "$GITHUB_WORKSPACE/$HEPTA_RUNTIME_SOURCE" \
            --mnn-checkout "$GITHUB_WORKSPACE/hepta-mnn-upstream" \
            --ndk "$ANDROID_NDK_ROOT" \
            --output "$RUNNER_TEMP/hepta-mobimind-rebuild/producer"
      - name: Bind the exact rebuilt runtime to this source and workflow attempt
        run: |
          python -B projects/razr60/phone-local-v150/android-local/validation/runtime-consumer-binding-v1/bind_consumer.py bind --kind mnn \
            --consumer-root "$GITHUB_WORKSPACE" --producer-root "$GITHUB_WORKSPACE/hepta-runtime-producer" \
            --bundle "$RUNNER_TEMP/hepta-mobimind-rebuild" \
            --source-head "$SOURCE_HEAD_SHA" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --compiler-identity "$RUNNER_TEMP/hepta-ndk-identity.json"
      - name: Transfer only the exact runtime within this workflow
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-mobimind-macos-runtime-${{ github.event.pull_request.head.sha || github.sha }}
          retention-days: 1
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/hepta-mobimind-rebuild/producer/runtime/*
            ${{ runner.temp }}/hepta-mobimind-rebuild/producer/NEW-BUILD-RECEIPT.json
            ${{ runner.temp }}/hepta-mobimind-rebuild/producer/CURRENT-CI-SOURCE.json
            ${{ runner.temp }}/hepta-mobimind-rebuild/producer/COMPILER-IDENTITY.json
            ${{ runner.temp }}/hepta-mobimind-rebuild/CURRENT-CONSUMER-SOURCE.json
      - name: Test fixed UI-Venus source and transfer binding contracts
        working-directory: hepta-runtime-producer/projects/razr60/phone-local-v150/android-local/validation/ui-venus-runtime-rebuild-v1
        run: python -B -m unittest -v test_rebuild_and_verify.py
      - name: Test the unchanged fixed-release transport adapter
        working-directory: projects/razr60/phone-local-v150/android-local/validation/geniex-ci-transport-v1
        run: python -B -m unittest -v test_fetch_verified_runtime.py
      - name: Fetch and verify the fixed SDK for the independent UI-Venus build
        run: |
          python -B projects/razr60/phone-local-v150/android-local/validation/geniex-ci-transport-v1/fetch_verified_runtime.py \
            --source "$GITHUB_WORKSPACE/$HEPTA_SDK_FETCH_SOURCE" \
            --destination "$RUNNER_TEMP/hepta-ui-venus-geniex" \
            --receipt "$RUNNER_TEMP/hepta-ui-venus-geniex-transport.json"
      - name: Rebuild and bind the exact ordinary-App UI-Venus worker on macOS
        run: |
          python -B projects/razr60/phone-local-v150/android-local/validation/runtime-consumer-binding-v1/bind_consumer.py bind --kind ui \
            --consumer-root "$GITHUB_WORKSPACE" --producer-root "$GITHUB_WORKSPACE/hepta-runtime-producer" \
            --ndk "$ANDROID_NDK_ROOT" --sdk-libs "$RUNNER_TEMP/hepta-ui-venus-geniex/lib" \
            --bundle "$RUNNER_TEMP/hepta-ui-venus-rebuild" \
            --compiler-identity "$RUNNER_TEMP/hepta-ndk-identity.json" \
            --source-head "$SOURCE_HEAD_SHA" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
      - name: Transfer only the exact UI-Venus runtime within this workflow
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-ui-venus-macos-runtime-${{ github.event.pull_request.head.sha || github.sha }}
          retention-days: 1
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/hepta-ui-venus-rebuild/producer/runtime/*
            ${{ runner.temp }}/hepta-ui-venus-rebuild/producer/NEW-BUILD-RECEIPT.json
            ${{ runner.temp }}/hepta-ui-venus-rebuild/producer/CURRENT-CI-SOURCE.json
            ${{ runner.temp }}/hepta-ui-venus-rebuild/producer/COMPILER-IDENTITY.json
            ${{ runner.temp }}/hepta-ui-venus-rebuild/CURRENT-CONSUMER-SOURCE.json
      - name: Preserve actual independent UI-Venus build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-ui-venus-macos-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/hepta-ui-venus-geniex-transport.json
            ${{ runner.temp }}/hepta-ui-venus-rebuild/producer/actual-build/*
            ${{ runner.temp }}/hepta-ui-venus-rebuild/producer/actual-build.stdout
            ${{ runner.temp }}/hepta-ui-venus-rebuild/producer/actual-build.stderr
            ${{ runner.temp }}/hepta-ui-venus-rebuild/producer/NEW-BUILD-RECEIPT.json
            ${{ runner.temp }}/hepta-ui-venus-rebuild/producer/CURRENT-CI-SOURCE.json
      - name: Preserve actual macOS runtime build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-mobimind-macos-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/hepta-ndk-identity.json
            ${{ runner.temp }}/hepta-runtime-source-pair.json
            ${{ runner.temp }}/hepta-mobimind-rebuild/CURRENT-CONSUMER-SOURCE.json
            ${{ runner.temp }}/hepta-ui-venus-rebuild/CURRENT-CONSUMER-SOURCE.json
            ${{ runner.temp }}/hepta-mobimind-rebuild/producer/NEW-BUILD-RECEIPT.json
            ${{ runner.temp }}/hepta-mobimind-rebuild/producer/three-elf-comparison.json
            ${{ runner.temp }}/hepta-mobimind-rebuild/producer/source-qualification.json
            ${{ runner.temp }}/hepta-mobimind-rebuild/producer/worker-compile-commands.json
            ${{ runner.temp }}/hepta-mobimind-rebuild/producer/*.log
  source-and-android:
    needs: mnn-runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      HEPTA_SOURCE: projects/razr60/phone-local-v150/android-local/lfm3-controller
      HEPTA_RUNTIME_SOURCE: hepta-runtime-producer/projects/razr60/phone-local-v150/android-local/lfm3-controller
      HEPTA_SDK_FETCH_SOURCE: hepta-sdk-fetch-source/projects/razr60/phone-local-v150/android-local/lfm3-controller
      PYTHONDONTWRITEBYTECODE: '1'
      SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the exact candidate source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check out the unchanged frozen runtime producer independently
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: cc4a7035760383a126e4510002139d88667e0b97
          path: hepta-runtime-producer
          persist-credentials: false
      - name: Check out the original fixed SDK fetcher independently
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 815e203fda5edb1cc5b6ef799cfc7559c288025a
          path: hepta-sdk-fetch-source
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify complete source closure
        working-directory: ${{ env.HEPTA_SOURCE }}
        run: python -B tools/verify_source.py
      - name: Test independent producer and consumer source binding
        working-directory: projects/razr60/phone-local-v150/android-local/validation/runtime-consumer-binding-v1
        run: python -B -m unittest -v test_bind_consumer.py
      - name: Verify both complete source trees and unchanged runtime contracts
        run: |
          python -B projects/razr60/phone-local-v150/android-local/validation/runtime-consumer-binding-v1/bind_consumer.py check-sources \
            --consumer-root "$GITHUB_WORKSPACE" --producer-root "$GITHUB_WORKSPACE/hepta-runtime-producer" \
            --source-head "$SOURCE_HEAD_SHA" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            > "$RUNNER_TEMP/hepta-runtime-source-pair.json"
      - name: Verify the unchanged SDK transport and its fixed source
        run: |
          python -B - <<'PY'
          import os
          from pathlib import Path
          import runpy
          root = Path(os.environ["GITHUB_WORKSPACE"])
          helper = root / "projects/razr60/phone-local-v150/android-local/validation/geniex-ci-transport-v1/fetch_verified_runtime.py"
          api = runpy.run_path(str(helper), run_name="hepta_sdk_transport_preflight")
          api["verify_helper_closure"](helper.parent)
          api["load_frozen_source"](root / os.environ["HEPTA_SDK_FETCH_SOURCE"])
          print("Original SDK transport closure and fixed fetch source admitted.")
          PY
      - name: Fetch and verify the pinned host JSON dependency
        run: |
          set -euo pipefail
          hepta_json_jar="$RUNNER_TEMP/hepta-json-20240303.jar"
          curl --fail --location --proto '=https' --tlsv1.2 --connect-timeout 15 --max-time 60 \
            --output "$hepta_json_jar" \
            'https://repo.maven.apache.org/maven2/org/json/json/20240303/json-20240303.jar'
          printf '%s  %s\n' \
            '3cf6cd6892e32e2b4c1c39e0f52f5248a2f5b37646fdfbb79a66b46b618414ed' "$hepta_json_jar" \
            | sha256sum --check --strict
      - name: Run host contracts
        working-directory: ${{ env.HEPTA_SOURCE }}
        run: python -B tools/run_host_checks.py --out "$RUNNER_TEMP/hepta-host-checks" --json-jar "$RUNNER_TEMP/hepta-json-20240303.jar"
      - name: Run all seven required native App regression gates
        run: |
          set -euo pipefail
          hepta_native_source="$GITHUB_WORKSPACE/$HEPTA_SOURCE"
          hepta_native_out="$RUNNER_TEMP/hepta-native-app-gates"
          mkdir "$hepta_native_out"
          python -B "$hepta_native_source/tests/native-app-goal/run_host.py" \
            --source "$hepta_native_source" --output "$hepta_native_out/goal" --java-home "$JAVA_HOME"
          python -B "$hepta_native_source/tests/native-app-routing/run_host.py" \
            --source "$hepta_native_source" --output "$hepta_native_out/routing" --java-home "$JAVA_HOME" \
            --json-jar "$RUNNER_TEMP/hepta-json-20240303.jar"
          python -B "$hepta_native_source/tests/native-xiaomi-product/run_host.py" \
            --source "$hepta_native_source" --output "$hepta_native_out/xiaomi" --java-home "$JAVA_HOME"
          python -B "$hepta_native_source/tests/native-app-provider/run_host.py" \
            --source "$hepta_native_source" --output "$hepta_native_out/provider" --java-home "$JAVA_HOME" \
            --json-jar "$RUNNER_TEMP/hepta-json-20240303.jar"
          python -B "$hepta_native_source/tests/native-app-facts/run_host.py" \
            --source "$hepta_native_source" --output "$hepta_native_out/facts" --java-home "$JAVA_HOME" \
            --json-jar "$RUNNER_TEMP/hepta-json-20240303.jar"
          python -B "$hepta_native_source/tests/owned-generation-mixed-uid/run_host.py" \
            --source "$hepta_native_source" --output "$hepta_native_out/mixed-uid" --cc "$(command -v cc)"
          python -B "$hepta_native_source/tests/owned-single-task/run_host.py" \
            --source "$hepta_native_source" --output "$hepta_native_out/owned-single-task" --java-home "$JAVA_HOME" --json-jar "$RUNNER_TEMP/hepta-json-20240303.jar"
      - name: Run required Notes non-scroll editor gate
        run: |
          set -euo pipefail
          hepta_native_source="$GITHUB_WORKSPACE/$HEPTA_SOURCE"
          hepta_native_out="$RUNNER_TEMP/hepta-native-app-gates"
          python -B "$hepta_native_source/tests/notes-nonscroll-editor/run_host.py" \
            --source "$hepta_native_source" --output "$hepta_native_out/notes-nonscroll-editor" --java-home "$JAVA_HOME" \
            > "$hepta_native_out/notes-nonscroll-editor.runner.stdout" \
            2> "$hepta_native_out/notes-nonscroll-editor.runner.stderr"
      - name: Run required observation diagnostics gate
        run: |
          set -euo pipefail
          hepta_native_source="$GITHUB_WORKSPACE/$HEPTA_SOURCE"
          hepta_native_out="$RUNNER_TEMP/hepta-native-app-gates"
          python -B "$hepta_native_source/tests/observation-diagnostics/run_host.py" \
            --source "$hepta_native_source" --output "$hepta_native_out/observation-diagnostics" --java-home "$JAVA_HOME" \
            --json-jar "$RUNNER_TEMP/hepta-json-20240303.jar" \
            > "$hepta_native_out/observation-diagnostics.runner.stdout" \
            2> "$hepta_native_out/observation-diagnostics.runner.stderr"
      - name: Preserve all original native App gate results and streams
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hepta-native-app-gates-${{ github.event.pull_request.head.sha || github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: ${{ runner.temp }}/hepta-native-app-gates/**
      - name: Run independent core acceptance regressions
        working-directory: projects/razr60/phone-local-v150/android-local/validation/core-phone-suite
        run: python -B -m unittest -v test_core_assertions.py
      - name: Run independent GPU evidence regressions
        working-directory: projects/razr60/phone-local-v150/android-local/validation/gpu-runtime
        run: python -B -m unittest -v test_gpu_log_validation.py
      - name: Run independent lifecycle guard regressions
        working-directory: projects/razr60/phone-local-v150/android-local/validation/lifecycle
        run: python -B -m unittest -v test_lifecycle_guards.py
      - name: Run compatible base-driver regressions
        working-directory: projects/razr60/phone-local-v150/android-local/validation/compat-drivers-v1
        run: python -B -m unittest -v test_phone_acceptance test_phone_suite test_phone_inventory
      - name: Run core-v2 goal and ordering regressions
        working-directory: projects/razr60/phone-local-v150/android-local/validation/core-phone-suite-v2
        env:
          HEPTA_CORE_TEST_DRIVERS: ../compat-drivers-v1
        run: python -B -m unittest -v test_core_assertions.py
      - name: Run lifecycle path-binding regressions
        working-directory: projects/razr60/phone-local-v150/android-local/validation/lifecycle-v2
        run: python -B -m unittest -v test_lifecycle_guards.py
      - name: Run offline-transaction restoration regressions
        working-directory: projects/razr60/phone-local-v150/android-local/validation/offline-network-v1
        run: python -B -m unittest -v test_offline_transaction.py
      - name: Run display-scoped lifecycle regressions
        working-directory: projects/razr60/phone-local-v150/android-local/validation/lifecycle-v3
        run: python -B -m unittest -v test_lifecycle_guards.py
      - name: Run qualified-data-key offline regressions
        working-directory: projects/razr60/phone-local-v150/android-local/validation/offline-network-v2
