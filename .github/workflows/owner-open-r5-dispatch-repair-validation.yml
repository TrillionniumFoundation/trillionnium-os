name: owner-open R5 dispatch repair validation

on:
  push:
    branches:
      - "codex/owner-open-r5-tool-loop-20260827"
    paths:
      - ".github/workflows/owner-open-r5-dispatch-repair-validation.yml"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Dispatch the validated repair workflow at the latest branch head
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh workflow run owner-open-r5-validate-and-land-repairs.yml \
            --ref codex/owner-open-r5-tool-loop-20260827
