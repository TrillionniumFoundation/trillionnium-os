name: G1 legacy review-index migration diagnostic

# Manual-only compatibility diagnostic. This workflow does not claim to qualify
# an exact prospective merge, a closed-world review inventory, integration,
# promotion, a target, a device or a release. The real prospective-merge source
# gate is `G1 synthetic-merge qualification` and is consumed by the protected
# exact-head aggregate.
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open pull request to inspect
        required: true
        type: string
      base_commit:
        description: Exact pull-request base commit
        required: true
        type: string
      head_commit:
        description: Exact pull-request head commit
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: g1-legacy-review-index-${{ inputs.pr_number }}-${{ inputs.head_commit }}
  cancel-in-progress: true

env:
  SOURCE_HEAD_SHA: ${{ inputs.head_commit }}
  EVENT_BASE_SHA: ${{ inputs.base_commit }}
  EVENT_PR_NUMBER: ${{ inputs.pr_number }}

jobs:
  source-subject-diagnostic:
    name: L1 legacy review-index source-subject diagnostic
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out selected pull-request head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ env.SOURCE_HEAD_SHA }}
          persist-credentials: false
      - name: Verify bounded source subject only
        run: |
          set -euo pipefail
          [[ "$EVENT_PR_NUMBER" =~ ^[1-9][0-9]{0,8}$ ]]
          [[ "$EVENT_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git --no-replace-objects rev-parse HEAD^{commit})" = "$SOURCE_HEAD_SHA"
          git --no-replace-objects cat-file -e "$EVENT_BASE_SHA^{commit}"
          git --no-replace-objects merge-base --is-ancestor \
            "$EVENT_BASE_SHA" "$SOURCE_HEAD_SHA"
          if ! worktree_status="$(git --no-replace-objects -C "${GITHUB_WORKSPACE:?}" status --porcelain=v1 --untracked-files=all --ignore-submodules=none)"; then
            printf '%s\n' 'Cannot verify repository worktree state' >&2
            exit 1
          fi
          test -z "$worktree_status"
      - name: State diagnostic claim ceiling
        run: |
          cat <<'EOF'
          This manual diagnostic verifies only source object identity, ancestry
          and a clean checkout. It is not a review receipt, synthetic-merge
          qualification, approval, integration authorization, promotion
          authorization, target observation or public-release authority.
          EOF
      - name: Prove the diagnostic left the selected checkout unchanged
        run: |
          set -euo pipefail
          if ! worktree_status="$(git --no-replace-objects -C "${GITHUB_WORKSPACE:?}" status --porcelain=v1 --untracked-files=all --ignore-submodules=none)"; then
            printf '%s\n' 'Cannot verify repository worktree state after diagnostic' >&2
            exit 1
          fi
          test -z "$worktree_status"
