name: Owner-Open R7 workspace v4 controller

on:
  push:
    branches:
      - ops/owner-open-r7-workspace-v4-controller-20260830
    paths:
      - .github/workflows/owner-open-r7-workspace-v4-controller.yml

permissions:
  actions: read
  checks: read
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: owner-open-r7-workspace-v4-controller
  cancel-in-progress: false

jobs:
  supervise:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_BRANCH: codex/owner-open-r7-workspace-integrity-20260830-v4
      TARGET_WORKFLOW: Owner-Open R7 workspace integrity v4 executor
      TARGET_EXECUTOR: .github/workflows/owner-open-r7-workspace-integrity-v4-executor.yml
      SOURCE_BRANCH: codex/owner-open-r7-runtime-hardening-20260830-v4
      BASE_SHA: 34d8b731370b42f84fb50c34ecd6ca41b39f0d08

    steps:
      - name: Check out controller
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: ops/owner-open-r7-workspace-v4-controller-20260830

      - name: Observe source run and permanent exact-head matrix
        shell: bash
        run: |
          set -uo pipefail
          owner="${GITHUB_REPOSITORY%%/*}"
          mkdir -p out
          deadline=$((SECONDS + 16200))
          run_id=""
          status=""
          conclusion=""
          while [ "$SECONDS" -lt "$deadline" ]; do
            runs="$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/runs" -f branch="$TARGET_BRANCH" -F per_page=100 2>/dev/null || printf '{"workflow_runs":[]}')"
            row="$(jq -c --arg name "$TARGET_WORKFLOW" '[.workflow_runs[] | select(.name == $name)] | sort_by(.created_at) | last // empty' <<<"$runs")"
            if [ -n "$row" ]; then
              run_id="$(jq -r .id <<<"$row")"
              status="$(jq -r .status <<<"$row")"
              conclusion="$(jq -r '.conclusion // ""' <<<"$row")"
              [ "$status" = completed ] && break
            fi
            sleep 30
          done

          branch="$(gh api "repos/$GITHUB_REPOSITORY/branches/$TARGET_BRANCH" 2>/dev/null || printf '{}')"
          sha="$(jq -r '.commit.sha // empty' <<<"$branch")"
          executor_present=false
          gh api "repos/$GITHUB_REPOSITORY/contents/$TARGET_EXECUTOR?ref=$TARGET_BRANCH" >/dev/null 2>&1 && executor_present=true
          gate_present=false
          gh api "repos/$GITHUB_REPOSITORY/contents/.github/workflows/owner-open-workspace-integrity.yml?ref=$TARGET_BRANCH" >/dev/null 2>&1 && gate_present=true
          pr="$(gh api --method GET "repos/$GITHUB_REPOSITORY/pulls" -f state=all -f head="$owner:$TARGET_BRANCH" -F per_page=20 2>/dev/null | jq -r '.[0].number // empty' || true)"

          if [ "$status" != completed ] || [ "$conclusion" != success ] || [ -z "$sha" ] || [ "$sha" = "$BASE_SHA" ] || [ "$executor_present" = true ] || [ "$gate_present" != true ]; then
            log=""
            [ -n "$run_id" ] && log="$(gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --log-failed 2>/dev/null | tail -c 18000 || true)"
            printf '%s\n' "$log" > out/failed.log
            jq -n --arg outcome not_qualified --arg run_id "$run_id" --arg status "$status" --arg conclusion "$conclusion" --arg sha "$sha" --argjson executor_present "$executor_present" --argjson gate_present "$gate_present" '{outcome:$outcome,run_id:$run_id,status:$status,conclusion:$conclusion,sha:$sha,executor_present:$executor_present,gate_present:$gate_present}' > out/result.json
            if [ -n "$pr" ]; then
              gh pr comment "$pr" --repo "$GITHUB_REPOSITORY" --body "Workspace v4 controller: qualification did not produce a self-deleted persistent exact-head gate (run=\`$run_id\`, conclusion=\`$conclusion\`). No CI coverage claim was accepted." || true
              gh pr close "$pr" --repo "$GITHUB_REPOSITORY" --comment "Closed fail-closed after workspace qualification did not pass." || true
            fi
            if [ -n "$log" ]; then
              issue="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search 'R7 workspace v4 diagnostic in:title' --json number --jq '.[0].number // empty' 2>/dev/null || true)"
              body="Workspace v4 run \`$run_id\` failed closed.\n\n<details><summary>Failed log tail</summary>\n\n\`\`\`text\n$log\n\`\`\`\n</details>"
              if [ -n "$issue" ]; then gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body "$body" || true; else gh issue create --repo "$GITHUB_REPOSITORY" --title "R7 workspace v4 diagnostic" --body "$body" || true; fi
            fi
          else
            if [ -z "$pr" ]; then
              gh pr create --repo "$GITHUB_REPOSITORY" --draft --base "$SOURCE_BRANCH" --head "$TARGET_BRANCH" --title "ci(r7): enforce exact-head complete workspace integrity" --body "Exact-head full workspace tests and strict Clippy on source and canonical state heads. L1 only." >/dev/null || true
              pr="$(gh api --method GET "repos/$GITHUB_REPOSITORY/pulls" -f state=open -f head="$owner:$TARGET_BRANCH" -F per_page=20 | jq -r '.[0].number // empty' || true)"
            fi
            check_deadline=$((SECONDS + 7200))
            stable=0
            previous=""
            total=0
            pending=1
            bad=0
            workspace_ok=0
            checks='{"total_count":0,"check_runs":[]}'
            while [ "$SECONDS" -lt "$check_deadline" ]; do
              checks="$(gh api -H 'Accept: application/vnd.github+json' "repos/$GITHUB_REPOSITORY/commits/$sha/check-runs?per_page=100" 2>/dev/null || printf '{"total_count":0,"check_runs":[]}')"
              total="$(jq -r '.total_count // 0' <<<"$checks")"
              pending="$(jq '[.check_runs[] | select(.status != "completed")] | length' <<<"$checks")"
              bad="$(jq '[.check_runs[] | select(.status == "completed") | select((.conclusion // "") as $c | ($c != "success" and $c != "neutral" and $c != "skipped"))] | length' <<<"$checks")"
              workspace_ok="$(jq '[.check_runs[] | select(.name == "L1 Rust 1.93 complete workspace tests and strict Clippy" and .status == "completed" and .conclusion == "success")] | length' <<<"$checks")"
              signature="$(jq -r '[.check_runs[] | [.name,.status,(.conclusion // "")] | join(":")] | sort | join("|")' <<<"$checks")"
              if [ "$total" -ge 10 ] && [ "$pending" -eq 0 ] && [ "$workspace_ok" -ge 1 ] && [ "$signature" = "$previous" ]; then stable=$((stable+1)); else stable=0; fi
              previous="$signature"
              [ "$stable" -ge 2 ] && break
              sleep 30
            done
            jq '{total_count,check_runs:[.check_runs[]|{name,status,conclusion,html_url}]}' <<<"$checks" > out/checks.json
            if [ "$total" -ge 10 ] && [ "$pending" -eq 0 ] && [ "$bad" -eq 0 ] && [ "$workspace_ok" -ge 1 ]; then
              jq -n --arg outcome qualified --arg run_id "$run_id" --arg sha "$sha" --argjson checks "$total" '{outcome:$outcome,run_id:$run_id,sha:$sha,checks:$checks}' > out/result.json
              if [ -n "$pr" ]; then
                gh pr ready "$pr" --repo "$GITHUB_REPOSITORY" || true
                gh pr edit "$pr" --repo "$GITHUB_REPOSITORY" --add-reviewer ProfHepta --add-label ready-for-review >/dev/null 2>&1 || true
                gh pr comment "$pr" --repo "$GITHUB_REPOSITORY" --body "Workspace v4 controller: exact head \`$sha\` passed source run \`$run_id\`, the permanent complete-workspace gate and $total stable checks. Ready for independent review; no L2-L6 claim promoted." || true
              fi
            else
              jq -n --arg outcome permanent_checks_not_green --arg run_id "$run_id" --arg sha "$sha" --argjson total "$total" --argjson pending "$pending" --argjson bad "$bad" --argjson workspace_ok "$workspace_ok" '{outcome:$outcome,run_id:$run_id,sha:$sha,total:$total,pending:$pending,bad:$bad,workspace_ok:$workspace_ok}' > out/result.json
              if [ -n "$pr" ]; then gh pr comment "$pr" --repo "$GITHUB_REPOSITORY" --body "Workspace v4 source exists at \`$sha\`, but its permanent exact-head matrix is not fully green; the PR remains draft." || true; fi
            fi
          fi
          cat out/result.json

      - name: Retire controller
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/owner-open-r7-workspace-v4-controller.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "ops(r7): retire workspace v4 controller"
          git push origin HEAD:ops/owner-open-r7-workspace-v4-controller-20260830
