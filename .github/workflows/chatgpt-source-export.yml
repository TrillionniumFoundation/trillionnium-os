name: ChatGPT exact-source export

on:
  push:
    branches:
      - ops/chatgpt-source-export-20260908

permissions:
  contents: read

jobs:
  export-pr50:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SOURCE_SHA: 8b8fa7def9ae9f8e0994b129db96b8820231eb80
    steps:
      - name: Check out exact PR50 head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Assert clean exact checkout and archive
        shell: bash
        run: |
          set -euo pipefail
          test "$(git --no-replace-objects rev-parse HEAD)" = "$SOURCE_SHA"
          if ! worktree_status="$(git --no-replace-objects status --porcelain=v1 --untracked-files=all --ignore-submodules=none)"; then
            exit 1
          fi
          test -z "$worktree_status"
          git --no-replace-objects archive --format=tar.gz --output="${RUNNER_TEMP}/trillionnium-os-${SOURCE_SHA}.tar.gz" "$SOURCE_SHA"
          sha256sum "${RUNNER_TEMP}/trillionnium-os-${SOURCE_SHA}.tar.gz" > "${RUNNER_TEMP}/trillionnium-os-${SOURCE_SHA}.tar.gz.sha256"
      - name: Upload exact source archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chatgpt-source-pr50-${{ env.SOURCE_SHA }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          path: |
            ${{ runner.temp }}/trillionnium-os-${{ env.SOURCE_SHA }}.tar.gz
            ${{ runner.temp }}/trillionnium-os-${{ env.SOURCE_SHA }}.tar.gz.sha256
