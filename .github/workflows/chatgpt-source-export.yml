name: ChatGPT PR63 executable-custody repair

on:
  push:
    branches:
      - ops/chatgpt-source-export-20260908

permissions:
  contents: write

concurrency:
  group: chatgpt-pr63-executable-custody-repair
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CONTROL_BRANCH: ops/chatgpt-source-export-20260908
      TARGET_BRANCH: codex/perf-harness-isolation-20260908
      EXPECTED_HEAD: e12a997e6af71c505bc7da07fdee1de1d3f4f733
      EXPECTED_TREE: 913dfa1abdaeb70ac89de416eccda3bb41dbb9a7
      B64_SHA256: 61562e9661d903bb49149730a6bc647d37f5e007fda292bcdf432b5418c64200
      GZIP_SHA256: 6090a8801c12a7a8685267a6d1269054563957faa94024f458d1a36f6025b81b
      PATCH_SHA256: 32f3d58e7d85d445f6a92c202b6bf7f9a275814a45616b91eafdfd3bfee39a45
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out exact PR63 head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ env.TARGET_BRANCH }}
          persist-credentials: true
      - name: Reassemble and apply exact executable-custody repair
        shell: bash
        run: |
          set -euo pipefail
          test "$(git --no-replace-objects rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git --no-replace-objects rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          if ! status="$(git --no-replace-objects status --porcelain=v1 --untracked-files=all --ignore-submodules=none)"; then
            exit 1
          fi
          test -z "$status"
          git fetch --no-tags origin "$CONTROL_BRANCH"
          {
            git show "origin/$CONTROL_BRANCH:ops/pr63-exec-custody.part00"
            git show "origin/$CONTROL_BRANCH:ops/pr63-exec-custody.part01"
            git show "origin/$CONTROL_BRANCH:ops/pr63-exec-custody.part02"
            git show "origin/$CONTROL_BRANCH:ops/pr63-exec-custody.part03"
          } > "${RUNNER_TEMP}/pr63-exec-custody.patch.gz.b64"
          echo "$B64_SHA256  ${RUNNER_TEMP}/pr63-exec-custody.patch.gz.b64" | sha256sum --check -
          base64 --decode "${RUNNER_TEMP}/pr63-exec-custody.patch.gz.b64" > "${RUNNER_TEMP}/pr63-exec-custody.patch.gz"
          echo "$GZIP_SHA256  ${RUNNER_TEMP}/pr63-exec-custody.patch.gz" | sha256sum --check -
          gzip --decompress --stdout "${RUNNER_TEMP}/pr63-exec-custody.patch.gz" > "${RUNNER_TEMP}/pr63-exec-custody.patch"
          echo "$PATCH_SHA256  ${RUNNER_TEMP}/pr63-exec-custody.patch" | sha256sum --check -
          git apply --check "${RUNNER_TEMP}/pr63-exec-custody.patch"
          git apply "${RUNNER_TEMP}/pr63-exec-custody.patch"
          git diff --check
          cat > "${RUNNER_TEMP}/expected-paths" <<'EOF'
          tools/build/README.md
          tools/build/_verify_host_reproducibility_core.py
          tools/build/verify_host_reproducibility.py
          tools/perf/README.md
          tools/perf/_run_product_baseline_core.py
          tools/perf/run_product_baseline.py
          tools/tests/test_run_product_baseline.py
          tools/tests/test_verify_host_reproducibility.py
          EOF
          git diff --name-only | LC_ALL=C sort > "${RUNNER_TEMP}/actual-paths"
          diff -u "${RUNNER_TEMP}/expected-paths" "${RUNNER_TEMP}/actual-paths"
      - name: Execute executable-custody hostile matrix
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            tools/perf/_run_product_baseline_core.py \
            tools/perf/run_product_baseline.py \
            tools/build/_verify_host_reproducibility_core.py \
            tools/build/verify_host_reproducibility.py \
            tools/tests/test_run_product_baseline.py \
            tools/tests/test_product_baseline_process_group_cleanup.py \
            tools/tests/test_verify_host_reproducibility.py
          python3 -m unittest \
            tools.tests.test_run_product_baseline \
            tools.tests.test_product_baseline_process_group_cleanup \
            tools.tests.test_verify_host_reproducibility \
            tools.tests.test_owner_open_rootlinux_supervisor -v
          python3 tools/perf/run_product_baseline.py --help >/dev/null
          python3 tools/build/verify_host_reproducibility.py --help >/dev/null
          find tools -type d -name __pycache__ -prune -exec rm -rf {} +
          git diff --check
          if ! status="$(git --no-replace-objects status --porcelain=v1 --untracked-files=all --ignore-submodules=none)"; then
            exit 1
          fi
          printf '%s\n' "$status"
      - name: Commit and publish repaired exact head
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Qian QI'
          git config user.email '102159240+ProfHepta@users.noreply.github.com'
          git add \
            tools/build/README.md \
            tools/build/_verify_host_reproducibility_core.py \
            tools/build/verify_host_reproducibility.py \
            tools/perf/README.md \
            tools/perf/_run_product_baseline_core.py \
            tools/perf/run_product_baseline.py \
            tools/tests/test_run_product_baseline.py \
            tools/tests/test_verify_host_reproducibility.py
          git commit -m 'perf: pin executed bytes across probe-to-exec boundaries'
          git push origin "HEAD:$TARGET_BRANCH"
