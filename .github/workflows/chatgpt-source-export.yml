name: ChatGPT PR50 rerun-coherence repair

on:
  push:
    branches:
      - ops/chatgpt-source-export-20260908

permissions:
  contents: write

concurrency:
  group: chatgpt-pr50-rerun-coherence
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPECTED_HEAD: 8b8fa7def9ae9f8e0994b129db96b8820231eb80
      PR_BRANCH: reviewer/ci-governance-simplification-20260908
    steps:
      - name: Check out exact PR50 head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ env.PR_BRANCH }}
          persist-credentials: true
      - name: Apply source-controlled continuous invalidation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git config user.name 'Qian QI'
          git config user.email '102159240+ProfHepta@users.noreply.github.com'
          python3 - <<'PY'
          from pathlib import Path

          p = Path('.github/workflows/g1-exact-head-source.yml')
          s = p.read_text()
          old = '  aggregate:\n    name: L1 exact-source-head aggregate candidate\n'
          new = '  aggregate:\n    name: L1 exact-head direct-source aggregate\n'
          if s.count(old) != 1:
              raise SystemExit('exact aggregate marker drift')
          p.write_text(s.replace(old, new), encoding='utf-8')

          p = Path('.github/workflows/g1-synthetic-merge.yml')
          s = p.read_text()
          if '  source-admission:\n' in s:
              raise SystemExit('source-admission already exists')
          appendix = '''\n\n  source-admission:\n    name: L1 exact-source-head aggregate candidate\n    needs:\n      - synthetic-merge\n    if: ${{ always() }}\n    runs-on: ubuntu-24.04\n    timeout-minutes: 5\n    steps:\n      - name: Continuously bind the required context to this workflow attempt\n        env:\n          SYNTHETIC_RESULT: ${{ needs.synthetic-merge.result }}\n        shell: bash\n        run: |\n          set -euo pipefail\n          test "$SYNTHETIC_RESULT" = success\n          printf '%s\\n' 'L1_EXACT_HEAD_AND_SYNTHETIC_SOURCE_PASSED'\n'''
          p.write_text(s.rstrip() + appendix + '\n', encoding='utf-8')

          p = Path('tools/g1_pr_aggregate_model.py')
          s = p.read_text()
          old = '        job_names=frozenset({"L1 exact two-parent merge source qualification"}),\n'
          new = '''        job_names=frozenset(\n            {\n                "L1 exact two-parent merge source qualification",\n                "L1 exact-source-head aggregate candidate",\n            }\n        ),\n'''
          if s.count(old) != 1:
              raise SystemExit('aggregate model marker drift')
          p.write_text(s.replace(old, new), encoding='utf-8')

          p = Path('tools/tests/test_g1_pr_aggregate.py')
          s = p.read_text()
          old = '            frozenset({"L1 exact two-parent merge source qualification"}),\n'
          new = '''            frozenset(\n                {\n                    "L1 exact two-parent merge source qualification",\n                    "L1 exact-source-head aggregate candidate",\n                }\n            ),\n'''
          if s.count(old) != 1 or s.count('self.assertEqual(len(workflow["jobs"]), 1)') != 1:
              raise SystemExit('aggregate test marker drift')
          s = s.replace(old, new)
          s = s.replace('self.assertEqual(len(workflow["jobs"]), 1)', 'self.assertEqual(len(workflow["jobs"]), 2)')
          p.write_text(s, encoding='utf-8')

          p = Path('tools/tests/test_g1_synthetic_merge_identity.py')
          s = p.read_text()
          s = s.replace(
              'WORKFLOW = ROOT / ".github/workflows/g1-synthetic-merge.yml"\n',
              'WORKFLOW = ROOT / ".github/workflows/g1-synthetic-merge.yml"\n'
              'EXACT_HEAD_WORKFLOW = ROOT / ".github/workflows/g1-exact-head-source.yml"\n'
          )
          marker = '    def test_same_tree_and_ordered_parents_produce_one_commit_identity(self) -> None:\n'
          method = '''    def test_required_context_is_owned_by_synthetic_attempt(self) -> None:\n        synthetic = WORKFLOW.read_text(encoding="utf-8")\n        exact_head = EXACT_HEAD_WORKFLOW.read_text(encoding="utf-8")\n        required = "name: L1 exact-source-head aggregate candidate"\n        self.assertEqual(synthetic.count(required), 1)\n        self.assertNotIn(required, exact_head)\n        self.assertIn("  source-admission:\\n", synthetic)\n        self.assertIn("      - synthetic-merge\\n", synthetic)\n        self.assertIn("    if: ${{ always() }}\\n", synthetic)\n        self.assertIn(\n            "SYNTHETIC_RESULT: ${{ needs.synthetic-merge.result }}", synthetic\n        )\n        self.assertIn('test "$SYNTHETIC_RESULT" = success', synthetic)\n        self.assertIn(\n            "name: L1 exact-head direct-source aggregate", exact_head\n        )\n\n'''
          if marker not in s:
              raise SystemExit('synthetic identity test marker drift')
          p.write_text(s.replace(marker, method + marker, 1), encoding='utf-8')

          p = Path('tools/verify-g1-pr-aggregate.py')
          s = p.read_text()
          old = '''The protected ``L1 exact-source-head aggregate candidate`` context already\nrequires the direct jobs in its own workflow. This command additionally binds\nthe newest successful ``G1 synthetic-merge qualification`` run and source-bound\nreceipt to the same live PR base/head tuple. It deliberately does not require\nreview-index, Android target, evidence-intake, device, fault, signing or release\nworkflows.\n'''
          new = '''The protected ``L1 exact-source-head aggregate candidate`` context is emitted\nby the dependent admission job in ``G1 synthetic-merge qualification``. This\ncommand runs in the separately named exact-head direct-source aggregate and\nbinds that workflow's exact attempt, both job identities, and source receipt to\nthe same live PR base/head tuple. It deliberately does not require review-index,\nAndroid target, evidence-intake, device, fault, signing or release workflows.\n'''
          if old not in s:
              raise SystemExit('aggregate docstring marker drift')
          p.write_text(s.replace(old, new), encoding='utf-8')

          p = Path('docs/CI_GATE_MODEL.md')
          s = p.read_text()
          old = '''The server-required exact-head aggregate must fail closed unless the newest run\nof `G1 synthetic-merge qualification` for the exact live base/head subject is\ncomplete and successful. The aggregate consumes that exact workflow attempt and\nits commit-bound source receipt; this is not target, device or release evidence.\nA failed merge, changed ordered parent, changed merge tree, changed canonical\ncommit, rerun-attempt movement or artifact movement invalidates the aggregate.\n'''
          new = '''The server-required `L1 exact-source-head aggregate candidate` context is owned\nby a dependent job in `G1 synthetic-merge qualification`. It cannot complete\nuntil the exact live base/head synthetic job succeeds. The separately named\nexact-head direct-source aggregate consumes that same workflow attempt, both\njob identities and its commit-bound source receipt. A rerun of the synthetic job\ntherefore requeues its dependent required context; a failed attempt makes that\ncontext fail without requiring a source push. This is source/integration\nevidence, not target, device or release evidence. A failed merge, changed\nordered parent, changed merge tree, changed canonical commit, rerun-attempt\nmovement or artifact movement invalidates the aggregate.\n'''
          if old not in s:
              raise SystemExit('CI model source marker drift')
          s = s.replace(old, new)
          old = '''The real synthetic-merge context should also be continuously enforced by branch\nprotection so that a post-aggregate rerun immediately blocks mergeability. That\nadministrative requirement is separate from canonicalizing the source-produced\ncommit and cannot be claimed complete by a repository commit alone.\n\nChanges to required context names and branch protection must be atomic: the new\nsource guarantee becomes enforceable before the old context is removed.\n'''
          new = '''The existing required context is continuously coupled to the synthetic workflow\nby its dependent admission job. The exact-head workflow must not emit the same\nname; duplicate job names across workflows would make protection ambiguous. A\npost-success rerun of the synthetic job and its dependants must make the required\ncontext pending and then success or failure for that new attempt.\n\nAny future context-name or branch-protection migration must remain atomic: the\nnew source guarantee becomes enforceable before the old context is removed.\n'''
          if old not in s:
              raise SystemExit('CI model migration marker drift')
          p.write_text(s.replace(old, new), encoding='utf-8')

          p = Path('docs/QUALIFICATION_AND_EVIDENCE.md')
          s = p.read_text()
          old = '''The server-required `L1 exact-source-head aggregate candidate` context is the\nrepository-controlled L1 source/integration gate. It requires every direct\nsource job in its own exact-head workflow and binds the live pull-request base,\nhead, repository and clean checkout.\n\nA real conflict-checked canonical synthetic merge is also a direct\nsource/integration property. The aggregate therefore requires the newest\nexact-subject run of `G1 synthetic-merge qualification` to be terminal-success\nand validates its source-bound receipt against the same live base/head tuple,\nordered parents, merge tree, canonical merge commit, lockfile and source\ncheckout.\n'''
          new = '''The server-required `L1 exact-source-head aggregate candidate` context is a\ndependent admission job in `G1 synthetic-merge qualification`. It becomes\npending for each new workflow attempt and succeeds only after the exact\nconflict-checked synthetic merge job succeeds. The direct exact-head jobs retain\ntheir own required contexts, while their separately named aggregate binds the\nlive pull-request base, head, repository and clean checkout.\n\nThe exact-head aggregate requires the newest exact-subject synthetic workflow to\nbe terminal-success and validates both workflow jobs plus its source-bound\nreceipt against the same live base/head tuple, ordered parents, merge tree,\ncanonical merge commit, lockfile and source checkout. A post-success rerun of\nthe synthetic job and dependent admission job therefore invalidates the old\nrequired result without a source push.\n'''
          if old not in s:
              raise SystemExit('qualification marker drift')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY
          git diff --check
      - name: Verify focused boundary and workflow contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/docs/generate_global_docs.py --check
          python3 tools/docs/verify_global_docs.py
          python3 -m unittest \
            tools.tests.test_g1_pr_aggregate \
            tools.tests.test_g1_pr_aggregate_job_attempt_binding \
            tools.tests.test_g1_synthetic_merge_identity \
            tools.tests.test_owner_open_workflow_exact_head \
            tools.tests.test_verify_global_docs_contracts -v
      - name: Commit and publish repair
        shell: bash
        run: |
          set -euo pipefail
          git add \
            .github/workflows/g1-exact-head-source.yml \
            .github/workflows/g1-synthetic-merge.yml \
            docs/CI_GATE_MODEL.md \
            docs/QUALIFICATION_AND_EVIDENCE.md \
            tools/g1_pr_aggregate_model.py \
            tools/tests/test_g1_pr_aggregate.py \
            tools/tests/test_g1_synthetic_merge_identity.py \
            tools/verify-g1-pr-aggregate.py
          git commit -m 'ci: continuously invalidate synthetic rerun admission'
          git push origin "HEAD:$PR_BRANCH"
