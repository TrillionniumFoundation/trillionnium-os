name: ChatGPT effect-lifecycle candidate

on:
  push:
    branches:
      - ops/chatgpt-source-export-20260908

permissions:
  contents: write

concurrency:
  group: chatgpt-effect-lifecycle-candidate
  cancel-in-progress: false

jobs:
  build-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      EXPECTED_BASE: fb196c36fbd6d1ca9978c229b3bd4fecd5f5783e
      TARGET_BRANCH: codex/effect-lifecycle-model-20260908
      CONTROL_BRANCH: ops/chatgpt-source-export-20260908
      PATCH_SHA256: 84f0e0c2654147cf2edf9e606c18d9d1d87258a5aab2515c036a43f7fe77aad5
    steps:
      - name: Check out exact lifecycle base
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: codex/effect-lifecycle-model-20260908
          persist-credentials: true
      - name: Reassemble and apply bound lifecycle patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_BASE"
          git config user.name 'Qian QI'
          git config user.email '102159240+ProfHepta@users.noreply.github.com'
          git fetch --no-tags origin "$CONTROL_BRANCH"
          git show "origin/$CONTROL_BRANCH:ops/issue54.patch.gz.b64" > "${RUNNER_TEMP}/issue54.patch.gz.b64"
          test -s "${RUNNER_TEMP}/issue54.patch.gz.b64"
          python3 - <<'PY'
          import base64
          import hashlib
          import os
          from pathlib import Path
          import zlib

          source = Path(os.environ["RUNNER_TEMP"]) / "issue54.patch.gz.b64"
          output = Path(os.environ["RUNNER_TEMP"]) / "issue54.patch"
          alphabet = frozenset("ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=")
          encoded = "".join(ch for ch in source.read_text(encoding="ascii") if ch in alphabet)
          decoder = zlib.decompressobj(16 + zlib.MAX_WBITS)
          plain = bytearray()
          for offset in range(0, len(encoded) - 3, 4):
              quad = encoded[offset : offset + 4]
              try:
                  block = base64.b64decode(quad, validate=True)
              except Exception as exc:
                  raise SystemExit(f"invalid bound base64 quartet at {offset}: {exc}")
              plain.extend(decoder.decompress(block))
              if decoder.eof:
                  plain.extend(decoder.flush())
                  break
          if not decoder.eof:
              raise SystemExit("no complete gzip member in lifecycle patch carrier")
          digest = hashlib.sha256(plain).hexdigest()
          expected = os.environ["PATCH_SHA256"]
          if digest != expected:
              raise SystemExit(f"lifecycle patch digest mismatch: {digest}")
          output.write_bytes(plain)
          PY
          echo "$PATCH_SHA256  ${RUNNER_TEMP}/issue54.patch" | sha256sum --check -
          git apply --check "${RUNNER_TEMP}/issue54.patch"
          git apply "${RUNNER_TEMP}/issue54.patch"
          git diff --check
      - name: Verify machine lifecycle and formal projection
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            tools/docs/generate_global_docs.py \
            tools/docs/verify_global_docs.py \
            tools/docs/verify_effect_lifecycle.py
          python3 tools/docs/generate_global_docs.py --check
          python3 tools/docs/verify_effect_lifecycle.py --model-check --json
          python3 tools/docs/verify_repository_authority.py
          python3 tools/docs/verify_global_docs.py
          python3 -m unittest \
            tools.tests.test_effect_lifecycle \
            tools.tests.test_repository_authority \
            tools.tests.test_verify_global_docs_contracts \
            tools.tests.test_owner_open_broker_module_documentation -v
      - name: Commit and publish candidate
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git commit -m 'docs: machine-verify cross-module effect lifecycle'
          git push origin "HEAD:$TARGET_BRANCH"
