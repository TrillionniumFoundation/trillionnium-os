name: ChatGPT PR50 rerun-coherence repair

on:
  push:
    branches:
      - ops/chatgpt-source-export-20260908

permissions:
  contents: write

concurrency:
  group: chatgpt-pr50-rerun-coherence
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPECTED_HEAD: 8b8fa7def9ae9f8e0994b129db96b8820231eb80
      PR_BRANCH: reviewer/ci-governance-simplification-20260908
      CONTROL_BRANCH: ops/chatgpt-source-export-20260908
    steps:
      - name: Check out exact PR50 head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: reviewer/ci-governance-simplification-20260908
          persist-credentials: true
      - name: Apply staged patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git config user.name 'Qian QI'
          git config user.email '102159240+ProfHepta@users.noreply.github.com'
          git fetch --no-tags origin "$CONTROL_BRANCH"
          git show "origin/$CONTROL_BRANCH:ops/pr50-rerun-coherence.patch" > "${RUNNER_TEMP}/pr50-rerun-coherence.patch"
          test -s "${RUNNER_TEMP}/pr50-rerun-coherence.patch"
          git apply --check "${RUNNER_TEMP}/pr50-rerun-coherence.patch"
          git apply "${RUNNER_TEMP}/pr50-rerun-coherence.patch"
          git diff --check
      - name: Verify focused boundary and workflow contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/docs/generate_global_docs.py --check
          python3 tools/docs/verify_global_docs.py
          python3 -m unittest \
            tools.tests.test_g1_pr_aggregate \
            tools.tests.test_g1_pr_aggregate_job_attempt_binding \
            tools.tests.test_g1_synthetic_merge_identity \
            tools.tests.test_owner_open_workflow_exact_head \
            tools.tests.test_verify_global_docs_contracts -v
      - name: Commit and publish non-workflow files
        shell: bash
        run: |
          set -euo pipefail
          git add \
            docs/CI_GATE_MODEL.md \
            docs/QUALIFICATION_AND_EVIDENCE.md \
            tools/g1_pr_aggregate_model.py \
            tools/tests/test_g1_pr_aggregate.py \
            tools/tests/test_g1_synthetic_merge_identity.py \
            tools/verify-g1-pr-aggregate.py
          git commit -m 'ci: bind aggregate model to synthetic admission job'
          git push origin "HEAD:$PR_BRANCH"
