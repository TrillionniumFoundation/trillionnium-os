name: ChatGPT exact source export

on:
  push:
    branches:
      - ops/chatgpt-source-export-20260908

permissions:
  contents: read

concurrency:
  group: chatgpt-exact-source-export
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SOURCE_SHA: fb196c36fbd6d1ca9978c229b3bd4fecd5f5783e
      SOURCE_TREE: 202f4509d4deda35db5d0a08528f76110fd183f0
    steps:
      - name: Check out exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Bind and archive clean exact tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git --no-replace-objects rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git --no-replace-objects rev-parse HEAD^{tree})" = "$SOURCE_TREE"
          if ! status="$(git --no-replace-objects status --porcelain=v1 --untracked-files=all --ignore-submodules=none)"; then
            exit 1
          fi
          test -z "$status"
          git --no-replace-objects archive --format=tar.gz --output="${RUNNER_TEMP}/repository-truth-${SOURCE_SHA}.tar.gz" "$SOURCE_SHA"
          sha256sum "${RUNNER_TEMP}/repository-truth-${SOURCE_SHA}.tar.gz" > "${RUNNER_TEMP}/repository-truth-${SOURCE_SHA}.tar.gz.sha256"
      - name: Upload exact non-qualifying source export
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: repository-truth-source-${{ env.SOURCE_SHA }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          path: |
            ${{ runner.temp }}/repository-truth-${{ env.SOURCE_SHA }}.tar.gz
            ${{ runner.temp }}/repository-truth-${{ env.SOURCE_SHA }}.tar.gz.sha256
