name: one-shot owner-open R5 exact-head CI repair

on:
  push:
    branches:
      - codex/owner-open-r5-gap-closure-20260829
    paths:
      - ".github/workflows/owner-open-r5-ci-repair-one-shot.yml"

permissions:
  contents: write

jobs:
  repair-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/owner-open-r5-gap-closure-20260829
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@1.93.0
        with:
          components: rustfmt
      - name: Repair exact-head evidence and provider fixtures
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          def ensure_once(path: Path, old: str, new: str, label: str) -> None:
              text = path.read_text(encoding="utf-8")
              if new in text:
                  return
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one old match, observed {count}")
              path.write_text(text.replace(old, new), encoding="utf-8")

          gap_path = Path("docs/status/owner-open-r5-gap-closure.json")
          gaps = json.loads(gap_path.read_text(encoding="utf-8"))
          required = {
              "R5-GAP-ROOTLINUX-PLACEMENT-001": (
                  "required_material",
                  [
                      "authorized target Root Linux instance",
                      "service-manager unit and identity configuration",
                      "namespace, cgroup and mount observations",
                      "writable store and socket ownership evidence",
                  ],
              ),
              "R5-GAP-ANDROID-GRAPH-001": (
                  "required_material",
                  [
                      "clean pinned Android source checkout",
                      "authorized AOSP build toolchain and build capacity",
                      "target-files and image inventories",
                      "Soong, init and SELinux build evidence",
                  ],
              ),
              "R5-GAP-PHYSICAL-ADB-001": (
                  "required_material",
                  [
                      "authorized physical Android device and USB host",
                      "selected ARM64 adb client and server artifacts",
                      "ordinary adbd offline, unauthorized and reconnect states",
                      "raw visible-effect and no-redispatch observations",
                  ],
              ),
              "R5-GAP-FAULT-MATRIX-001": (
                  "required_material",
                  [
                      "authorized destructive test environment",
                      "controllable ENOSPC, corruption and power-loss fault injection",
                      "target service and physical-device access",
                      "independently retained recovery evidence",
                  ],
              ),
              "R5-GAP-RELEASE-001": (
                  "required_authority",
                  [
                      "independent security and release reviewers",
                      "authorized production signing-key custodian",
                      "AVB, OTA and rollback policy owner",
                      "explicit human public-release authorization",
                  ],
              ),
          }
          observed = set()
          for gap in gaps.get("gaps", []):
              gap_id = gap.get("id")
              if gap_id not in required:
                  continue
              field, values = required[gap_id]
              gap[field] = values
              observed.add(gap_id)
          missing = sorted(set(required) - observed)
          if missing:
              raise SystemExit(f"required external-hold gaps missing: {missing}")
          gap_path.write_text(
              json.dumps(gaps, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )

          evidence_test = Path("tools/tests/test_verify_owner_open_r5_gap_evidence.py")
          ensure_once(
              evidence_test,
              "import json\nfrom pathlib import Path",
              "import json\nfrom pathlib import Path\nimport sys",
              "dataclass dynamic-import sys import",
          )
          ensure_once(
              evidence_test,
              "module = importlib.util.module_from_spec(spec)\nspec.loader.exec_module(module)",
              "module = importlib.util.module_from_spec(spec)\nsys.modules[spec.name] = module\nspec.loader.exec_module(module)",
              "dataclass dynamic-import module registration",
          )

          duplex = Path("crates/trillionnium-owner-open-provider-jsonl/tests/duplex.rs")
          text = duplex.read_text(encoding="utf-8")
          old_token = r'\"status\":\"invalid_request\"'
          new_token = '"status":"invalid_request"'
          if old_token in text:
              count = text.count(old_token)
              if count != 1:
                  raise SystemExit(
                      f"unknown-tool response token: expected one match, observed {count}"
                  )
              duplex.write_text(text.replace(old_token, new_token), encoding="utf-8")
          elif new_token not in text:
              raise SystemExit("unknown-tool response token is absent")

          Path(".github/workflows/owner-open-r5-ci-repair-one-shot.yml").unlink()
          PY
      - name: Verify repaired machine state
        run: |
          set -euo pipefail
          python3 -m json.tool docs/status/owner-open-r5-gap-closure.json >/dev/null
          python3 tools/verify-owner-open-r5.py --json >/tmp/owner-open-r5.json
          python3 tools/verify-owner-open-r5-gap-evidence.py --json >/tmp/owner-open-r5-gap-evidence.json
          python3 -m unittest discover \
            -s tools/tests \
            -p 'test_verify_owner_open_r5_gap_evidence.py' \
            -v
      - name: Verify repaired provider behavior
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo test --locked -p trillionnium-owner-open-provider-jsonl --test duplex
      - name: Commit repaired exact-head inputs
        run: |
          set -euo pipefail
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            docs/status/owner-open-r5-gap-closure.json \
            tools/tests/test_verify_owner_open_r5_gap_evidence.py \
            crates/trillionnium-owner-open-provider-jsonl/tests/duplex.rs \
            .github/workflows/owner-open-r5-ci-repair-one-shot.yml
          git diff --cached --check
          git commit -m "fix(r5): repair exact-head evidence and provider fixtures"
          git push origin HEAD:codex/owner-open-r5-gap-closure-20260829
