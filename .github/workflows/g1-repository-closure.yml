name: G1 repository topology and exact-subject closure

# Repository topology/document integrity remains useful after merge or during an
# explicit governance audit. Live PR review-index closure is intentionally not a
# pull-request admission protocol.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g1-repository-closure-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_HEAD_SHA: ${{ github.sha }}
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  repository-closure:
    name: L1 real workspace and permanent workflow topology
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ env.SOURCE_HEAD_SHA }}
          persist-credentials: false
      - name: Assert clean source identity
        run: |
          set -euo pipefail
          test "$(git --no-replace-objects rev-parse HEAD)" = "$SOURCE_HEAD_SHA"
          test -n "$(git --no-replace-objects rev-parse HEAD^{tree})"
          test -z "$(git status --porcelain=v1 --untracked-files=all --ignore-submodules=none)"
      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Verify repository topology and permanent workflow boundaries
        run: |
          set -euo pipefail
          install -d -m 0700 "${RUNNER_TEMP}/g1-repository-closure"
          python3 -m py_compile tools/verify_g1_repository_closure.py tools/tests/test_verify_g1_repository_closure.py
          python3 tools/docs/generate_global_docs.py --check
          python3 tools/docs/verify_global_docs.py
          python3 tools/docs/verify_module_documentation.py
          python3 tools/verify_g1_repository_closure.py --json > "${RUNNER_TEMP}/g1-repository-closure/repository-closure.json"
          python3 -m unittest tools.tests.test_verify_g1_repository_closure -v
          python3 -m json.tool "${RUNNER_TEMP}/g1-repository-closure/repository-closure.json" >/dev/null
          git diff --check
          test -z "$(git status --porcelain=v1 --untracked-files=all --ignore-submodules=none)"
      - name: Upload topology observation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: g1-repository-closure-${{ env.SOURCE_HEAD_SHA }}
          if-no-files-found: error
          retention-days: 30
          path: ${{ runner.temp }}/g1-repository-closure/
