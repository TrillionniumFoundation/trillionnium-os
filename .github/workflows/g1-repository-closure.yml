name: G1 repository topology and exact-subject closure

# Repository/document integrity remains useful after merge or during an explicit
# audit. It does not verify historical compatibility receipts and does not
# participate in ordinary pull-request admission.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g1-repository-closure-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_HEAD_SHA: ${{ github.sha }}
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  repository-closure:
    name: L1 repository and documentation integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ env.SOURCE_HEAD_SHA }}
          persist-credentials: false
      - name: Assert clean source identity
        run: |
          set -euo pipefail
          test "$(git --no-replace-objects rev-parse HEAD^{commit})" = "$SOURCE_HEAD_SHA"
          test -n "$(git --no-replace-objects rev-parse HEAD^{tree})"
          if ! worktree_status="$(git --no-replace-objects -C "${GITHUB_WORKSPACE:?}" status --porcelain=v1 --untracked-files=all --ignore-submodules=none)"; then
            printf '%s\n' 'Cannot verify repository worktree state' >&2
            exit 1
          fi
          test -z "$worktree_status"
      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Verify generated documentation and module topology
        run: |
          set -euo pipefail
          python3 tools/docs/generate_global_docs.py --check
          python3 tools/docs/verify_global_docs.py
          python3 tools/docs/verify_module_documentation.py
          python3 - <<'PY'
          import tomllib
          from pathlib import Path

          root = Path(".")
          cargo = tomllib.loads((root / "Cargo.toml").read_text(encoding="utf-8"))
          workspace = cargo.get("workspace", {})
          members = workspace.get("members", [])
          defaults = workspace.get("default-members", [])
          assert isinstance(members, list) and members
          assert isinstance(defaults, list) and set(defaults) <= set(members)
          for member in members:
              assert (root / member / "Cargo.toml").is_file(), member
          PY
          git diff --check
          if ! worktree_status="$(git --no-replace-objects -C "${GITHUB_WORKSPACE:?}" status --porcelain=v1 --untracked-files=all --ignore-submodules=none)"; then
            printf '%s\n' 'Cannot verify repository worktree state after closure checks' >&2
            exit 1
          fi
          test -z "$worktree_status"
