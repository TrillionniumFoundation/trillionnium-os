name: one-shot owner-open R5 Host correlation patch

on:
  push:
    branches:
      - codex/owner-open-r5-gap-closure-20260829
    paths:
      - ".github/workflows/owner-open-r5-host-correlation-patch.yml"

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/owner-open-r5-gap-closure-20260829
      - uses: dtolnay/rust-toolchain@1.93.0
        with:
          components: rustfmt
      - name: Patch exact job response correlation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path: Path, old: str, new: str, label: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, observed {count}")
              path.write_text(text.replace(old, new), encoding="utf-8")

          def regex_once(path: Path, pattern: str, replacement: str, label: str) -> None:
              text = path.read_text(encoding="utf-8")
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.MULTILINE)
              if count != 1:
                  raise SystemExit(f"{label}: expected one regex match, observed {count}")
              path.write_text(updated, encoding="utf-8")

          wire = Path("apps/trillionnium-owner-open-host/src/bin/r5_control_host_v7/wire.rs")
          regex_once(
              wire,
              r"(fn build_job_frame\(\n(?:.*\n){5}\) -> RunTurnFrame \{\n)(    RunTurnFrame \{)",
              r'''\1    let mut payload = payload;
              if let Some(object) = payload.as_object_mut() {
                  object.entry("request_sha256".to_string()).or_insert_with(|| {
                      context
                          .request_sha256
                          .as_ref()
                          .map_or(Value::Null, |value| Value::String(value.clone()))
                  });
              }
              \2'''.replace("              ", ""),
              "build_job_frame payload binding",
          )
          replace_once(
              wire,
              "        stream_id: Some(context.stream_id.clone()),\n        turn_stream_id: None,\n",
              "        stream_id: Some(context.stream_id.clone()),\n        turn_stream_id: Some(context.key.scope.turn_stream_id.clone()),\n",
              "job turn-stream correlation",
          )

          process = Path("apps/trillionnium-owner-open-host/src/bin/r5_control_host_v7/process.rs")
          replace_once(
              process,
              "            let decoded = decode_job_start(&frame, shell_executable)?;\n            let context = decoded.context.clone();\n            let result = manager\n",
              "            let decoded = decode_job_start(&frame, shell_executable)?;\n            let context = decoded.context.clone();\n            let operation_id = decoded.request.operation_id.clone();\n            let result = manager\n",
              "job.start operation capture",
          )
          replace_once(
              process,
              "                start_payload(&result),\n",
              "                start_payload(&result, &operation_id),\n",
              "job.start response operation",
          )
          replace_once(
              process,
              "            let decoded = decode_job_control(&frame)?;\n            let context = resolve_job_context(manager, decoded.context)?;\n            let inspection = if frame.kind == FRAME_JOB_ATTACH {\n",
              "            let decoded = decode_job_control(&frame)?;\n            let context = resolve_job_context(manager, decoded.context)?;\n            let response_attachment_id = if frame.kind == FRAME_JOB_ATTACH {\n                decoded.attachment_id.as_deref()\n            } else {\n                None\n            };\n            let inspection = if frame.kind == FRAME_JOB_ATTACH {\n",
              "job.attach response identity",
          )
          replace_once(
              process,
              "            let response = bounded_inspection_frame(\n                state,\n                kind,\n                &inspection,\n                &durable_records,\n                max_frame_bytes,\n            )?;\n",
              "            let response = bounded_inspection_frame(\n                state,\n                kind,\n                &inspection,\n                &durable_records,\n                response_attachment_id,\n                max_frame_bytes,\n            )?;\n",
              "inspection response attachment argument",
          )
          replace_once(
              process,
              "fn bounded_inspection_frame(\n    state: &mut JobDeliveryState,\n    kind: &str,\n    inspection: &JobInspection,\n    durable_records: &[Value],\n    max_frame_bytes: usize,\n) -> Result<RunTurnFrame, String> {\n",
              "fn bounded_inspection_frame(\n    state: &mut JobDeliveryState,\n    kind: &str,\n    inspection: &JobInspection,\n    durable_records: &[Value],\n    attachment_id: Option<&str>,\n    max_frame_bytes: usize,\n) -> Result<RunTurnFrame, String> {\n",
              "bounded inspection signature",
          )
          replace_once(
              process,
              '            "durable_has_more": end < durable_records.len(),\n            "read_only": true,\n',
              '            "durable_has_more": end < durable_records.len(),\n            "attachment_id": attachment_id,\n            "read_only": true,\n',
              "inspection attachment payload",
          )
          replace_once(
              process,
              "fn start_payload(result: &JobStartResult) -> Value {\n",
              "fn start_payload(result: &JobStartResult, operation_id: &str) -> Value {\n",
              "start_payload signature",
          )
          replace_once(
              process,
              '        "snapshot": &result.snapshot,\n        "replay_status": &result.replay_status,\n',
              '        "snapshot": &result.snapshot,\n        "replay_status": &result.replay_status,\n        "operation_id": operation_id,\n',
              "start_payload operation binding",
          )

          test = Path("apps/trillionnium-owner-open-host/tests/r5_jobs.rs")
          replace_once(
              test,
              '    assert!(\n        frames\n            .iter()\n            .any(|frame| frame["kind"] == "job.start.result")\n    );\n',
              '    let start = frames\n        .iter()\n        .find(|frame| frame["kind"] == "job.start.result")\n        .expect("job.start.result");\n    assert_eq!(start["payload"]["operation_id"], "start-job-pipe");\n    assert_eq!(start["turn_stream_id"], "turn-stream-jobs");\n    assert_eq!(start["session_id"], "session-jobs");\n',
              "job start correlation regression",
          )
          replace_once(
              test,
              '    assert!(frames.iter().any(|frame| frame["kind"] == "job.started"));\n',
              '    assert!(frames.iter().any(|frame| frame["kind"] == "job.started"));\n    let control_operations = frames\n        .iter()\n        .filter(|frame| frame["kind"] == "job.control.result")\n        .filter_map(|frame| frame["payload"]["operation_id"].as_str())\n        .collect::<Vec<_>>();\n    assert!(control_operations.contains(&"write-job-pipe"));\n    assert!(control_operations.contains(&"close-job-pipe"));\n    assert!(frames\n        .iter()\n        .filter(|frame| frame["job_id"] == "job-pipe")\n        .all(|frame| frame["turn_stream_id"] == "turn-stream-jobs"));\n',
              "job control correlation regression",
          )
          PY
      - name: Format and test exact Host job path
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo test --locked --package trillionnium-owner-open-host --test r5_jobs
          cargo test --locked --package trillionnium-owner-open-host --test r5_stream_flow_control
          git diff --check
      - name: Commit correlated Host source
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/trillionnium-owner-open-host/src/bin/r5_control_host_v7/wire.rs \
            apps/trillionnium-owner-open-host/src/bin/r5_control_host_v7/process.rs \
            apps/trillionnium-owner-open-host/tests/r5_jobs.rs
          git commit -m "fix(broker): preserve exact job response correlation"
          git push origin HEAD:codex/owner-open-r5-gap-closure-20260829
