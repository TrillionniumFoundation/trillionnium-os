name: one-shot owner-open R5 Host correlation patch

on:
  push:
    branches:
      - codex/owner-open-r5-gap-closure-20260829
    paths:
      - ".github/workflows/owner-open-r5-host-correlation-patch.yml"

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/owner-open-r5-gap-closure-20260829
      - uses: dtolnay/rust-toolchain@1.93.0
        with:
          components: rustfmt
      - name: Patch exact job response correlation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str, label: str) -> None:
              text = path.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"{label}: expected one match, observed {text.count(old)}")
              path.write_text(text.replace(old, new), encoding="utf-8")

          wire = Path("apps/trillionnium-owner-open-host/src/bin/r5_control_host_v7/wire.rs")
          replace_once(
              wire,
              '''fn build_job_frame(
              context: &JobContext,
              kind: &str,
              seq: u64,
              discriminator: &str,
              payload: Value,
          ) -> RunTurnFrame {
              RunTurnFrame {
          ''',
              '''fn build_job_frame(
              context: &JobContext,
              kind: &str,
              seq: u64,
              discriminator: &str,
              payload: Value,
          ) -> RunTurnFrame {
              let mut payload = payload;
              if let Some(object) = payload.as_object_mut() {
                  object.entry("request_sha256".to_string()).or_insert_with(|| {
                      context
                          .request_sha256
                          .as_ref()
                          .map_or(Value::Null, |value| Value::String(value.clone()))
                  });
              }
              RunTurnFrame {
          ''',
              "build_job_frame payload binding",
          )
          replace_once(
              wire,
              '''        stream_id: Some(context.stream_id.clone()),
              turn_stream_id: None,
              session_id: Some(context.key.scope.session_id.clone()),
          ''',
              '''        stream_id: Some(context.stream_id.clone()),
              turn_stream_id: Some(context.key.scope.turn_stream_id.clone()),
              session_id: Some(context.key.scope.session_id.clone()),
          ''',
              "job turn-stream correlation",
          )

          process = Path("apps/trillionnium-owner-open-host/src/bin/r5_control_host_v7/process.rs")
          replace_once(
              process,
              '''            let decoded = decode_job_start(&frame, shell_executable)?;
              let context = decoded.context.clone();
              let result = manager
                  .start(decoded.request)
                  .map_err(|error| error.to_string())?;
          ''',
              '''            let decoded = decode_job_start(&frame, shell_executable)?;
              let context = decoded.context.clone();
              let operation_id = decoded.request.operation_id.clone();
              let result = manager
                  .start(decoded.request)
                  .map_err(|error| error.to_string())?;
          ''',
              "job.start operation capture",
          )
          replace_once(
              process,
              '''                start_payload(&result),
          ''',
              '''                start_payload(&result, &operation_id),
          ''',
              "job.start response operation",
          )
          replace_once(
              process,
              '''            let decoded = decode_job_control(&frame)?;
              let context = resolve_job_context(manager, decoded.context)?;
              let inspection = if frame.kind == FRAME_JOB_ATTACH {
          ''',
              '''            let decoded = decode_job_control(&frame)?;
              let context = resolve_job_context(manager, decoded.context)?;
              let response_attachment_id = if frame.kind == FRAME_JOB_ATTACH {
                  decoded.attachment_id.as_deref()
              } else {
                  None
              };
              let inspection = if frame.kind == FRAME_JOB_ATTACH {
          ''',
              "job.attach response identity",
          )
          replace_once(
              process,
              '''                &inspection,
                  &durable_records,
                  max_frame_bytes,
          ''',
              '''                &inspection,
                  &durable_records,
                  response_attachment_id,
                  max_frame_bytes,
          ''',
              "inspection response attachment argument",
          )
          replace_once(
              process,
              '''    inspection: &JobInspection,
              durable_records: &[Value],
              max_frame_bytes: usize,
          ) -> Result<RunTurnFrame, String> {
          ''',
              '''    inspection: &JobInspection,
              durable_records: &[Value],
              attachment_id: Option<&str>,
              max_frame_bytes: usize,
          ) -> Result<RunTurnFrame, String> {
          ''',
              "bounded inspection signature",
          )
          replace_once(
              process,
              '''            "durable_has_more": end < durable_records.len(),
              "read_only": true,
          ''',
              '''            "durable_has_more": end < durable_records.len(),
              "attachment_id": attachment_id,
              "read_only": true,
          ''',
              "inspection attachment payload",
          )
          replace_once(
              process,
              '''fn start_payload(result: &JobStartResult) -> Value {
              json!({
                  "status": match &result.disposition {
          ''',
              '''fn start_payload(result: &JobStartResult, operation_id: &str) -> Value {
              json!({
                  "status": match &result.disposition {
          ''',
              "start_payload signature",
          )
          replace_once(
              process,
              '''        "snapshot": &result.snapshot,
              "replay_status": &result.replay_status,
          ''',
              '''        "snapshot": &result.snapshot,
              "replay_status": &result.replay_status,
              "operation_id": operation_id,
          ''',
              "start_payload operation binding",
          )

          test = Path("apps/trillionnium-owner-open-host/tests/r5_jobs.rs")
          replace_once(
              test,
              '''    assert!(
                  frames
                      .iter()
                      .any(|frame| frame["kind"] == "job.start.result")
              );
          ''',
              '''    let start = frames
                  .iter()
                  .find(|frame| frame["kind"] == "job.start.result")
                  .expect("job.start.result");
              assert_eq!(start["payload"]["operation_id"], "start-job-pipe");
              assert_eq!(start["turn_stream_id"], "turn-stream-jobs");
              assert_eq!(start["session_id"], "session-jobs");
          ''',
              "job start correlation regression",
          )
          replace_once(
              test,
              '''    assert!(frames.iter().any(|frame| frame["kind"] == "job.started"));
          ''',
              '''    assert!(frames.iter().any(|frame| frame["kind"] == "job.started"));
              let control_operations = frames
                  .iter()
                  .filter(|frame| frame["kind"] == "job.control.result")
                  .filter_map(|frame| frame["payload"]["operation_id"].as_str())
                  .collect::<Vec<_>>();
              assert!(control_operations.contains(&"write-job-pipe"));
              assert!(control_operations.contains(&"close-job-pipe"));
              assert!(frames
                  .iter()
                  .filter(|frame| frame["job_id"] == "job-pipe")
                  .all(|frame| frame["turn_stream_id"] == "turn-stream-jobs"));
          ''',
              "job control correlation regression",
          )
          PY
      - name: Format and test exact Host job path
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo test --locked --package trillionnium-owner-open-host --test r5_jobs
          cargo test --locked --package trillionnium-owner-open-host --test r5_stream_flow_control
          git diff --check
      - name: Commit correlated Host source
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/trillionnium-owner-open-host/src/bin/r5_control_host_v7/wire.rs \
            apps/trillionnium-owner-open-host/src/bin/r5_control_host_v7/process.rs \
            apps/trillionnium-owner-open-host/tests/r5_jobs.rs
          git commit -m "fix(broker): preserve exact job response correlation"
          git push origin HEAD:codex/owner-open-r5-gap-closure-20260829
