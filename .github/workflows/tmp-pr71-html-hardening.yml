name: Temporary PR71 HTML authority hardening

on:
  push:
    branches:
      - codex/repository-truth-profiles-20260908

permissions:
  contents: write

concurrency:
  group: temporary-pr71-html-hardening-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply-repair:
    if: github.event.head_commit.message == 'ops: stage temporary PR71 HTML authority repair'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out staged repair subject
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: true

      - name: Verify exact inputs, apply patch, and run focused gates
        shell: bash
        run: |
          set -euo pipefail
          test "$(git --no-replace-objects rev-parse HEAD)" = "$GITHUB_SHA"
          printf '%s  %s\n' \
            '01e19791946adf52e4d4c8fea18765f2d566450e93b84933959956419420d25f' \
            'tools/docs/verify_repository_authority.py' \
            '9a07b746074773af8152caac29af4cd32365450c78db1d7c539fffc0b1d1f137' \
            'tools/tests/test_repository_authority.py' | sha256sum -c -
          git apply --check .github/temporary/pr71-html-hardening.patch
          git apply .github/temporary/pr71-html-hardening.patch
          rm .github/temporary/pr71-html-hardening.patch
          printf '%s  %s\n' \
            'aab8f4969a7e3cd4a5ed765fe6165199c87895f76f8183f4129ed9c8482c624f' \
            'tools/docs/verify_repository_authority.py' \
            '5ff6379ecc05c655da0cadf3ed28300d2e10405f6dde64c0c357af0f5b51995c' \
            'tools/tests/test_repository_authority.py' | sha256sum -c -
          python3 -m py_compile \
            tools/docs/verify_repository_authority.py \
            tools/tests/test_repository_authority.py
          python3 tools/docs/verify_repository_authority.py
          python3 -m unittest tools.tests.test_repository_authority -v
          python3 tools/docs/generate_global_docs.py --check
          python3 tools/docs/verify_global_docs.py
          git diff --check

      - name: Publish tested repair to the same PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          mapfile -t changed < <(git diff --cached --name-only)
          test "${#changed[@]}" -eq 3
          printf '%s\n' "${changed[@]}" | grep -Fxq '.github/temporary/pr71-html-hardening.patch'
          printf '%s\n' "${changed[@]}" | grep -Fxq 'tools/docs/verify_repository_authority.py'
          printf '%s\n' "${changed[@]}" | grep -Fxq 'tools/tests/test_repository_authority.py'
          git commit -m 'fix: harden repository authority HTML parsing'
          git push origin "HEAD:${GITHUB_REF_NAME}"
