name: owner-open R5 Root Linux image reproducibility

on:
  pull_request:
    paths:
      - "tools/owner-open/stage_owner_open_rootfs_payload_release.py"
      - "tools/owner-open/build_owner_open_rootfs_image_release.py"
      - "tools/owner-open/build_owner_open_rootfs_image_release_v2.py"
      - "tools/verify-owner-open-rootfs-payload-selection.py"
      - "tools/tests/test_stage_owner_open_rootfs_payload_release.py"
      - "tools/tests/test_build_owner_open_rootfs_image_release_v2.py"
      - "tools/tests/test_verify_owner_open_rootfs_payload_selection.py"
      - "docs/protocols/owner-open-rootfs-payload-staging-v1.md"
      - "docs/protocols/owner-open-rootfs-image-build-v1.md"
      - "docs/contracts/owner-open-r5-rootfs-payload-selection-v1.json"
      - ".github/workflows/owner-open-r5-rootfs-image.yml"
  push:
    branches:
      - main
      - "codex/**"
    paths:
      - "tools/owner-open/stage_owner_open_rootfs_payload_release.py"
      - "tools/owner-open/build_owner_open_rootfs_image_release.py"
      - "tools/owner-open/build_owner_open_rootfs_image_release_v2.py"
      - "tools/verify-owner-open-rootfs-payload-selection.py"
      - "tools/tests/test_stage_owner_open_rootfs_payload_release.py"
      - "tools/tests/test_build_owner_open_rootfs_image_release_v2.py"
      - "tools/tests/test_verify_owner_open_rootfs_payload_selection.py"
      - "docs/protocols/owner-open-rootfs-payload-staging-v1.md"
      - "docs/protocols/owner-open-rootfs-image-build-v1.md"
      - "docs/contracts/owner-open-r5-rootfs-payload-selection-v1.json"
      - ".github/workflows/owner-open-r5-rootfs-image.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: owner-open-r5-rootfs-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  payload-and-image-source:
    name: Root Linux staging and reproducible image process fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact source-head checkout
        env:
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git --no-replace-objects rev-parse HEAD)" = "$SOURCE_HEAD_SHA"
          test -n "$(git --no-replace-objects rev-parse HEAD^{tree})"
          test -z "$(git --no-replace-objects status --porcelain=v1 --untracked-files=all)"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Parse selection and compile selected source
        run: |
          python3 -m json.tool docs/contracts/owner-open-r5-rootfs-payload-selection-v1.json >/dev/null
          python3 -m py_compile \
            tools/owner-open/stage_owner_open_rootfs_payload_release.py \
            tools/owner-open/build_owner_open_rootfs_image_release.py \
            tools/owner-open/build_owner_open_rootfs_image_release_v2.py \
            tools/verify-owner-open-rootfs-payload-selection.py \
            tools/tests/test_stage_owner_open_rootfs_payload_release.py \
            tools/tests/test_build_owner_open_rootfs_image_release_v2.py \
            tools/tests/test_verify_owner_open_rootfs_payload_selection.py
      - name: Verify exact payload/image source selection
        run: |
          python3 tools/verify-owner-open-rootfs-payload-selection.py --json \
            | tee owner-open-r5-rootfs-payload-selection.json
      - name: Run payload staging tests
        env:
          PYTHONWARNINGS: error::ResourceWarning
        run: |
          python3 -m unittest \
            tools.tests.test_stage_owner_open_rootfs_payload_release \
            -v 2>&1 | tee owner-open-r5-rootfs-staging-tests.txt
      - name: Run deterministic image builder tests
        env:
          PYTHONWARNINGS: error::ResourceWarning
        run: |
          python3 -m unittest \
            tools.tests.test_build_owner_open_rootfs_image_release_v2 \
            -v 2>&1 | tee owner-open-r5-rootfs-image-tests.txt
      - name: Run source-selection tests
        run: |
          python3 -m unittest \
            tools.tests.test_verify_owner_open_rootfs_payload_selection \
            -v 2>&1 | tee owner-open-r5-rootfs-selection-tests.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: owner-open-r5-rootfs-image-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            owner-open-r5-rootfs-payload-selection.json
            owner-open-r5-rootfs-staging-tests.txt
            owner-open-r5-rootfs-image-tests.txt
            owner-open-r5-rootfs-selection-tests.txt
