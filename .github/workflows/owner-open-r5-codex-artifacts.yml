name: owner-open R5 official Codex artifacts

on:
  pull_request:
    paths:
      - "docs/contracts/owner-open-r5-codex-artifacts-v1.json"
      - "docs/status/owner-open-r5-codex-artifacts-status.json"
      - "tools/verify-owner-open-codex-artifacts.py"
      - "tools/verify-owner-open-codex-artifacts-v2.py"
      - "tools/verify-owner-open-codex-artifacts-v3.py"
      - "tools/verify-owner-open-codex-artifacts-v4.py"
      - "tools/verify-owner-open-codex-artifacts-v5.py"
      - "tools/tests/test_verify_owner_open_codex_artifacts.py"
      - "tools/tests/test_verify_owner_open_codex_artifacts_v2.py"
      - "tools/tests/test_verify_owner_open_codex_artifacts_v3.py"
      - "tools/tests/test_verify_owner_open_codex_artifacts_v4.py"
      - "tools/tests/test_verify_owner_open_codex_artifacts_v5.py"
      - ".github/workflows/owner-open-r5-codex-artifacts.yml"
  push:
    branches:
      - main
      - "codex/**"
    paths:
      - "docs/contracts/owner-open-r5-codex-artifacts-v1.json"
      - "docs/status/owner-open-r5-codex-artifacts-status.json"
      - "tools/verify-owner-open-codex-artifacts.py"
      - "tools/verify-owner-open-codex-artifacts-v2.py"
      - "tools/verify-owner-open-codex-artifacts-v3.py"
      - "tools/verify-owner-open-codex-artifacts-v4.py"
      - "tools/verify-owner-open-codex-artifacts-v5.py"
      - "tools/tests/test_verify_owner_open_codex_artifacts.py"
      - "tools/tests/test_verify_owner_open_codex_artifacts_v2.py"
      - "tools/tests/test_verify_owner_open_codex_artifacts_v3.py"
      - "tools/tests/test_verify_owner_open_codex_artifacts_v4.py"
      - "tools/tests/test_verify_owner_open_codex_artifacts_v5.py"
      - ".github/workflows/owner-open-r5-codex-artifacts.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: owner-open-r5-codex-artifacts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  official-release-artifacts:
    name: Official release bytes, package checksums, ELF identity and local CLI probe
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONWARNINGS: error::ResourceWarning
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact source-head checkout
        env:
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git --no-replace-objects rev-parse HEAD)" = "$SOURCE_HEAD_SHA"
          test -n "$(git --no-replace-objects rev-parse HEAD^{tree})"
          test -z "$(git --no-replace-objects status --porcelain=v1 --untracked-files=all)"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Compile and verify the complete artifact contract
        run: |
          set -euo pipefail
          python3 -m json.tool \
            docs/contracts/owner-open-r5-codex-artifacts-v1.json >/dev/null
          python3 -m py_compile \
            tools/verify-owner-open-codex-artifacts.py \
            tools/verify-owner-open-codex-artifacts-v2.py \
            tools/verify-owner-open-codex-artifacts-v3.py \
            tools/verify-owner-open-codex-artifacts-v4.py \
            tools/verify-owner-open-codex-artifacts-v5.py \
            tools/tests/test_verify_owner_open_codex_artifacts.py \
            tools/tests/test_verify_owner_open_codex_artifacts_v2.py \
            tools/tests/test_verify_owner_open_codex_artifacts_v3.py \
            tools/tests/test_verify_owner_open_codex_artifacts_v4.py \
            tools/tests/test_verify_owner_open_codex_artifacts_v5.py
          python3 tools/verify-owner-open-codex-artifacts-v5.py --json \
            | tee owner-open-r5-codex-artifact-source.json
      - name: Run archive, checksum, ELF, metadata and Cosign regressions
        run: |
          set -euo pipefail
          python3 -m unittest \
            tools.tests.test_verify_owner_open_codex_artifacts \
            tools.tests.test_verify_owner_open_codex_artifacts_v2 \
            tools.tests.test_verify_owner_open_codex_artifacts_v3 \
            tools.tests.test_verify_owner_open_codex_artifacts_v4 \
            tools.tests.test_verify_owner_open_codex_artifacts_v5 \
            -v 2>&1 | tee owner-open-r5-codex-artifact-tests.txt
      - name: Download exact upstream release metadata
        run: |
          set -euo pipefail
          release_api="$({ python3 - <<'PY'
          import json
          from pathlib import Path
          value = json.loads(Path('docs/contracts/owner-open-r5-codex-artifacts-v1.json').read_text())
          expected = 'https://api.github.com/repos/openai/codex/releases/tags/rust-v0.150.1'
          actual = value.get('upstream', {}).get('release_api')
          if actual != expected:
              raise SystemExit('release_api is not the pinned OpenAI Codex endpoint')
          print(actual)
          PY
          } )"
          curl --proto '=https' --tlsv1.2 --fail --show-error --silent \
            --location --retry 4 --retry-all-errors --connect-timeout 20 --max-time 120 \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            --output owner-open-r5-codex-release.json \
            "$release_api"
          release_id="$({ python3 - <<'PY'
          import json
          from pathlib import Path
          value = json.loads(Path('owner-open-r5-codex-release.json').read_text())
          release_id = value.get('id')
          if not isinstance(release_id, int) or release_id <= 0:
              raise SystemExit('release ID is missing')
          print(release_id)
          PY
          } )"
          for page in 1 2; do
            curl --proto '=https' --tlsv1.2 --fail --show-error --silent \
              --location --retry 4 --retry-all-errors --connect-timeout 20 --max-time 120 \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              --output "owner-open-r5-codex-release-assets-${page}.json" \
              "https://api.github.com/repos/openai/codex/releases/${release_id}/assets?per_page=100&page=${page}"
          done
      - name: Download exact execution archives, Cosign bundles and checksum list
        run: |
          set -euo pipefail
          mkdir -m 0700 owner-open-r5-codex-assets
          python3 - <<'PY' > owner-open-r5-codex-selected-assets.tsv
          import json
          from pathlib import Path
          import re
          value = json.loads(Path('docs/contracts/owner-open-r5-codex-artifacts-v1.json').read_text())
          prefix = 'https://github.com/openai/codex/releases/download/rust-v0.150.1/'
          def validate(item):
              filename = item.get('filename')
              url = item.get('url')
              if not isinstance(filename, str) or not filename or '/' in filename or '\\' in filename:
                  raise SystemExit(f'unsafe artifact filename: {filename!r}')
              if re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9._-]*', filename) is None:
                  raise SystemExit(f'unsafe artifact filename: {filename!r}')
              if url != prefix + filename:
                  raise SystemExit(f'artifact URL is not the pinned release host/path: {url!r}')
              return filename, url
          selected = [value['checksum_list']]
          for archive in value['archives']:
              selected.extend((archive, archive['sigstore']))
          for item in selected:
              filename, url = validate(item)
              print(f"{filename}\t{url}")
          PY
          while IFS=$'\t' read -r filename url; do
            curl --proto '=https' --tlsv1.2 --fail --show-error --silent \
              --location --retry 4 --retry-all-errors --connect-timeout 20 --max-time 1200 \
              --output "owner-open-r5-codex-assets/${filename}" \
              "$url"
          done < owner-open-r5-codex-selected-assets.tsv
      - name: Bind the public checksum-list bytes
        run: |
          set -euo pipefail
          checksum=owner-open-r5-codex-assets/codex-package_SHA256SUMS
          test -f "$checksum"
          sha256sum "$checksum" | tee owner-open-r5-codex-checksum-list.sha256
          wc -c "$checksum" | tee owner-open-r5-codex-checksum-list.bytes
      - name: Verify official bytes, package metadata, Rekor binding and host CLI identity
        run: |
          set -euo pipefail
          python3 tools/verify-owner-open-codex-artifacts-v5.py \
            --asset-dir owner-open-r5-codex-assets \
            --release-json owner-open-r5-codex-release.json \
            --release-assets-json owner-open-r5-codex-release-assets-1.json \
            --release-assets-json owner-open-r5-codex-release-assets-2.json \
            --probe --json \
            | tee owner-open-r5-codex-artifact-report.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          value = json.loads(Path('owner-open-r5-codex-artifact-report.json').read_text())
          facts = value.get('facts', {})
          assert value.get('ok') is True, value
          assert facts.get('artifact_bytes_verified') is True, facts
          assert facts.get('package_checksum_binding_contract_valid') is True, facts
          assert facts.get('package_checksum_list_cross_check_passed') is True, facts
          assert facts.get('package_release_metadata_cross_check_passed') is True, facts
          assert facts.get('host_cli_identity_probe_passed') is True, facts
          assert facts.get('authenticated_codex_execution') is False, facts
          assert facts.get('same_turn_mcp_qualification') is False, facts
          assert facts.get('target_root_linux_installed') is False, facts
          assert facts.get('cryptographic_sigstore_verification') is False, facts
          assert facts.get('public_release') is False, facts
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: owner-open-r5-official-codex-artifacts-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            owner-open-r5-codex-artifact-source.json
            owner-open-r5-codex-artifact-tests.txt
            owner-open-r5-codex-release.json
            owner-open-r5-codex-release-assets-1.json
            owner-open-r5-codex-release-assets-2.json
            owner-open-r5-codex-selected-assets.tsv
            owner-open-r5-codex-artifact-report.json
            owner-open-r5-codex-checksum-list.sha256
            owner-open-r5-codex-checksum-list.bytes
            owner-open-r5-codex-assets/codex-package_SHA256SUMS
