name: TrillionniumGame workspace diagnostics v18

on:
  push:
    branches: [ci/trillionniumgame-exact-head-relay-v1]
    paths: ['.github/workflows/trillionniumgame-workspace-diagnostics-v18.yml']
  workflow_dispatch:

permissions:
  contents: read

env:
  TARGET_REPOSITORY: TrillionniumFoundation/TrillionniumGame
  EXPECTED_HEAD: df5cff4eebbc5d8e79be40d2dd646ca50b02d463

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ env.TARGET_REPOSITORY }}
          ref: ${{ env.EXPECTED_HEAD }}
          path: source
          persist-credentials: false
      - name: Install exact Rust
        run: |
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.85.1
      - name: Materialize workspace split
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root = Path('Cargo.toml')
          text = root.read_text()
          text = text.replace('  "crates/trnm-persistence-pg",\n', '')
          text = text.replace('exclude = [\n', 'exclude = [\n  "crates/trnm-persistence-pg",\n', 1)
          root.write_text(text)
          Path('crates/trnm-persistence-pg/Cargo.toml').write_text('''[package]\nname = "trnm-persistence-pg"\nversion = "0.1.0"\nedition = "2021"\nrust-version = "1.85.1"\npublish = false\n\n[dependencies]\npostgres = "0.19"\ntrnm-contracts = { path = "../trnm-contracts" }\n\n[lints.rust]\nunsafe_code = "forbid"\nmissing_debug_implementations = "deny"\nunused_must_use = "deny"\n\n[lints.clippy]\ndbg_macro = "deny"\ntodo = "deny"\nunimplemented = "deny"\nwildcard_imports = "deny"\n\n[workspace]\n''')
          Path('Cargo.lock').write_text('''# This file is automatically @generated by Cargo.\n# It is not intended for manual editing.\nversion = 4\n\n[[package]]\nname = "trnm-authority-core"\nversion = "0.1.0"\ndependencies = [\n "trnm-contracts",\n]\n\n[[package]]\nname = "trnm-canonical-core"\nversion = "0.1.0"\ndependencies = [\n "trnm-contracts",\n]\n\n[[package]]\nname = "trnm-contracts"\nversion = "0.1.0"\n\n[[package]]\nname = "trnm-persistence-core"\nversion = "0.1.0"\ndependencies = [\n "trnm-contracts",\n]\n\n[[package]]\nname = "trnm-presence-core"\nversion = "0.1.0"\ndependencies = [\n "trnm-contracts",\n]\n\n[[package]]\nname = "trnm-query-core"\nversion = "0.1.0"\ndependencies = [\n "trnm-contracts",\n]\n\n[[package]]\nname = "trnm-session-core"\nversion = "0.1.0"\ndependencies = [\n "trnm-contracts",\n]\n\n[[package]]\nname = "trnm-storage-core"\nversion = "0.1.0"\ndependencies = [\n "trnm-contracts",\n]\n\n[[package]]\nname = "trnm-token-core"\nversion = "0.1.0"\ndependencies = [\n "trnm-contracts",\n]\n\n[[package]]\nname = "trnm-transport-core"\nversion = "0.1.0"\ndependencies = [\n "trnm-contracts",\n]\n''')
          profile = '''max_width = 120\nuse_small_heuristics = "Max"\nfn_call_width = 120\narray_width = 120\nchain_width = 120\n'''
          for directory in [
              'crates/trnm-persistence-pg',
              'crates/trnm-token-jwt-adapter',
              'crates/trnm-token-jwt-adapter-gate',
              'crates/trnm-token-jwt-adapter-gate-v2',
          ]:
              Path(directory, 'rustfmt.toml').write_text(profile)
          PY
      - name: Run complete diagnostic matrix
        working-directory: source
        shell: bash
        run: |
          set +e
          mkdir -p diagnostics/formatted
          : > diagnostics/results.tsv
          run_gate() {
            label=$1; shift
            started=$(date +%s)
            "$@" > "diagnostics/${label}.log" 2>&1
            rc=$?
            ended=$(date +%s)
            printf '%s\t%s\t%s\n' "$label" "$rc" "$((ended-started))" >> diagnostics/results.tsv
            return 0
          }
          run_gate root-fmt cargo fmt --all -- --check
          run_gate root-test cargo test --workspace --all-targets --locked
          run_gate root-clippy cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo generate-lockfile --manifest-path crates/trnm-persistence-pg/Cargo.toml > diagnostics/pg-lock.log 2>&1
          run_gate pg-fmt cargo fmt --manifest-path crates/trnm-persistence-pg/Cargo.toml -- --check
          run_gate pg-test cargo test --manifest-path crates/trnm-persistence-pg/Cargo.toml --all-targets --locked
          run_gate pg-clippy cargo clippy --manifest-path crates/trnm-persistence-pg/Cargo.toml --all-targets --locked -- -D warnings
          for manifest in \
            crates/trnm-token-jwt-adapter/Cargo.toml \
            crates/trnm-token-jwt-adapter-gate/Cargo.toml \
            crates/trnm-token-jwt-adapter-gate-v2/Cargo.toml; do
            label=$(basename "$(dirname "$manifest")")
            run_gate "${label}-fmt" cargo fmt --manifest-path "$manifest" -- --check
            run_gate "${label}-test" cargo test --manifest-path "$manifest" --all-targets --locked
            run_gate "${label}-clippy" cargo clippy --manifest-path "$manifest" --all-targets --locked -- -D warnings
          done
          cp Cargo.toml Cargo.lock diagnostics/formatted/
          cp crates/trnm-persistence-pg/Cargo.toml diagnostics/formatted/pg-Cargo.toml
          find crates/trnm-persistence-pg crates/trnm-token-jwt-adapter crates/trnm-token-jwt-adapter-gate crates/trnm-token-jwt-adapter-gate-v2 \
            -name rustfmt.toml -exec cp --parents {} diagnostics/formatted/ \;
          cargo fmt --manifest-path crates/trnm-persistence-pg/Cargo.toml > diagnostics/pg-fmt-apply.log 2>&1
          for manifest in \
            crates/trnm-token-jwt-adapter/Cargo.toml \
            crates/trnm-token-jwt-adapter-gate/Cargo.toml \
            crates/trnm-token-jwt-adapter-gate-v2/Cargo.toml; do
            cargo fmt --manifest-path "$manifest" >> diagnostics/isolated-fmt-apply.log 2>&1
          done
          git diff --binary > diagnostics/formatting.patch
          git diff --name-only > diagnostics/changed-files.txt
          while IFS= read -r path; do
            [[ -z "$path" || ! -f "$path" ]] && continue
            mkdir -p "diagnostics/formatted/$(dirname "$path")"
            cp "$path" "diagnostics/formatted/$path"
          done < diagnostics/changed-files.txt
          find diagnostics -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > diagnostics/SHA256SUMS
          cat diagnostics/results.tsv
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trillionniumgame-workspace-diagnostics-v18
          path: source/diagnostics
          if-no-files-found: error
          retention-days: 30
