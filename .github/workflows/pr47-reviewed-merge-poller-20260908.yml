name: PR47 reviewed merge poller

on:
  push:
    branches:
      - ops/pr47-merge-controller-20260908
    paths:
      - .github/workflows/pr47-reviewed-merge-poller-20260908.yml

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  merge:
    name: Wait for exact current-head reviews and merge ordinarily
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ops/pr47-merge-controller-20260908
          fetch-depth: 1
          persist-credentials: true
      - name: Poll exact review and check gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: TrillionniumFoundation/trillionnium-os
          PR: "47"
          EXPECTED_HEAD: b8e875d8d01893d894ae0666db9e4efdcc106d59
          EXPECTED_BASE: 968968046d69d000f1f9fe03683e92aa7903cf99
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ops-status
          api() {
            curl --fail --silent --show-error --location \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" "$@"
          }
          for attempt in $(seq 1 24); do
            api "https://api.github.com/repos/${REPO}/pulls/${PR}" >pr.json
            if [[ "$(jq -r .merged pr.json)" == true ]]; then
              jq '{status:"ALREADY_MERGED",merged_at,merge_commit_sha,head:.head.sha,base:.base.sha}' pr.json >ops-status/result.json
              exit 0
            fi
            test "$(jq -r .state pr.json)" = open
            test "$(jq -r .head.sha pr.json)" = "$EXPECTED_HEAD"
            test "$(jq -r .base.sha pr.json)" = "$EXPECTED_BASE"
            api "https://api.github.com/repos/${REPO}/pulls/${PR}/reviews?per_page=100" >reviews.json
            api "https://api.github.com/repos/${REPO}/commits/${EXPECTED_HEAD}/check-runs?per_page=100" >checks.json
            frank=false
            tomas=false
            blockers=$(jq --arg head "$EXPECTED_HEAD" '[.[] | select(.commit_id == $head and .state == "CHANGES_REQUESTED")] | length' reviews.json)
            if jq -e --arg head "$EXPECTED_HEAD" '[.[] | select(.user.login == "Franksudoman" and .commit_id == $head)] | last | .state == "APPROVED"' reviews.json >/dev/null; then frank=true; fi
            if jq -e --arg head "$EXPECTED_HEAD" '[.[] | select(.user.login == "Tomasrgbsf" and .commit_id == $head)] | last | .state == "APPROVED"' reviews.json >/dev/null; then tomas=true; fi
            checks_ready=false
            if jq -e '(.total_count > 0) and ([.check_runs[] | select(.status != "completed")] | length == 0) and ([.check_runs[] | select((.conclusion | IN("success","neutral","skipped")) | not)] | length == 0)' checks.json >/dev/null; then checks_ready=true; fi
            required_ready=true
            for required in \
              'L1 graph, documentation, broker and MCP source closure' \
              'L1 Rust 1.93 selected Host, job, flow and recovery closure' \
              'L1 exact-source-head aggregate candidate' \
              'L1 protected-main and exact-head independent-review readiness'; do
              if ! jq -e --arg required "$required" '[.check_runs[] | select(.name == $required and .status == "completed" and .conclusion == "success")] | length > 0' checks.json >/dev/null; then required_ready=false; fi
            done
            jq -n --argjson attempt "$attempt" --argjson blockers "$blockers" --arg frank "$frank" --arg tomas "$tomas" --arg checks "$checks_ready" --arg required "$required_ready" '{status:"WAITING",attempt:$attempt,current_head_approvals:{Franksudoman:($frank=="true"),Tomasrgbsf:($tomas=="true")},current_head_changes_requested:$blockers,all_checks_terminal_green:($checks=="true"),required_contexts_green:($required=="true")}' >ops-status/result.json
            if [[ "$frank" == true && "$tomas" == true && "$blockers" == 0 && "$checks_ready" == true && "$required_ready" == true ]]; then
              payload=$(jq -n --arg sha "$EXPECTED_HEAD" '{sha:$sha,merge_method:"squash",commit_title:"docs(g1): close complete workspace component documentation coverage (#47)",commit_message:"Protected exact-head integration of complete component documentation coverage and parser hardening. No installed-target, device, destructive-fault, signing, deployment, promotion or public-release authority is granted."}')
              api --request PUT --data "$payload" "https://api.github.com/repos/${REPO}/pulls/${PR}/merge" >merge.json
              jq -e '.merged == true' merge.json >/dev/null
              jq -n --slurpfile merge merge.json --arg head "$EXPECTED_HEAD" '{status:"MERGED_BY_ORDINARY_PROTECTED_PATH",head:$head,result:$merge[0]}' >ops-status/result.json
              exit 0
            fi
            sleep 30
          done
          jq '.status="NOT_MERGED_TIMEOUT_FAIL_CLOSED"' ops-status/result.json >ops-status/result.tmp
          mv ops-status/result.tmp ops-status/result.json
          exit 1
      - name: Persist terminal decision
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f ops-status/result.json || jq -n --arg run "$GITHUB_RUN_ID" '{status:"CONTROLLER_FAILED_BEFORE_STATUS",run_id:$run}' >ops-status/result.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ops-status/result.json
          git diff --cached --quiet && exit 0
          git commit -m 'ops: record terminal PR47 merge poller decision'
          git push origin HEAD:refs/heads/ops/pr47-merge-controller-20260908
