name: Temporary human-race v2 review route r2

on:
  push:
    branches:
      - ops/human-race-v2-review-route-r2-20260911

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  route:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      HEAD_BRANCH: codex/source-qualification-observation-races-v2-human-20260911
    steps:
      - name: Route fresh reviewers after delayed relay
        shell: bash
        run: |
          set -euo pipefail
          number="$(gh pr list --repo "$REPOSITORY" --state open --head "$HEAD_BRANCH" --json number --jq 'if length == 1 then .[0].number else empty end')"
          [[ -n "$number" ]] || { printf 'v2 PR absent\n'; exit 0; }
          gh api --method POST "repos/${REPOSITORY}/pulls/${number}/requested_reviewers" \
            -f 'reviewers[]=Tomasrgbsf' -f 'reviewers[]=Franksudoman' >/dev/null
          test "$(gh pr view "$number" --repo "$REPOSITORY" --json isDraft --jq '.isDraft')" = false
          gh pr merge "$number" --repo "$REPOSITORY" --auto --merge || printf 'auto-merge held\n'
          gh issue comment 51 --repo "$REPOSITORY" --body "Delayed route bound observation-race v2 PR #${number} to both fresh non-author reviewers and ordinary auto-merge. Branch protection remains authoritative."
