name: G1 independent review request v8

"on":
  push:
    branches:
      - ops/g1-synthetic-retirement-fix-20260906
  workflow_dispatch:

permissions:
  contents: read
  checks: read
  pull-requests: write

concurrency:
  group: g1-independent-review-request-v8
  cancel-in-progress: false

jobs:
  request:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Request non-author CODEOWNER review only after strict green head
        shell: bash
        env:
          G1_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: "41"
          TARGET_BRANCH: codex/g1-all-gap-closure-20260904
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${REPOSITORY}"
          auth=(-H "Authorization: Bearer ${G1_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28')
          pr="$(curl --fail --silent --show-error "${auth[@]}" "${api}/pulls/${PR_NUMBER}")"
          export PR_JSON="$pr"
          readarray -t identity < <(python3 - <<'PY'
          import json, os
          p=json.loads(os.environ['PR_JSON'])
          print(p['head']['sha'])
          print(p['user']['login'])
          print(p['state'])
          print('true' if p['draft'] else 'false')
          PY
          )
          head="${identity[0]}"; author="${identity[1]}"; state="${identity[2]}"; draft="${identity[3]}"
          [[ "$state" == open && "$draft" == false ]] || exit 0
          checks="$(curl --fail --silent --show-error "${auth[@]}" "${api}/commits/${head}/check-runs?per_page=100")"
          export CHECKS_JSON="$checks"
          python3 - <<'PY'
          import json, os
          c=json.loads(os.environ['CHECKS_JSON']).get('check_runs',[])
          if not c or not all(x.get('status')=='completed' and x.get('conclusion') in {'success','neutral','skipped'} for x in c):
              raise SystemExit(1)
          PY
          git fetch --no-tags origin "+refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git --no-replace-objects rev-parse "refs/remotes/origin/${TARGET_BRANCH}^{commit}")" = "$head"
          export HEAD_SHA="$head" AUTHOR="$author"
          payload="$(python3 - <<'PY'
          import json, os, re, subprocess
          head=os.environ['HEAD_SHA']; author=os.environ['AUTHOR'].lower()
          raw=''
          for path in ('.github/CODEOWNERS','CODEOWNERS','docs/CODEOWNERS'):
              p=subprocess.run(['git','--no-replace-objects','show',f'{head}:{path}'],stdout=subprocess.PIPE,stderr=subprocess.DEVNULL)
              if p.returncode==0:
                  raw=p.stdout.decode('utf-8','replace'); break
          users=[]; teams=[]
          for line in raw.splitlines():
              line=line.split('#',1)[0]
              for token in line.split()[1:]:
                  if not token.startswith('@'): continue
                  owner=token[1:]
                  if '/' in owner:
                      org,slug=owner.split('/',1)
                      if org.lower()=='trillionniumfoundation' and re.fullmatch(r'[A-Za-z0-9_.-]+',slug): teams.append(slug)
                  elif owner.lower()!=author and re.fullmatch(r'[A-Za-z0-9_.-]+',owner) and not owner.lower().endswith('[bot]'):
                      users.append(owner)
          value={'reviewers':sorted(set(users))[:15],'team_reviewers':sorted(set(teams))[:15]}
          print(json.dumps(value,separators=(',',':')))
          PY
          )"
          export REVIEW_PAYLOAD="$payload"
          count="$(python3 - <<'PY'
          import json, os
          p=json.loads(os.environ['REVIEW_PAYLOAD'])
          print(len(p['reviewers'])+len(p['team_reviewers']))
          PY
          )"
          [[ "$count" -gt 0 ]] || exit 0
          curl --fail --silent --show-error -X POST "${auth[@]}" \
            -H 'Content-Type: application/json' \
            "${api}/pulls/${PR_NUMBER}/requested_reviewers" --data "$payload" > /dev/null
          unset G1_TOKEN PR_JSON CHECKS_JSON REVIEW_PAYLOAD payload
