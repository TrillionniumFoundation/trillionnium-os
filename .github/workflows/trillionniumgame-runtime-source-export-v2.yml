# exact-target: a6c463d830e4410c727290cd3addd9c18da8bcc6
name: TrillionniumGame runtime source export v2

on:
  push:
    branches: [ci/trillionniumgame-exact-head-relay-v1]
    paths: ['.github/workflows/trillionniumgame-runtime-source-export-v2.yml']
  workflow_dispatch:

permissions:
  contents: read

env:
  TARGET_REPOSITORY: TrillionniumFoundation/TrillionniumGame
  EXPECTED_HEAD: a6c463d830e4410c727290cd3addd9c18da8bcc6

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact target
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ env.TARGET_REPOSITORY }}
          ref: ${{ env.EXPECTED_HEAD }}
          path: source
          fetch-depth: 1
          persist-credentials: false
      - name: Seal source identity
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          mkdir -p exact-source
          cp -R runtime contracts docs deploy compose.yaml exact-source/
          git rev-parse HEAD > exact-source/commit.txt
          find exact-source -type f ! -name SHA256SUMS -print0 \
            | sort -z | xargs -0 sha256sum > exact-source/SHA256SUMS
      - name: Upload exact source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trillionniumgame-runtime-source-${{ env.EXPECTED_HEAD }}
          path: source/exact-source
          if-no-files-found: error
          retention-days: 30
