name: Temporary executable module-contract v3 main preflight v4

on:
  push:
    branches:
      - ops/module-contracts-v3-final-qualifier-20260910

permissions:
  contents: write

concurrency:
  group: temporary-module-contracts-v3-main-preflight-v4
  cancel-in-progress: true

jobs:
  generate-qualify-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Check out exact controller
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: true

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"

      - name: Set up Rust 1.93
        uses: dtolnay/rust-toolchain@d8dfd7155fea72af4ad34a8fe97364d210e2d020
        with:
          toolchain: "1.93.0"
          components: rustfmt,clippy

      - name: Generate, qualify and publish exact main-based candidate
        shell: bash
        run: bash ops/module-contracts-v3-main-preflight-v4.sh

      - name: Upload non-authorizing qualification receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: module-contract-v3-main-preflight-v4-${{ github.sha }}
          path: |
            ${{ runner.temp }}/module-contract-v3-candidate.env
            ${{ runner.temp }}/module-contract-schemars.json
          if-no-files-found: error
          retention-days: 7
