name: G1 force-cancel proven-stale source queues v18

on:
  push:
    branches: [ops/g1-exact-source-recover-v13-20260906]
    paths: [.github/workflows/g1-force-cancel-stale-source-queues-v18.yml]

permissions:
  actions: write
  contents: read
  pull-requests: read

concurrency:
  group: g1-force-cancel-proven-stale-source-queues-v18
  cancel-in-progress: false

env:
  REPOSITORY: TrillionniumFoundation/trillionnium-os
  CURRENT_BRANCH: codex/g1-all-gap-closure-20260904
  CURRENT_HEAD: 4b9af095813df1a83b65d029d061d889b882d5e7

jobs:
  cancel:
    name: Force-cancel only stale queued source runs after exact identity checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Select and force-cancel only proven stale runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          api="https://api.github.com/repos/${REPOSITORY}"
          headers=(
            -H "Authorization: Bearer ${GH_TOKEN}"
            -H 'Accept: application/vnd.github+json'
            -H 'X-GitHub-Api-Version: 2022-11-28'
          )
          get() {
            /usr/bin/curl --fail-with-body --silent --show-error --proto '=https' --tlsv1.2 \
              "${headers[@]}" "$1"
          }
          get "${api}/git/ref/heads/${CURRENT_BRANCH}" > "$RUNNER_TEMP/ref.json"
          get "${api}/pulls/41" > "$RUNNER_TEMP/pr.json"
          get "${api}/actions/runs?status=queued&per_page=100" > "$RUNNER_TEMP/queued.json"
          /usr/bin/python3 -I - "$RUNNER_TEMP/ref.json" "$RUNNER_TEMP/pr.json" "$RUNNER_TEMP/queued.json" "$RUNNER_TEMP/selected.json" <<'PY'
          import json, os, sys
          from pathlib import Path
          ref, pr, queued = [json.loads(Path(p).read_text()) for p in sys.argv[1:4]]
          current = os.environ["CURRENT_HEAD"]
          assert ref["object"]["sha"] == current
          assert pr["state"] == "open" and pr["draft"] is True
          assert pr["head"]["sha"] == current
          retired_prefixes = (
              "codex/g1-live-consolidation",
              "ops/g1-synthetic-retirement-fix-",
              "ops/g1-job-startup-prtarget-trigger-",
              "ops/g1-job-startup-validation-",
          )
          selected = []
          for run in queued.get("workflow_runs", []):
              branch = run.get("head_branch") or ""
              sha = run.get("head_sha") or ""
              stale = (branch == os.environ["CURRENT_BRANCH"] and sha != current) or branch.startswith(retired_prefixes)
              if not stale:
                  continue
              assert run["status"] == "queued" and sha != current
              lowered = (run.get("name") or "").lower()
              for forbidden in ("target evidence", "physical", "destructive", "signed public release"):
                  assert forbidden not in lowered
              selected.append({"id": run["id"], "name": run["name"], "branch": branch, "sha": sha})
          Path(sys.argv[4]).write_text(json.dumps(selected, sort_keys=True))
          print(json.dumps({"selected_count": len(selected), "selected": selected}, sort_keys=True))
          PY
          /usr/bin/python3 -I - "$RUNNER_TEMP/selected.json" > "$RUNNER_TEMP/ids" <<'PY'
          import json, sys
          from pathlib import Path
          for item in json.loads(Path(sys.argv[1]).read_text()):
              print(item["id"])
          PY
          : > "$RUNNER_TEMP/results.jsonl"
          while IFS= read -r run_id; do
            test -n "$run_id" || continue
            get "${api}/actions/runs/${run_id}" > "$RUNNER_TEMP/before-${run_id}.json"
            /usr/bin/python3 -I - "$RUNNER_TEMP/before-${run_id}.json" <<'PY'
          import json, os, sys
          from pathlib import Path
          run = json.loads(Path(sys.argv[1]).read_text())
          assert run["status"] == "queued"
          assert run["head_sha"] != os.environ["CURRENT_HEAD"]
          PY
            code="$(/usr/bin/curl --silent --show-error --proto '=https' --tlsv1.2 \
              "${headers[@]}" --request POST --output "$RUNNER_TEMP/force-${run_id}.json" \
              --write-out '%{http_code}' "${api}/actions/runs/${run_id}/force-cancel")"
            test "$code" = 202 || test "$code" = 409
            printf '{"run_id":%s,"http_status":%s}\n' "$run_id" "$code" >> "$RUNNER_TEMP/results.jsonl"
          done < "$RUNNER_TEMP/ids"
          /usr/bin/python3 -I - "$RUNNER_TEMP/selected.json" "$RUNNER_TEMP/results.jsonl" > "$RUNNER_TEMP/receipt.json" <<'PY'
          import json, os, sys
          from pathlib import Path
          selected = json.loads(Path(sys.argv[1]).read_text())
          results = [json.loads(line) for line in Path(sys.argv[2]).read_text().splitlines() if line]
          assert len(selected) == len(results)
          print(json.dumps({
              "schema": "org.trillionnium.g1-proven-stale-force-cancel.v1",
              "repository": os.environ["REPOSITORY"],
              "current_head": os.environ["CURRENT_HEAD"],
              "selected": selected,
              "results": results,
              "current_exact_head_touched": False,
              "target_or_external_evidence_run_touched": False,
              "administrator_bypass": False,
              "public_release": False,
          }, sort_keys=True))
          PY
          cat "$RUNNER_TEMP/receipt.json"

      - name: Retain bounded force-cancel receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: g1-proven-stale-force-cancel-v18
          path: ${{ runner.temp }}/receipt.json
          if-no-files-found: error
          retention-days: 7
