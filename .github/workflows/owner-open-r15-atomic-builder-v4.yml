name: Owner-Open R15 atomic source builder v11
on:
  push:
    branches: [ops/owner-open-r15-atomic-builder-20260831-v11]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@d8dfd7155fea72af4ad34a8fe97364d210e2d020
        with:
          toolchain: "1.93.0"
          components: rustfmt, clippy
      - shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "ops/owner-open-r15-atomic-builder-20260831-v11"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          cat .github/owner-open-r15-runtime-hardening.patch.gz.* > /tmp/r15.patch.gz
          echo 'f30cd81483225ebda3192aa8e7ce29a194e1086d290e2a8aae915e1bc5462ae3  /tmp/r15.patch.gz' | sha256sum -c -
          gzip -dc .github/owner-open-r15-builder.sh.gz > /tmp/r15-builder.sh
          cp .github/owner-open-r15-contract-fix-v11.py /tmp/r15-contract-fix.py
          python3 -m py_compile /tmp/r15-contract-fix.py
          python3 - <<'PY'
          from pathlib import Path

          path = Path("/tmp/r15-builder.sh")
          text = path.read_text()
          app_anchor = (
              ".github/workflows/owner-open-r15-runtime-hardening.yml\n"
              "apps/trillionnium-owner-open-host/src/bin/r5_control_host_v6/entry.rs\n"
          )
          app_replacement = (
              ".github/workflows/owner-open-r15-runtime-hardening.yml\n"
              "apps/trillionnium-agent-privilege-broker/src/"
              "linux_provider_post_exec_test_kernel.rs\n"
              "apps/trillionnium-owner-open-host/src/bin/r5_control_host_v6/entry.rs\n"
              "apps/trillionniumd/src/main.rs\n"
          )
          crate_anchor = (
              "crates/trillionnium-owner-open-runtime/src/types.rs\n"
              "docs/protocols/owner-open-jobs-v1.md\n"
          )
          crate_replacement = (
              "crates/trillionnium-owner-open-runtime/src/types.rs\n"
              "crates/trillionnium-shell-exec/src/durable.rs\n"
              "docs/protocols/owner-open-jobs-v1.md\n"
          )
          apply_anchor = 'git apply --index --whitespace=error "$PATCH"\n'
          if text.count(app_anchor) != 1:
              raise SystemExit("R15 app expected-path anchor is not exact")
          if text.count(crate_anchor) != 1:
              raise SystemExit("R15 crate expected-path anchor is not exact")
          if text.count(apply_anchor) != 1:
              raise SystemExit("R15 builder apply anchor is not exact")
          text = text.replace(app_anchor, app_replacement, 1)
          text = text.replace(crate_anchor, crate_replacement, 1)
          text = text.replace(
              apply_anchor,
              apply_anchor
              + "python3 /tmp/r15-contract-fix.py\n"
              + "git add "
              + "apps/trillionnium-agent-privilege-broker/src/"
              + "linux_provider_post_exec_test_kernel.rs "
              + "apps/trillionniumd/src/main.rs "
              + "crates/trillionnium-owner-open-job-runtime/tests/runtime.rs "
              + "crates/trillionnium-shell-exec/src/durable.rs\n",
              1,
          )
          path.write_text(text)
          PY
          chmod 700 /tmp/r15-builder.sh
          /tmp/r15-builder.sh /tmp/r15.patch.gz
