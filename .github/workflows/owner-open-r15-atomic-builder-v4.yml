name: Owner-Open R15 atomic source builder v5
on:
  push:
    branches: [ops/owner-open-r15-atomic-builder-20260831-v5]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@d8dfd7155fea72af4ad34a8fe97364d210e2d020
        with:
          toolchain: "1.93.0"
          components: rustfmt, clippy
      - shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "ops/owner-open-r15-atomic-builder-20260831-v5"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          cat .github/owner-open-r15-runtime-hardening.patch.gz.* > /tmp/r15.patch.gz
          echo 'f30cd81483225ebda3192aa8e7ce29a194e1086d290e2a8aae915e1bc5462ae3  /tmp/r15.patch.gz' | sha256sum -c -
          gzip -dc .github/owner-open-r15-builder.sh.gz > /tmp/r15-builder.sh
          cat > /tmp/r15-contract-fix.py <<'PY'
          from pathlib import Path

          path = Path("crates/trillionnium-owner-open-job-runtime/tests/runtime.rs")
          text = path.read_text()
          start_marker = "#[test]\nfn configured_unavailable_journal_is_unknown_and_never_dispatched() {"
          end_marker = "\n#[test]\nfn capacity_rejection_happens_before_spawn_or_visible_side_effect() {"
          if text.count(start_marker) != 1 or text.count(end_marker) != 1:
              raise SystemExit("R15 journal-unavailable test markers are not exact")
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          replacement = r'''#[test]
          fn configured_unavailable_journal_is_rejected_before_dispatch() {
              let directory = tempfile::tempdir().unwrap();
              let journal_path = directory.path().join("jobs.jsonl");
              let held = JobJournal::open_best_effort(Some(&journal_path));
              assert_eq!(held.status().unwrap(), JournalStatus::Durable);
              let manager = JobManager::open(JobRuntimeConfig::default(), Some(&journal_path)).unwrap();
              assert!(matches!(
                  manager.journal().status().unwrap(),
                  JournalStatus::Unavailable { .. }
              ));
              let marker = directory.path().join("must-not-run-unavailable");
              let error = manager
                  .start(start_request(
                      key("job-unavailable"),
                      request('f', "pipe"),
                      "start-unavailable",
                      format!("touch '{}'", marker.display()),
                      None,
                  ))
                  .unwrap_err();
              assert!(matches!(
                  error,
                  trillionnium_owner_open_job_runtime::JobRuntimeError::Journal(message)
                      if message == "job journal is unavailable and unjournaled effects are disabled"
              ));
              assert!(!marker.exists());
          }
          '''
          path.write_text(text[:start] + replacement + text[end:])
          PY
          python3 -m py_compile /tmp/r15-contract-fix.py
          python3 - <<'PY'
          from pathlib import Path

          path = Path("/tmp/r15-builder.sh")
          text = path.read_text()
          anchor = 'git apply --index --whitespace=error "$PATCH"\n'
          if text.count(anchor) != 1:
              raise SystemExit("R15 builder apply anchor is not exact")
          injected = (
              anchor
              + "python3 /tmp/r15-contract-fix.py\n"
              + "git add crates/trillionnium-owner-open-job-runtime/tests/runtime.rs\n"
          )
          path.write_text(text.replace(anchor, injected, 1))
          PY
          chmod 700 /tmp/r15-builder.sh
          /tmp/r15-builder.sh /tmp/r15.patch.gz
