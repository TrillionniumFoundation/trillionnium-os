name: Owner-Open R15 atomic source builder v4
on:
  push:
    branches: [ops/owner-open-r15-atomic-builder-20260831-v4]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@d8dfd7155fea72af4ad34a8fe97364d210e2d020
        with:
          toolchain: "1.93.0"
          components: rustfmt, clippy
      - shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "ops/owner-open-r15-atomic-builder-20260831-v4"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          cat .github/owner-open-r15-runtime-hardening.patch.gz.* > /tmp/r15.patch.gz
          echo 'f30cd81483225ebda3192aa8e7ce29a194e1086d290e2a8aae915e1bc5462ae3  /tmp/r15.patch.gz' | sha256sum -c -
          gzip -dc .github/owner-open-r15-builder.sh.gz > /tmp/r15-builder.sh
          chmod 700 /tmp/r15-builder.sh
          /tmp/r15-builder.sh /tmp/r15.patch.gz
