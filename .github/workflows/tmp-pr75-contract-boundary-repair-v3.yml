name: Temporary PR75 contract-boundary repair v3

on:
  push:
    branches:
      - ops/pr75-contract-boundary-repair-v3-20260910

permissions:
  contents: write

concurrency:
  group: pr75-contract-boundary-repair-v3
  cancel-in-progress: false

jobs:
  repair-qualify-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      TARGET_BRANCH: codex/executable-module-contracts-v3-main-20260910
      TARGET_HEAD: e84227a9cce92bcda45e66c9e9060036f424c4cd
      TARGET_BASE: b681cd856fccac1189496576f25d259752d2dcce
      CHECKER_SHA256: 1c8be47df5b6361b391cfb29d04cd3897fb1394e2115becf6fa5298ed8fe210a
      CHECKER_ZLIB_B64: 
      PYTHONDONTWRITEBYTECODE: "1"
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out immutable repair controller
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          ref: ${{ github.sha }}
          path: controller
          persist-credentials: false

      - name: Check out exact PR candidate with publication credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ env.TARGET_BRANCH }}
          path: candidate
          persist-credentials: true

      - name: Assert exact immutable input tuple
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git --no-replace-objects rev-parse HEAD)" = "$TARGET_HEAD"
          test "$(git --no-replace-objects rev-parse HEAD^)" = "$TARGET_BASE"
          test "$(git --no-replace-objects rev-parse origin/main)" = "$TARGET_BASE"
          test -z "$(git status --porcelain=v1 --untracked-files=all --ignore-submodules=none)"

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"

      - name: Set up Rust 1.93
        uses: dtolnay/rust-toolchain@d8dfd7155fea72af4ad34a8fe97364d210e2d020
        with:
          toolchain: "1.93.0"
          components: rustfmt,clippy

      - name: Extract reviewed patcher and repair escaped checker embedding
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import hashlib
          import os
          from pathlib import Path
          import re
          import zlib

          workflow = Path("controller/.github/workflows/tmp-pr75-contract-boundary-repair-v1.yml")
          text = workflow.read_text(encoding="utf-8")
          match = re.search(
              r"(?ms)^      PATCH_ZLIB_B64: \|\n(?P<body>(?:          [A-Za-z0-9+/=]+\n)+)",
              text,
          )
          if match is None:
              raise SystemExit("reviewed repair payload block not found")
          encoded = "".join(line.strip() for line in match.group("body").splitlines())
          patcher = zlib.decompress(base64.b64decode(encoded, validate=True))
          patcher_path = Path(os.environ["RUNNER_TEMP"]) / "repair_pr75_contract_boundaries.py"
          patcher_path.write_bytes(patcher)
          patcher_path.chmod(0o700)

          checker = zlib.decompress(
              base64.b64decode(os.environ["CHECKER_ZLIB_B64"], validate=True)
          )
          if hashlib.sha256(checker).hexdigest() != os.environ["CHECKER_SHA256"]:
              raise SystemExit("exact checker payload digest differs")
          checker_path = Path(os.environ["RUNNER_TEMP"]) / "check_module_contract_compatibility.py"
          checker_path.write_bytes(checker)
          checker_path.chmod(0o700)
          print(f"reviewed_patcher_bytes={len(patcher)} exact_checker_bytes={len(checker)}")
          PY
          python3 "$RUNNER_TEMP/repair_pr75_contract_boundaries.py" "$GITHUB_WORKSPACE/candidate"
          python3 - <<'PY'
          import os
          from pathlib import Path

          root = Path(os.environ["GITHUB_WORKSPACE"]) / "candidate"
          generator = root / "tools/contracts/generate_module_contracts.py"
          checker = (Path(os.environ["RUNNER_TEMP"]) / "check_module_contract_compatibility.py").read_bytes()
          text = generator.read_text(encoding="utf-8")
          start = "def compatibility_checker_source() -> bytes:\n"
          end = "\n\ndef contract_readme() -> bytes:\n"
          first = text.find(start)
          last = text.find(end, first)
          if first < 0 or last < 0:
              raise SystemExit("compatibility checker generator boundaries differ")
          replacement = start + "    return " + repr(checker) + "\n"
          generator.write_text(text[:first] + replacement + text[last:], encoding="utf-8")
          PY
          cd "$GITHUB_WORKSPACE/candidate"
          python3 -m py_compile \
            tools/contracts/generate_module_contracts.py \
            tools/contracts/check_module_contract_compatibility.py \
            android-integration/module-contracts/verify_vectors.py \
            tools/tests/test_module_contracts.py

      - name: Generate and verify exact shared contracts
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/contracts/generate_module_contracts.py --write
          test "$(python3 - <<'PY'
          from pathlib import Path
          print(Path('tools/contracts/check_module_contract_compatibility.py').read_bytes().count(b'\0'))
          PY
          )" = 0
          python3 -m py_compile tools/contracts/check_module_contract_compatibility.py
          cmp --silent \
            tools/contracts/check_module_contract_compatibility.py \
            "$RUNNER_TEMP/check_module_contract_compatibility.py"
          python3 tools/contracts/generate_module_contracts.py --check
          python3 tools/contracts/generate_module_contracts.py --verify
          python3 tools/contracts/check_module_contract_compatibility.py --base-ref origin/main
          python3 android-integration/module-contracts/verify_vectors.py
          python3 -m unittest tools.tests.test_module_contracts -v

      - name: Execute global documentation and complete Python matrix
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/docs/generate_global_docs.py --check
          python3 tools/docs/verify_global_docs.py
          python3 tools/docs/verify_repository_authority.py
          python3 -m unittest discover -s tools/tests -p 'test*.py' -v

      - name: Execute locked Rust and planned matrices
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo test --locked --workspace --all-targets
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo fmt --manifest-path planned/Cargo.toml --all -- --check
          cargo test --locked --manifest-path planned/Cargo.toml --workspace --all-targets
          cargo clippy --locked --manifest-path planned/Cargo.toml --workspace --all-targets -- -D warnings

      - name: Publish exact fast-forward repair commit
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git --no-replace-objects rev-parse HEAD)" = "$TARGET_HEAD"
          test "$(git --no-replace-objects rev-parse HEAD^)" = "$TARGET_BASE"
          test -z "$(git diff --name-only -- 'ops/**' '.github/workflows/tmp-*')"
          git diff --check
          git config user.name 'Qian QI'
          git config user.email '102159240+ProfHepta@users.noreply.github.com'
          git add -A
          test -n "$(git diff --cached --name-only)"
          test -z "$(git diff --cached --name-only | grep -E '^(ops/|\.github/workflows/tmp-)' || true)"
          git diff --cached --check
          git commit \
            -m 'fix(contracts): close reviewed parser and compatibility boundaries' \
            -m 'Fail closed on unresolved base refs, preserve annotation-named schema properties, reject exponent overflow, and enforce one UTF-8 byte/control domain across Python, Rust and Android vectors. Preserve automatic_redispatch=false and the L1-only claim ceiling.'
          final="$(git --no-replace-objects rev-parse HEAD)"
          test "$(git --no-replace-objects rev-parse HEAD^)" = "$TARGET_HEAD"
          git push --force-with-lease="refs/heads/$TARGET_BRANCH:$TARGET_HEAD" \
            origin "HEAD:refs/heads/$TARGET_BRANCH"
          printf 'published_head=%s\n' "$final"
