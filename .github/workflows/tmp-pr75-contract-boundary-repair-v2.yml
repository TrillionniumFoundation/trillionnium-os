name: Temporary PR75 contract-boundary repair v2

on:
  push:
    branches:
      - ops/pr75-contract-boundary-repair-v2-20260910

permissions:
  contents: write

concurrency:
  group: temporary-pr75-contract-boundary-repair-v2
  cancel-in-progress: true

env:
  PR_HEAD_SHA: e84227a9cce92bcda45e66c9e9060036f424c4cd
  BASE_SHA: b681cd856fccac1189496576f25d259752d2dcce
  TARGET_BRANCH: codex/executable-module-contracts-v3-main-20260910
  PATCH_XZ_SHA256: d1f503d73563c6969d13c8e5a1850e0b9d892cd6db4a23d0f9d006eef3cefcb0
  PATCH_SHA256: ce75b6a01bde14b56a6a74c445a3d1774c6968e665504ac1767a2fc4f23e47af
  PYTHONDONTWRITEBYTECODE: "1"
  CARGO_TERM_COLOR: always

jobs:
  repair-qualify-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out immutable repair controller
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: true

      - name: Authenticate controller and recover patcher
        shell: bash
        run: |
          set -euo pipefail
          test "$(git --no-replace-objects rev-parse HEAD^)" = "$PR_HEAD_SHA"
          observed="$(git --no-replace-objects diff --name-only "$PR_HEAD_SHA"...HEAD | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/tmp-pr75-contract-boundary-repair-v2.yml' \
            'ops/patch_pr75_contract_boundaries.py.xz' | LC_ALL=C sort)"
          test "$observed" = "$expected"
          cp -- ops/patch_pr75_contract_boundaries.py.xz "${RUNNER_TEMP:?}/patch.py.xz"
          printf '%s  %s\n' "$PATCH_XZ_SHA256" "${RUNNER_TEMP:?}/patch.py.xz" | sha256sum --check --strict
          xz --decompress --stdout -- "${RUNNER_TEMP:?}/patch.py.xz" > "${RUNNER_TEMP:?}/patch.py"
          printf '%s  %s\n' "$PATCH_SHA256" "${RUNNER_TEMP:?}/patch.py" | sha256sum --check --strict
          PATCH_PATH="${RUNNER_TEMP:?}/patch.py" python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path(os.environ["PATCH_PATH"])
          text = path.read_text(encoding="utf-8")
          old = 'listing.stdout.split(b"\\\\0")'
          new = 'listing.stdout.split(b"\\\\\\\\0")'
          if text.count(old) != 1:
              raise SystemExit(f"patcher NUL-escape anchor count differs: {text.count(old)}")
          text = text.replace(old, new, 1)
          if old in text or text.count(new) != 1:
              raise SystemExit("patcher NUL-escape transform is not exact")
          path.write_text(text, encoding="utf-8")
          PY
          python3 -m py_compile "${RUNNER_TEMP:?}/patch.py"
          sha256sum "${RUNNER_TEMP:?}/patch.py"

      - name: Install declared source-test tools
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/sudo /usr/bin/apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          /usr/bin/sudo /usr/bin/apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install --yes --no-install-recommends acl

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"

      - name: Set up Rust 1.93
        uses: dtolnay/rust-toolchain@d8dfd7155fea72af4ad34a8fe97364d210e2d020
        with:
          toolchain: "1.93.0"
          components: rustfmt,clippy

      - name: Apply four fail-closed contract-boundary repairs
        shell: bash
        run: |
          set -euo pipefail
          git --no-replace-objects checkout --detach "$PR_HEAD_SHA"
          test "$(git --no-replace-objects rev-parse HEAD^)" = "$BASE_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all --ignore-submodules=none)"
          python3 "${RUNNER_TEMP:?}/patch.py"
          python3 -m py_compile \
            tools/contracts/generate_module_contracts.py \
            tools/tests/test_module_contracts.py
          git diff --check

      - name: Regenerate and verify every executable contract
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/contracts/generate_module_contracts.py --write
          python3 -m py_compile \
            tools/contracts/check_module_contract_compatibility.py \
            android-integration/module-contracts/verify_vectors.py
          python3 tools/contracts/generate_module_contracts.py --check
          python3 tools/contracts/generate_module_contracts.py --verify
          python3 tools/contracts/check_module_contract_compatibility.py --base-ref "$BASE_SHA"
          if python3 tools/contracts/check_module_contract_compatibility.py --base-ref does-not-exist-review-fixture; then
            printf '%s\n' 'unresolved compatibility base was accepted' >&2
            exit 1
          fi
          python3 android-integration/module-contracts/verify_vectors.py
          python3 -m unittest tools.tests.test_module_contracts -v
          cargo fmt --all -- --check
          cargo test --locked -p trillionnium-owner-open-types --all-targets
          cargo clippy --locked -p trillionnium-owner-open-types --all-targets -- -D warnings
          git diff --check

      - name: Run complete repository and planned-workspace matrix
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/docs/generate_global_docs.py --check
          python3 tools/docs/verify_global_docs.py
          python3 tools/docs/verify_repository_authority.py
          python3 -m unittest discover -s tools/tests -p 'test*.py' -v
          cargo fmt --all -- --check
          cargo test --locked --all-targets
          cargo clippy --locked --all-targets -- -D warnings
          cargo fmt --manifest-path planned/Cargo.toml --all -- --check
          cargo test --locked --manifest-path planned/Cargo.toml --workspace --all-targets
          cargo clippy --locked --manifest-path planned/Cargo.toml --workspace --all-targets -- -D warnings
          git diff --check

      - name: Publish repaired exact head through immutable branch lease
        shell: bash
        run: |
          set -euo pipefail
          test "$(git --no-replace-objects rev-parse HEAD)" = "$PR_HEAD_SHA"
          test "$(git --no-replace-objects rev-parse HEAD^)" = "$BASE_SHA"
          test ! -e ops/patch_pr75_contract_boundaries.py.xz
          test ! -e .github/workflows/tmp-pr75-contract-boundary-repair-v2.yml
          git config user.name 'Qian QI'
          git config user.email '102159240+ProfHepta@users.noreply.github.com'
          git add -A
          test -n "$(git diff --cached --name-only)"
          if git diff --cached --name-only | grep -E '^(ops/|\.github/workflows/tmp-)'; then
            printf '%s\n' 'temporary controller path leaked into candidate' >&2
            exit 1
          fi
          git diff --cached --check
          git commit \
            -m 'fix(contracts): close parser fingerprint and UTF-8 boundary gaps' \
            -m 'Resolve immutable bases before compatibility reads, preserve application property names during schema fingerprinting, reject overflowing JSON exponents, and enforce one Unicode-control/UTF-8-byte domain across Python, Rust, Android, schemas and shared vectors. Preserve automatic_redispatch=false, OBSERVE_ONLY and the L1-only claim ceiling.'
          final="$(git --no-replace-objects rev-parse HEAD)"
          tree="$(git --no-replace-objects rev-parse HEAD^{tree})"
          test "$(git --no-replace-objects rev-parse HEAD^)" = "$PR_HEAD_SHA"
          git push \
            --force-with-lease="refs/heads/${TARGET_BRANCH}:${PR_HEAD_SHA}" \
            origin "HEAD:refs/heads/${TARGET_BRANCH}"
          printf 'published_head=%s\npublished_tree=%s\n' "$final" "$tree"
