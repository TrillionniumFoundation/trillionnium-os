name: TrillionniumGame current source export v21

on:
  push:
    branches: [ci/trillionniumgame-exact-head-relay-v1]
    paths: ['.github/workflows/trillionniumgame-current-source-export-v21.yml']
  workflow_dispatch:

permissions:
  contents: read

env:
  TARGET_REPOSITORY: TrillionniumFoundation/TrillionniumGame
  EXPECTED_HEAD: 7a0fae07c6cf37dda767151448a00a89ae3b1d33

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ env.TARGET_REPOSITORY }}
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 1
          persist-credentials: false
      - name: Seal exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          mkdir -p export
          git archive --format=tar HEAD | tar -xf - -C export
          git rev-parse HEAD > export/.source-commit
          git rev-parse HEAD^{tree} > export/.source-tree
          find export -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > export/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trillionniumgame-current-source-${{ env.EXPECTED_HEAD }}
          path: export
          if-no-files-found: error
          retention-days: 7
