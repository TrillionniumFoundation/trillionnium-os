name: Owner-Open R7 workspace integrity controller

on:
  push:
    branches:
      - ops/owner-open-r7-workspace-controller-20260830
    paths:
      - .github/workflows/owner-open-r7-workspace-controller.yml

permissions:
  actions: read
  checks: read
  contents: write
  pull-requests: write

concurrency:
  group: owner-open-r7-workspace-controller
  cancel-in-progress: false

jobs:
  supervise:
    runs-on: ubuntu-24.04
    timeout-minutes: 125
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_BRANCH: codex/owner-open-r7-workspace-integrity-20260830-v2
      TARGET_WORKFLOW: Owner-Open R7 full-workspace integrity v2 executor
      TARGET_EXECUTOR: .github/workflows/owner-open-r7-workspace-integrity-v2-executor.yml
      SOURCE_BRANCH: codex/owner-open-r7-runtime-hardening-20260830-v3

    steps:
      - name: Check out controller branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: ops/owner-open-r7-workspace-controller-20260830

      - name: Supervise source executor and permanent checks
        shell: bash
        run: |
          set -uo pipefail
          owner="${GITHUB_REPOSITORY%%/*}"
          mkdir -p out
          deadline=$((SECONDS + 6600))
          run_id=""
          status=""
          conclusion=""
          while [ "$SECONDS" -lt "$deadline" ]; do
            runs="$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/runs" \
              -f branch="$TARGET_BRANCH" -F per_page=100 2>/dev/null || printf '{"workflow_runs":[]}')"
            row="$(jq -c --arg name "$TARGET_WORKFLOW" \
              '[.workflow_runs[] | select(.name == $name)] | sort_by(.created_at) | last // empty' \
              <<<"$runs")"
            if [ -n "$row" ]; then
              run_id="$(jq -r .id <<<"$row")"
              status="$(jq -r .status <<<"$row")"
              conclusion="$(jq -r '.conclusion // ""' <<<"$row")"
              [ "$status" = completed ] && break
            fi
            sleep 30
          done

          pr="$(gh api --method GET "repos/$GITHUB_REPOSITORY/pulls" \
            -f state=all -f head="$owner:$TARGET_BRANCH" -F per_page=20 2>/dev/null \
            | jq -r '.[0].number // empty' || true)"

          if [ "$status" != completed ] || [ "$conclusion" != success ]; then
            printf '{"outcome":"executor_not_passed","run_id":"%s","status":"%s","conclusion":"%s"}\n' \
              "$run_id" "$status" "$conclusion" > out/result.json
            if [ -n "$pr" ]; then
              gh pr comment "$pr" --repo "$GITHUB_REPOSITORY" \
                --body "Workspace controller: executor run \`$run_id\` did not pass (status=\`$status\`, conclusion=\`$conclusion\`). No permanent gate claim is accepted; the PR remains draft." || true
            fi
          else
            branch="$(gh api "repos/$GITHUB_REPOSITORY/branches/$TARGET_BRANCH" 2>/dev/null || printf '{}')"
            sha="$(jq -r '.commit.sha // empty' <<<"$branch")"
            executor_present=false
            gh api "repos/$GITHUB_REPOSITORY/contents/$TARGET_EXECUTOR?ref=$TARGET_BRANCH" \
              >/dev/null 2>&1 && executor_present=true
            permanent_present=false
            gh api "repos/$GITHUB_REPOSITORY/contents/.github/workflows/owner-open-workspace-integrity.yml?ref=$TARGET_BRANCH" \
              >/dev/null 2>&1 && permanent_present=true

            if [ -z "$sha" ] || [ "$executor_present" = true ] || [ "$permanent_present" != true ]; then
              printf '{"outcome":"persistent_head_not_proven","run_id":"%s","sha":"%s"}\n' \
                "$run_id" "$sha" > out/result.json
            else
              if [ -z "$pr" ]; then
                gh pr create --repo "$GITHUB_REPOSITORY" --draft \
                  --base "$SOURCE_BRANCH" --head "$TARGET_BRANCH" \
                  --title "ci(r7): require complete Rust workspace integrity" \
                  --body "Permanent exact-head Rust 1.93 complete-workspace tests and strict Clippy. L1 only; no L2-L6 claim." >/dev/null || true
                pr="$(gh api --method GET "repos/$GITHUB_REPOSITORY/pulls" \
                  -f state=open -f head="$owner:$TARGET_BRANCH" -F per_page=20 \
                  | jq -r '.[0].number // empty' || true)"
              fi

              checks_deadline=$((SECONDS + 2700))
              stable=0
              signature=""
              total=0
              pending=1
              bad=0
              checks='{}'
              while [ "$SECONDS" -lt "$checks_deadline" ]; do
                checks="$(gh api -H 'Accept: application/vnd.github+json' \
                  "repos/$GITHUB_REPOSITORY/commits/$sha/check-runs?per_page=100" \
                  2>/dev/null || printf '{"total_count":0,"check_runs":[]}')"
                total="$(jq -r '.total_count // 0' <<<"$checks")"
                pending="$(jq '[.check_runs[] | select(.status != "completed")] | length' <<<"$checks")"
                bad="$(jq '[.check_runs[] | select(.status == "completed") | select((.conclusion // "") as $c | ($c != "success" and $c != "neutral" and $c != "skipped"))] | length' <<<"$checks")"
                next="$(jq -r '[.check_runs[] | [.name,.status,(.conclusion // "")] | join(":")] | sort | join("|")' <<<"$checks")"
                if [ "$total" -ge 3 ] && [ "$pending" -eq 0 ] && [ "$next" = "$signature" ]; then
                  stable=$((stable + 1))
                else
                  stable=0
                fi
                signature="$next"
                [ "$stable" -ge 2 ] && break
                sleep 30
              done

              if [ "$total" -ge 3 ] && [ "$pending" -eq 0 ] && [ "$bad" -eq 0 ]; then
                printf '{"outcome":"passed","run_id":"%s","sha":"%s","checks":%s}\n' \
                  "$run_id" "$sha" "$total" > out/result.json
                if [ -n "$pr" ]; then
                  gh pr ready "$pr" --repo "$GITHUB_REPOSITORY" || true
                  gh pr edit "$pr" --repo "$GITHUB_REPOSITORY" \
                    --add-reviewer ProfHepta --add-label ready-for-review || true
                  gh pr comment "$pr" --repo "$GITHUB_REPOSITORY" \
                    --body "Workspace controller: exact head \`$sha\` passed executor run \`$run_id\` and $total stable permanent check runs. Ready for independent review; no L2-L6 claim promoted." || true
                fi
              else
                printf '{"outcome":"permanent_checks_not_green","run_id":"%s","sha":"%s","checks":%s,"pending":%s,"bad":%s}\n' \
                  "$run_id" "$sha" "$total" "$pending" "$bad" > out/result.json
              fi
            fi
          fi
          cat out/result.json

      - name: Retire controller
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/owner-open-r7-workspace-controller.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "ops(r7): retire workspace qualification controller"
          git push origin HEAD:ops/owner-open-r7-workspace-controller-20260830
