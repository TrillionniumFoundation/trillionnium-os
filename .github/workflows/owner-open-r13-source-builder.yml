name: Owner-Open R13 deterministic source builder

on:
  push:
    branches:
      - ops/owner-open-r13-source-builder-20260831
    paths:
      - .github/workflows/owner-open-r13-source-builder.yml

permissions:
  contents: write

concurrency:
  group: owner-open-r13-deterministic-source-builder
  cancel-in-progress: false

env:
  BASE_SHA: 34d8b731370b42f84fb50c34ecd6ca41b39f0d08
  SOURCE_BRANCH: ops/owner-open-r13-source-builder-20260831
  TARGET_BRANCH: codex/owner-open-r13-source-hardening-20260831
  PATCH_B64_GLOB: .github/owner-open-r13-source.patch.gz.b64.*
  BUILDER_PATH: .github/workflows/owner-open-r13-source-builder.yml
  PATCH_SHA256: c2ecbd15d2023f2c51bd8f6aeaf5777f9a1a18c3472c23425d68192642cd7c86
  PATCH_GZIP_SHA256: 92c8672a09afa8ffe164095886df85801eab0db14dad146cb157c71cfc850e45
  PATCH_B64_SHA256: 1cd5c9b37a02d8a6697b16c3874dfdde1d15c67295a7be70d5bb9a4d10f014a8
  PYTHONDONTWRITEBYTECODE: "1"
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  build-and-publish:
    name: Replay, qualify and atomically publish R13 source
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out exact transient builder head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: ${{ github.sha }}

      - name: Verify transient builder envelope and decode patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git --no-replace-objects rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git --no-replace-objects merge-base "$BASE_SHA" HEAD)" = "$BASE_SHA"
          cat > "$RUNNER_TEMP/expected-builder-paths.txt" <<'EOF'
          .github/owner-open-r13-source.patch.gz.b64.00
          .github/owner-open-r13-source.patch.gz.b64.01
          .github/owner-open-r13-source.patch.gz.b64.02
          .github/owner-open-r13-source.patch.gz.b64.03
          .github/owner-open-r13-source.patch.gz.b64.04
          .github/owner-open-r13-source.patch.gz.b64.05
          .github/owner-open-r13-source.patch.gz.b64.06
          .github/owner-open-r13-source.patch.gz.b64.07
          .github/owner-open-r13-source.patch.gz.b64.08
          .github/workflows/owner-open-r13-source-builder.yml
          EOF
          git --no-replace-objects diff --name-only "$BASE_SHA" HEAD | LC_ALL=C sort \
            > "$RUNNER_TEMP/actual-builder-paths.txt"
          diff -u "$RUNNER_TEMP/expected-builder-paths.txt" "$RUNNER_TEMP/actual-builder-paths.txt"
          cat $PATCH_B64_GLOB > "$RUNNER_TEMP/r13.patch.gz.b64"
          test "$(sha256sum "$RUNNER_TEMP/r13.patch.gz.b64" | awk '{print $1}')" = "$PATCH_B64_SHA256"
          base64 --decode "$RUNNER_TEMP/r13.patch.gz.b64" > "$RUNNER_TEMP/r13.patch.gz"
          test "$(sha256sum "$RUNNER_TEMP/r13.patch.gz" | awk '{print $1}')" = "$PATCH_GZIP_SHA256"
          gzip --decompress --stdout "$RUNNER_TEMP/r13.patch.gz" > "$RUNNER_TEMP/r13.patch"
          test "$(sha256sum "$RUNNER_TEMP/r13.patch" | awk '{print $1}')" = "$PATCH_SHA256"

      - name: Reset to immutable R6 source and replay deterministic patch
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard "$BASE_SHA"
          git clean -ffdqx
          test -z "$(compgen -G "$PATCH_B64_GLOB" || true)"
          test ! -e "$BUILDER_PATH"
          git apply --check --index "$RUNNER_TEMP/r13.patch"
          git apply --index "$RUNNER_TEMP/r13.patch"
          cat > "$RUNNER_TEMP/expected-source-paths.txt" <<'EOF'
          .github/workflows/owner-open-r13-source-qualification.yml
          .github/workflows/owner-open-r5-tool-loop.yml
          apps/trillionnium-owner-open-host/src/bin/r5_control_host_v6/entry.rs
          apps/trillionnium-owner-open-host/src/bin/r5_control_host_v6/process.rs
          apps/trillionnium-owner-open-host/src/bin/r5_control_host_v7/entry.rs
          apps/trillionnium-owner-open-host/src/bin/r5_control_host_v7/process.rs
          apps/trillionnium-owner-open-host/tests/r5_jobs.rs
          crates/trillionnium-owner-open-job-registry/src/registry.rs
          crates/trillionnium-owner-open-job-registry/src/types.rs
          crates/trillionnium-owner-open-job-registry/tests/registry.rs
          crates/trillionnium-owner-open-job-runtime/src/manager.rs
          crates/trillionnium-owner-open-job-runtime/src/process.rs
          crates/trillionnium-owner-open-job-runtime/src/types.rs
          crates/trillionnium-owner-open-job-runtime/tests/runtime.rs
          crates/trillionnium-owner-open-provider-jsonl/src/lib.rs
          crates/trillionnium-owner-open-runtime/src/process.rs
          docs/implementation/owner-open-long-running-jobs-v1.md
          docs/implementation/owner-open-r13-runtime-boundary-hardening.md
          docs/protocols/owner-open-jobs-v1.md
          tools/tests/test_owner_open_r13_runtime_hardening.py
          tools/tests/test_verify_owner_open_r5_workflow_boundaries.py
          tools/verify-owner-open-r5-workflow-boundaries.py
          EOF
          git diff --cached --name-only | LC_ALL=C sort > "$RUNNER_TEMP/actual-source-paths.txt"
          diff -u "$RUNNER_TEMP/expected-source-paths.txt" "$RUNNER_TEMP/actual-source-paths.txt"
          git diff --cached --check
          git diff --exit-code -- Cargo.lock

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"

      - name: Set up Rust 1.93
        uses: dtolnay/rust-toolchain@d8dfd7155fea72af4ad34a8fe97364d210e2d020
        with:
          toolchain: "1.93.0"
          components: rustfmt, clippy

      - name: Run Python, workflow and canonical qualification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r13-logs"
          python3 -m compileall -q tools
          python3 -m unittest discover -s tools/tests -p 'test_*.py' -v \
            2>&1 | tee "$RUNNER_TEMP/r13-logs/python-all.txt"
          python3 tools/verify-owner-open-r5-workflow-boundaries.py --json \
            | tee "$RUNNER_TEMP/r13-logs/workflow-boundaries.json"

      - name: Run complete Rust workspace qualification
        shell: bash
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          set -euo pipefail
          cargo fmt --all -- --check \
            2>&1 | tee "$RUNNER_TEMP/r13-logs/cargo-fmt.txt"
          cargo test --workspace --all-targets --all-features --locked \
            2>&1 | tee "$RUNNER_TEMP/r13-logs/cargo-test.txt"
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings \
            2>&1 | tee "$RUNNER_TEMP/r13-logs/cargo-clippy.txt"
          cargo doc --workspace --all-features --no-deps --locked \
            2>&1 | tee "$RUNNER_TEMP/r13-logs/cargo-doc.txt"

      - name: Commit immutable single-parent source candidate
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          git diff --exit-code -- Cargo.lock
          git clean -ffdqx
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "fix(r13): harden runtime and execution boundaries"
          head="$(git --no-replace-objects rev-parse HEAD)"
          tree="$(git --no-replace-objects rev-parse HEAD^{tree})"
          test "$(git --no-replace-objects rev-parse HEAD^1)" = "$BASE_SHA"
          test "$(git --no-replace-objects rev-list --parents -n 1 HEAD | wc -w)" -eq 2
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          python3 tools/verify-owner-open-r5.py \
            --expected-commit "$head" --expected-tree "$tree" --json \
            | tee "$RUNNER_TEMP/r13-logs/r5-verifier-postcommit.json"
          python3 tools/verify-owner-open-r5-gap-evidence.py \
            --expected-commit "$head" --expected-tree "$tree" --json \
            | tee "$RUNNER_TEMP/r13-logs/gap-verifier-postcommit.json"
          printf '%s\n' "$head" > "$RUNNER_TEMP/r13-logs/candidate-head.txt"
          printf '%s\n' "$tree" > "$RUNNER_TEMP/r13-logs/candidate-tree.txt"
          test ! -e "$BUILDER_PATH"
          test -z "$(compgen -G "$PATCH_B64_GLOB" || true)"

      - name: Atomically publish the qualified source branch
        shell: bash
        run: |
          set -euo pipefail
          git push \
            --force-with-lease="refs/heads/$TARGET_BRANCH:$BASE_SHA" \
            origin "HEAD:refs/heads/$TARGET_BRANCH"

      - name: Upload qualification logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: owner-open-r13-source-builder-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/r13-logs/
          if-no-files-found: warn
          retention-days: 30
