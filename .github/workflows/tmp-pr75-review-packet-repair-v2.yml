name: Temporary PR75 content-addressed review-packet repair v2

on:
  push:
    branches:
      - ops/pr75-review-packet-repair-v2-20260911

permissions:
  contents: write

concurrency:
  group: temporary-pr75-review-packet-repair-v2
  cancel-in-progress: true

env:
  PR_HEAD_SHA: c543385f6b0cef61ef14086db92a465f7b0598f2
  BASE_SHA: b681cd856fccac1189496576f25d259752d2dcce
  TARGET_BRANCH: codex/executable-module-contracts-v3-main-20260910
  PATCH_XZ_SHA256: 6fab9529897a0950ab8dbe76373410f49ace9dc8c5d7b9d648df16f7b1065689
  PATCH_SHA256: 2bb8e1a55af7e767b25e0d7feac4c0f685c33610ece000d14d867ae68a715ce6
  PYTHONDONTWRITEBYTECODE: "1"
  CARGO_TERM_COLOR: always

jobs:
  repair-qualify-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out immutable controller
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: true

      - name: Authenticate exact XZ repair patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git --no-replace-objects rev-parse HEAD^)" = "$PR_HEAD_SHA"
          observed="$(git --no-replace-objects diff --name-only "$PR_HEAD_SHA"...HEAD | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/tmp-pr75-review-packet-repair-v2.yml' \
            'ops/pr75-review-packet-v2.patch.xz' | LC_ALL=C sort)"
          test "$observed" = "$expected"
          cp -- ops/pr75-review-packet-v2.patch.xz "${RUNNER_TEMP:?}/repair.patch.xz"
          printf '%s  %s\n' "$PATCH_XZ_SHA256" "${RUNNER_TEMP:?}/repair.patch.xz" | sha256sum --check --strict
          xz --decompress --stdout -- "${RUNNER_TEMP:?}/repair.patch.xz" > "${RUNNER_TEMP:?}/repair.patch"
          printf '%s  %s\n' "$PATCH_SHA256" "${RUNNER_TEMP:?}/repair.patch" | sha256sum --check --strict
          python3 - <<'PY'
          import os
          from pathlib import Path
          raw = (Path(os.environ["RUNNER_TEMP"]) / "repair.patch").read_bytes()
          raw.decode("utf-8")
          if not raw or b"\x00" in raw:
              raise SystemExit("repair patch is empty or contains NUL")
          PY

      - name: Install source-test prerequisites
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/sudo /usr/bin/apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          /usr/bin/sudo /usr/bin/apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install --yes --no-install-recommends acl

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"

      - name: Set up Rust 1.93
        uses: dtolnay/rust-toolchain@d8dfd7155fea72af4ad34a8fe97364d210e2d020
        with:
          toolchain: "1.93.0"
          components: rustfmt,clippy

      - name: Apply exact content-addressed packet repair
        shell: bash
        run: |
          set -euo pipefail
          git --no-replace-objects checkout --detach "$PR_HEAD_SHA"
          test "$(git --no-replace-objects merge-base HEAD "$BASE_SHA")" = "$BASE_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all --ignore-submodules=none)"
          git apply -p1 --check --whitespace=error-all "${RUNNER_TEMP:?}/repair.patch"
          git apply -p1 --whitespace=error-all "${RUNNER_TEMP:?}/repair.patch"
          observed="$(git diff --name-only | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            'tools/contracts/check_module_contract_compatibility.py' \
            'tools/contracts/generate_module_contracts.py' \
            'tools/tests/test_module_contracts.py' | LC_ALL=C sort)"
          test "$observed" = "$expected"
          python3 -m py_compile \
            tools/contracts/check_module_contract_compatibility.py \
            tools/contracts/generate_module_contracts.py \
            tools/tests/test_module_contracts.py
          python3 -m unittest tools.tests.test_module_contracts -v
          git diff --check

      - name: Regenerate and verify every bound contract artifact
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/contracts/generate_module_contracts.py --write
          python3 tools/contracts/generate_module_contracts.py --check
          python3 tools/contracts/generate_module_contracts.py --verify
          python3 tools/contracts/check_module_contract_compatibility.py --base-ref "$BASE_SHA"
          python3 android-integration/module-contracts/verify_vectors.py
          cargo fmt --all -- --check
          cargo test --locked -p trillionnium-owner-open-types --all-targets
          cargo clippy --locked -p trillionnium-owner-open-types --all-targets -- -D warnings
          git diff --check

      - name: Execute complete repository and planned qualification
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/docs/generate_global_docs.py --check
          python3 tools/docs/verify_global_docs.py
          python3 tools/docs/verify_repository_authority.py
          python3 -m unittest discover -s tools/tests -p 'test*.py' -v
          cargo fmt --all -- --check
          cargo test --locked --all-targets
          cargo clippy --locked --all-targets -- -D warnings
          cargo fmt --manifest-path planned/Cargo.toml --all -- --check
          cargo test --locked --manifest-path planned/Cargo.toml --workspace --all-targets
          cargo clippy --locked --manifest-path planned/Cargo.toml --workspace --all-targets -- -D warnings
          git diff --check

      - name: Publish repaired exact head through immutable branch lease
        shell: bash
        run: |
          set -euo pipefail
          test "$(git --no-replace-objects rev-parse HEAD)" = "$PR_HEAD_SHA"
          test ! -e ops/pr75-review-packet-v2.patch.xz
          test ! -e .github/workflows/tmp-pr75-review-packet-repair-v2.yml
          git config user.name 'Qian QI'
          git config user.email '102159240+ProfHepta@users.noreply.github.com'
          git add -A
          test -n "$(git diff --cached --name-only)"
          if git diff --cached --name-only | grep -E '^(ops/|\.github/workflows/tmp-)'; then
            printf '%s\n' 'temporary controller path leaked into candidate' >&2
            exit 1
          fi
          git diff --cached --check
          git commit \
            -m 'fix(contracts): bind migration review packets by content' \
            -m 'Replace author-controlled opaque review IDs and free-form plans with one bounded canonical packet whose path is its SHA-256. Bind exact module, contract and semantic-family scopes; base and target schema identities; migration and rollback metadata; an allowlisted non-author reviewer identity; a non-authorizing source posture; automatic_redispatch=false; and public_release=false. Protected exact-head approval remains an independent GitHub control.'
          final="$(git --no-replace-objects rev-parse HEAD)"
          tree="$(git --no-replace-objects rev-parse HEAD^{tree})"
          test "$(git --no-replace-objects rev-parse HEAD^)" = "$PR_HEAD_SHA"
          git push \
            --force-with-lease="refs/heads/${TARGET_BRANCH}:${PR_HEAD_SHA}" \
            origin "HEAD:refs/heads/${TARGET_BRANCH}"
          printf 'published_head=%s\npublished_tree=%s\n' "$final" "$tree"
