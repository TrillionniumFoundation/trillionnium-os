name: Temporary PR75 contract-boundary diagnostic v2

on:
  push:
    branches:
      - ops/pr75-contract-boundary-repair-v1-20260910

permissions:
  contents: read

concurrency:
  group: pr75-contract-boundary-diagnostic-v2
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TARGET_BRANCH: codex/executable-module-contracts-v3-main-20260910
      TARGET_HEAD: e84227a9cce92bcda45e66c9e9060036f424c4cd
      TARGET_BASE: b681cd856fccac1189496576f25d259752d2dcce
      PYTHONDONTWRITEBYTECODE: "1"
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out immutable diagnostic controller
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          ref: ${{ github.sha }}
          path: controller
          persist-credentials: false

      - name: Check out exact unchanged candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ env.TARGET_BRANCH }}
          path: candidate
          persist-credentials: false

      - name: Assert input tuple and extract exact repair payload
        shell: bash
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE/candidate"
          test "$(git --no-replace-objects rev-parse HEAD)" = "$TARGET_HEAD"
          test "$(git --no-replace-objects rev-parse HEAD^)" = "$TARGET_BASE"
          test "$(git --no-replace-objects rev-parse origin/main)" = "$TARGET_BASE"
          test -z "$(git status --porcelain=v1 --untracked-files=all --ignore-submodules=none)"
          cd "$GITHUB_WORKSPACE"
          python3 - <<'PY'
          import base64
          from pathlib import Path
          import re
          import zlib

          workflow = Path("controller/.github/workflows/tmp-pr75-contract-boundary-repair-v1.yml")
          text = workflow.read_text(encoding="utf-8")
          match = re.search(
              r"(?ms)^      PATCH_ZLIB_B64: \|\n(?P<body>(?:          [A-Za-z0-9+/=]+\n)+)",
              text,
          )
          if match is None:
              raise SystemExit("repair payload block not found")
          encoded = "".join(line.strip() for line in match.group("body").splitlines())
          raw = zlib.decompress(base64.b64decode(encoded, validate=True))
          target = Path("repair_pr75_contract_boundaries.py")
          target.write_bytes(raw)
          target.chmod(0o700)
          print(f"PATCH_PAYLOAD_OK bytes={len(raw)}")
          PY
          python3 -m py_compile repair_pr75_contract_boundaries.py
          sha256sum repair_pr75_contract_boundaries.py
          grep -RFn "generator binding anchor differs" repair_pr75_contract_boundaries.py candidate || true
          grep -RFn "binding anchor" repair_pr75_contract_boundaries.py candidate/tools/contracts candidate/crates/trillionnium-owner-open-types || true

      - name: Run patcher only with explicit phase boundary
        shell: bash
        run: |
          set -euxo pipefail
          echo PATCHER_BEGIN
          python3 "$GITHUB_WORKSPACE/repair_pr75_contract_boundaries.py" "$GITHUB_WORKSPACE/candidate"
          echo PATCHER_OK
          cd "$GITHUB_WORKSPACE/candidate"
          git status --short
          grep -RFn "generator binding anchor differs" tools/contracts crates/trillionnium-owner-open-types || true
          grep -RFn "binding anchor" tools/contracts crates/trillionnium-owner-open-types || true
          python3 -m py_compile \
            tools/contracts/generate_module_contracts.py \
            tools/contracts/check_module_contract_compatibility.py \
            android-integration/module-contracts/verify_vectors.py \
            tools/tests/test_module_contracts.py
          echo PYCOMPILE_OK

      - name: Run generator write only with explicit phase boundary
        working-directory: candidate
        shell: bash
        run: |
          set -euxo pipefail
          echo GENERATOR_WRITE_BEGIN
          python3 tools/contracts/generate_module_contracts.py --write
          echo GENERATOR_WRITE_OK

      - name: Run remaining focused boundaries
        working-directory: candidate
        shell: bash
        run: |
          set -euxo pipefail
          echo GENERATOR_CHECK_BEGIN
          python3 tools/contracts/generate_module_contracts.py --check
          echo GENERATOR_CHECK_OK
          python3 tools/contracts/generate_module_contracts.py --verify
          echo GENERATOR_VERIFY_OK
          python3 tools/contracts/check_module_contract_compatibility.py --base-ref origin/main
          echo COMPATIBILITY_OK
          python3 android-integration/module-contracts/verify_vectors.py
          echo ANDROID_OK
          python3 -m unittest tools.tests.test_module_contracts -v
          echo FOCUSED_TESTS_OK

      - name: Retain diagnostic sources
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr75-contract-boundary-diagnostic-${{ github.sha }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            repair_pr75_contract_boundaries.py
            candidate/tools/contracts/generate_module_contracts.py
            candidate/tools/contracts/check_module_contract_compatibility.py
            candidate/android-integration/module-contracts/verify_vectors.py
            candidate/tools/tests/test_module_contracts.py
