name: G1 materialize job start concurrency

on:
  push:
    branches:
      - codex/g1-gap-closure-r1-20260831
    paths:
      - .github/workflows/g1-materialize-job-hotlock.yml

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: codex/g1-gap-closure-r1-20260831
      - uses: dtolnay/rust-toolchain@d8dfd7155fea72af4ad34a8fe97364d210e2d020
        with:
          toolchain: "1.93.0"
          components: rustfmt,clippy
      - name: Apply, format, and verify job concurrency patch
        env:
          PATCH_GZ_B64: 
        run: |
          set -euo pipefail
          printf '%s' "$PATCH_GZ_B64" | base64 -d | gzip -d > /tmp/job-hotlock.patch
          git apply --index /tmp/job-hotlock.patch
          cargo fmt --all
          cargo test --locked -p trillionnium-owner-open-job-runtime --all-targets
          cargo clippy --locked -p trillionnium-owner-open-job-runtime --all-targets -- -D warnings
      - name: Commit verified materialization
        run: |
          set -euo pipefail
          rm .github/workflows/g1-materialize-job-hotlock.yml
          git add -A
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "feat(g1): remove job start global slow-path lock" -m "Reserve bounded capacity with RAII permits and serialize only stable start shards so unrelated jobs can progress while spawn and journal paths remain outside the global running-map lock." -m "Signed-off-by: OpenAI Codex <noreply@openai.com>"
          git push origin HEAD:codex/g1-gap-closure-r1-20260831
