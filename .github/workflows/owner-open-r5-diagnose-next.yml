name: owner-open R5 diagnose next failures

on:
  workflow_dispatch:
  push:
    branches:
      - "codex/owner-open-r5-tool-loop-20260827"
    paths:
      - ".github/workflows/owner-open-r5-diagnose-next.yml"

permissions:
  contents: read

concurrency:
  group: owner-open-r5-diagnose-next-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    name: Diagnose isolated Python clusters and next Rust compiler errors
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/owner-open-r5-tool-loop-20260827
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Set up Rust 1.93
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.93.0
          components: rustfmt, clippy

      - name: Scan unittest subclasses for reserved run overrides
        run: |
          mkdir -p owner-open-r5-diagnose
          python3 - <<'PY' | tee owner-open-r5-diagnose/testcase-run-overrides-before.txt
          import ast
          from pathlib import Path

          findings = []
          for path in sorted(Path("tools/tests").rglob("test_*.py")):
              tree = ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
              for node in tree.body:
                  if not isinstance(node, ast.ClassDef):
                      continue
                  bases = {ast.unparse(base) for base in node.bases}
                  if not any(base.endswith("TestCase") for base in bases):
                      continue
                  for item in node.body:
                      if isinstance(item, (ast.FunctionDef, ast.AsyncFunctionDef)) and item.name == "run":
                          findings.append((str(path), node.name, item.lineno))
          for path, cls, line in findings:
              print(f"{path}:{line}: {cls}.run")
          print(f"count={len(findings)}")
          PY

      - name: Apply known temporary repairs in the diagnostic checkout
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str, expected: int = 1) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{path}: expected {expected}, observed {count}: {old!r}")
              target.write_text(text.replace(old, new), encoding="utf-8")

          stage = "tools/tests/test_stage_owner_open_rootfs_payload_release.py"
          replace_exact(
              stage,
              "    def run(self, plan: Path, output: Path) -> subprocess.CompletedProcess[bytes]:\n",
              "    def run_command(\n        self, plan: Path, output: Path\n    ) -> subprocess.CompletedProcess[bytes]:\n",
          )
          replace_exact(stage, "self.run(plan, output)", "self.run_command(plan, output)", expected=6)

          event_store = "crates/trillionnium-owner-open-event-store/src/lib.rs"
          replace_exact(
              event_store,
              "    let read = reader\n        .take(maximum as u64 + 2)\n",
              "    let read = reader\n        .by_ref()\n        .take(maximum as u64 + 2)\n",
          )
          replace_exact(
              event_store,
              "    if matches!(\n        error.raw_os_error(),\n        Some(libc::EWOULDBLOCK) | Some(libc::EAGAIN)\n    ) {\n",
              "    if error\n        .raw_os_error()\n        .is_some_and(|code| code == libc::EWOULDBLOCK || code == libc::EAGAIN)\n    {\n",
          )

          runtime = "crates/trillionnium-owner-open-runtime/src/lib.rs"
          replace_exact(
              runtime,
              "use std::sync::mpsc::{Receiver, SyncSender, TryRecvError, sync_channel};\n",
              "use std::sync::mpsc::{SyncSender, sync_channel};\n",
          )
          PY
          cargo fmt --all
          git diff --check

      - name: Rescan reserved TestCase run overrides
        run: |
          python3 - <<'PY' | tee owner-open-r5-diagnose/testcase-run-overrides-after.txt
          import ast
          from pathlib import Path

          findings = []
          for path in sorted(Path("tools/tests").rglob("test_*.py")):
              tree = ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
              for node in tree.body:
                  if not isinstance(node, ast.ClassDef):
                      continue
                  bases = {ast.unparse(base) for base in node.bases}
                  if not any(base.endswith("TestCase") for base in bases):
                      continue
                  for item in node.body:
                      if isinstance(item, (ast.FunctionDef, ast.AsyncFunctionDef)) and item.name == "run":
                          findings.append((str(path), node.name, item.lineno))
          for path, cls, line in findings:
              print(f"{path}:{line}: {cls}.run")
          print(f"count={len(findings)}")
          if findings:
              raise SystemExit(1)
          PY

      - name: Run isolated Python failure clusters without early abort
        run: |
          set +e
          run_cluster() {
            name="$1"
            shift
            echo "=== $name ===" > "owner-open-r5-diagnose/${name}.log"
            python3 -m unittest "$@" -v >> "owner-open-r5-diagnose/${name}.log" 2>&1
            rc=$?
            echo "$rc" > "owner-open-r5-diagnose/${name}.rc"
            echo "$name rc=$rc" | tee -a owner-open-r5-diagnose/python-summary.txt
          }
          run_cluster stage-rootfs tools.tests.test_stage_owner_open_rootfs_payload_release
          run_cluster shell-artifact tools.tests.test_build_shell_exec_artifact_set
          run_cluster final-daemon tools.tests.test_materialize_p01_final_daemon_artifact
          run_cluster adb-reverse tools.tests.test_owner_open_adb_reverse
          run_cluster adb-qualification \
            tools.tests.test_qualify_owner_open_adb \
            tools.tests.test_qualify_owner_open_adb_selected \
            tools.tests.test_release_qualification_paths \
            tools.tests.test_release_qualification_paths_v2
          run_cluster daemon-receipt tools.tests.test_p01_daemon_receipt_build
          run_cluster rootfs-admission tools.tests.test_rootfs_v8_erofs_admission
          exit 0

      - name: Run full Python discovery after the reserved-name repair
        run: |
          set +e
          python3 -m unittest discover -s tools/tests -p 'test_*.py' -v \
            > owner-open-r5-diagnose/python-discover.log 2>&1
          echo "$?" > owner-open-r5-diagnose/python-discover.rc
          exit 0

      - name: Compile and test Rust packages until the next failure
        run: |
          set +e
          cargo test --locked --all-targets --package trillionnium-owner-open-event-store \
            > owner-open-r5-diagnose/rust-event-store.log 2>&1
          echo "$?" > owner-open-r5-diagnose/rust-event-store.rc
          cargo test --locked --all-targets --package trillionnium-owner-open-runtime \
            > owner-open-r5-diagnose/rust-runtime.log 2>&1
          echo "$?" > owner-open-r5-diagnose/rust-runtime.rc
          cargo test --locked --all-targets --package trillionnium-owner-open-host \
            > owner-open-r5-diagnose/rust-host.log 2>&1
          echo "$?" > owner-open-r5-diagnose/rust-host.rc
          cargo clippy --locked --all-targets --package trillionnium-owner-open-event-store -- -D warnings \
            > owner-open-r5-diagnose/clippy-event-store.log 2>&1
          echo "$?" > owner-open-r5-diagnose/clippy-event-store.rc
          cargo clippy --locked --all-targets --package trillionnium-owner-open-runtime -- -D warnings \
            > owner-open-r5-diagnose/clippy-runtime.log 2>&1
          echo "$?" > owner-open-r5-diagnose/clippy-runtime.rc
          cargo clippy --locked --all-targets --package trillionnium-owner-open-host -- -D warnings \
            > owner-open-r5-diagnose/clippy-host.log 2>&1
          echo "$?" > owner-open-r5-diagnose/clippy-host.rc
          exit 0

      - name: Capture exact diagnostic patch and status
        run: |
          git diff --binary > owner-open-r5-diagnose/temporary-repairs.patch
          git diff --stat > owner-open-r5-diagnose/temporary-repairs.stat
          git rev-parse HEAD > owner-open-r5-diagnose/base-head.txt
          find owner-open-r5-diagnose -maxdepth 1 -name '*.rc' -print -exec cat {} \; \
            | tee owner-open-r5-diagnose/all-return-codes.txt

      - name: Upload diagnostic evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: owner-open-r5-next-diagnosis-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          path: owner-open-r5-diagnose/
