name: G1 strict synthetic artifact-set closure v19

on:
  push:
    branches: [ops/g1-aggregate-artifact-v19-20260906]
    paths:
      - .github/workflows/g1-aggregate-artifact-v19.yml
      - .g1/g1_aggregate_artifact_v19_apply.py

permissions: {}

concurrency:
  group: g1-aggregate-artifact-v19
  cancel-in-progress: false

env:
  TARGET_HEAD: 4b9af095813df1a83b65d029d061d889b882d5e7
  TARGET_BRANCH: codex/g1-all-gap-closure-20260904
  MATERIALIZED_BRANCH: ops/g1-aggregate-artifact-materialized-v19-20260906
  APPLICATOR_BLOB: 42bd0fe30fb65260188ce86eba0c3dddbb667446
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  validate:
    name: Read-only exact-tree aggregate artifact validation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      result_tree: ${{ steps.bind.outputs.result_tree }}
      staged_patch_sha256: ${{ steps.bind.outputs.staged_patch_sha256 }}
      paths_sha256: ${{ steps.bind.outputs.paths_sha256 }}
    steps:
      - name: Check out exact isolated control source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          path: control

      - name: Check out exact PR head without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ github.repository }}
          ref: ${{ env.TARGET_HEAD }}
          fetch-depth: 1
          persist-credentials: false
          path: target

      - name: Verify immutable inputs and construct repair
        shell: bash
        run: |
          set -euo pipefail
          control="$GITHUB_WORKSPACE/control"
          target="$GITHUB_WORKSPACE/target"
          test "$(git -C "$control" --no-replace-objects rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C "$control" hash-object .g1/g1_aggregate_artifact_v19_apply.py)" = "$APPLICATOR_BLOB"
          test "$(git -C "$target" --no-replace-objects rev-parse HEAD)" = "$TARGET_HEAD"
          test "$(git -C "$target" hash-object tools/g1_pr_aggregate_receipts.py)" = 18b518cb6a1c1bd1b93573fb286bf08b47718062
          test "$(git -C "$target" hash-object tools/tests/g1_pr_aggregate_fixture_legacy.py)" = b81362dc662a6a783b62a09eed996d5639647076
          test "$(git -C "$target" hash-object tools/tests/test_g1_pr_aggregate.py)" = faf9ff51f455a7f6340441e71308f48a03d40259
          python3 -I "$control/.g1/g1_aggregate_artifact_v19_apply.py" --worktree "$target"
          git -C "$target" diff --check
          git -C "$target" status --porcelain=v1 --untracked-files=all \
            | sed -E 's/^.. //; s/.* -> //' | LC_ALL=C sort > "$RUNNER_TEMP/actual-paths"
          cat > "$RUNNER_TEMP/expected-paths" <<'EOF'
          tools/g1_pr_aggregate_receipts.py
          tools/tests/g1_pr_aggregate_fixture_legacy.py
          tools/tests/test_g1_pr_aggregate.py
          EOF
          diff -u "$RUNNER_TEMP/expected-paths" "$RUNNER_TEMP/actual-paths"

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"

      - name: Validate strict artifact semantics and repository invariants
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            tools/g1_pr_aggregate_receipts.py \
            tools/tests/g1_pr_aggregate_fixture_legacy.py \
            tools/tests/test_g1_pr_aggregate.py
          python3 -m unittest discover -s tools/tests -p 'test_g1_pr_aggregate*.py' -v
          python3 tools/docs/generate_global_docs.py --check
          python3 tools/docs/verify_global_docs.py
          python3 tools/docs/verify_module_documentation.py
          python3 tools/verify_g1_repository_closure.py --json > "$RUNNER_TEMP/repository-closure.json"
          git diff --check
          test -z "$(git diff --name-only -- Cargo.lock planned/Cargo.lock docs/machine docs/generated governance/pr41-review-index.v1.json .github)"

      - name: Bind exact tested tree, patch and path set
        id: bind
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          git add -- \
            tools/g1_pr_aggregate_receipts.py \
            tools/tests/g1_pr_aggregate_fixture_legacy.py \
            tools/tests/test_g1_pr_aggregate.py
          test -z "$(git diff --name-only)"
          git diff --cached --binary --full-index > "$RUNNER_TEMP/g1-v19-staged.patch"
          git diff --cached --name-only > "$RUNNER_TEMP/g1-v19-paths"
          result_tree="$(git --no-replace-objects write-tree)"
          staged_patch_sha256="$(sha256sum "$RUNNER_TEMP/g1-v19-staged.patch" | awk '{print $1}')"
          paths_sha256="$(sha256sum "$RUNNER_TEMP/g1-v19-paths" | awk '{print $1}')"
          {
            echo "result_tree=$result_tree"
            echo "staged_patch_sha256=$staged_patch_sha256"
            echo "paths_sha256=$paths_sha256"
          } >> "$GITHUB_OUTPUT"

  publish:
    name: Exact reconstruction without target execution
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out exact isolated control source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          path: control

      - name: Check out exact PR head without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ github.repository }}
          ref: ${{ env.TARGET_HEAD }}
          fetch-depth: 1
          persist-credentials: false
          path: target

      - name: Reconstruct validated bytes without running target programs
        id: commit
        working-directory: target
        shell: bash
        env:
          EXPECTED_TREE: ${{ needs.validate.outputs.result_tree }}
          EXPECTED_STAGED_PATCH: ${{ needs.validate.outputs.staged_patch_sha256 }}
          EXPECTED_PATHS: ${{ needs.validate.outputs.paths_sha256 }}
        run: |
          set -euo pipefail
          control="$GITHUB_WORKSPACE/control"
          test "$(git -C "$control" --no-replace-objects rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C "$control" hash-object .g1/g1_aggregate_artifact_v19_apply.py)" = "$APPLICATOR_BLOB"
          test "$(git --no-replace-objects rev-parse HEAD)" = "$TARGET_HEAD"
          test "$(git hash-object tools/g1_pr_aggregate_receipts.py)" = 18b518cb6a1c1bd1b93573fb286bf08b47718062
          test "$(git hash-object tools/tests/g1_pr_aggregate_fixture_legacy.py)" = b81362dc662a6a783b62a09eed996d5639647076
          test "$(git hash-object tools/tests/test_g1_pr_aggregate.py)" = faf9ff51f455a7f6340441e71308f48a03d40259
          python3 -I "$control/.g1/g1_aggregate_artifact_v19_apply.py" --worktree "$PWD"
          git diff --check
          git add -- \
            tools/g1_pr_aggregate_receipts.py \
            tools/tests/g1_pr_aggregate_fixture_legacy.py \
            tools/tests/test_g1_pr_aggregate.py
          test -z "$(git diff --name-only)"
          git diff --cached --binary --full-index > "$RUNNER_TEMP/g1-v19-publish.patch"
          git diff --cached --name-only > "$RUNNER_TEMP/g1-v19-publish.paths"
          test "$(sha256sum "$RUNNER_TEMP/g1-v19-publish.patch" | awk '{print $1}')" = "$EXPECTED_STAGED_PATCH"
          test "$(sha256sum "$RUNNER_TEMP/g1-v19-publish.paths" | awk '{print $1}')" = "$EXPECTED_PATHS"
          test "$(git --no-replace-objects write-tree)" = "$EXPECTED_TREE"
          git config user.name 'OpenAI Codex'
          git config user.email 'noreply@openai.com'
          git commit \
            -m 'fix(g1): accept the exact synthetic diagnostic artifact set' \
            -m 'Require one semantic merge artifact plus the one head-bound diagnostic artifact emitted by the successful synthetic workflow. Reject missing, stale, duplicate-semantic and third artifacts. The diagnostic remains non-qualifying and is not downloaded into the semantic report.' \
            -m 'Signed-off-by: OpenAI Codex <noreply@openai.com>'
          result_commit="$(git --no-replace-objects rev-parse HEAD)"
          test "$(git --no-replace-objects rev-parse HEAD^)" = "$TARGET_HEAD"
          test "$(git --no-replace-objects rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          echo "result_commit=$result_commit" >> "$GITHUB_OUTPUT"
          printf '{"result_commit":"%s","result_tree":"%s","parent":"%s","staged_patch_sha256":"%s","paths_sha256":"%s","target_execution_in_publish_job":false,"integration_authorized":false,"gap_promotion_authorized":false,"public_release":false}\n' \
            "$result_commit" "$EXPECTED_TREE" "$TARGET_HEAD" "$EXPECTED_STAGED_PATCH" "$EXPECTED_PATHS" \
            > "$RUNNER_TEMP/g1-v19-result.json"

      - name: Publish only to isolated materialized branch with exact lease
        working-directory: target
        shell: bash
        env:
          RESULT_COMMIT: ${{ steps.commit.outputs.result_commit }}
          G1_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$G1_TOKEN" | base64 -w0)"
          current_candidate="$(git -c "http.extraheader=AUTHORIZATION: basic ${auth}" ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk 'NR==1 {print $1}')"
          observed="$(git -c "http.extraheader=AUTHORIZATION: basic ${auth}" ls-remote origin "refs/heads/${MATERIALIZED_BRANCH}" | awk 'NR==1 {print $1}')"
          test "$current_candidate" = "$TARGET_HEAD"
          test "$observed" = "$TARGET_HEAD"
          git -c "http.extraheader=AUTHORIZATION: basic ${auth}" push \
            "--force-with-lease=refs/heads/${MATERIALIZED_BRANCH}:${TARGET_HEAD}" \
            origin "${RESULT_COMMIT}:refs/heads/${MATERIALIZED_BRANCH}"
          unset G1_TOKEN auth

      - name: Retain exact materialization receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: g1-aggregate-artifact-v19-${{ steps.commit.outputs.result_commit }}
          path: ${{ runner.temp }}/g1-v19-result.json
          if-no-files-found: error
          retention-days: 30
