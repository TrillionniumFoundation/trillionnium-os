name: R5 exact-head resume packet

on:
  pull_request:
    paths:
      - ".github/workflows/owner-open-r5-resume-packet.yml"
      - "docs/TRILLIONNIUM_OWNER_OPEN_R5_EXECUTION_PLAN.md"
      - "docs/status/owner-open-r5-gap-closure.json"
      - "docs/status/owner-open-r5-status.json"
      - "docs/operations/owner-open-r5-external-evidence-resume-runbook.md"
      - "tools/generate-owner-open-r5-resume-packet.py"
      - "tools/verify-owner-open-r5.py"
      - "tools/verify-owner-open-r5-gap-evidence.py"
      - "tools/owner_open_r5_evidence_bundle.py"
      - "tools/promote-owner-open-r5-evidence.py"
      - "evidence/owner-open-r5/**"
      - "tools/tests/test_generate_owner_open_r5_resume_packet.py"
  push:
    branches:
      - codex/owner-open-r5-gap-closure-20260829
    paths:
      - ".github/workflows/owner-open-r5-resume-packet.yml"
      - "docs/TRILLIONNIUM_OWNER_OPEN_R5_EXECUTION_PLAN.md"
      - "docs/status/owner-open-r5-gap-closure.json"
      - "docs/status/owner-open-r5-status.json"
      - "docs/operations/owner-open-r5-external-evidence-resume-runbook.md"
      - "tools/generate-owner-open-r5-resume-packet.py"
      - "tools/verify-owner-open-r5.py"
      - "tools/verify-owner-open-r5-gap-evidence.py"
      - "tools/owner_open_r5_evidence_bundle.py"
      - "tools/promote-owner-open-r5-evidence.py"
      - "evidence/owner-open-r5/**"
      - "tools/tests/test_generate_owner_open_r5_resume_packet.py"

permissions:
  contents: read

concurrency:
  group: owner-open-r5-resume-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact-head-resume-packet:
    name: R5 exact-head RESUME_REQUIRED truth
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'

      - name: Revalidate the exact checkout
        env:
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SOURCE_HEAD_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          set -euo pipefail
          test "$(git --no-replace-objects rev-parse HEAD)" = "$SOURCE_HEAD_SHA"
          test -n "$(git --no-replace-objects rev-parse HEAD^{tree})"
          test "$(git --no-replace-objects rev-parse --show-toplevel)" = "$GITHUB_WORKSPACE"
          test -z "$(git --no-replace-objects status --porcelain=v1 --untracked-files=all)"
          test -z "$(git --no-replace-objects for-each-ref refs/replace)"
          test -z "$(git --no-replace-objects ls-files -v | awk '$1 != "H" { print; exit 1 }')"
          git --no-replace-objects diff --check

      - name: Verify canonical R5 source and evidence truth
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/owner-open-r5-resume-${{ github.run_id }}-${{ github.run_attempt }}
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir -m 0700 -p "$EVIDENCE_DIR"
          SOURCE_HEAD_TREE="$(git --no-replace-objects rev-parse HEAD^{tree})"
          test "$(git --no-replace-objects rev-parse HEAD)" = "$SOURCE_HEAD_SHA"
          python3 -m json.tool docs/status/owner-open-r5-gap-closure.json >/dev/null
          python3 -m json.tool docs/status/owner-open-r5-status.json >/dev/null
          python3 tools/verify-owner-open-r5.py --json \
            --expected-commit "$SOURCE_HEAD_SHA" \
            --expected-tree "$SOURCE_HEAD_TREE" \
            | tee "$EVIDENCE_DIR/verify-r5.json"
          python3 tools/verify-owner-open-r5-gap-evidence.py --json \
            --expected-commit "$SOURCE_HEAD_SHA" \
            --expected-tree "$SOURCE_HEAD_TREE" \
            | tee "$EVIDENCE_DIR/verify-r5-gap-evidence.json"
          python3 -m unittest \
            tools.tests.test_generate_owner_open_r5_resume_packet \
            -v \
            2>&1 | tee "$EVIDENCE_DIR/resume-packet-tests.log"

      - name: Generate exact-head resume packet
        env:
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SOURCE_HEAD_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
          EVIDENCE_DIR: ${{ runner.temp }}/owner-open-r5-resume-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          HEAD_SHA="$(git --no-replace-objects rev-parse HEAD)"
          TREE_SHA="$(git --no-replace-objects rev-parse HEAD^{tree})"
          test "$HEAD_SHA" = "$SOURCE_HEAD_SHA"
          python3 tools/generate-owner-open-r5-resume-packet.py \
            --repository "$GITHUB_REPOSITORY" \
            --branch "$SOURCE_HEAD_BRANCH" \
            --commit "$HEAD_SHA" \
            --tree "$TREE_SHA" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --output out/owner-open-r5-resume/resume-packet.json
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          packet = json.loads(
              Path("out/owner-open-r5-resume/resume-packet.json").read_text(
                  encoding="utf-8"
              )
          )
          assert packet["commit_sha"] == os.environ["SOURCE_HEAD_SHA"]
          assert packet["branch"] == os.environ["SOURCE_HEAD_BRANCH"]
          assert packet["state_counts"]["OPEN"] == 0
          assert packet["outcome"] in {
              "RESUME_REQUIRED",
              "MODULE_CLOSED_CANDIDATE",
          }
          assert packet["invariants"]["automatic_redispatch"] is False
          assert packet["invariants"]["packet_promotes_gap_state"] is False
          assert packet["invariants"]["packet_is_environment_evidence"] is False
          if packet["outcome"] == "RESUME_REQUIRED":
              assert packet["remaining_gap_count"] > 0
              assert packet["invariants"]["zero_gap"] is False
          else:
              assert packet["remaining_gap_count"] == 0
              assert packet["invariants"]["zero_gap"] is True
          PY
          cp "$EVIDENCE_DIR/verify-r5.json" out/owner-open-r5-resume/verify-r5.json
          cp "$EVIDENCE_DIR/verify-r5-gap-evidence.json" out/owner-open-r5-resume/verify-r5-gap-evidence.json
          cp "$EVIDENCE_DIR/resume-packet-tests.log" out/owner-open-r5-resume/resume-packet-tests.log
          (
            cd out/owner-open-r5-resume
            sha256sum \
              resume-packet.json \
              verify-r5.json \
              verify-r5-gap-evidence.json \
              resume-packet-tests.log \
              > SHA256SUMS
          )
          test "$(git --no-replace-objects rev-parse HEAD)" = "$SOURCE_HEAD_SHA"
          test -z "$(git --no-replace-objects status --porcelain=v1 --untracked-files=all -- . ':(exclude)out/owner-open-r5-resume/')"

      - name: Upload exact-head resume artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: owner-open-r5-resume-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/owner-open-r5-resume/
          if-no-files-found: error
          retention-days: 30
