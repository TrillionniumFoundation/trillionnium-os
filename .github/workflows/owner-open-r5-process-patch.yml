name: one-shot owner-open R5 process event patch

on:
  push:
    branches:
      - codex/owner-open-r5-gap-closure-20260829
    paths:
      - ".github/workflows/owner-open-r5-process-patch.yml"

permissions:
  contents: write

jobs:
  patch-format-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/owner-open-r5-gap-closure-20260829
      - uses: dtolnay/rust-toolchain@1.93.0
        with:
          components: rustfmt
      - name: Apply exact manager event-state patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("crates/trillionnium-owner-open-job-runtime/src/manager.rs")
          text = path.read_text(encoding="utf-8")

          old_reader = "\n".join([
              "                        InternalProcessEvent::ReaderFailed { stream, error } => {",
              "                            if let Err(journal_error) = manager.push_runtime_event(",
              "                                &key,",
              "                                &request,",
              "                                RuntimeJobEventKind::JournalUnavailable {",
              "                                    error: Some(format!(\"{stream} reader failed: {error}\")),",
              "                                },",
              "                            ) {",
              "                                let _ = manager.note_journal_failure(journal_error.to_string());",
              "                            }",
              "                            let _ = running.control.kill(libc::SIGKILL);",
              "                        }",
              "",
          ])
          new_reader = "\n".join([
              "                        InternalProcessEvent::InputFailed { error } => {",
              "                            let _ = manager.push_runtime_event(",
              "                                &key,",
              "                                &request,",
              "                                RuntimeJobEventKind::ProcessFault {",
              "                                    phase: \"initial_stdin\".to_string(),",
              "                                    error,",
              "                                },",
              "                            );",
              "                            let _ = running.control.kill(libc::SIGKILL);",
              "                        }",
              "                        InternalProcessEvent::ReaderFailed { stream, error } => {",
              "                            let _ = manager.push_runtime_event(",
              "                                &key,",
              "                                &request,",
              "                                RuntimeJobEventKind::ProcessFault {",
              "                                    phase: format!(\"{stream}_reader\"),",
              "                                    error,",
              "                                },",
              "                            );",
              "                            let _ = running.control.kill(libc::SIGKILL);",
              "                        }",
              "",
          ])
          if text.count(old_reader) != 1:
              raise SystemExit("expected one reader-failure match block")
          text = text.replace(old_reader, new_reader)

          old_exit = "\n".join([
              "                        InternalProcessEvent::Exited {",
              "                            terminal_kind,",
              "                            exit_code,",
              "                            signal,",
              "                        } => {",
              "                            let stdout_bytes =",
          ])
          new_exit = "\n".join([
              "                        InternalProcessEvent::Exited {",
              "                            terminal_kind,",
              "                            exit_code,",
              "                            signal,",
              "                            cleanup_error,",
              "                        } => {",
              "                            if let Some(error) = cleanup_error {",
              "                                let _ = manager.push_runtime_event(",
              "                                    &key,",
              "                                    &request,",
              "                                    RuntimeJobEventKind::ProcessFault {",
              "                                        phase: \"process_group_cleanup\".to_string(),",
              "                                        error,",
              "                                    },",
              "                                );",
              "                            }",
              "                            let stdout_bytes =",
          ])
          if text.count(old_exit) != 1:
              raise SystemExit("expected one exited match block")
          text = text.replace(old_exit, new_exit)

          old_kind = "\n".join([
              "        RuntimeJobEventKind::Terminal { .. } => \"job.terminal.observation\",",
              "        RuntimeJobEventKind::JournalUnavailable { .. } => \"job.journal_unavailable\",",
          ])
          new_kind = "\n".join([
              "        RuntimeJobEventKind::Terminal { .. } => \"job.terminal.observation\",",
              "        RuntimeJobEventKind::ProcessFault { .. } => \"job.process_fault\",",
              "        RuntimeJobEventKind::JournalUnavailable { .. } => \"job.journal_unavailable\",",
          ])
          if text.count(old_kind) != 1:
              raise SystemExit("expected one runtime event kind block")
          text = text.replace(old_kind, new_kind)
          path.write_text(text, encoding="utf-8")
          PY
      - name: Apply deterministic Rust formatting
        run: cargo fmt --all
      - name: Commit patched and formatted source
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/trillionnium-owner-open-job-runtime/src/manager.rs \
                  crates/trillionnium-owner-open-job-runtime/src/process.rs \
                  crates/trillionnium-owner-open-job-runtime/src/types.rs \
                  apps/trillionnium-owner-open-host/src/bin/r5_transport_host/flow/queue.rs \
                  apps/trillionnium-owner-open-host/src/bin/r5_transport_host/flow/tests.rs
          git commit -m "fix(r5): converge process faults and cleanup uncertainty"
          git push origin HEAD:codex/owner-open-r5-gap-closure-20260829
