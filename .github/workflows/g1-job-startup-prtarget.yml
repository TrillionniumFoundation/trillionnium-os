name: G1 trusted job-startup object materialization

on:
  pull_request_target:
    types: [opened, reopened, synchronize]
    branches: [ops/g1-job-startup-validation-20260905]

permissions:
  contents: read
  actions: read

concurrency:
  group: g1-job-startup-prtarget-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  CANDIDATE: 9420aac7ec2a8c88416f00115031885f72227ccc
  CANDIDATE_TREE: 4cfb5fbbf9a38fd59c682fb1502aa95ba980e8da
  EXPECTED_MANAGER_BLOB: 9cc64a363f45c0ad01d71e442953e80b7303f0d7
  EXPECTED_DOC_BLOB: 0ff21f0f91d287f05d41fcf3a81a4590dc5611b5
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - name: Bind trusted trigger without reading head content
        env:
          EVENT_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          EVENT_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
        shell: bash
        run: |
          set -euo pipefail
          test "$EVENT_HEAD_REPOSITORY" = 'TrillionniumFoundation/trillionnium-os'
          test "$EVENT_HEAD_REF" = 'ops/g1-job-startup-prtarget-trigger-20260906'
          test "$EVENT_BASE_REF" = 'ops/g1-job-startup-validation-20260905'

      - name: Check out trusted base driver only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: driver
          fetch-depth: 1
          persist-credentials: false

      - name: Check out exact candidate as fixed subject
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 9420aac7ec2a8c88416f00115031885f72227ccc
          path: job-fixed
          fetch-depth: 1
          persist-credentials: false

      - name: Check out exact candidate as red baseline
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 9420aac7ec2a8c88416f00115031885f72227ccc
          path: job-baseline
          fetch-depth: 1
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@d8dfd7155fea72af4ad34a8fe97364d210e2d020
        with:
          toolchain: "1.93.0"
          components: rustfmt,clippy

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"

      - name: Prepare exact paired regression subjects
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" != 0
          test "$(git -C job-fixed --no-replace-objects rev-parse HEAD)" = "$CANDIDATE"
          test "$(git -C job-fixed --no-replace-objects rev-parse 'HEAD^{tree}')" = "$CANDIDATE_TREE"
          test "$(git -C job-baseline --no-replace-objects rev-parse HEAD)" = "$CANDIDATE"
          test "$(git -C job-baseline --no-replace-objects rev-parse 'HEAD^{tree}')" = "$CANDIDATE_TREE"
          echo '8673d2fb2c6435daf40e37a31278cfc9837959c71afd0297a5e69251332b7c34  driver/repair/job-startup.patch' | sha256sum --check
          mkdir -m 0700 "$RUNNER_TEMP/job-startup-results"
          git -C job-fixed apply --check "$GITHUB_WORKSPACE/driver/repair/job-startup.patch"
          git -C job-fixed apply "$GITHUB_WORKSPACE/driver/repair/job-startup.patch"
          python3 -I - <<'PY'
          import os
          from pathlib import Path
          root = Path(os.environ['GITHUB_WORKSPACE'])
          relative = Path('crates/trillionnium-owner-open-job-runtime/src/manager.rs')
          fixed = (root / 'job-fixed' / relative).read_text()
          begin = '    // BEGIN duplicate-start lock-scope regression\n'
          end = '    // END duplicate-start lock-scope regression\n'
          assert fixed.count(begin) == fixed.count(end) == 1
          regression = begin + fixed.split(begin, 1)[1].split(end, 1)[0] + end + '\n'
          path = root / 'job-baseline' / relative
          baseline = path.read_text()
          needle = '    #[test]\n    fn runtime_observation_sequence_exhaustion_fails_closed_without_a_phantom_event()'
          assert baseline.count(needle) == 1
          path.write_text(baseline.replace(needle, regression + needle, 1))
          PY
          rustc -Vv | tee "$RUNNER_TEMP/job-startup-results/toolchain.txt"
          cargo -V | tee -a "$RUNNER_TEMP/job-startup-results/toolchain.txt"

      - name: Require the original implementation to fail the real-child lock regression
        shell: bash
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/job-startup-target
        run: |
          set -euo pipefail
          cd job-baseline
          set +e
          timeout 600 cargo test --locked -p trillionnium-owner-open-job-runtime --lib manager::tests::duplicate_start_releases_running_map_before_startup_wait -- --exact --nocapture > "$RUNNER_TEMP/job-startup-results/baseline.log" 2>&1
          code=$?
          set -e
          cat "$RUNNER_TEMP/job-startup-results/baseline.log"
          test "$code" = 101
          grep -F 'duplicate start held the global map across its startup wait' "$RUNNER_TEMP/job-startup-results/baseline.log"
          grep -F 'test result: FAILED. 0 passed; 1 failed;' "$RUNNER_TEMP/job-startup-results/baseline.log"

      - name: Validate exact fixed bytes and complete source gates
        shell: bash
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/job-startup-target
        run: |
          set -euo pipefail
          cd job-fixed
          rustfmt --edition 2024 crates/trillionnium-owner-open-job-runtime/src/manager.rs
          rustfmt --edition 2024 --check crates/trillionnium-owner-open-job-runtime/src/manager.rs
          test "$(git hash-object crates/trillionnium-owner-open-job-runtime/src/manager.rs)" = "$EXPECTED_MANAGER_BLOB"
          test "$(git hash-object docs/modules/MOD-JOB-RUNTIME.md)" = "$EXPECTED_DOC_BLOB"
          cargo test --locked -p trillionnium-owner-open-job-runtime --all-targets 2>&1 | tee "$RUNNER_TEMP/job-startup-results/job-runtime.log"
          cargo test --locked --all-targets 2>&1 | tee "$RUNNER_TEMP/job-startup-results/product-source.log"
          cargo clippy --locked --all-targets -- -D warnings 2>&1 | tee "$RUNNER_TEMP/job-startup-results/clippy.log"
          python3 tools/docs/generate_global_docs.py --check
          python3 tools/docs/verify_global_docs.py
          python3 tools/docs/verify_module_documentation.py
          python3 tools/verify_g1_repository_closure.py --json > "$RUNNER_TEMP/job-startup-results/topology.json"
          python3 -m unittest tools.tests.test_owner_open_broker_module_documentation -v 2>&1 | tee "$RUNNER_TEMP/job-startup-results/module-docs.log"
          git diff --exit-code -- Cargo.lock planned/Cargo.lock docs/machine docs/generated .github
          git diff --check
          git diff --binary > "$RUNNER_TEMP/job-startup-results/final.patch"
          git add crates/trillionnium-owner-open-job-runtime/src/manager.rs docs/modules/MOD-JOB-RUNTIME.md
          python3 -I - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          paths = ['crates/trillionnium-owner-open-job-runtime/src/manager.rs', 'docs/modules/MOD-JOB-RUNTIME.md']
          changed = subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines()
          assert changed == paths, changed
          expected = {
              paths[0]: os.environ['EXPECTED_MANAGER_BLOB'],
              paths[1]: os.environ['EXPECTED_DOC_BLOB'],
          }
          files = []
          for path in paths:
              data = Path(path).read_bytes()
              git_blob = hashlib.sha1(('blob ' + str(len(data)) + '\0').encode() + data).hexdigest()
              assert git_blob == expected[path]
              files.append({'path': path, 'content': data.decode('utf-8'), 'sha256': hashlib.sha256(data).hexdigest(), 'git_blob': git_blob})
          value = {
              'candidate': os.environ['CANDIDATE'],
              'candidate_tree': os.environ['CANDIDATE_TREE'],
              'tree': subprocess.check_output(['git','write-tree'], text=True).strip(),
              'files': files,
              'validation_run': os.environ['GITHUB_RUN_ID'],
              'qualification_ceiling': 'SOURCE_OBJECTS_ONLY_PENDING_EXACT_HEAD_CI_AND_REVIEW',
              'zero_gap': False,
              'public_release': False,
          }
          (Path(os.environ['RUNNER_TEMP']) / 'job-startup-results' / 'source-files.json').write_text(json.dumps(value))
          PY

      - name: Retain all source diagnostics including the red baseline
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: job-startup-current-head-source
          path: ${{ runner.temp }}/job-startup-results
          if-no-files-found: error
          retention-days: 7

  materialize:
    needs: validate
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    permissions:
      contents: write
      actions: read
    steps:
      - name: Bind trusted trigger without reading head content
        env:
          EVENT_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          EVENT_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
        shell: bash
        run: |
          set -euo pipefail
          test "$EVENT_HEAD_REPOSITORY" = 'TrillionniumFoundation/trillionnium-os'
          test "$EVENT_HEAD_REF" = 'ops/g1-job-startup-prtarget-trigger-20260906'
          test "$EVENT_BASE_REF" = 'ops/g1-job-startup-validation-20260905'

      - name: Download same-run validated bytes without candidate checkout
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: job-startup-current-head-source
          path: ${{ runner.temp }}/validated-source

      - name: Create immutable Git objects only and keep product ref unchanged
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          /usr/bin/python3 -I - <<'PY'
          import hashlib, json, os, urllib.request
          from pathlib import Path
          repository = 'TrillionniumFoundation/trillionnium-os'
          candidate_ref = 'codex/g1-all-gap-closure-20260904'
          candidate = os.environ['CANDIDATE']
          candidate_tree = os.environ['CANDIDATE_TREE']
          assert os.environ['GITHUB_REPOSITORY'] == repository
          token = os.environ['GH_TOKEN']
          headers = {
              'Authorization': 'Bearer ' + token,
              'Accept': 'application/vnd.github+json',
              'Content-Type': 'application/json',
              'X-GitHub-Api-Version': '2022-11-28',
          }
          def get(path):
              request = urllib.request.Request('https://api.github.com/repos/' + repository + '/' + path, headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)
          def post(endpoint, payload):
              request = urllib.request.Request(
                  'https://api.github.com/repos/' + repository + '/git/' + endpoint,
                  data=json.dumps(payload).encode(), headers=headers, method='POST')
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)
          current = get('git/ref/heads/' + candidate_ref)
          assert current['object']['sha'] == candidate, 'candidate ref moved during validation'
          path = Path(os.environ['RUNNER_TEMP']) / 'validated-source' / 'source-files.json'
          raw = path.read_bytes()
          assert 0 < len(raw) <= 1024 * 1024
          value = json.loads(raw)
          assert value['candidate'] == candidate
          assert value['candidate_tree'] == candidate_tree
          paths = ['crates/trillionnium-owner-open-job-runtime/src/manager.rs', 'docs/modules/MOD-JOB-RUNTIME.md']
          expected_blobs = {
              paths[0]: os.environ['EXPECTED_MANAGER_BLOB'],
              paths[1]: os.environ['EXPECTED_DOC_BLOB'],
          }
          assert [entry['path'] for entry in value['files']] == paths
          elements = []
          for entry in value['files']:
              data = entry['content'].encode('utf-8')
              assert hashlib.sha256(data).hexdigest() == entry['sha256']
              expected = hashlib.sha1(('blob ' + str(len(data)) + '\0').encode() + data).hexdigest()
              assert expected == entry['git_blob'] == expected_blobs[entry['path']]
              blob = post('blobs', {'content': entry['content'], 'encoding': 'utf-8'})
              assert blob['sha'] == expected
              elements.append({'path': entry['path'], 'mode': '100644', 'type': 'blob', 'sha': blob['sha']})
          tree = post('trees', {'base_tree': candidate_tree, 'tree': elements})
          assert tree['sha'] == value['tree']
          message = (
              'fix(job-runtime): bound startup waits and release duplicate-start map lock\n\n'
              'Preserve accepted-job ownership on observation timeout. Add a real-child lock-scope regression and pending/notification/terminal tests. '
              'The original exact candidate fails the specific lock regression; fixed product tests, full workspace tests, strict Clippy and module documentation checks pass in workflow run '
              + os.environ['GITHUB_RUN_ID'] + '.\n\n'
              'No gap promotion, target evidence, main integration, independent approval or release claim. Fresh exact-head qualification remains required.\n\n'
              'Signed-off-by: OpenAI Codex <noreply@openai.com>'
          )
          commit = post('commits', {'message': message, 'tree': tree['sha'], 'parents': [candidate]})
          output = {
              'commit': commit['sha'], 'tree': tree['sha'], 'parent': candidate,
              'run': os.environ['GITHUB_RUN_ID'], 'candidate_ref_unchanged': True,
              'ref_updated': False, 'zero_gap': False, 'public_release': False,
          }
          Path('job-startup-current-head-commit.json').write_text(json.dumps(output, indent=2) + '\n')
          print(json.dumps(output))
          PY

      - name: Retain materialized object identity
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: job-startup-current-head-commit
          path: ${{ runner.temp }}/job-startup-current-head-commit.json
          if-no-files-found: error
          retention-days: 7
