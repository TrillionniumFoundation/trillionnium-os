          cargo test --locked --all-targets
          cargo clippy --locked --all-targets -- -D warnings
          cargo check --locked --workspace --all-targets
          cmp --silent Cargo.lock "$RUNNER_TEMP/reviewed-Cargo.lock"
          git --no-replace-objects diff --check

      - name: Commit only qualified persistent source
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .github/workflows/owner-open-r7-runtime-hardening-v4-executor.yml
          git --no-replace-objects diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(r7): harden provider and job runtime boundaries"
          git push origin "HEAD:$TARGET_BRANCH"

      - name: Ensure one stacked draft PR exists
        shell: bash
        run: |
          set -u
          owner="${GITHUB_REPOSITORY%%/*}"
          pr_number="$(gh api --method GET "repos/$GITHUB_REPOSITORY/pulls" \
            -f state=open -f head="$owner:$TARGET_BRANCH" -F per_page=20 2>/dev/null \
            | jq -r '.[0].number // empty' || true)"
          if [ -z "$pr_number" ]; then
            cat > "$RUNNER_TEMP/pr-body.md" <<EOF
          ## Purpose

          Close post-R6 repository-local runtime and workflow-boundary findings while preserving the canonical L2-L6 evidence holds.

          ## Qualified source changes

          - durable job journal required by default in the product-facing v7 core;
          - explicit unsafe development override for unjournaled effects;
          - allowlisted Provider environment and parent-death race protection;
          - fallible Provider reader creation with bounded child cleanup;
          - parent PID captured before fork for pipe and PTY jobs;
          - bounded SpawnGuard rollback;
          - truthful PTY EOT result semantics;
          - all-generation, named-step-aware owner-open workflow auditing.

          ## One-shot qualification

          Executor run: $GITHUB_RUN_ID / attempt $GITHUB_RUN_ATTEMPT. The write-capable executor deleted itself before Python, canonical, Rust selected-closure and full-workspace compilation gates ran.

          ## Claim boundary

          L1 source candidate only. Protected-main, independent review, installed Root Linux/Codex, Android target-files, physical ADB, destructive faults, signing and public release remain unclaimed.
          EOF
            gh pr create --repo "$GITHUB_REPOSITORY" --draft \
              --base "$TARGET_BASE" --head "$TARGET_BRANCH" \
              --title "fix(r7): harden provider and job runtime boundaries" \
              --body-file "$RUNNER_TEMP/pr-body.md" >/dev/null || true
            pr_number="$(gh api --method GET "repos/$GITHUB_REPOSITORY/pulls" \
              -f state=open -f head="$owner:$TARGET_BRANCH" -F per_page=20 2>/dev/null \
              | jq -r '.[0].number // empty' || true)"
          fi
          if [ -n "$pr_number" ]; then
            gh pr edit "$pr_number" --repo "$GITHUB_REPOSITORY" \
              --add-reviewer ProfHepta --add-label ready-for-review >/dev/null 2>&1 || true
          fi
          exit 0
