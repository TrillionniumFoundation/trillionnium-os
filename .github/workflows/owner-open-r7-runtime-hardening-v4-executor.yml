        report = MODULE.verify(self.make_root())
        self.assertTrue(report["ok"], report)

    def test_r7_workflow_cannot_escape_write_permission_scan(self) -> None:
        root = self.make_root()
        path = root / ".github" / "workflows" / "owner-open-r7-escape.yml"
        path.write_text(
            CHECKOUT.replace("contents: read", "contents: write"),
            encoding="utf-8",
        )
