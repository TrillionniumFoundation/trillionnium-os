class WorkflowBoundaryHardeningTest(unittest.TestCase):
    def make_root(self) -> Path:
        root = Path(tempfile.mkdtemp())
        workflows = root / ".github" / "workflows"
        workflows.mkdir(parents=True)
        for name in (
            "owner-open-r5-tool-loop.yml",
