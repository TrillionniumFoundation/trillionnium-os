Status: **SOURCE CANDIDATE — exact-head L1 qualification required**

This slice is stacked on the R6 integration terminal and does not alter the
canonical L2-L6 evidence ceiling. It hardens repository-local mechanics:

- the product-facing v7 core requires durable job journaling by default;
- unjournaled job effects require an explicit unsafe development flag;
- Provider child environments are allowlisted instead of inherited wholesale;
- Provider and job children bind parent-death setup to the Host PID observed
  before fork and reject the setup race;
- Provider reader-thread creation failures perform bounded process cleanup;
- SpawnGuard rollback no longer executes an unbounded wait in `Drop`;
- PTY EOT delivery is not reported as a file-descriptor close;
- workflow governance scans every owner-open generation and both named and
  anonymous checkout-step shapes.

The slice is source-only. It does not claim protected-main enforcement,
independent approval, installed Root Linux or Codex, Android target-files,
physical ADB, destructive-fault evidence, signing, or public release.
''',
