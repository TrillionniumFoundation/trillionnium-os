name: Owner-Open R7 runtime hardening v4 executor

on:
  push:
    branches:
      - codex/owner-open-r7-runtime-hardening-20260830-v4
    paths:
      - .github/workflows/owner-open-r7-runtime-hardening-v4-executor.yml

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: owner-open-r7-runtime-hardening-v4
  cancel-in-progress: false

jobs:
  qualify-and-publish:
    name: Qualify and publish persistent runtime hardening
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_BRANCH: codex/owner-open-r7-runtime-hardening-20260830-v4
      TARGET_BASE: codex/owner-open-r5-gap-closure-20260829
      EXPECTED_BASE: 34d8b731370b42f84fb50c34ecd6ca41b39f0d08
      CARGO_INCREMENTAL: "0"
      RUST_BACKTRACE: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONWARNINGS: error::ResourceWarning

    steps:
      - name: Check out exact executor head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: codex/owner-open-r7-runtime-hardening-20260830-v4

      - name: Assert immutable base and clean executor checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git --no-replace-objects rev-parse HEAD^)" = "$EXPECTED_BASE"
          test -z "$(git --no-replace-objects status --porcelain=v1 --untracked-files=all)"

      - name: Apply reviewed runtime, process and governance hardening
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"{path}: expected exactly one match, observed {count}: {old!r}"
                  )
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          # The product-facing v7 core requires a durable job journal by
          # default. Memory-only effects remain available only behind an
          # explicit, visibly unsafe development flag.
          replace_once(
              "apps/trillionnium-owner-open-host/src/bin/r5_control_host_v7/entry.rs",
              "        let mut require_job_journal = false;\n",
              "        let mut require_job_journal = true;\n",
          )
          replace_once(
              "apps/trillionnium-owner-open-host/src/bin/r5_control_host_v7/entry.rs",
              "                \"--require-job-journal\" => {\n                    require_job_journal = true;\n                }\n",
              "                \"--require-job-journal\" => {\n                    require_job_journal = true;\n                }\n                \"--allow-unjournaled-effects-for-development\" => {\n                    require_job_journal = false;\n                }\n",
          )
          replace_once(
              "apps/trillionnium-owner-open-host/src/bin/r5_control_host_v7/entry.rs",
              "Long-running job options:\\n  --job-store /absolute/path/jobs.jsonl\\n  --require-job-journal\\n\\n",
              "Long-running job options:\\n  --job-store /absolute/path/jobs.jsonl\\n  --require-job-journal (accepted for compatibility; durability is required by default)\\n  --allow-unjournaled-effects-for-development (unsafe development-only override)\\n\\n",
          )

          # Provider environment inheritance is deny-by-default. Only the
          # operational variables required by the selected product topology,
          # plus an explicit validated EnvironmentDelta, cross the boundary.
          provider = Path("crates/trillionnium-owner-open-provider-jsonl/src/lib.rs")
          text = provider.read_text(encoding="utf-8")
          launch_old = '''        if let Some(cwd) = &self.config.cwd {
            command.current_dir(cwd);
        }
        for (key, value) in &self.config.env {
            match value {
                Some(value) => {
                    command.env(key, value);
                }
                None => {
                    command.env_remove(key);
                }
            }
        }
        unsafe {
            command.pre_exec(|| {
                if libc::setpgid(0, 0) != 0 {
                    return Err(std::io::Error::last_os_error());
                }
                Ok(())
            });
        }
'''
          launch_new = '''        if let Some(cwd) = &self.config.cwd {
            command.current_dir(cwd);
        }
        apply_provider_environment(&mut command, &self.config.env);
        let parent_pid = unsafe { libc::getpid() };
        unsafe {
            command.pre_exec(move || {
                if libc::setpgid(0, 0) != 0 {
                    return Err(std::io::Error::last_os_error());
                }
                #[cfg(any(target_os = "linux", target_os = "android"))]
                {
                    if libc::prctl(libc::PR_SET_PDEATHSIG, libc::SIGKILL) != 0 {
                        return Err(std::io::Error::last_os_error());
                    }
                    if libc::getppid() != parent_pid {
                        return Err(std::io::Error::from_raw_os_error(libc::ECHILD));
                    }
                }
                Ok(())
            });
        }
