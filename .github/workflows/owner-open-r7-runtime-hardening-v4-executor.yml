## R7 close-stdin result precision

The product response distinguishes a real pipe descriptor close from the PTY
compatibility action:

```text
pipe: status=stdin_closed, mode=pipe_close
pty:  status=pty_eot_sent, mode=pty_eot
```

`pty_eot_sent` records only that byte `0x04` was written to the PTY master. It
does not claim that a raw-mode or application-managed terminal interpreted the
byte as end-of-file.
'''
