name: TrillionniumGame all-branches consolidation relay

on:
  push:
    branches:
      - ci/trillionniumgame-exact-head-relay-v1
    paths:
      - '.github/workflows/trillionniumgame-all-branches-consolidation-relay.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trillionniumgame-all-branches-consolidation-${{ github.ref }}
  cancel-in-progress: false

env:
  TARGET_REPOSITORY: TrillionniumFoundation/TrillionniumGame
  TARGET_BRANCH: integration/all-branches-main-v1
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse

jobs:
  source-and-static:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Resolve immutable integration head
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          sha=$(git ls-remote "https://github.com/${TARGET_REPOSITORY}.git" \
            "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')
          test -n "$sha"
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"

      - name: Check out exact integration head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ env.TARGET_REPOSITORY }}
          ref: ${{ steps.resolve.outputs.sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false

      - name: Install exact toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal \
            --component rustfmt --component clippy
          rustup default 1.85.1
          rustc --version --verbose
          cargo --version --verbose
          go version
          python3 --version

      - name: Prove branch ancestry and materialize source
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          evidence=relay-evidence/consolidation
          mkdir -p "$evidence/materialized"
          test "$(git rev-parse HEAD)" = '${{ steps.resolve.outputs.sha }}'
          git fetch --force origin '+refs/heads/*:refs/remotes/origin/*'
          git rev-parse HEAD > "$evidence/commit.txt"
          git rev-parse HEAD^{tree} > "$evidence/tree.txt"
          : > "$evidence/branches.tsv"
          : > "$evidence/non-ancestor-branches.txt"
          while IFS= read -r ref; do
            branch=${ref#refs/remotes/origin/}
            [[ "$branch" == 'HEAD' ]] && continue
            sha=$(git rev-parse "$ref")
            if [[ "$branch" == "$TARGET_BRANCH" || "$branch" == 'main' ]]; then
              relation=self-or-target
            elif git merge-base --is-ancestor "$sha" HEAD; then
              relation=ancestor
            else
              relation=NOT_ANCESTOR
              printf '%s\t%s\n' "$branch" "$sha" \
                >> "$evidence/non-ancestor-branches.txt"
            fi
            printf '%s\t%s\t%s\n' "$branch" "$sha" "$relation" \
              >> "$evidence/branches.tsv"
          done < <(git for-each-ref --format='%(refname)' refs/remotes/origin | sort)
          test ! -s "$evidence/non-ancestor-branches.txt"

          cargo generate-lockfile \
            > "$evidence/cargo-generate-lockfile.log" 2>&1
          cargo fmt --all > "$evidence/root-cargo-fmt.log" 2>&1
          isolated=(
            crates/trnm-token-jwt-adapter/Cargo.toml
            crates/trnm-token-jwt-adapter-gate/Cargo.toml
            crates/trnm-token-jwt-adapter-gate-v2/Cargo.toml
            crates/trnm-presence-router-v2/Cargo.toml
          )
          for manifest in "${isolated[@]}"; do
            cargo fmt --manifest-path "$manifest"
          done
          git diff --binary -- . ':(exclude)relay-evidence' \
            > "$evidence/materialization.patch"
          git diff --name-only -- . ':(exclude)relay-evidence' \
            > "$evidence/materialized-files.txt"
          while IFS= read -r path; do
            [[ -z "$path" || ! -f "$path" ]] && continue
            mkdir -p "$evidence/materialized/$(dirname "$path")"
            cp "$path" "$evidence/materialized/$path"
          done < "$evidence/materialized-files.txt"
          git diff --check -- . ':(exclude)relay-evidence'

      - name: Validate root and isolated Rust workspaces
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          evidence=relay-evidence/consolidation
          cargo fmt --all -- --check \
            > "$evidence/root-fmt-check.log" 2>&1
          cargo test --workspace --all-targets --locked \
            2>&1 | tee "$evidence/root-test.log"
          cargo clippy --workspace --all-targets --locked -- -D warnings \
            2>&1 | tee "$evidence/root-clippy.log"
          isolated=(
            crates/trnm-token-jwt-adapter/Cargo.toml
            crates/trnm-token-jwt-adapter-gate/Cargo.toml
            crates/trnm-token-jwt-adapter-gate-v2/Cargo.toml
            crates/trnm-presence-router-v2/Cargo.toml
          )
          for manifest in "${isolated[@]}"; do
            label=$(basename "$(dirname "$manifest")")
            cargo fmt --manifest-path "$manifest" -- --check \
              > "$evidence/${label}-fmt.log" 2>&1
            cargo test --manifest-path "$manifest" --all-targets --locked \
              2>&1 | tee "$evidence/${label}-test.log"
            cargo clippy --manifest-path "$manifest" --all-targets --locked \
              -- -D warnings 2>&1 | tee "$evidence/${label}-clippy.log"
          done

      - name: Validate plan, Python contracts and deployed World runtime
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          evidence=relay-evidence/consolidation
          python3 -m compileall -q scripts tests tools
          checks=(
            scripts/check-plan.py
            scripts/check-rust-foundation.py
            scripts/check-storage-core.py
            scripts/check-persistence-core.py
            scripts/check-foundation-schema.py
            scripts/check-database-v2.py
            scripts/check-pgwire-persistence-adapter.py
            scripts/test-canonical-framing.py
            scripts/check-transport-core.py
            scripts/check-token-core.py
            scripts/check-presence-core.py
            scripts/verify-presence-router-v2.py
            scripts/check-query-core.py
          )
          for check in "${checks[@]}"; do
            label=$(basename "$check")
            python3 "$check" 2>&1 | tee "$evidence/${label}.log"
          done
          python3 -m unittest discover -s tests -p 'test_*.py' \
            2>&1 | tee "$evidence/unittest-discover.log"
          python3 - <<'PY'
          import json
          from pathlib import Path
          for path in sorted(Path('.').rglob('*.json')):
              if '.git' in path.parts or 'target' in path.parts or 'relay-evidence' in path.parts:
                  continue
              json.loads(path.read_text(encoding='utf-8'))
          PY
          find scripts -type f -name '*.sh' -print0 \
            | sort -z | xargs -0 -n1 bash -n
          (cd runtime && go test -mod=readonly ./...) \
            2>&1 | tee "$evidence/go-test.log"
          git status --short -- . ':(exclude)relay-evidence' \
            > "$evidence/git-status-after-materialization.txt"
          find "$evidence" -type f ! -name SHA256SUMS -print0 \
            | sort -z | xargs -0 sha256sum > "$evidence/SHA256SUMS"

      - name: Upload static evidence and materialized files
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trillionniumgame-consolidation-static-${{ steps.resolve.outputs.sha }}-run-${{ github.run_number }}
          path: source/relay-evidence
          if-no-files-found: error
          retention-days: 30

  postgresql-live:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Resolve immutable integration head
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          sha=$(git ls-remote "https://github.com/${TARGET_REPOSITORY}.git" \
            "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')
          test -n "$sha"
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"
      - name: Check out exact integration head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ env.TARGET_REPOSITORY }}
          ref: ${{ steps.resolve.outputs.sha }}
          path: source
          fetch-depth: 1
          persist-credentials: false
      - name: Install exact Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal
          rustup default 1.85.1
      - name: Execute PostgreSQL adapter contract
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          TRNM_EVIDENCE_ROOT=relay-evidence/pgwire \
            bash scripts/ci-pgwire-persistence-adapter.sh postgresql
      - name: Upload PostgreSQL evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trillionniumgame-consolidation-postgresql-${{ steps.resolve.outputs.sha }}-run-${{ github.run_number }}
          path: source/relay-evidence
          if-no-files-found: error
          retention-days: 30

  cockroachdb-live:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Resolve immutable integration head
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          sha=$(git ls-remote "https://github.com/${TARGET_REPOSITORY}.git" \
            "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')
          test -n "$sha"
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"
      - name: Check out exact integration head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ env.TARGET_REPOSITORY }}
          ref: ${{ steps.resolve.outputs.sha }}
          path: source
          fetch-depth: 1
          persist-credentials: false
      - name: Install exact Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal
          rustup default 1.85.1
      - name: Execute CockroachDB adapter contract
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          TRNM_EVIDENCE_ROOT=relay-evidence/pgwire \
            bash scripts/ci-pgwire-persistence-adapter.sh cockroachdb
      - name: Upload CockroachDB evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trillionniumgame-consolidation-cockroachdb-${{ steps.resolve.outputs.sha }}-run-${{ github.run_number }}
          path: source/relay-evidence
          if-no-files-found: error
          retention-days: 30

  publish:
    if: always()
    needs:
      - source-and-static
      - postgresql-live
      - cockroachdb-live
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out relay audit branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ci/trillionniumgame-exact-head-relay-v1
          fetch-depth: 1
          persist-credentials: true
      - name: Download consolidation evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: trillionniumgame-consolidation-*-run-${{ github.run_number }}
          path: downloaded
          merge-multiple: false
      - name: Publish immutable and latest evidence
        shell: bash
        env:
          STATIC_RESULT: ${{ needs.source-and-static.result }}
          POSTGRESQL_RESULT: ${{ needs.postgresql-live.result }}
          COCKROACHDB_RESULT: ${{ needs.cockroachdb-live.result }}
        run: |
          set -euo pipefail
          destination="relay-repairs/consolidation-run-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ID}"
          latest="relay-repairs/latest-consolidation"
          mkdir -p "$destination"
          rm -rf "$latest"
          mkdir -p "$latest"
          cp -R downloaded/. "$destination/"
          cp -R downloaded/. "$latest/"
          printf '%s\n' "$GITHUB_RUN_ID" > "$destination/run-id.txt"
          printf '%s\n' "$GITHUB_SHA" > "$destination/relay-head.txt"
          printf 'static=%s\npostgresql=%s\ncockroachdb=%s\n' \
            "$STATIC_RESULT" "$POSTGRESQL_RESULT" "$COCKROACHDB_RESULT" \
            > "$destination/results.txt"
          cp "$destination/results.txt" "$latest/results.txt"
          find "$destination" -type f ! -name SHA256SUMS -print0 \
            | sort -z | xargs -0 sha256sum > "$destination/SHA256SUMS"
          find "$latest" -type f ! -name SHA256SUMS -print0 \
            | sort -z | xargs -0 sha256sum > "$latest/SHA256SUMS"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$destination" "$latest"
          git commit -m "ci(relay): publish consolidation run ${GITHUB_RUN_NUMBER}"
          git push origin HEAD:ci/trillionniumgame-exact-head-relay-v1
          test "$STATIC_RESULT" = success
          test "$POSTGRESQL_RESULT" = success
          test "$COCKROACHDB_RESULT" = success
