name: L1 owner-open R5 governance protection bootstrap

on:
  push:
    branches:
      - codex/owner-open-r5-gap-closure-20260829
    paths:
      - ".github/workflows/owner-open-r5-governance-bootstrap-v1.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: owner-open-r5-governance-protection-bootstrap
  cancel-in-progress: false

jobs:
  protect:
    name: L1 governance protection attempt and evidence capture
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ADMIN_TOKEN: ${{ secrets.OWNER_OPEN_R5_GOVERNANCE_TOKEN || github.token }}
      EXPECTED_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Apply protection only with real administration authority
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python3 - <<'PY'
          from datetime import datetime, timezone
          import json
          import os
          from pathlib import Path
          import urllib.error
          import urllib.request

          repository = os.environ['GITHUB_REPOSITORY']
          owner, repo = repository.split('/', 1)
          token = os.environ.get('ADMIN_TOKEN', '')
          headers = {
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'Content-Type': 'application/json',
          }
          if token:
              headers['Authorization'] = f'Bearer {token}'

          payload = {
              'required_status_checks': {
                  'strict': True,
                  'contexts': [
                      'L1 graph, documents, Python and broker closure',
                      'L1 Rust 1.93 source closure',
                      'L1 aggregate exact-head candidate',
                  ],
              },
              'enforce_admins': True,
              'required_pull_request_reviews': {
                  'dismissal_restrictions': {},
                  'dismiss_stale_reviews': True,
                  'require_code_owner_reviews': True,
                  'required_approving_review_count': 1,
                  'require_last_push_approval': True,
              },
              'restrictions': None,
              'required_linear_history': True,
              'allow_force_pushes': False,
              'allow_deletions': False,
              'block_creations': False,
              'required_conversation_resolution': True,
              'lock_branch': False,
              'allow_fork_syncing': True,
          }

          def request(path: str, *, method: str = 'GET', body=None):
              raw = None if body is None else json.dumps(body).encode()
              req = urllib.request.Request(f'https://api.github.com/repos/{repository}/{path}', data=raw, method=method, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      value = json.loads(response.read().decode() or '{}')
                      return {'ok': True, 'status': response.status, 'value': value}
              except urllib.error.HTTPError as error:
                  return {'ok': False, 'status': error.code, 'error': error.read().decode(errors='replace')[-4096:]}
              except Exception as error:
                  return {'ok': False, 'status': None, 'error': str(error)}

          attempt = request('branches/main/protection', method='PUT', body=payload)
          observed_branch = request('branches/main')
          observed_protection = request('branches/main/protection')
          observed_rulesets = request('rulesets')
          protected = bool(observed_branch.get('ok') and observed_branch['value'].get('protected'))
          contexts = []
          review_count = None
          force_pushes = None
          if observed_protection.get('ok'):
              value = observed_protection['value']
              contexts = value.get('required_status_checks', {}).get('contexts', [])
              review_count = value.get('required_pull_request_reviews', {}).get('required_approving_review_count')
              force_pushes = value.get('allow_force_pushes', {}).get('enabled')
          required = payload['required_status_checks']['contexts']
          verified = (
              protected
              and set(required).issubset(set(contexts))
              and isinstance(review_count, int)
              and review_count >= 1
              and force_pushes is False
          )
          report = {
              'schema': 'org.trillionnium.owner-open-r5.governance-bootstrap.v1',
              'captured_at': datetime.now(timezone.utc).isoformat().replace('+00:00', 'Z'),
              'repository': repository,
              'source_commit': os.environ['EXPECTED_SHA'],
              'branch': 'main',
              'attempt': attempt,
              'observed_branch': observed_branch,
              'observed_protection': observed_protection,
              'observed_rulesets': observed_rulesets,
              'required_contexts': required,
              'protection_verified': verified,
              'automatic_redispatch': False,
              'claim_ceiling': 'GOVERNANCE_PROTECTION_OBSERVED_PENDING_EXACT_HEAD_INDEPENDENT_APPROVAL' if verified else 'RESUME_REQUIRED_ADMIN_AUTHORITY_OR_PROTECTION',
          }
          Path('owner-open-r5-governance-bootstrap.json').write_text(json.dumps(report, indent=2, sort_keys=True) + '\n')
          print(json.dumps({'protection_verified': verified, 'attempt_status': attempt.get('status'), 'claim_ceiling': report['claim_ceiling']}, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: owner-open-r5-governance-bootstrap-${{ github.sha }}-${{ github.run_id }}
          path: owner-open-r5-governance-bootstrap.json
          if-no-files-found: error
          retention-days: 30
