name: Owner-Open R15 final identity-bound materializer

on:
  push:
    branches:
      - ops/owner-open-r15-final-materializer-20260831-v17

permissions:
  contents: write

concurrency:
  group: owner-open-r15-source-materializer
  cancel-in-progress: true

env:
  BASE_COMMIT: 7ca4d64de1d5acee65a1592b0903a1b4c5bc11b0
  MATERIAL_BRANCH: ops/owner-open-r15-atomic-builder-20260831-v12
  MATERIAL_COMMIT: 80b24d7ebadef58f2fcfc576fc211cbe974b1d69
  TARGET_BRANCH: codex/owner-open-r15-runtime-hardening-20260831
  EXPECTED_TARGET_HEAD: eb1aa598cf466120200b064b8ebfbb3763935688
  PATCH_SHA256: f30cd81483225ebda3192aa8e7ce29a194e1086d290e2a8aae915e1bc5462ae3
  CARGO_INCREMENTAL: "0"
  PYTHONDONTWRITEBYTECODE: "1"
  TRILLIONNIUM_P01_CONFORMANCE_BUILD_VARIANT: userdebug
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

jobs:
  materialize-and-qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Check out exact final materializer
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: ${{ github.sha }}

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"

      - name: Set up Rust 1.93
        uses: dtolnay/rust-toolchain@d8dfd7155fea72af4ad34a8fe97364d210e2d020
        with:
          toolchain: "1.93.0"
          components: rustfmt, clippy

      - name: Materialize, qualify and atomically publish ordinary source
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$GITHUB_REF_NAME" = "ops/owner-open-r15-final-materializer-20260831-v17"
          test "$(git --no-replace-objects rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git --no-replace-objects status --porcelain=v1 --untracked-files=all)"

          git fetch --no-tags origin \
            "+refs/heads/$MATERIAL_BRANCH:refs/remotes/origin/$MATERIAL_BRANCH" \
            "+refs/heads/$TARGET_BRANCH:refs/remotes/origin/$TARGET_BRANCH"
          test "$(git rev-parse refs/remotes/origin/$MATERIAL_BRANCH)" = "$MATERIAL_COMMIT"
          test "$(git rev-parse refs/remotes/origin/$TARGET_BRANCH)" = "$EXPECTED_TARGET_HEAD"
          git cat-file -e "$BASE_COMMIT^{commit}"

          patch_gz=/tmp/owner-open-r15-runtime-hardening.patch.gz
          patch=/tmp/owner-open-r15-runtime-hardening.patch
          workflow_copy=/tmp/owner-open-r15-runtime-hardening.yml
          rm -f "$patch_gz" "$patch" "$workflow_copy" /tmp/owner-open-r15-contract-fix-v*.py
          for part in 00 01 02 03 04 05; do
            git show "$MATERIAL_COMMIT:.github/owner-open-r15-runtime-hardening.patch.gz.$part" >> "$patch_gz"
          done
          echo "$PATCH_SHA256  $patch_gz" | sha256sum -c -
          gzip -dc "$patch_gz" > "$patch"
          chmod 600 "$patch"
          for version in v11 v13 v14 v15 v16 v17; do
            script="/tmp/owner-open-r15-contract-fix-$version.py"
            git show "$MATERIAL_COMMIT:.github/owner-open-r15-contract-fix-$version.py" > "$script"
            chmod 600 "$script"
            python3 -m py_compile "$script"
          done

          git switch --detach "$BASE_COMMIT"
          git switch -C "$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$BASE_COMMIT"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          git apply --index --whitespace=error "$patch"
          for version in v11 v13 v14 v15 v16 v17; do
            python3 "/tmp/owner-open-r15-contract-fix-$version.py"
          done
          cargo fmt --all
          git add -A
          cp .github/workflows/owner-open-r15-runtime-hardening.yml "$workflow_copy"

          cat > /tmp/r15-expected-paths.txt <<'EOF'
          .github/workflows/owner-open-r15-runtime-hardening.yml
          apps/trillionnium-agent-privilege-broker/src/linux_provider_post_exec_test_kernel.rs
          apps/trillionnium-owner-open-host/src/bin/r5_control_host_v6/entry.rs
          apps/trillionnium-owner-open-host/src/bin/r5_control_host_v7/entry.rs
          apps/trillionniumd/src/direct_operation_runtime_authority_transport.rs
          apps/trillionniumd/src/main.rs
          crates/trillionnium-owner-open-job-runtime/src/manager.rs
          crates/trillionnium-owner-open-job-runtime/src/process.rs
          crates/trillionnium-owner-open-job-runtime/src/types.rs
          crates/trillionnium-owner-open-job-runtime/tests/runtime.rs
          crates/trillionnium-owner-open-provider-jsonl/src/lib.rs
          crates/trillionnium-owner-open-provider-jsonl/src/process.rs
          crates/trillionnium-owner-open-runtime/src/process.rs
          crates/trillionnium-owner-open-runtime/src/types.rs
          crates/trillionnium-shell-exec/src/durable.rs
          docs/protocols/owner-open-jobs-v1.md
          tools/tests/test_owner_open_r15_runtime_hardening.py
          tools/verify-owner-open-r5-workflow-boundaries.py
          EOF
          sed -i 's/^          //' /tmp/r15-expected-paths.txt
          LC_ALL=C sort -o /tmp/r15-expected-paths.txt /tmp/r15-expected-paths.txt
          git diff --cached --name-only | LC_ALL=C sort > /tmp/r15-actual-paths.txt
          diff -u /tmp/r15-expected-paths.txt /tmp/r15-actual-paths.txt
          git diff --cached --check

          python3 tools/generate-owner-open-types.py --check
          python3 tools/verify-owner-open-r5.py --json
          python3 tools/verify-owner-open-r5-gap-evidence.py --json
          python3 -m compileall -q tools
          PYTHONWARNINGS=error::ResourceWarning python3 -m unittest discover -s tools/tests -p 'test_*.py' -v
          python3 tools/verify-owner-open-r5-workflow-boundaries.py --json

          cargo metadata --locked --format-version 1 > /tmp/r15-cargo-metadata.json
          cargo fmt --all -- --check
          cargo test --locked --workspace --all-targets
          cargo clippy --locked --workspace --all-targets -- -D warnings
          RUSTDOCFLAGS="-D warnings" cargo doc --locked --workspace --no-deps

          cargo test -p trillionnium-agent-direct-tools --all-targets --no-default-features --features dev-overrides --locked
          cargo test -p trillionnium-agent-direct-tools --all-targets --no-default-features --features development-compatibility-lane --locked
          cargo test -p trillionnium-agent-direct-tools --all-targets --no-default-features --features production-durable-hotpath --locked
          cargo test -p trillionnium-agent-direct-tools --all-targets --no-default-features --features device-launch-package-conformance --locked
          cargo test -p trillionnium-tool-runtime --all-targets --all-features --locked
          cargo test -p trillionnium-shell-exec --all-targets --all-features --locked
          cargo test -p trillionnium-agent-privilege-broker --all-targets --features p0-launch-package-device-conformance --locked
          cargo test -p trillionnium-os-types --all-targets --all-features --locked
          cargo test -p trillionnium-privilege-broker-protocol --all-targets --all-features --locked
          cargo test -p trillionniumd --all-targets --no-default-features --features dev-conformance-fault-hook,legacy-plan-conformance --locked

          cargo clippy -p trillionnium-agent-direct-tools --all-targets --no-default-features --features dev-overrides --locked -- -D warnings
          cargo clippy -p trillionnium-agent-direct-tools --all-targets --no-default-features --features development-compatibility-lane --locked -- -D warnings
          cargo clippy -p trillionnium-agent-direct-tools --all-targets --no-default-features --features production-durable-hotpath --locked -- -D warnings
          cargo clippy -p trillionnium-agent-direct-tools --all-targets --no-default-features --features device-launch-package-conformance --locked -- -D warnings
          cargo clippy -p trillionnium-tool-runtime --all-targets --all-features --locked -- -D warnings
          cargo clippy -p trillionnium-shell-exec --all-targets --all-features --locked -- -D warnings
          cargo clippy -p trillionnium-agent-privilege-broker --all-targets --features p0-launch-package-device-conformance --locked -- -D warnings
          cargo clippy -p trillionnium-os-types --all-targets --all-features --locked -- -D warnings
          cargo clippy -p trillionnium-privilege-broker-protocol --all-targets --all-features --locked -- -D warnings
          cargo clippy -p trillionniumd --all-targets --no-default-features --features dev-conformance-fault-hook,legacy-plan-conformance --locked -- -D warnings

          test -z "$(git diff --name-only)"
          git diff --cached --check

          git rm --cached --force .github/workflows/owner-open-r15-runtime-hardening.yml
          rm .github/workflows/owner-open-r15-runtime-hardening.yml
          grep -v '^\.github/workflows/owner-open-r15-runtime-hardening\.yml$' /tmp/r15-expected-paths.txt > /tmp/r15-source-expected-paths.txt
          git diff --cached --name-only | LC_ALL=C sort > /tmp/r15-source-actual-paths.txt
          diff -u /tmp/r15-source-expected-paths.txt /tmp/r15-source-actual-paths.txt
          test ! -e .github/workflows/owner-open-r15-runtime-hardening.yml
          git diff --cached --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(r15): harden runtime durability and process identity"
          test "$(git rev-parse HEAD^)" = "$BASE_COMMIT"
          source_commit="$(git rev-parse HEAD)"
          source_tree="$(git rev-parse HEAD^{tree})"
          git push --force-with-lease="refs/heads/$TARGET_BRANCH:$EXPECTED_TARGET_HEAD" origin "HEAD:refs/heads/$TARGET_BRANCH"

          echo "R15_SOURCE_COMMIT=$source_commit"
          echo "R15_SOURCE_TREE=$source_tree"
          echo "R15_WORKFLOW_TEXT_BEGIN"
          cat "$workflow_copy"
          echo "R15_WORKFLOW_TEXT_END"
