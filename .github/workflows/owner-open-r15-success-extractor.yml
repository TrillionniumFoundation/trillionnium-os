name: Owner-Open R15 source publication extractor

on:
  push:
    branches:
      - ops/owner-open-r15-success-extractor-20260831

permissions:
  actions: read
  contents: read

concurrency:
  group: owner-open-r15-source-publication-extractor
  cancel-in-progress: true

jobs:
  extract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      TARGET_JOB_ID: "99389332725"
    steps:
      - name: Print bounded executed output from exact materializer job
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          api="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/jobs/$TARGET_JOB_ID"
          state="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$api")"
          test "$(printf '%s' "$state" | python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])')" = completed

          log=/tmp/owner-open-r15-materializer.log
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$api/logs" --output "$log"

          python3 - "$log" <<'PY'
          import re
          import sys
          from pathlib import Path

          raw = Path(sys.argv[1]).read_bytes()
          text = raw.decode("utf-8", errors="replace")
          ansi = re.compile(r"\x1b\[[0-?]*[ -/]*[@-~]")
          lines = [ansi.sub("", line) for line in text.splitlines()]

          # GitHub first echoes the complete shell program in cyan. Ignore that
          # source block and inspect only bytes emitted after its end-group.
          echoed_end = max(
              (i for i, line in enumerate(lines) if 'echo "R15_WORKFLOW_TEXT_END"' in line),
              default=-1,
          )
          runtime_start = next(
              (i + 1 for i in range(echoed_end + 1, len(lines)) if "##[endgroup]" in lines[i]),
              0,
          )
          runtime = lines[runtime_start:]

          commit_re = re.compile(r"R15_SOURCE_COMMIT=([0-9a-f]{40})(?:\s|$)")
          tree_re = re.compile(r"R15_SOURCE_TREE=([0-9a-f]{40})(?:\s|$)")
          begin = next((i for i, line in enumerate(runtime) if commit_re.search(line)), None)
          end = next(
              (
                  i
                  for i, line in enumerate(runtime)
                  if begin is not None and i >= begin and "R15_WORKFLOW_TEXT_END" in line
              ),
              None,
          )
          if begin is not None and end is not None:
              selected = runtime[begin : end + 1]
              if not any(tree_re.search(line) for line in selected):
                  raise SystemExit("source tree marker is missing")
              print(f"R15_PUBLICATION_LOG_BYTES={len(raw)}")
              print(f"R15_PUBLICATION_LINES={len(selected)}")
              for line in selected:
                  print(line)
              raise SystemExit(0)

          needles = (
              "##[error]",
              "error:",
              "FAILED",
              "panicked at",
              "Process completed with exit code",
              "remote rejected",
              "diff -u",
          )
          hits = [
              i
              for i, line in enumerate(runtime)
              if any(needle.lower() in line.lower() for needle in needles)
          ]
          selected_indices: set[int] = set()
          for i in hits[-24:]:
              selected_indices.update(range(max(0, i - 10), min(len(runtime), i + 12)))
          if not selected_indices:
              selected_indices.update(range(max(0, len(runtime) - 280), len(runtime)))
          ordered = sorted(selected_indices)[-360:]
          print(f"R15_PUBLICATION_LOG_BYTES={len(raw)}")
          print("R15_PUBLICATION_MARKERS=missing")
          previous = None
          for i in ordered:
              if previous is not None and i != previous + 1:
                  print("... omitted ...")
              print(f"{runtime_start + i + 1:06d}: {runtime[i]}")
              previous = i
          raise SystemExit(1)
          PY
