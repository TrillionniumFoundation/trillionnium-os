name: one-shot owner-open R5 patch normalizer

on:
  push:
    branches:
      - codex/owner-open-r5-gap-closure-20260829
    paths:
      - ".github/workflows/owner-open-r5-patch-normalizer-one-shot.yml"

permissions:
  contents: write

jobs:
  normalize-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/owner-open-r5-gap-closure-20260829
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Normalize structural patching and deterministic fixture cleanup
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          workflow = Path('.github/workflows/owner-open-r5-host-correlation-patch.yml')
          text = workflow.read_text(encoding='utf-8')
          import_anchor = '          from pathlib import Path\n\n          def replace_once'
          if '          import textwrap\n' not in text:
              if text.count(import_anchor) != 1:
                  raise SystemExit('embedded patch import anchor drifted')
              text = text.replace(
                  import_anchor,
                  '          from pathlib import Path\n          import textwrap\n\n          def replace_once',
              )
          pattern = re.compile(
              r"(r?'''[\s\S]*?''')\.replace\(\"              \", \"\"\)"
          )
          text, converted = pattern.subn(r'textwrap.dedent(\1)', text)
          if converted < 10:
              raise SystemExit(
                  f'expected at least 10 dedent conversions, observed {converted}'
              )
          workflow.write_text(text, encoding='utf-8')

          test = Path('tools/tests/test_generate_owner_open_l1_candidate.py')
          value = test.read_text(encoding='utf-8')
          if 'import time\n' not in value:
              value = value.replace(
                  'import tempfile\nimport unittest\n',
                  'import tempfile\nimport time\nimport unittest\n',
                  1,
              )
          config_anchor = '''        subprocess.run(
              ["git", "config", "user.name", "test"], cwd=self.root, check=True
          )
          subprocess.run(["git", "add", "."], cwd=self.root, check=True)
          '''
          config_replacement = '''        subprocess.run(
              ["git", "config", "user.name", "test"], cwd=self.root, check=True
          )
          subprocess.run(
              ["git", "config", "gc.auto", "0"], cwd=self.root, check=True
          )
          subprocess.run(
              ["git", "config", "maintenance.auto", "false"],
              cwd=self.root,
              check=True,
          )
          subprocess.run(["git", "add", "."], cwd=self.root, check=True)
          '''
          if 'maintenance.auto' not in value:
              if value.count(config_anchor) != 1:
                  raise SystemExit('git maintenance fixture anchor drifted')
              value = value.replace(config_anchor, config_replacement)
          cleanup_anchor = '''    def tearDown(self) -> None:
              self.temp.cleanup()
          '''
          cleanup_replacement = '''    def tearDown(self) -> None:
              last_error: OSError | None = None
              for _ in range(10):
                  try:
                      self.temp.cleanup()
                      return
                  except OSError as error:
                      last_error = error
                      time.sleep(0.02)
              if last_error is not None:
                  raise last_error
          '''
          if 'last_error: OSError | None' not in value:
              if value.count(cleanup_anchor) != 1:
                  raise SystemExit('temporary directory cleanup anchor drifted')
              value = value.replace(cleanup_anchor, cleanup_replacement)
          test.write_text(value, encoding='utf-8')

          Path('.github/workflows/owner-open-r5-patch-normalizer-one-shot.yml').unlink()
          PY
      - name: Verify normalized files
        run: |
          set -euo pipefail
          python3 -m py_compile tools/tests/test_generate_owner_open_l1_candidate.py
          python3 -m unittest tools.tests.test_generate_owner_open_l1_candidate -v
          grep -q 'import textwrap' .github/workflows/owner-open-r5-host-correlation-patch.yml
          test "$(grep -c 'textwrap.dedent' .github/workflows/owner-open-r5-host-correlation-patch.yml)" -ge 10
          git diff --check
      - name: Commit normalized patch inputs
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            .github/workflows/owner-open-r5-host-correlation-patch.yml \
            .github/workflows/owner-open-r5-patch-normalizer-one-shot.yml \
            tools/tests/test_generate_owner_open_l1_candidate.py
          git diff --cached --check
          git commit -m "fix(r5): normalize patching and fixture cleanup"
          git push origin HEAD:codex/owner-open-r5-gap-closure-20260829
