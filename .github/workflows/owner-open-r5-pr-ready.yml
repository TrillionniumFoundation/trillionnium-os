name: temporary owner-open R5 PR ready transition

on:
  push:
    branches:
      - ops/owner-open-r5-l2-runner-probe-20260829
    paths:
      - ".github/workflows/owner-open-r5-pr-ready.yml"

permissions:
  contents: read
  pull-requests: write

jobs:
  mark-ready:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Mark PR 21 ready through the official GraphQL mutation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NODE_ID: PR_kwDOUFzoVc8AAAABBbvdJg
        run: |
          set -euo pipefail
          payload="$(jq -nc --arg id "$PR_NODE_ID" '{query:"mutation($id:ID!){markPullRequestReadyForReview(input:{pullRequestId:$id}){pullRequest{id isDraft}}}",variables:{id:$id}}')"
          response="$(curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data "$payload" \
            "${GITHUB_API_URL}/graphql")"
          printf '%s\n' "$response" | jq -e '.data.markPullRequestReadyForReview.pullRequest.isDraft == false'
