name: owner-open R5 validate and land repairs

on:
  workflow_dispatch:
  push:
    branches:
      - "codex/owner-open-r5-tool-loop-20260827"
    paths:
      - ".github/workflows/owner-open-r5-validate-and-land-repairs.yml"

permissions:
  contents: write

concurrency:
  group: owner-open-r5-validate-and-land-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-land:
    name: Validate full Python/Rust closure and land exact repair bytes
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/owner-open-r5-tool-loop-20260827
          persist-credentials: true
          fetch-depth: 2

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Set up Rust 1.93
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.93.0
          components: rustfmt, clippy

      - name: Prepare evidence directory and bind base head
        run: |
          rm -rf /tmp/owner-open-r5-candidate
          mkdir -p /tmp/owner-open-r5-candidate
          git rev-parse HEAD | tee /tmp/owner-open-r5-candidate/base-head.txt

      - name: Apply exact audited repairs
        run: |
          python3 -m py_compile tools/owner-open/apply_r5_runner_repair_candidate.py
          python3 tools/owner-open/apply_r5_runner_repair_candidate.py --apply \
            | tee /tmp/owner-open-r5-candidate/applicator.log

      - name: Refresh lockfile, format and statically validate candidate
        run: |
          cargo generate-lockfile
          cargo fmt --all
          cargo fmt --all -- --check
          git diff --check
          bash -n tools/owner-open/prepare-adb-reverse-v1.sh
          python3 -m py_compile \
            tools/tests/test_stage_owner_open_rootfs_payload_release.py \
            tools/tests/test_supervise_codex_mcp_qualification.py \
            tools/tests/test_supervise_codex_mcp_qualification_release.py \
            tools/tests/test_qualify_owner_open_adb.py \
            tools/tests/test_qualify_owner_open_adb_selected.py \
            tools/tests/test_build_shell_exec_artifact_set.py \
            tools/tests/test_adb_smart_socket_relay_selected.py \
            tools/tests/test_release_qualification_paths.py \
            tools/tests/test_release_qualification_paths_v2.py \
            tools/tests/test_verify_owner_open_selected_paths.py \
            tools/tests/test_p01_daemon_receipt_build.py \
            tools/tests/test_rootfs_v8_erofs_admission.py \
            tools/materialize_p01_final_daemon_artifact.py

      - name: Create a clean local candidate commit
        run: |
          git config user.name "R5 validation fixture"
          git config user.email "r5-validation@invalid.local"
          git add -A
          git commit -m "fix: close R5 Python Rust and lockfile gates"
          git rev-parse HEAD | tee /tmp/owner-open-r5-candidate/candidate-head.txt
          git diff HEAD^ --binary > /tmp/owner-open-r5-candidate/candidate.patch
          git diff HEAD^ --stat > /tmp/owner-open-r5-candidate/candidate.stat
          git diff-tree --no-commit-id --name-only -r HEAD \
            > /tmp/owner-open-r5-candidate/changed-files.txt
          test -z "$(git status --porcelain=v1)"

      - name: Reject unittest TestCase.run collisions
        run: |
          python3 - <<'PY' | tee /tmp/owner-open-r5-candidate/testcase-reserved-methods.txt
          import ast
          from pathlib import Path

          findings = []
          for path in sorted(Path("tools/tests").rglob("test_*.py")):
              tree = ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
              for node in tree.body:
                  if not isinstance(node, ast.ClassDef):
                      continue
                  bases = {ast.unparse(base) for base in node.bases}
                  if not any(base.endswith("TestCase") for base in bases):
                      continue
                  for item in node.body:
                      if isinstance(item, (ast.FunctionDef, ast.AsyncFunctionDef)) and item.name == "run":
                          findings.append((str(path), node.name, item.lineno))
          for path, cls, line in findings:
              print(f"{path}:{line}: {cls}.run")
          print(f"count={len(findings)}")
          if findings:
              raise SystemExit(1)
          PY

      - name: Run source generators and graph gates
        run: |
          set +e
          python3 tools/generate-owner-open-types.py --check \
            > /tmp/owner-open-r5-candidate/generated-types.log 2>&1
          echo "$?" > /tmp/owner-open-r5-candidate/generated-types.rc
          python3 tools/verify-owner-open-r5.py --json \
            > /tmp/owner-open-r5-candidate/r5-graph.log 2>&1
          echo "$?" > /tmp/owner-open-r5-candidate/r5-graph.rc
          python3 -m unittest tools.tests.test_verify_owner_open_r5 -v \
            > /tmp/owner-open-r5-candidate/r5-verifier-tests.log 2>&1
          echo "$?" > /tmp/owner-open-r5-candidate/r5-verifier-tests.rc
          exit 0

      - name: Run complete Python source suite
        run: |
          set +e
          PYTHONWARNINGS=error::ResourceWarning \
          python3 -m unittest discover -s tools/tests -p 'test_*.py' -v \
            > /tmp/owner-open-r5-candidate/python-discover.log 2>&1
          echo "$?" > /tmp/owner-open-r5-candidate/python-discover.rc
          exit 0

      - name: Run complete default Rust test closure
        run: |
          set +e
          cargo test --locked --all-targets \
            > /tmp/owner-open-r5-candidate/rust-test.log 2>&1
          echo "$?" > /tmp/owner-open-r5-candidate/rust-test.rc
          exit 0

      - name: Run complete default Rust clippy closure
        run: |
          set +e
          cargo clippy --locked --all-targets -- -D warnings \
            > /tmp/owner-open-r5-candidate/rust-clippy.log 2>&1
          echo "$?" > /tmp/owner-open-r5-candidate/rust-clippy.rc
          exit 0

      - name: Capture exact Cargo graph and candidate bytes
        if: always()
        run: |
          set +e
          cargo metadata --locked --format-version 1 \
            > /tmp/owner-open-r5-candidate/cargo-metadata.json \
            2> /tmp/owner-open-r5-candidate/cargo-metadata.stderr
          echo "$?" > /tmp/owner-open-r5-candidate/cargo-metadata.rc
          cargo tree --locked -e features \
            > /tmp/owner-open-r5-candidate/cargo-tree.txt \
            2> /tmp/owner-open-r5-candidate/cargo-tree.stderr
          echo "$?" > /tmp/owner-open-r5-candidate/cargo-tree.rc
          mkdir -p /tmp/owner-open-r5-candidate/files
          while IFS= read -r path; do
            test -n "$path" || continue
            test -f "$path" || continue
            mkdir -p "/tmp/owner-open-r5-candidate/files/$(dirname "$path")"
            cp -- "$path" "/tmp/owner-open-r5-candidate/files/$path"
          done < /tmp/owner-open-r5-candidate/changed-files.txt
          sha256sum /tmp/owner-open-r5-candidate/candidate.patch \
            > /tmp/owner-open-r5-candidate/candidate.patch.sha256
          find /tmp/owner-open-r5-candidate -maxdepth 1 -name '*.rc' \
            -print -exec cat {} \; \
            > /tmp/owner-open-r5-candidate/all-return-codes.txt
          exit 0

      - name: Upload complete candidate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: owner-open-r5-validated-repair-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: /tmp/owner-open-r5-candidate/

      - name: Require every candidate gate to pass
        run: |
          python3 - <<'PY'
          from pathlib import Path
          failed = []
          for path in sorted(Path("/tmp/owner-open-r5-candidate").glob("*.rc")):
              value = path.read_text(encoding="utf-8").strip()
              if value != "0":
                  failed.append(f"{path.name}={value}")
          if failed:
              raise SystemExit("candidate gates failed: " + ", ".join(failed))
          print("PASS_ALL_R5_CANDIDATE_GATES")
          PY

      - name: Push the exact validated non-workflow candidate commit
        run: |
          git push origin HEAD:refs/heads/codex/owner-open-r5-tool-loop-20260827
