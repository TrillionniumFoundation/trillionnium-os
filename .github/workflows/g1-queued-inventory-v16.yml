name: G1 queued-run inventory v16

on:
  push:
    branches: [ops/g1-exact-source-recover-v13-20260906]
    paths: [.github/workflows/g1-queued-inventory-v16.yml]

permissions:
  actions: read
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Print bounded queued-run identities without checkout
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: TrillionniumFoundation/trillionnium-os
        run: |
          set -euo pipefail
          umask 077
          /usr/bin/curl --fail-with-body --silent --show-error --proto '=https' --tlsv1.2 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${REPOSITORY}/actions/runs?status=queued&per_page=100" \
            > "$RUNNER_TEMP/queued.json"
          /usr/bin/python3 -I - "$RUNNER_TEMP/queued.json" <<'PY'
          import json, sys
          from pathlib import Path
          data = json.loads(Path(sys.argv[1]).read_text())
          rows = []
          for run in data.get("workflow_runs", []):
              rows.append({
                  "id": run["id"],
                  "name": run["name"],
                  "branch": run.get("head_branch"),
                  "sha": run.get("head_sha"),
                  "event": run.get("event"),
                  "created_at": run.get("created_at"),
                  "status": run.get("status"),
              })
          print(json.dumps({"total_count": data.get("total_count"), "rows": rows}, sort_keys=True))
          PY
