name: one-shot owner-open R5 current exact-source evidence promotion

on:
  push:
    branches:
      - codex/owner-open-r5-gap-closure-20260829
    paths:
      - ".github/workflows/owner-open-r5-source-evidence-promotion-one-shot.yml"

permissions:
  contents: write

jobs:
  promote:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/owner-open-r5-gap-closure-20260829
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Bind current qualified source evidence without promoting external gaps
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "498d0ffc6818776f7abfa71af5ee2c77cde45a8a"
          python3 - <<'PY'
          from __future__ import annotations

          import json
          from copy import deepcopy
          from pathlib import Path

          root = Path.cwd()
          source_commit = "498d0ffc6818776f7abfa71af5ee2c77cde45a8a"
          source_tree = "aad53bd41aa8efa4fac5496aba813aed8ffd2d91"
          workflow_run_id = 33275227428
          branch = "codex/owner-open-r5-gap-closure-20260829"
          claim_ceiling = "EXACT_COMMIT_SOURCE_GATES_PASSED_NOT_INSTALLED_CODEX"
          source_evidence = {
              "level": "L1",
              "branch": branch,
              "commit": source_commit,
              "tree": source_tree,
              "workflow_run_id": workflow_run_id,
              "successful_jobs": [
                  "L1 graph, documentation, broker and MCP source closure",
                  "L1 Rust 1.93 selected Host, job, flow and recovery closure",
                  "L1 exact-source-head aggregate candidate",
              ],
              "artifacts": [
                  {
                      "id": 9721291169,
                      "name": f"owner-open-r5-l1-graph-docs-python-{source_commit}",
                      "digest": "sha256:165d20d42b4e084e273161cbba28f8012f663e67f8eb070911ed42a7164f7838",
                  },
                  {
                      "id": 9721304610,
                      "name": f"owner-open-r5-l1-rust-{source_commit}",
                      "digest": "sha256:2f8ad943f132cb6b2babab3054d4b160b71cc6e5e4d28117757ce35b1ed68887",
                  },
                  {
                      "id": 9721310376,
                      "name": f"owner-open-r5-l1-candidate-{source_commit}",
                      "digest": "sha256:1ebc7fa77055a803a5e9dd66edc981d54939f3be6077304b7015537103ee4aa3",
                  },
              ],
          }

          def write_json(path: Path, value: object) -> None:
              path.write_text(json.dumps(value, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")

          gap_path = root / "docs/status/owner-open-r5-gap-closure.json"
          gaps = json.loads(gap_path.read_text(encoding="utf-8"))
          gaps["documentation_candidate"].update(
              {
                  "state": "EXACT_SOURCE_HEAD_L1_PASSED",
                  "evidence_level": "L1",
                  "validated_source_commit": source_commit,
                  "validated_source_tree": source_tree,
                  "workflow_run_id": workflow_run_id,
                  "checked_in_promotion_requires_new_exact_head_ci": True,
              }
          )
          for gap in gaps["gaps"]:
              if "source_evidence" in gap:
                  gap["source_evidence"] = deepcopy(source_evidence)
          write_json(gap_path, gaps)

          status_path = root / "docs/status/owner-open-r5-status.json"
          status = json.loads(status_path.read_text(encoding="utf-8"))
          status["updated_at"] = "2026-08-30"
          status["product_claim"] = (
              f"Exact source commit {source_commit} and tree {source_tree} passed the permanent L1 "
              "source, gap, Rust, Broker, MCP, release-path, product-entrypoint, ADB-relay and "
              "foundation gates. Job admission is CLOSED at L1. Process lifecycle, stream recovery, "
              "journal convergence, Broker correlation and product entrypoint are source-closed but "
              "still require their declared L2-L5 target evidence. Repository governance, installed "
              "Codex, Root Linux placement, Android image, physical ADB, destructive faults and public "
              "release remain explicit holds."
          )
          status["claim_ceiling"] = claim_ceiling
          status["current_candidate"].update(
              {
                  "validated_source_commit": source_commit,
                  "validated_source_tree": source_tree,
                  "workflow_run_id": workflow_run_id,
                  "exact_head_validation_pending": False,
                  "must_not_inherit_baseline_l1": False,
                  "promotion_commit_requires_new_exact_head_ci": True,
              }
          )
          for hold in status.get("external_evidence_holds", []):
              hold["source_evidence_commit"] = source_commit
          status["known_exact_candidate"] = {
              "status": "HOST_TESTED",
              "evidence_level": "L1",
              "branch": branch,
              "commit": source_commit,
              "tree": source_tree,
              "workflow_run_id": workflow_run_id,
              "successful_jobs": list(source_evidence["successful_jobs"]),
              "artifacts": deepcopy(source_evidence["artifacts"]),
              "claim_ceiling": claim_ceiling,
          }
          write_json(status_path, status)

          evidence_md = root / "docs/status/owner-open-r5-source-closure-evidence-2026-08-29.md"
          evidence_md.write_text(
              f'''# Owner-Open R5 exact-source-head L1 closure evidence

          Status: **L1 source closure passed; target, device, destructive-fault and release evidence remains open.**

          ## Exact source identity

          | Field | Value |
          | --- | --- |
          | Repository | `TrillionniumFoundation/trillionnium-os` |
          | Branch | `{branch}` |
          | Source commit | `{source_commit}` |
          | Source tree | `{source_tree}` |
          | Permanent workflow | `L1 owner-open R5 source and gap closure` |
          | Workflow run | `{workflow_run_id}` |
          | Result | `L1_SOURCE_CLOSURE_PASSED` |
          | Claim ceiling | `{claim_ceiling}` |
          | Cargo.lock SHA-256 | `a469d72776978b143f47ba71904325404dc77307b25374214e6dd321147b99a0` |

          The permanent workflow checked out the pull-request source head rather than GitHub's synthetic merge
          commit. The exact source checkout passed graph and document verification, gap/evidence mutation tests,
          Broker and MCP process fixtures, locked Rust 1.93 formatting/tests/strict Clippy, product-entrypoint
          source checks, release-path mechanics, ADB relay checks and the foundation suite.

          ## Bound artifacts

          | Artifact ID | Name | SHA-256 digest |
          | --- | --- | --- |
          | `9721291169` | `owner-open-r5-l1-graph-docs-python-{source_commit}` | `sha256:165d20d42b4e084e273161cbba28f8012f663e67f8eb070911ed42a7164f7838` |
          | `9721304610` | `owner-open-r5-l1-rust-{source_commit}` | `sha256:2f8ad943f132cb6b2babab3054d4b160b71cc6e5e4d28117757ce35b1ed68887` |
          | `9721310376` | `owner-open-r5-l1-candidate-{source_commit}` | `sha256:1ebc7fa77055a803a5e9dd66edc981d54939f3be6077304b7015537103ee4aa3` |

          ## Source identity versus promotion head

          `{source_commit}` / `{source_tree}` is the immutable qualified source identity. A later state-only
          promotion commit may update `docs/status/` or import independently reviewed evidence without changing
          that source identity. Such a promotion head must pass its own exact-head repository checks and is not
          allowed to inherit qualification after any source, Cargo, contract, tool or workflow drift.

          External evidence bundles must bind their `source_commit` and `source_tree` to this exact pair. The
          promotion script rejects a bundle whose source identity differs from the gap register.

          ## Gap transitions

          - `R5-GAP-JOB-ADMISSION-001` is **CLOSED at L1**: finite capacity is reserved before spawn,
            conflicting concurrency cannot oversubscribe it, and post-spawn cleanup is bounded and tested.
          - Process lifecycle, stream recovery, journal convergence, Broker correlation and product entrypoint
            are **SOURCE_CLOSED_PENDING_EVIDENCE**. Their source contracts and exact-head tests pass, but their
            declared L2-L5 installed/environment evidence does not exist yet.
          - Repository governance is **EXTERNAL_HOLD** because protected-main required checks and independent
            review are repository-administrator and reviewer actions, not source artifacts.
          - Installed Codex, Root Linux placement, Android image, physical ADB, destructive faults and public
            release remain **EXTERNAL_HOLD** with their exact required material or authority listed in the
            machine gap register.

          ## Non-claims

          This evidence does not prove installation, target UID/GID or namespace placement, Android image
          inclusion, physical effects, destructive recovery qualification, signed release, protected-main
          configuration or zero-gap completion. `zero_gap=false`, `public_release=false` and
          `automatic_redispatch=false` remain mandatory.
          '''.replace("          ", ""),
              encoding="utf-8",
          )

          plan_path = root / "docs/TRILLIONNIUM_OWNER_OPEN_R5_EXECUTION_PLAN.md"
          plan = plan_path.read_text(encoding="utf-8")
          old = '''## 2026-08-29 exact-source closure checkpoint

          Permanent exact-head run `33256008472` passed for source commit
          `f0ce11ed6fc7ab950c34727be92fc2a60bc9dd28` and tree
          `8d25f3b4cfa0190e93a07031891e6b0de62404ce`.

          This checkpoint closes only the L1 job-admission gap. It moves the completed process-lifecycle,
          stream-recovery, journal-convergence, Broker-correlation and product-entrypoint source work into
          `SOURCE_CLOSED_PENDING_EVIDENCE`; it does not lower their declared L2-L5 exit levels. Governance
          and all target/device/release lanes remain explicit holds. The ordered next path is protected-main
          and independent review, installed Root Linux L2, Android L3, physical ADB L4, destructive faults
          L5 and separately authorized release L6.
          '''.replace("          ", "")
          new = f'''## 2026-08-29 exact-source closure checkpoint

          Permanent exact-source-head run `{workflow_run_id}` passed for source commit
          `{source_commit}` and tree
          `{source_tree}`. The aggregate candidate also binds Cargo.lock SHA-256
          `a469d72776978b143f47ba71904325404dc77307b25374214e6dd321147b99a0`.

          This checkpoint closes only the L1 job-admission gap. It moves the completed process-lifecycle,
          stream-recovery, journal-convergence, Broker-correlation and product-entrypoint source work into
          `SOURCE_CLOSED_PENDING_EVIDENCE`; it does not lower their declared L2-L5 exit levels. Governance
          and all target/device/release lanes remain explicit holds. The ordered next path is protected-main
          and independent review, installed Root Linux L2, Android L3, physical ADB L4, destructive faults
          L5 and separately authorized release L6.

          The qualified source identity and a later evidence-promotion head are deliberately distinct. A
          state-only promotion commit may bind this source evidence or import reviewed target bundles, but any
          change to source, Cargo, contracts, tools or permanent workflows invalidates inheritance and requires
          a new exact-source qualification.
          '''.replace("          ", "")
          if old not in plan:
              raise SystemExit("expected plan checkpoint block not found")
          plan_path.write_text(plan.replace(old, new), encoding="utf-8")

          stale = root / "docs/status/owner-open-r5-agent-terminal.json"
          if stale.exists():
              stale.unlink()
          PY
          rm -f .github/workflows/owner-open-r5-source-evidence-promotion-one-shot.yml
      - name: Verify canonical truth and promotion boundaries
        run: |
          set -euo pipefail
          python3 -m json.tool docs/status/owner-open-r5-gap-closure.json >/dev/null
          python3 -m json.tool docs/status/owner-open-r5-status.json >/dev/null
          python3 tools/verify-owner-open-r5-workflow-boundaries.py --json
          python3 tools/verify-owner-open-r5.py --json
          python3 tools/verify-owner-open-r5-gap-evidence.py --json
          python3 -m unittest \
            tools.tests.test_verify_owner_open_r5_gap_closure \
            tools.tests.test_verify_owner_open_r5_gap_evidence \
            tools.tests.test_generate_owner_open_r5_resume_packet \
            tools.tests.test_promote_owner_open_r5_evidence \
            tools.tests.test_verify_owner_open_r5_workflow_boundaries \
            -v
          if rg -n 'f0ce11ed6fc7ab950c34727be92fc2a60bc9dd28|33256008472|9715819868|9715826446|8d25f3b4cfa0190e93a07031891e6b0de62404ce' \
            docs tools .github evidence; then
            echo "stale source-evidence identity remains" >&2
            exit 1
          fi
          git diff --check
      - name: Commit the state-only source-evidence promotion
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          actual="$(git diff --cached --name-only | sort)"
          expected="$(cat <<'EOF'
          .github/workflows/owner-open-r5-source-evidence-promotion-one-shot.yml
          docs/TRILLIONNIUM_OWNER_OPEN_R5_EXECUTION_PLAN.md
          docs/status/owner-open-r5-agent-terminal.json
          docs/status/owner-open-r5-gap-closure.json
          docs/status/owner-open-r5-source-closure-evidence-2026-08-29.md
          docs/status/owner-open-r5-status.json
          EOF
          )"
          test "$actual" = "$expected"
          git commit -m "docs(r5): bind current exact L1 source evidence"
          git push origin HEAD:codex/owner-open-r5-gap-closure-20260829
