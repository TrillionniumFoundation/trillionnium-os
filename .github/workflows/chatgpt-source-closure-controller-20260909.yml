name: ChatGPT source closure controller

on:
  push:
    branches:
      - ops/chatgpt-pr63-source-export-20260909

permissions:
  contents: write

concurrency:
  group: chatgpt-source-closure-controller-20260909
  cancel-in-progress: true

jobs:
  repair-pr71:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TARGET_BRANCH: codex/repository-truth-profiles-20260908
      CONTROL_BRANCH: ops/chatgpt-pr63-source-export-20260909
      EXPECTED_HEAD: b2ae0c37c2079cdaf7623ef7799ce4bf35cb13af
    steps:
      - name: Check out exact PR71 head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ env.TARGET_BRANCH }}
          persist-credentials: true
      - name: Apply byte-visible repair script
        shell: bash
        run: |
          set -euo pipefail
          test "$(git --no-replace-objects rev-parse HEAD)" = "$EXPECTED_HEAD"
          git fetch --no-tags origin "$CONTROL_BRANCH"
          git show "origin/$CONTROL_BRANCH:ops/pr71_authority_fix.py" > /tmp/pr71_authority_fix.py
          python3 /tmp/pr71_authority_fix.py
          python3 -m py_compile tools/docs/verify_repository_authority.py tools/tests/test_repository_authority.py
          git diff --check
      - name: Verify repaired repository authority
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest tools.tests.test_repository_authority -v
          python3 tools/docs/generate_global_docs.py --check
          python3 tools/docs/verify_repository_authority.py
          python3 tools/docs/verify_global_docs.py
          python3 -m unittest tools.tests.test_verify_global_docs_contracts tools.tests.test_owner_open_broker_module_documentation -v
      - name: Commit and publish exact PR71 repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Qian QI'
          git config user.email '102159240+ProfHepta@users.noreply.github.com'
          git add tools/docs/verify_repository_authority.py tools/tests/test_repository_authority.py
          git diff --cached --check
          git commit -m 'docs: close rendered authority target bypasses'
          git push origin "HEAD:$TARGET_BRANCH"
