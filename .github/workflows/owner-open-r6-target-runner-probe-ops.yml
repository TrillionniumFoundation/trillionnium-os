name: Owner-Open R6 target runner availability probe (ops)

on:
  push:
    branches:
      - codex/owner-open-r6-governance-control-plane-20260830
    paths:
      - .github/workflows/owner-open-r6-target-runner-probe-ops.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: owner-open-r6-target-runner-probe
  cancel-in-progress: true

jobs:
  l2:
    name: Probe L2 target runner
    runs-on: [self-hosted, owner-open-r5-l2]
    timeout-minutes: 5
    steps:
      - name: Report identity and fixed-file presence without executing target harnesses
        shell: bash
        run: |
          set -euo pipefail
          for kind in installed_root_linux_process_matrix installed_codex_same_turn; do
            harness="/opt/owner-open-r5/harnesses/$kind"
            attestation="/etc/owner-open-r5/attestations/$kind.json"
            printf 'kind=%s runner=%s os=%s arch=%s harness_present=%s attestation_present=%s\n' \
              "$kind" "$RUNNER_NAME" "$RUNNER_OS" "$RUNNER_ARCH" \
              "$([ -f "$harness" ] && echo true || echo false)" \
              "$([ -f "$attestation" ] && echo true || echo false)"
          done

  l3:
    name: Probe L3 target runner
    runs-on: [self-hosted, owner-open-r5-l3]
    timeout-minutes: 5
    steps:
      - name: Report identity and fixed-file presence without executing target harness
        shell: bash
        run: |
          set -euo pipefail
          kind=clean_android_target_files
          printf 'kind=%s runner=%s os=%s arch=%s harness_present=%s attestation_present=%s\n' \
            "$kind" "$RUNNER_NAME" "$RUNNER_OS" "$RUNNER_ARCH" \
            "$([ -f "/opt/owner-open-r5/harnesses/$kind" ] && echo true || echo false)" \
            "$([ -f "/etc/owner-open-r5/attestations/$kind.json" ] && echo true || echo false)"

  l4:
    name: Probe L4 target runner
    runs-on: [self-hosted, owner-open-r5-l4]
    timeout-minutes: 5
    steps:
      - name: Report identity and fixed-file presence without executing target harness
        shell: bash
        run: |
          set -euo pipefail
          kind=physical_android_adb
          printf 'kind=%s runner=%s os=%s arch=%s harness_present=%s attestation_present=%s\n' \
            "$kind" "$RUNNER_NAME" "$RUNNER_OS" "$RUNNER_ARCH" \
            "$([ -f "/opt/owner-open-r5/harnesses/$kind" ] && echo true || echo false)" \
            "$([ -f "/etc/owner-open-r5/attestations/$kind.json" ] && echo true || echo false)"

  l5:
    name: Probe L5 target runner
    runs-on: [self-hosted, owner-open-r5-l5]
    timeout-minutes: 5
    steps:
      - name: Report identity and fixed-file presence without executing destructive harness
        shell: bash
        run: |
          set -euo pipefail
          kind=destructive_fault_matrix
          printf 'kind=%s runner=%s os=%s arch=%s harness_present=%s attestation_present=%s\n' \
            "$kind" "$RUNNER_NAME" "$RUNNER_OS" "$RUNNER_ARCH" \
            "$([ -f "/opt/owner-open-r5/harnesses/$kind" ] && echo true || echo false)" \
            "$([ -f "/etc/owner-open-r5/attestations/$kind.json" ] && echo true || echo false)"

  l6:
    name: Probe L6 target runner
    runs-on: [self-hosted, owner-open-r5-l6]
    timeout-minutes: 5
    steps:
      - name: Report identity and fixed-file presence without executing signing harness
        shell: bash
        run: |
          set -euo pipefail
          kind=signed_public_release
          printf 'kind=%s runner=%s os=%s arch=%s harness_present=%s attestation_present=%s\n' \
            "$kind" "$RUNNER_NAME" "$RUNNER_OS" "$RUNNER_ARCH" \
            "$([ -f "/opt/owner-open-r5/harnesses/$kind" ] && echo true || echo false)" \
            "$([ -f "/etc/owner-open-r5/attestations/$kind.json" ] && echo true || echo false)"

  watchdog:
    name: Snapshot runner assignment and cancel probe
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Allow target jobs to acquire eligible runners
        run: sleep 45
      - name: Capture non-secret job assignment snapshot
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?filter=all&per_page=100"
          curl --fail-with-body --silent --show-error --location \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$api" \
            | jq '{
                schema: "org.trillionnium.owner-open-r6.target-runner-probe.v1",
                repository: env.GITHUB_REPOSITORY,
                run_id: (env.GITHUB_RUN_ID | tonumber),
                observed_at: (now | todateiso8601),
                jobs: [.jobs[] | {
                  id, name, status, conclusion, runner_id, runner_name,
                  labels: (.labels // [])
                }]
              }' > "$RUNNER_TEMP/runner-probe.json"
          cat "$RUNNER_TEMP/runner-probe.json"
      - name: Upload probe snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: owner-open-r6-target-runner-probe-${{ github.run_id }}
          path: ${{ runner.temp }}/runner-probe.json
          if-no-files-found: error
          retention-days: 7
      - name: Cancel this probe run after snapshot
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          curl --silent --show-error --location \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/cancel"
