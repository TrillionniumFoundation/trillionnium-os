name: finalize owner-open r4 foundation

on:
  push:
    branches:
      - codex/owner-open-r4-foundation-20260827
    paths:
      - tools/owner-open-r4-finalize.py
      - .github/workflows/owner-open-r4-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: codex/owner-open-r4-foundation-20260827
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Rust 1.93
        uses: dtolnay/rust-toolchain@1.93.0
        with:
          components: rustfmt

      - name: Apply deterministic foundation hardening
        run: python3 tools/owner-open-r4-finalize.py

      - name: Format and generate lockfile
        run: |
          cargo fmt --package trillionnium-owner-open-types
          cargo fmt --package trillionnium-owner-open-host
          cargo generate-lockfile

      - name: Run foundation validation
        run: |
          python3 -m json.tool docs/status/owner-open-r4-status.json >/dev/null
          python3 -m json.tool docs/contracts/owner-open-forbidden-default-graph-v1.json >/dev/null
          python3 -m json.tool schemas/codex-sovereign-direct-tools.schema.json >/dev/null
          python3 tools/generate-owner-open-types.py --check
          python3 tools/verify-owner-open-foundation.py --json
          python3 -m unittest discover -s tools/tests -p 'test_*.py' -v
          cargo test --locked --package trillionnium-owner-open-types
          cargo test --locked --package trillionnium-owner-open-host

      - name: Remove one-shot bootstrap files
        run: |
          rm .github/workflows/owner-open-r4-finalize.yml
          rm tools/owner-open-r4-finalize.py

      - name: Commit finalized source and lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No finalization changes were required."
            exit 0
          fi
          git commit -m "build: finalize r4 owner-open foundation"
          git push origin HEAD:codex/owner-open-r4-foundation-20260827
