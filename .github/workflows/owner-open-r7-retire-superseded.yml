name: Owner-Open R7 retire superseded qualification lanes

on:
  push:
    branches:
      - ops/owner-open-r7-retire-superseded-20260830
    paths:
      - .github/workflows/owner-open-r7-retire-superseded.yml

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: owner-open-r7-retire-superseded
  cancel-in-progress: false

jobs:
  retire:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      BASE_SHA: 34d8b731370b42f84fb50c34ecd6ca41b39f0d08
    steps:
      - name: Check out cleanup lane
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: ops/owner-open-r7-retire-superseded-20260830

      - name: Cancel, close and reset only superseded lanes
        shell: bash
        run: |
          set -u
          owner="${GITHUB_REPOSITORY%%/*}"
          branches=(
            codex/owner-open-r7-runtime-hardening-20260830
            codex/owner-open-r7-runtime-hardening-20260830-v2
            codex/owner-open-r7-runtime-hardening-20260830-v3
            codex/owner-open-r7-workspace-integrity-20260830
            codex/owner-open-r7-workspace-integrity-20260830-v2
            codex/owner-open-r7-workspace-integrity-20260830-v3
            codex/owner-open-r7-source-promotion-20260830
            ops/owner-open-r7-runtime-hardening-controller-20260830
            ops/owner-open-r7-workspace-controller-20260830
            ops/owner-open-r7-workspace-v3-controller-20260830
            ops/owner-open-r7-source-promotion-controller-20260830
          )
          for branch in "${branches[@]}"; do
            encoded="$(jq -rn --arg value "$branch" '$value|@uri')"
            runs="$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/runs" \
              -f branch="$branch" -F per_page=100 2>/dev/null || printf '{"workflow_runs":[]}')"
            jq -r '.workflow_runs[] | select(.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "pending") | .id' \
              <<<"$runs" | while read -r run_id; do
                [ -n "$run_id" ] || continue
                gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/cancel" \
                  >/dev/null 2>&1 || true
              done

            prs="$(gh api --method GET "repos/$GITHUB_REPOSITORY/pulls" \
              -f state=open -f head="$owner:$branch" -F per_page=100 2>/dev/null \
              || printf '[]')"
            jq -r '.[].number' <<<"$prs" | while read -r pr; do
              [ -n "$pr" ] || continue
              gh pr close "$pr" --repo "$GITHUB_REPOSITORY" \
                --comment "Superseded by the fail-closed R7 v4 qualification chain; no evidence or gap state from this lane is promoted." \
                >/dev/null 2>&1 || true
            done

            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/$encoded" \
              -f sha="$BASE_SHA" -F force=true >/dev/null 2>&1 || \
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch" \
              -f sha="$BASE_SHA" -F force=true >/dev/null 2>&1 || true
          done

      - name: Retire cleanup lane
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/owner-open-r7-retire-superseded.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "ops(r7): retire superseded-lane cleanup"
          git push origin HEAD:ops/owner-open-r7-retire-superseded-20260830
