name: one-shot owner-open R5 durable job restart race fix

on:
  push:
    branches:
      - codex/owner-open-r5-gap-closure-20260829
    paths:
      - ".github/workflows/owner-open-r5-job-restart-flake-fix-one-shot.yml"

permissions:
  contents: write

jobs:
  patch-test-and-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: codex/owner-open-r5-gap-closure-20260829
      - uses: dtolnay/rust-toolchain@d8dfd7155fea72af4ad34a8fe97364d210e2d020
        with:
          toolchain: 1.93.0
          components: rustfmt, clippy
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Apply the exact race closure
        run: |
          set -euo pipefail
          python3 tools/patch-owner-open-r5-job-restart-race.py
          rm -f \
            .github/workflows/owner-open-r5-job-restart-flake-fix-one-shot.yml \
            tools/patch-owner-open-r5-job-restart-race.py
          cargo fmt --all
          git diff --check
      - name: Stress the exact restart regression
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          for attempt in $(seq 1 50); do
            echo "restart regression attempt ${attempt}/50"
            cargo test --locked -p trillionnium-owner-open-job-runtime \
              --test runtime completed_durable_job_never_spawns_again_after_manager_restart -- --exact
          done
      - name: Run the complete source gate
        run: |
          set -euo pipefail
          cargo test --locked --all-targets
          cargo clippy --locked --all-targets -- -D warnings
          python3 tools/verify-owner-open-r5-workflow-boundaries.py --json
          python3 tools/verify-owner-open-r5.py --json
          python3 tools/verify-owner-open-r5-gap-evidence.py --json
          python3 -m unittest discover -s tools/tests -p 'test_*.py' -v
          git diff --check
      - name: Commit the verified race closure
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          actual="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' \
            .github/workflows/owner-open-r5-job-restart-flake-fix-one-shot.yml \
            crates/trillionnium-owner-open-job-runtime/src/manager.rs \
            crates/trillionnium-owner-open-job-runtime/tests/runtime.rs \
            tools/patch-owner-open-r5-job-restart-race.py | sort)"
          test "$actual" = "$expected"
          git commit -m "fix(r5): serialize durable job restart handoff"
          git push origin HEAD:codex/owner-open-r5-gap-closure-20260829
