name: L1 owner-open source slices

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "apps/trillionnium-owner-open-host/**"
      - "crates/trillionnium-owner-open-*/**"
      - "tools/owner-open/**"
      - "tools/tests/**"
      - "tools/verify-owner-open-*.py"
      - "packaging/owner-open-adb/**"
      - "schemas/owner-open-codex-exec-prefix-v1.schema.json"
      - "docs/implementation/owner-open-*.md"
      - "docs/architecture/2026-08-27-owner-open-raw-adb-topology.md"
      - "docs/status/owner-open-r4-*.json"
      - "docs/status/owner-open-r5-*.json"
      - "docs/protocols/owner-open-*.md"
      - ".github/workflows/owner-open-source-slices.yml"
  push:
    branches:
      - main
      - "codex/**"
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "apps/trillionnium-owner-open-host/**"
      - "crates/trillionnium-owner-open-*/**"
      - "tools/owner-open/**"
      - "tools/tests/**"
      - "tools/verify-owner-open-*.py"
      - "packaging/owner-open-adb/**"
      - "schemas/owner-open-codex-exec-prefix-v1.schema.json"
      - "docs/implementation/owner-open-*.md"
      - "docs/architecture/2026-08-27-owner-open-raw-adb-topology.md"
      - "docs/status/owner-open-r4-*.json"
      - "docs/status/owner-open-r5-*.json"
      - "docs/protocols/owner-open-*.md"
      - ".github/workflows/owner-open-source-slices.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: owner-open-source-slices-l1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  l1-python-and-contracts:
    name: L1 Python, shell and machine contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate canonical shell bootstrap syntax
        run: bash -n tools/owner-open/prepare-adb-reverse-v1.sh
      - name: Validate JSON status and schemas
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          paths = [
              Path("schemas/owner-open-codex-exec-prefix-v1.schema.json"),
              Path("packaging/owner-open-adb/owner-open-adb-arm64-artifact.schema.json"),
              Path("docs/status/owner-open-r5-status.json"),
              Path("docs/status/owner-open-r5-gap-closure.json"),
          ]
          paths.extend(sorted(Path("docs/status").glob("owner-open-r4-*.json")))
          for path in paths:
              json.loads(path.read_text(encoding="utf-8"))
              print(path)
          PY
      - name: Compile owner-open Python sources
        run: python3 -m compileall -q tools/owner-open tools/tests tools/verify-owner-open-r5.py
      - name: Run complete owner-open Python and fake-process tests
        env:
          PYTHONWARNINGS: error::ResourceWarning
        run: python3 -m unittest discover -s tools/tests -p 'test_*.py' -v 2>&1 | tee owner-open-python-tests.txt
      - name: Run foundation and active R5 graph verifiers
        run: |
          set -euo pipefail
          python3 tools/verify-owner-open-foundation.py --json | tee owner-open-foundation-report.json
          python3 tools/verify-owner-open-r5.py --json | tee owner-open-r5-report.json
      - name: Upload L1 Python and contract evidence
        uses: actions/upload-artifact@v4
        with:
          name: owner-open-l1-python-contracts-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            owner-open-python-tests.txt
            owner-open-foundation-report.json
            owner-open-r5-report.json

  l1-rust-source-closure:
    name: L1 Rust 1.93 exact selected closure
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Rust 1.93
        uses: dtolnay/rust-toolchain@1.93.0
        with:
          components: rustfmt, clippy
      - name: Bind locked metadata without mutation
        run: |
          set -euo pipefail
          test -s Cargo.lock
          cp Cargo.lock owner-open-reviewed-Cargo.lock
          cargo metadata --locked --format-version 1 > owner-open-cargo-metadata.json
          cmp --silent Cargo.lock owner-open-reviewed-Cargo.lock
          git diff --exit-code -- Cargo.lock
      - name: Check exact workspace formatting
        run: cargo fmt --all -- --check
      - name: Test exact selected default closure once
        run: cargo test --locked --all-targets
      - name: Pin completed-job restart non-redispatch regression
        run: |
          cargo test --locked --package trillionnium-owner-open-host \
            --test r5_jobs completed_job_is_not_redispatched_after_a_new_core_process \
            -- --exact
      - name: Deny Clippy warnings in the exact selected closure
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Capture locked package and feature graphs
        run: |
          set -euo pipefail
          cmp --silent Cargo.lock owner-open-reviewed-Cargo.lock
          git diff --exit-code -- Cargo.lock
          : > owner-open-cargo-tree.txt
          for package in \
            trillionnium-owner-open-types \
            trillionnium-owner-open-runtime \
            trillionnium-owner-open-call-registry \
            trillionnium-owner-open-event-store \
            trillionnium-owner-open-job-registry \
            trillionnium-owner-open-job-runtime \
            trillionnium-owner-open-provider-jsonl \
            trillionnium-owner-open-stream-window \
            trillionnium-owner-open-tool-bridge \
            trillionnium-owner-open-turn-loop \
            trillionnium-owner-open-host
          do
            cargo tree --locked -e features -p "$package" >> owner-open-cargo-tree.txt
          done
          git diff -- Cargo.lock > owner-open-cargo-lock.patch
          test ! -s owner-open-cargo-lock.patch
          git diff --exit-code
      - name: Upload L1 Rust source evidence
        uses: actions/upload-artifact@v4
        with:
          name: owner-open-l1-rust-source-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            Cargo.lock
            owner-open-reviewed-Cargo.lock
            owner-open-cargo-metadata.json
            owner-open-cargo-tree.txt
            owner-open-cargo-lock.patch
