name: owner-open source slices

on:
  push:
    branches:
      - "codex/owner-open-r5-tool-loop-20260827"
    paths:
      - ".github/workflows/owner-open-source-slices.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: owner-open-source-slices-repair-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    name: Persist terminal before publishing completion
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact owner-open head
        uses: actions/checkout@v4
        with:
          ref: codex/owner-open-r5-tool-loop-20260827
          fetch-depth: 0
      - name: Set up Rust 1.93
        uses: dtolnay/rust-toolchain@1.93.0
        with:
          components: rustfmt
      - name: Apply exact fail-closed ordering repair
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('crates/trillionnium-owner-open-job-runtime/src/manager.rs')
          lines = path.read_text().splitlines()
          candidates = [
              index
              for index, line in enumerate(lines)
              if line == '                            let _ ='
              and index + 4 < len(lines)
              and lines[index + 4]
              == '                                    .complete(&key, generation, terminal.clone());'
          ]
          if len(candidates) != 1:
              raise SystemExit(f'unexpected terminal completion preimage count: {len(candidates)}')
          start = candidates[0]
          end_candidates = [
              index
              for index in range(start + 1, min(len(lines), start + 64))
              if lines[index] == '                            if let Ok(mut jobs) = manager.running() {'
          ]
          if len(end_candidates) != 1:
              raise SystemExit(f'unexpected terminal block end count: {len(end_candidates)}')
          end = end_candidates[0]
          replacement = [
              '                            let event = RuntimeJobEventKind::Terminal {',
              '                                generation,',
              '                                terminal_kind,',
              '                                exit_code,',
              '                                signal,',
              '                                observation_sha256,',
              '                                stdout_bytes,',
              '                                stderr_bytes,',
              '                            };',
              '                            if let Ok(seq) =',
              '                                manager.push_runtime_event(&key, &request, event.clone())',
              '                                && manager',
              '                                    .inner',
              '                                    .journal',
              '                                    .record_job_terminal(',
              '                                        &key,',
              '                                        &request,',
              '                                        seq,',
              '                                        serde_json::to_value(event).unwrap_or(Value::Null),',
              '                                    )',
              '                                    .is_ok()',
              '                            {',
              '                                let _ = manager',
              '                                    .inner',
              '                                    .registry',
              '                                    .complete(&key, generation, terminal);',
              '                            }',
          ]
          path.write_text('\n'.join(lines[:start] + replacement + lines[end:]) + '\n')
          PY
          cargo fmt --all
          git diff --check
      - name: Prove restart does not redispatch a completed job
        run: |
          cargo test --locked --package trillionnium-owner-open-host \
            --test r5_jobs completed_job_is_not_redispatched_after_a_new_core_process \
            -- --exact --nocapture
          cargo test --locked --package trillionnium-owner-open-job-runtime --all-targets
      - name: Commit exact repair
        run: |
          set -euo pipefail
          git config user.name "owner-open-r5-repair[bot]"
          git config user.email "owner-open-r5-repair[bot]@users.noreply.github.com"
          git add crates/trillionnium-owner-open-job-runtime/src/manager.rs
          git commit -m "fix(jobs): persist terminal before publishing completion"
          git push origin HEAD:codex/owner-open-r5-tool-loop-20260827
