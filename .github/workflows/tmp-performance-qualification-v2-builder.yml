name: Temporary performance qualification v2 builder

on:
  push:
    branches:
      - ops/performance-qualification-v2-builder-20260910
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: performance-qualification-v2-builder
  cancel-in-progress: false

env:
  CONTROLLER_BRANCH: ops/performance-qualification-v2-builder-20260910
  TARGET_BASE_SHA: b681cd856fccac1189496576f25d259752d2dcce
  TARGET_BASE_TREE: f96f88a9749c61b3ce0dde7167303c8261788f22
  CANDIDATE_BRANCH: codex/performance-measurement-v2-20260910
  PAYLOAD_PATH: ops/performance-qualification-v2.patch.xz.b64
  PAYLOAD_B64_BYTES: "17742"
  PAYLOAD_B64_SHA256: 9f6ad4c658efc255e4b41c15046249d99cc39a205108316f27393bbf6eb737d6
  PAYLOAD_XZ_BYTES: "13132"
  PAYLOAD_XZ_SHA256: e64d98ba8e27d7d47aeaa247086ab1ae2dd64bc0cb859ba6c3c86ca8dc966734
  PAYLOAD_PATCH_BYTES: "55988"
  PAYLOAD_PATCH_SHA256: 07b2d95aa8eeda9da7e9a0303267c393a17bc4214728acf89bd338b5cd356a71
  PYTHONDONTWRITEBYTECODE: "1"
  CARGO_TERM_COLOR: always

jobs:
  qualify-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact controller
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: true

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"

      - name: Set up Rust 1.93
        uses: dtolnay/rust-toolchain@d8dfd7155fea72af4ad34a8fe97364d210e2d020
        with:
          toolchain: "1.93.0"
          components: rustfmt,clippy

      - name: Authenticate payload, qualify exact tree and publish candidate
        shell: bash
        run: |
          set -euo pipefail
          printf 'controller_ref=%s controller_head=%s\n' "${GITHUB_REF_NAME:?}" "${GITHUB_SHA:?}"
          printf 'payload_bytes=%s payload_sha256=' "$(wc -c < "$PAYLOAD_PATH" | tr -d ' ')"
          sha256sum "$PAYLOAD_PATH"
          test "${GITHUB_REF_NAME:?}" = "$CONTROLLER_BRANCH"
          test "$(git --no-replace-objects rev-parse HEAD)" = "${GITHUB_SHA:?}"
          test -f "$PAYLOAD_PATH"
          test ! -L "$PAYLOAD_PATH"
          test "$(wc -c < "$PAYLOAD_PATH" | tr -d ' ')" = "$PAYLOAD_B64_BYTES"
          printf '%s  %s\n' "$PAYLOAD_B64_SHA256" "$PAYLOAD_PATH" | sha256sum --check --strict

          payload_xz="${RUNNER_TEMP:?}/performance-qualification-v2.patch.xz"
          payload_patch="${RUNNER_TEMP:?}/performance-qualification-v2.patch"
          base64 --decode "$PAYLOAD_PATH" > "$payload_xz"
          test "$(wc -c < "$payload_xz" | tr -d ' ')" = "$PAYLOAD_XZ_BYTES"
          printf '%s  %s\n' "$PAYLOAD_XZ_SHA256" "$payload_xz" | sha256sum --check --strict
          xz --decompress --stdout "$payload_xz" > "$payload_patch"
          test "$(wc -c < "$payload_patch" | tr -d ' ')" = "$PAYLOAD_PATCH_BYTES"
          printf '%s  %s\n' "$PAYLOAD_PATCH_SHA256" "$payload_patch" | sha256sum --check --strict

          git --no-replace-objects cat-file -e "${TARGET_BASE_SHA}^{commit}"
          test "$(git --no-replace-objects rev-parse "${TARGET_BASE_SHA}^{tree}")" = "$TARGET_BASE_TREE"
          if git ls-remote --exit-code --heads origin "refs/heads/${CANDIDATE_BRANCH}" >/dev/null 2>&1; then
            echo "candidate branch already exists; absence lease refused" >&2
            exit 1
          fi

          worktree="${RUNNER_TEMP:?}/performance-qualification-v2-source"
          git worktree add --detach "$worktree" "$TARGET_BASE_SHA"
          cd "$worktree"
          test "$(git --no-replace-objects rev-parse HEAD)" = "$TARGET_BASE_SHA"
          test "$(git --no-replace-objects rev-parse HEAD^{tree})" = "$TARGET_BASE_TREE"
          test -z "$(git status --porcelain=v1 --untracked-files=all --ignore-submodules=none)"

          git apply --binary --index --check "$payload_patch"
          git apply --binary --index "$payload_patch"

          expected="${RUNNER_TEMP:?}/performance-qualification-v2.expected"
          actual="${RUNNER_TEMP:?}/performance-qualification-v2.actual"
          printf '%s\n' \
            '.github/workflows/g1-exact-head-source.yml' \
            '.github/workflows/g1-synthetic-merge.yml' \
            'docs/PERFORMANCE_AND_OPTIMIZATION.md' \
            'tools/perf/README.md' \
            'tools/perf/performance_qualification.py' \
            'tools/tests/test_performance_qualification.py' > "$expected"
          git diff --cached --name-only | LC_ALL=C sort > "$actual"
          diff --unified "$expected" "$actual"
          test -z "$(grep -E '^(ops/|\.github/workflows/tmp-)' "$actual" || true)"
          git diff --cached --check

          python3 -I -m py_compile \
            tools/perf/performance_qualification.py \
            tools/tests/test_performance_qualification.py
          python3 -m unittest tools.tests.test_performance_qualification -v
          python3 tools/docs/generate_global_docs.py --check
          python3 tools/docs/verify_global_docs.py
          python3 tools/docs/verify_repository_authority.py
          cargo fmt --all -- --check
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
          git diff --cached --check

          git config user.name 'Qian QI'
          git config user.email '102159240+ProfHepta@users.noreply.github.com'
          git commit -m 'perf: add stable controlled performance qualification' \
            -m 'Add three-batch same-input stability, cold/steady workload matrices, complete raw-sample statistics, explicit stage/resource coverage, L1/L2 evidence ceilings, and fail-closed regression qualification. WL-11 and WL-12 remain external L4/L5 holds.'

          candidate_head="$(git --no-replace-objects rev-parse HEAD)"
          candidate_tree="$(git --no-replace-objects rev-parse HEAD^{tree})"
          test "$(git --no-replace-objects rev-parse HEAD^)" = "$TARGET_BASE_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all --ignore-submodules=none)"
          git push --force-with-lease="refs/heads/${CANDIDATE_BRANCH}:" \
            origin "HEAD:refs/heads/${CANDIDATE_BRANCH}"

          receipt="${RUNNER_TEMP:?}/performance-qualification-v2-candidate.env"
          {
            printf 'schema=org.trillionnium.performance-qualification-builder-receipt.v1\n'
            printf 'controller_head=%s\n' "${GITHUB_SHA:?}"
            printf 'target_base=%s\n' "$TARGET_BASE_SHA"
            printf 'target_base_tree=%s\n' "$TARGET_BASE_TREE"
            printf 'candidate_branch=%s\n' "$CANDIDATE_BRANCH"
            printf 'candidate_head=%s\n' "$candidate_head"
            printf 'candidate_tree=%s\n' "$candidate_tree"
            printf 'payload_patch_sha256=%s\n' "$PAYLOAD_PATCH_SHA256"
            printf 'changed_file_count=6\n'
            printf 'focused_tests=10\n'
            printf 'automatic_redispatch=false\n'
            printf 'public_release=false\n'
            printf 'qualification=L1_SOURCE_ONLY\n'
          } > "$receipt"
          cat "$receipt"

      - name: Upload non-authorizing builder receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: performance-qualification-v2-builder-${{ github.sha }}
          path: ${{ runner.temp }}/performance-qualification-v2-candidate.env
          if-no-files-found: error
          retention-days: 30
