name: temporary owner-open R5 L2 probe cleanup

on:
  push:
    branches:
      - ops/owner-open-r5-l2-runner-probe-20260829
    paths:
      - ".github/workflows/owner-open-r5-l2-runner-probe.yml"

permissions:
  actions: write
  contents: read

jobs:
  cancel-unassigned-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Cancel the unassigned self-hosted probe run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_RUN_ID: "33275584879"
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${TARGET_RUN_ID}/cancel"
