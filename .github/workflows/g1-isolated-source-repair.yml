name: G1 isolated audit repair validation
on:
  push:
    branches: [ops/g1-audit-repair-builder-20260905]
permissions:
  contents: read
concurrency:
  group: g1-isolated-audit-repair
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      candidate: ${{ steps.subject.outputs.candidate }}
      tree: ${{ steps.subject.outputs.tree }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      CARGO_TERM_COLOR: never
      RUST_BACKTRACE: '1'
    defaults:
      run:
        working-directory: source
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 17990958e11af59c625b52ad7677168537410456
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 3bfdb9516e600852ec7bff044b5c1df3131a9676
          path: inputs
          persist-credentials: false
      - name: Apply exact hash-bound source patch
        run: |
          set -euo pipefail
          test "$(git --no-replace-objects rev-parse HEAD)" = 17990958e11af59c625b52ad7677168537410456
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          mkdir -p "$RUNNER_TEMP/g1-repair"
          python3 - <<'PY'
          import base64, hashlib, lzma, os
          from pathlib import Path
          encoded = ''.join((Path('../inputs/repair-inputs') / f'part{i}.b64').read_text() for i in range(1,5))
          assert len(encoded) == 26280
          decoder = lzma.LZMADecompressor(memlimit=128*1024*1024)
          raw = decoder.decompress(base64.b64decode(encoded, validate=True), max_length=113438)
          assert decoder.eof and not decoder.unused_data
          assert len(raw) == 113437
          assert hashlib.sha256(raw).hexdigest() == 'ca63c1127ec89a96bbbe470e6c5332e827235bdb149068298d2f0cf8e7685f65'
          (Path(os.environ['RUNNER_TEMP'])/'g1-repair/source.patch').write_bytes(raw)
          PY
          git apply --index "$RUNNER_TEMP/g1-repair/source.patch"
          python3 - <<'PY'
          from pathlib import Path
          path = Path('apps/trillionnium-owner-open-host/tests/r5_jobs.rs')
          source = path.read_text()
          for operation in ['wait-before-restart', 'wait-delayed-terminal']:
              old = '        &[job_start(&command), job_wait(0, "'+operation+'", 5000)],'
              new = '        &[\n            job_start(&command),\n            job_wait(0, "'+operation+'", 5000),\n        ],'
              assert source.count(old) == 1
              source = source.replace(old, new)
          path.write_text(source)
          PY
          git add apps/trillionnium-owner-open-host/tests/r5_jobs.rs
      - name: Generate complete non-self-referential review inventory
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from tools import verify_g1_review_index as v
          import subprocess
          from pathlib import Path
          base = 'bb0f85e63b251b99a6fb490dfe6406a992d95f45'
          parent = '17990958e11af59c625b52ad7677168537410456'
          def git(*args):
              return subprocess.check_output(['git','--no-replace-objects',*args]).decode().strip()
          raw = subprocess.check_output(['git','diff','--cached','--name-status','-z','-M',base]).decode().split('\0')
          assert raw.pop() == ''
          records = []
          i = 0
          while i < len(raw):
              status, path = raw[i:i+2]
              i += 2
              if status.startswith('R'):
                  previous, path = path, raw[i]
                  i += 1
                  kind = 'renamed'
              else:
                  previous = None
                  kind = {'A':'added','D':'removed','M':'modified','T':'changed'}[status]
              records.append({'path':path,'status':kind,'previous_path':previous})
          observed = v.observation_from_changes(repository=v.REPOSITORY,pull_request=41,base_commit=base,base_tree=git('rev-parse',base+'^{tree}'),head_commit=parent,head_tree=git('write-tree'),pages=0,raw_changes=records)
          proposal = v.propose_index(observed,predecessor_commit=parent,predecessor_tree=git('rev-parse',parent+'^{tree}'),accountable_owner='ProfHepta',runtime_reviewer='Tomasrgbsf',evidence_reviewer='Franksudoman')
          v.atomic_json(Path(v.INDEX_PATH),proposal)
          print(proposal['expected'])
          PY
          git add governance/pr41-review-index.v1.json
          test "$(git write-tree)" = 088ad917918ca3540314839123589222b1ed23e7
          test -z "$(git diff --cached --name-only -- .github docs/machine/gap-register.v2.json docs/machine/evidence-index.v1.json)"
      - name: Commit the exact source candidate without qualification claims
        id: subject
        run: |
          set -euo pipefail
          git config user.name 'OpenAI Codex'
          git config user.email 'noreply@openai.com'
          git -c commit.gpgsign=false commit -m 'fix(g1): bind complete review inventory and executable module contracts' -m 'Wait for durable job termination before restart regression; reject contract prose drift and validate concrete navigation for all modules. Preserve every external evidence hold and all no-release/no-redispatch boundaries.' -m 'Signed-off-by: OpenAI Codex <noreply@openai.com>'
          candidate=$(git rev-parse HEAD)
          tree=$(git rev-parse HEAD^{tree})
          printf 'candidate=%s\ntree=%s\n' "$candidate" "$tree" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$candidate" "$tree" > "$RUNNER_TEMP/g1-repair/subject.txt"
          git bundle create "$RUNNER_TEMP/g1-repair/candidate.bundle" HEAD
          git diff HEAD^ HEAD --stat > "$RUNNER_TEMP/g1-repair/change-stat.txt"
          git diff HEAD^ HEAD --binary > "$RUNNER_TEMP/g1-repair/complete.patch"
      - uses: dtolnay/rust-toolchain@d8dfd7155fea72af4ad34a8fe97364d210e2d020
        with:
          toolchain: 1.93.0
          components: rustfmt,clippy
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Verify detailed contracts and closed-world inventory regressions
        run: |
          set -euo pipefail
          {
            python3 tools/docs/generate_global_docs.py --check
            python3 tools/docs/verify_global_docs.py
            python3 tools/docs/verify_module_documentation.py
            python3 -m unittest tools.tests.test_owner_open_broker_module_documentation tools.tests.test_verify_global_docs_contracts tools.tests.test_verify_g1_review_index -v
            python3 -m unittest discover -s tools/tests -p 'test_g1_pr_aggregate*.py' -v
            python3 -m unittest discover -s tools/tests -p 'test_verify_g1_repository_closure.py' -v
            python3 tools/verify_g1_repository_closure.py --root .
          } 2>&1 | tee "$RUNNER_TEMP/g1-repair/contracts.log"
      - name: Run complete selected Rust source qualification
        run: |
          set -euo pipefail
          {
            rustc --version --verbose
            cargo fmt --all -- --check
            cargo test --locked --all-targets
            cargo clippy --locked --all-targets -- -D warnings
            for iteration in $(seq 1 20); do
              printf '\n=== job lifecycle repetition %s ===\n' "$iteration"
              cargo test --locked -p trillionnium-owner-open-host --test r5_jobs -- --test-threads=8
            done
          } 2>&1 | tee "$RUNNER_TEMP/g1-repair/rust.log"
      - name: Check independent planned workspaces and broker regressions
        run: |
          set -euo pipefail
          {
            for manifest in planned/crates/trillionnium-global-control-plane/Cargo.toml planned/crates/trillionnium-telemetry/Cargo.toml; do
              cargo fmt --manifest-path "$manifest" -- --check
              cargo test --locked --manifest-path "$manifest" --all-targets
              cargo clippy --locked --manifest-path "$manifest" --all-targets -- -D warnings
            done
            python3 -m unittest discover -s tools/tests -p 'test_owner_open_broker*.py' -v
          } 2>&1 | tee "$RUNNER_TEMP/g1-repair/planned-and-broker.log"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          printf '%s\n' 'PASS_ISOLATED_SOURCE_TESTS_ONLY' 'Independent review is not supplied by this run.' 'The live PR exact-head/merge matrix must run separately.' 'No L2-L6 evidence, signing, promotion or release authorization.' > "$RUNNER_TEMP/g1-repair/result.txt"
          sha256sum "$RUNNER_TEMP/g1-repair/candidate.bundle" > "$RUNNER_TEMP/g1-repair/bundle.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: g1-audit-source-repair
          path: ${{ runner.temp }}/g1-repair/
          if-no-files-found: error
          retention-days: 30
  publish-candidate:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: g1-audit-source-repair
          path: ${{ runner.temp }}/g1-repair
      - name: Publish inert verified Git objects to a new candidate branch only
        shell: bash
        env:
          CANDIDATE: ${{ needs.validate.outputs.candidate }}
          TREE: ${{ needs.validate.outputs.tree }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$TREE" = 088ad917918ca3540314839123589222b1ed23e7
          grep -qx PASS_ISOLATED_SOURCE_TESTS_ONLY "$RUNNER_TEMP/g1-repair/result.txt"
          mkdir "$RUNNER_TEMP/g1-publish"
          cd "$RUNNER_TEMP/g1-publish"
          git init --bare
          git fetch "$RUNNER_TEMP/g1-repair/candidate.bundle" HEAD:refs/heads/candidate
          test "$(git rev-parse candidate)" = "$CANDIDATE"
          test "$(git rev-parse candidate^{tree})" = "$TREE"
          test "$(git rev-parse candidate^)" = 17990958e11af59c625b52ad7677168537410456
          test "$(git rev-list --count candidate^..candidate)" = 1
          test -z "$(git diff candidate^ candidate --name-only -- .github docs/machine/gap-register.v2.json docs/machine/evidence-index.v1.json)"
          git remote add origin https://github.com/TrillionniumFoundation/trillionnium-os.git
          git config credential.helper '!f() { printf "username=x-access-token\npassword=%s\n" "$GH_TOKEN"; }; f'
          test -z "$(git ls-remote --heads origin refs/heads/codex/g1-audit-repair-20260905)"
          git push origin refs/heads/candidate:refs/heads/codex/g1-audit-repair-20260905
          printf 'Published source candidate %s; no protected ref was changed.\n' "$CANDIDATE"
