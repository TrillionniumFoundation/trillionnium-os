name: one-shot owner-open R5 Rust format repair

on:
  push:
    branches:
      - codex/owner-open-r5-gap-closure-20260829
    paths:
      - ".github/workflows/owner-open-r5-format-repair.yml"
      - "apps/trillionnium-owner-open-host/**/*.rs"
      - "crates/trillionnium-owner-open-*/**/*.rs"

permissions:
  contents: write

concurrency:
  group: owner-open-r5-one-shot-format-${{ github.ref }}
  cancel-in-progress: false

jobs:
  format-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/owner-open-r5-gap-closure-20260829
      - uses: dtolnay/rust-toolchain@1.93.0
        with:
          components: rustfmt
      - name: Apply deterministic Rust formatting
        run: cargo fmt --all
      - name: Commit only deterministic formatting when required
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No Rust formatting repair required"
            exit 0
          fi
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.rs'
          git commit -m "style(r5): apply deterministic Rust 1.93 formatting"
          git push origin HEAD:codex/owner-open-r5-gap-closure-20260829
