name: one-shot owner-open R5 Rust format repair

on:
  push:
    branches:
      - codex/owner-open-r5-gap-closure-20260829
    paths:
      - ".github/workflows/owner-open-r5-format-repair.yml"

permissions:
  contents: write

jobs:
  format-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/owner-open-r5-gap-closure-20260829
      - uses: dtolnay/rust-toolchain@1.93.0
        with:
          components: rustfmt
      - name: Apply deterministic Rust formatting
        run: cargo fmt --all
      - name: Commit deterministic formatting
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.rs'
          git commit -m "style(r5): format lifecycle and recovery regressions"
          git push origin HEAD:codex/owner-open-r5-gap-closure-20260829
