name: owner-open R5 selected qualification paths

on:
  pull_request:
    paths:
      - "tools/owner-open/adb_smart_socket_relay_selected.py"
      - "tools/owner-open/qualify_owner_open_adb_selected.py"
      - "tools/owner-open/supervise_codex_mcp_qualification.py"
      - "tools/owner-open/trace_mcp_stdio.py"
      - "tools/owner-open/qualify_codex_mcp_jobs.py"
      - "tools/tests/test_adb_smart_socket_relay_selected.py"
      - "tools/tests/test_qualify_owner_open_adb_selected.py"
      - "tools/tests/test_supervise_codex_mcp_qualification.py"
      - "tools/tests/test_codex_mcp_qualification_lifecycle.py"
      - "docs/protocols/owner-open-adb-*.md"
      - "docs/protocols/owner-open-installed-codex-mcp-qualification-v1.md"
      - "docs/plan/owner-open-r5-batch-e-*.md"
      - ".github/workflows/owner-open-r5-selected-qualification.yml"
  push:
    branches:
      - main
      - "codex/**"
    paths:
      - "tools/owner-open/adb_smart_socket_relay_selected.py"
      - "tools/owner-open/qualify_owner_open_adb_selected.py"
      - "tools/owner-open/supervise_codex_mcp_qualification.py"
      - "tools/owner-open/trace_mcp_stdio.py"
      - "tools/owner-open/qualify_codex_mcp_jobs.py"
      - "tools/tests/test_adb_smart_socket_relay_selected.py"
      - "tools/tests/test_qualify_owner_open_adb_selected.py"
      - "tools/tests/test_supervise_codex_mcp_qualification.py"
      - "tools/tests/test_codex_mcp_qualification_lifecycle.py"
      - "docs/protocols/owner-open-adb-*.md"
      - "docs/protocols/owner-open-installed-codex-mcp-qualification-v1.md"
      - "docs/plan/owner-open-r5-batch-e-*.md"
      - ".github/workflows/owner-open-r5-selected-qualification.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: owner-open-r5-selected-qualification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  selected-python-paths:
    name: Selected Codex and ADB qualification mechanics
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile selected source
        run: |
          python3 -m py_compile \
            tools/owner-open/trace_mcp_stdio.py \
            tools/owner-open/qualify_codex_mcp_jobs.py \
            tools/owner-open/supervise_codex_mcp_qualification.py \
            tools/owner-open/adb_smart_socket_relay_selected.py \
            tools/owner-open/qualify_owner_open_adb_selected.py \
            tools/tests/test_codex_mcp_qualification_lifecycle.py \
            tools/tests/test_supervise_codex_mcp_qualification.py \
            tools/tests/test_adb_smart_socket_relay_selected.py \
            tools/tests/test_qualify_owner_open_adb_selected.py
      - name: Run selected installed-Codex lifecycle fixtures
        env:
          PYTHONWARNINGS: error::ResourceWarning
        run: |
          python3 -m unittest \
            tools.tests.test_codex_mcp_qualification_lifecycle \
            tools.tests.test_supervise_codex_mcp_qualification \
            -v 2>&1 | tee selected-codex-qualification-tests.txt
      - name: Run selected ADB relay and qualifier fixtures
        env:
          PYTHONWARNINGS: error::ResourceWarning
        run: |
          python3 -m unittest \
            tools.tests.test_adb_smart_socket_relay_selected \
            tools.tests.test_qualify_owner_open_adb_selected \
            -v 2>&1 | tee selected-adb-qualification-tests.txt
      - uses: actions/upload-artifact@v4
        with:
          name: owner-open-r5-selected-qualification-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            selected-codex-qualification-tests.txt
            selected-adb-qualification-tests.txt
