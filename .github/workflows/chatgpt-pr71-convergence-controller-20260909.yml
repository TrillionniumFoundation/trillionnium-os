name: ChatGPT PR71 repository-truth convergence

on:
  push:
    branches:
      - ops/chatgpt-pr71-convergence-controller-20260909

permissions:
  actions: read
  checks: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: chatgpt-pr71-repository-truth-convergence
  cancel-in-progress: true

jobs:
  converge-review-merge:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: TrillionniumFoundation/trillionnium-os
      DEPENDENCY_PR: "63"
      PR_NUMBER: "71"
      EXPECTED_HEAD_REF: codex/repository-truth-profiles-20260908
      REVIEWER_RUNTIME: Tomasrgbsf
      REVIEWER_EVIDENCE: Franksudoman
      PYTHONDONTWRITEBYTECODE: 1
    steps:
      - name: Wait for ordinary protected integration of PR63
        id: subject
        shell: bash
        run: |
          set -euo pipefail
          for iteration in $(seq 1 1080); do
            dependency_state="$(gh api "repos/$REPOSITORY/pulls/$DEPENDENCY_PR" --jq .state)"
            dependency_merged="$(gh api "repos/$REPOSITORY/pulls/$DEPENDENCY_PR" --jq .merged)"
            if test "$dependency_state" = closed && test "$dependency_merged" = true; then
              break
            fi
            sleep 15
          done
          test "$dependency_state" = closed
          test "$dependency_merged" = true

          state="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" --jq .state)"
          merged="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" --jq .merged)"
          if test "$state" = closed && test "$merged" = true; then
            printf 'already_merged=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test "$state" = open
          printf 'already_merged=false\n' >> "$GITHUB_OUTPUT"
          head_ref="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" --jq .head.ref)"
          head_repo="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" --jq .head.repo.full_name)"
          base_ref="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" --jq .base.ref)"
          old_head="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" --jq .head.sha)"
          main_head="$(gh api "repos/$REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          test "$head_ref" = "$EXPECTED_HEAD_REF"
          test "$head_repo" = "$REPOSITORY"
          test "$base_ref" = main
          printf 'head_ref=%s\n' "$head_ref" >> "$GITHUB_OUTPUT"
          printf 'old_head=%s\n' "$old_head" >> "$GITHUB_OUTPUT"
          printf 'main_head=%s\n' "$main_head" >> "$GITHUB_OUTPUT"

      - name: Check out repository-truth candidate
        if: steps.subject.outputs.already_merged != 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ steps.subject.outputs.head_ref }}
          persist-credentials: true

      - name: Converge with current protected main and rebuild exact review index
        if: steps.subject.outputs.already_merged != 'true'
        id: converge
        shell: bash
        env:
          HEAD_REF: ${{ steps.subject.outputs.head_ref }}
          OLD_HEAD: ${{ steps.subject.outputs.old_head }}
          MAIN_HEAD: ${{ steps.subject.outputs.main_head }}
        run: |
          set -euo pipefail
          test "$(git --no-replace-objects rev-parse HEAD)" = "$OLD_HEAD"
          git fetch --no-tags origin main
          test "$(git --no-replace-objects rev-parse origin/main)" = "$MAIN_HEAD"
          git config user.name 'Qian QI'
          git config user.email '102159240+ProfHepta@users.noreply.github.com'
          predecessor_tree="$(git --no-replace-objects rev-parse "$OLD_HEAD^{tree}")"
          main_tree="$(git --no-replace-objects rev-parse "$MAIN_HEAD^{tree}")"

          if git --no-replace-objects merge-base --is-ancestor "$MAIN_HEAD" "$OLD_HEAD"; then
            printf '%s\n' 'repository-truth candidate already contains protected main'
          else
            set +e
            git merge --no-ff --no-commit "$MAIN_HEAD"
            merge_status=$?
            set -e
            unmerged="$(git diff --name-only --diff-filter=U | LC_ALL=C sort)"
            if test -n "$unmerged"; then
              test "$unmerged" = governance/pr41-review-index.v1.json
              git checkout --ours governance/pr41-review-index.v1.json
              git add governance/pr41-review-index.v1.json
            else
              test "$merge_status" -eq 0
            fi
          fi

          python3 - "$PWD" "$MAIN_HEAD" "$main_tree" "$OLD_HEAD" "$predecessor_tree" "$PR_NUMBER" <<'PY'
          from __future__ import annotations
          import importlib.util
          import json
          from pathlib import Path
          import subprocess
          import sys

          root = Path(sys.argv[1])
          main_commit, main_tree, predecessor, predecessor_tree = sys.argv[2:6]
          pull_request = int(sys.argv[6])
          verifier_path = root / 'tools/verify_g1_review_index.py'
          spec = importlib.util.spec_from_file_location('_review_index', verifier_path)
          if spec is None or spec.loader is None:
              raise SystemExit('cannot load review-index verifier')
          verifier = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(verifier)
          raw = subprocess.check_output(
              ['git', '--no-replace-objects', '-C', str(root), 'diff', '--cached', '--name-status', '-M', main_commit],
              text=True,
          )
          mapping = {'A': 'added', 'M': 'modified', 'D': 'removed', 'T': 'changed'}
          changes = []
          for line in raw.splitlines():
              fields = line.split('\t')
              code = fields[0]
              if code.startswith('R'):
                  changes.append({'path': fields[2], 'status': 'renamed', 'previous_path': fields[1]})
              else:
                  status = mapping.get(code[:1])
                  if status is None or len(fields) != 2:
                      raise SystemExit(f'unsupported diff status: {line}')
                  changes.append({'path': fields[1], 'status': status, 'previous_path': None})
          changes.sort(key=lambda item: item['path'])
          if not changes:
              raise SystemExit('repository-truth candidate has no changes from protected main')
          observation = {
              'repository': 'TrillionniumFoundation/trillionnium-os',
              'pull_request': pull_request,
              'base_commit': main_commit,
              'base_tree': main_tree,
              'changes': changes,
          }
          index = verifier.propose_index(
              observation,
              predecessor_commit=predecessor,
              predecessor_tree=predecessor_tree,
              accountable_owner='ProfHepta',
              runtime_reviewer='Tomasrgbsf',
              evidence_reviewer='Franksudoman',
          )
          (root / verifier.INDEX_PATH).write_text(
              json.dumps(index, indent=2, sort_keys=True, ensure_ascii=False, allow_nan=False) + '\n',
              encoding='utf-8',
          )
          PY
          git add governance/pr41-review-index.v1.json
          git diff --cached --check
          if git diff --cached --quiet; then
            new_head="$OLD_HEAD"
          else
            git commit -m 'docs: converge repository truth with authenticated performance tooling'
            new_head="$(git --no-replace-objects rev-parse HEAD)"
          fi
          new_tree="$(git --no-replace-objects rev-parse "$new_head^{tree}")"
          changed_count="$(git diff --name-only "$MAIN_HEAD...$new_head" | wc -l | tr -d ' ')"
          test "$changed_count" -gt 0

          gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" --jq .body > "${RUNNER_TEMP}/body.md"
          python3 - "$MAIN_HEAD" "$main_tree" "$new_head" "$new_tree" "$changed_count" "${RUNNER_TEMP}/body.md" <<'PY'
          from pathlib import Path
          import re
          import sys
          base, base_tree, head, head_tree, count, body_path = sys.argv[1:]
          path = Path(body_path)
          body = path.read_text(encoding='utf-8')
          block = f'''## Exact subject

          ```text
          base branch:               main
          base commit:               {base}
          base tree:                 {base_tree}
          head commit:               {head}
          head tree:                 {head_tree}
          changed paths from base:   {count}
          ```

          The admission surface is this exact base/head/tree, the deterministic
          ordered-parent synthetic result, exact workflow attempts/jobs/artifacts,
          and fresh non-author reviews. Any movement invalidates qualification.
          '''
          block = '\n'.join(line[10:] if line.startswith('          ') else line for line in block.splitlines())
          if re.search(r'## Exact subject\n.*?(?=\n## )', body, flags=re.S):
              body = re.sub(r'## Exact subject\n.*?(?=\n## )', block.rstrip() + '\n', body, count=1, flags=re.S)
          else:
              body = block.rstrip() + '\n\n' + body
          path.write_text(body, encoding='utf-8')
          PY
          gh api -X PATCH "repos/$REPOSITORY/pulls/$PR_NUMBER" --input <(python3 - "${RUNNER_TEMP}/body.md" <<'PY'
          from pathlib import Path
          import json, sys
          print(json.dumps({'body': Path(sys.argv[1]).read_text(encoding='utf-8')}))
          PY
          ) >/dev/null
          if test "$new_head" != "$OLD_HEAD"; then
            git push origin "HEAD:$HEAD_REF"
          fi
          printf 'new_head=%s\n' "$new_head" >> "$GITHUB_OUTPUT"
          printf 'new_tree=%s\n' "$new_tree" >> "$GITHUB_OUTPUT"

      - name: Wait for exact-head and deterministic synthetic gates
        if: steps.subject.outputs.already_merged != 'true'
        shell: bash
        env:
          HEAD_SHA: ${{ steps.converge.outputs.new_head }}
        run: |
          set -euo pipefail
          python3 - "$REPOSITORY" "$HEAD_SHA" <<'PY'
          import json, subprocess, sys, time
          repository, head = sys.argv[1:]
          required = {
              'L1 graph, documentation, broker and MCP source closure',
              'L1 Rust 1.93 selected Host, job, flow and recovery closure',
              'L1 exact-source-head aggregate candidate',
              'L1 protected-main and exact-head independent-review readiness',
              'L1 exact two-parent merge source qualification',
          }
          def api(path):
              return json.loads(subprocess.check_output(['gh', 'api', path], text=True))
          for _ in range(720):
              values = api(f'repos/{repository}/commits/{head}/check-runs?per_page=100')['check_runs']
              latest = {}
              for value in sorted(values, key=lambda item: item.get('started_at') or item.get('created_at') or ''):
                  latest[value['name']] = value
              failed = sorted(name for name in required if name in latest and latest[name]['status'] == 'completed' and latest[name]['conclusion'] != 'success')
              if failed:
                  raise SystemExit(f'repository-truth required checks failed: {failed}')
              if required <= set(latest) and all(latest[name]['status'] == 'completed' for name in required):
                  break
              time.sleep(20)
          else:
              raise SystemExit('repository-truth checks did not complete')
          PY

      - name: Request fresh exact-head reviews
        if: steps.subject.outputs.already_merged != 'true'
        shell: bash
        env:
          HEAD_SHA: ${{ steps.converge.outputs.new_head }}
        run: |
          set -euo pipefail
          node_id="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" --jq .node_id)"
          if test "$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" --jq .draft)" = true; then
            gh api graphql -f query='mutation($id:ID!){markPullRequestReadyForReview(input:{pullRequestId:$id}){pullRequest{number}}}' -F id="$node_id" >/dev/null
          fi
          gh api -X POST "repos/$REPOSITORY/pulls/$PR_NUMBER/requested_reviewers" \
            -f reviewers[]="$REVIEWER_RUNTIME" -f reviewers[]="$REVIEWER_EVIDENCE" >/dev/null
          gh api -X POST "repos/$REPOSITORY/issues/$PR_NUMBER/comments" \
            -f body="Repository-truth candidate converged to protected main and all source/synthetic gates are successful on exact head \`$HEAD_SHA\`. Fresh non-author review requested; historical decisions do not transfer. Source/profile truth only—no L2-L6 or release authority." >/dev/null

      - name: Wait for both exact-head approvals and merge without bypass
        if: steps.subject.outputs.already_merged != 'true'
        shell: bash
        env:
          HEAD_SHA: ${{ steps.converge.outputs.new_head }}
        run: |
          set -euo pipefail
          python3 - "$REPOSITORY" "$PR_NUMBER" "$HEAD_SHA" "$REVIEWER_RUNTIME" "$REVIEWER_EVIDENCE" <<'PY'
          import json, subprocess, sys, time
          repository, number, head, *reviewers = sys.argv[1:]
          def api(path):
              return json.loads(subprocess.check_output(['gh', 'api', path], text=True))
          for _ in range(720):
              pull = api(f'repos/{repository}/pulls/{number}')
              if pull['head']['sha'] != head:
                  raise SystemExit('repository-truth head moved during review')
              values = api(f'repos/{repository}/pulls/{number}/reviews?per_page=100')
              latest = {}
              for value in sorted(values, key=lambda item: item.get('submitted_at') or ''):
                  if value['user']['login'] in reviewers:
                      latest[value['user']['login']] = value
              if all(latest.get(login, {}).get('state') == 'APPROVED' and latest[login].get('commit_id') == head for login in reviewers):
                  break
              time.sleep(20)
          else:
              raise SystemExit('repository-truth exact-head approvals not observed')
          PY
          gh api -X PUT "repos/$REPOSITORY/pulls/$PR_NUMBER/merge" \
            -f merge_method=squash -f sha="$HEAD_SHA" \
            -f commit_title='docs: make repository profiles and authority executable (#71)' \
            -f commit_message='Converge the repository-wide authority/link verifier and machine-readable product profiles with the protected source and authenticated performance tooling. Source truth only; no target, device, signing or release evidence is promoted.' \
            --jq '{merged,sha,message}'
