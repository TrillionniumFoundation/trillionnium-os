name: ChatGPT source chain convergence

on:
  push:
    branches:
      - ops/chatgpt-pr63-source-export-20260909

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: chatgpt-source-chain-convergence-20260909
  cancel-in-progress: true

jobs:
  converge:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      PYTHONDONTWRITEBYTECODE: 1
    steps:
      - name: Converge the next dependency-ready source candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import time
          import urllib.error
          import urllib.request
          from pathlib import Path

          repo = os.environ['REPOSITORY']
          token = os.environ['GH_TOKEN']
          api = 'https://api.github.com'
          chain = [
              ('codex/perf-harness-isolation-20260908', 63),
              ('codex/repository-truth-profiles-20260908', None),
              ('codex/effect-lifecycle-model-20260908', None),
              ('codex/executable-module-contracts-v1-20260909', None),
              ('codex/performance-measurement-v1-20260909', None),
              ('codex/observe-shadow-telemetry-v1-20260909', None),
          ]

          def api_request(method, path, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(
                  api + path,
                  data=data,
                  method=method,
                  headers={
                      'Accept': 'application/vnd.github+json',
                      'Authorization': f'Bearer {token}',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'User-Agent': 'trillionnium-source-chain-convergence',
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      raw = response.read(16 * 1024 * 1024 + 1)
                      if len(raw) > 16 * 1024 * 1024:
                          raise RuntimeError(f'oversized response: {path}')
                      return None if not raw else json.loads(raw)
              except urllib.error.HTTPError as error:
                  raw = error.read(64 * 1024).decode('utf-8', 'replace')
                  raise RuntimeError(f'{method} {path}: HTTP {error.code}: {raw}') from error

          def run(*args, cwd=None, env=None, check=True):
              completed = subprocess.run(
                  list(args), cwd=cwd, env=env, text=True,
                  stdout=subprocess.PIPE, stderr=subprocess.PIPE,
                  timeout=1800, check=False,
              )
              if check and completed.returncode != 0:
                  raise RuntimeError(
                      f'command failed ({completed.returncode}): {args}\n'
                      f'stdout:\n{completed.stdout[-12000:]}\n'
                      f'stderr:\n{completed.stderr[-12000:]}'
                  )
              return completed

          def post(number, body):
              api_request('POST', f'/repos/{repo}/issues/{number}/comments', {'body': body})

          def open_pulls():
              pulls = api_request('GET', f'/repos/{repo}/pulls?state=open&per_page=100')
              return {p['head']['ref']: p for p in pulls}

          def current_main():
              return api_request('GET', f'/repos/{repo}/branches/main')['commit']['sha']

          def merged(number):
              pull = api_request('GET', f'/repos/{repo}/pulls/{number}')
              return bool(pull.get('merged'))

          def exact_status_records(root, main_ref):
              raw = run('git', 'diff', '--cached', '--name-status', '-z', '-M', main_ref, cwd=root).stdout
              tokens = raw.split('\0')
              if tokens and tokens[-1] == '':
                  tokens.pop()
              records = []
              index = 0
              mapping = {'A': 'added', 'M': 'modified', 'D': 'removed', 'C': 'copied'}
              while index < len(tokens):
                  status_token = tokens[index]
                  index += 1
                  code = status_token[0]
                  if code == 'R':
                      previous = tokens[index]
                      path = tokens[index + 1]
                      index += 2
                      records.append({'path': path, 'status': 'renamed', 'previous_path': previous})
                  elif code == 'C':
                      previous = tokens[index]
                      path = tokens[index + 1]
                      index += 2
                      records.append({'path': path, 'status': 'copied', 'previous_path': None})
                  else:
                      path = tokens[index]
                      index += 1
                      records.append({'path': path, 'status': mapping.get(code, 'changed'), 'previous_path': None})
              return sorted(records, key=lambda item: item['path'])

          report = {
              'schema': 'org.trillionnium.source-chain-convergence.v1',
              'automatic_redispatch': False,
              'administrator_bypass': False,
              'events': [],
          }
          deadline = time.monotonic() + 40 * 60
          while time.monotonic() < deadline:
              pulls = open_pulls()
              # The first candidate is converged already; wait for its ordinary merge.
              first = pulls.get(chain[0][0])
              if first is not None:
                  report['events'].append({'decision': 'WAIT_PR63', 'head': first['head']['sha']})
                  time.sleep(30)
                  continue
              if not merged(63):
                  report['events'].append({'decision': 'PR63_NOT_MERGED'})
                  time.sleep(30)
                  continue

              # Find the first open candidate after the merged prefix.
              target = None
              predecessor_complete = True
              for ref, pinned in chain[1:]:
                  pull = pulls.get(ref)
                  if pull is None:
                      predecessor_complete = False
                      report['events'].append({'ref': ref, 'decision': 'NO_OPEN_PULL'})
                      break
                  if not predecessor_complete:
                      break
                  target = pull
                  break
              if target is None:
                  time.sleep(30)
                  continue

              main_sha = current_main()
              number = target['number']
              target_ref = target['head']['ref']
              target_head = target['head']['sha']
              target_base = target['base']['sha']
              body = target.get('body') or ''
              if target_base == main_sha and main_sha in body:
                  report['events'].append({
                      'pr': number, 'ref': target_ref, 'head': target_head,
                      'decision': 'ALREADY_BOUND_TO_CURRENT_MAIN',
                  })
                  time.sleep(30)
                  continue

              work = Path('/tmp/source-chain')
              if work.exists():
                  run('rm', '-rf', str(work))
              clone_url = f'https://x-access-token:{token}@github.com/{repo}.git'
              safe_env = dict(os.environ)
              safe_env.update({'GIT_TERMINAL_PROMPT': '0', 'LC_ALL': 'C', 'LANG': 'C'})
              run('git', 'clone', '--no-tags', '--branch', target_ref, clone_url, str(work), env=safe_env)
              run('git', 'fetch', '--no-tags', 'origin', 'main', cwd=work, env=safe_env)
              observed_head = run('git', 'rev-parse', 'HEAD', cwd=work).stdout.strip()
              if observed_head != target_head:
                  raise RuntimeError(f'target head moved: expected {target_head}, got {observed_head}')
              main_sha = run('git', 'rev-parse', 'origin/main', cwd=work).stdout.strip()
              main_tree = run('git', 'rev-parse', 'origin/main^{tree}', cwd=work).stdout.strip()
              predecessor_tree = run('git', 'rev-parse', 'HEAD^{tree}', cwd=work).stdout.strip()
              run('git', 'config', 'user.name', 'Qian QI', cwd=work)
              run('git', 'config', 'user.email', '102159240+ProfHepta@users.noreply.github.com', cwd=work)

              ancestry = run('git', 'merge-base', '--is-ancestor', main_sha, 'HEAD', cwd=work, check=False)
              if ancestry.returncode != 0:
                  merge = run('git', 'merge', '--no-ff', '--no-commit', 'origin/main', cwd=work, check=False)
                  if merge.returncode != 0:
                      run('git', 'merge', '--abort', cwd=work, check=False)
                      message = (
                          f'## Source-chain convergence blocked\n\n'
                          f'PR #{number} `{target_ref}` could not be cleanly converged with '
                          f'protected `main@{main_sha}`. No conflict resolution, force push, '
                          f'review dismissal or administrator bypass was attempted.\n\n'
                          f'```text\n{merge.stderr[-6000:]}\n```'
                      )
                      post(number, message)
                      report['events'].append({
                          'pr': number, 'ref': target_ref, 'head': target_head,
                          'main': main_sha, 'decision': 'MERGE_CONFLICT_FAIL_CLOSED',
                      })
                      break
              else:
                  run('git', 'reset', '--soft', 'HEAD', cwd=work)

              index_path = work / 'governance/pr41-review-index.v1.json'
              index_path.parent.mkdir(parents=True, exist_ok=True)
              # Ensure the index itself is part of the staged candidate inventory.
              if not index_path.exists():
                  index_path.write_text('{}\n', encoding='utf-8')
              run('git', 'add', '-A', cwd=work)
              records = exact_status_records(work, 'origin/main')
              if not any(item['path'] == 'governance/pr41-review-index.v1.json' for item in records):
                  records.append({
                      'path': 'governance/pr41-review-index.v1.json',
                      'status': 'modified', 'previous_path': None,
                  })
                  records.sort(key=lambda item: item['path'])

              import importlib.util
              verifier_path = work / 'tools/verify_g1_review_index.py'
              spec = importlib.util.spec_from_file_location('review_index', verifier_path)
              if spec is None or spec.loader is None:
                  raise RuntimeError('cannot load review-index authority')
              module = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(module)
              observation = {
                  'repository': repo,
                  'pull_request': number,
                  'base_commit': main_sha,
                  'base_tree': main_tree,
                  'head_commit': target_head,
                  'head_tree': predecessor_tree,
                  'changes': records,
              }
              index = module.propose_index(
                  observation,
                  predecessor_commit=target_head,
                  predecessor_tree=predecessor_tree,
                  accountable_owner='ProfHepta',
                  runtime_reviewer='Tomasrgbsf',
                  evidence_reviewer='Franksudoman',
              )
              index_path.write_text(
                  json.dumps(index, indent=2, sort_keys=True, ensure_ascii=False, allow_nan=False) + '\n',
                  encoding='utf-8',
              )
              run('git', 'add', '-A', cwd=work)
              actual = exact_status_records(work, 'origin/main')
              if actual != records:
                  # Rebuild once from the final staged inventory.
                  observation['changes'] = actual
                  index = module.propose_index(
                      observation,
                      predecessor_commit=target_head,
                      predecessor_tree=predecessor_tree,
                      accountable_owner='ProfHepta',
                      runtime_reviewer='Tomasrgbsf',
                      evidence_reviewer='Franksudoman',
                  )
                  index_path.write_text(
                      json.dumps(index, indent=2, sort_keys=True, ensure_ascii=False, allow_nan=False) + '\n',
                      encoding='utf-8',
                  )
                  run('git', 'add', '-A', cwd=work)

              # Focused preflight; the PR workflows remain the full admission authority.
              run('git', 'diff', '--cached', '--check', cwd=work)
              run('python3', '-m', 'compileall', '-q', 'tools', cwd=work)
              if (work / 'tools/docs/generate_global_docs.py').exists():
                  run('python3', 'tools/docs/generate_global_docs.py', '--check', cwd=work)
              if (work / 'tools/docs/verify_global_docs.py').exists():
                  run('python3', 'tools/docs/verify_global_docs.py', cwd=work)
              focused = []
              for module_name in (
                  'tools.tests.test_repository_authority',
                  'tools.tests.test_effect_lifecycle',
                  'tools.tests.test_executable_module_contracts',
                  'tools.tests.test_run_product_baseline',
                  'tools.tests.test_verify_host_reproducibility',
                  'tools.tests.test_telemetry_control',
              ):
                  module_path = work / (module_name.replace('.', '/') + '.py')
                  if module_path.exists():
                      focused.append(module_name)
              if focused:
                  run('python3', '-m', 'unittest', *focused, '-v', cwd=work)

              message = f'chore: converge PR #{number} with protected main'
              run('git', 'commit', '-m', message, cwd=work)
              new_head = run('git', 'rev-parse', 'HEAD', cwd=work).stdout.strip()
              new_tree = run('git', 'rev-parse', 'HEAD^{tree}', cwd=work).stdout.strip()
              parents = run('git', 'show', '-s', '--format=%P', 'HEAD', cwd=work).stdout.strip().split()
              if main_sha not in parents:
                  raise RuntimeError('convergence commit does not contain protected main as a parent')
              run('git', 'push', 'origin', f'HEAD:{target_ref}', cwd=work, env=safe_env)

              pull_now = api_request('GET', f'/repos/{repo}/pulls/{number}')
              old_body = pull_now.get('body') or ''
              exact = (
                  '## Current exact subject\n\n'
                  '```text\n'
                  f'base branch:       main\n'
                  f'base commit:       {main_sha}\n'
                  f'base tree:         {main_tree}\n'
                  f'review predecessor:{target_head}\n'
                  f'head commit:       {new_head}\n'
                  f'head tree:         {new_tree}\n'
                  f'changed paths:     {len(actual)}\n'
                  '```\n\n'
                  'This explicit convergence contains protected main as an ordered parent. '
                  'Any base/head/tree/workflow/review movement invalidates qualification. '
                  'No old-head check or review transfers.\n\n'
              )
              if old_body.startswith('## Current exact subject'):
                  marker = old_body.find('\n## ', 4)
                  old_body = old_body[marker + 1:] if marker >= 0 else ''
              new_body = exact + old_body
              api_request('PATCH', f'/repos/{repo}/pulls/{number}', {
                  'body': new_body,
                  'draft': True,
              })
              try:
                  api_request('POST', f'/repos/{repo}/pulls/{number}/requested_reviewers', {
                      'reviewers': ['Tomasrgbsf', 'Franksudoman'],
                  })
              except RuntimeError as error:
                  if '422' not in str(error):
                      raise
              post(number, (
                  f'## Explicit current-main convergence published\n\n'
                  f'`{target_ref}` moved from `{target_head}` to `{new_head}` with '
                  f'protected `main@{main_sha}` as a parent. Focused preflight passed. '
                  'The PR remains Draft until full exact-head and deterministic synthetic-merge '
                  'workflows are terminal-success; both named reviewers must submit fresh decisions '
                  'on the new head. No administrator bypass or L2-L6 promotion is authorized.'
              ))
              report['events'].append({
                  'pr': number, 'ref': target_ref, 'old_head': target_head,
                  'new_head': new_head, 'new_tree': new_tree, 'main': main_sha,
                  'decision': 'CURRENT_MAIN_CONVERGENCE_PUBLISHED',
              })
              break

          Path('/tmp/source-chain-convergence.json').write_text(
              json.dumps(report, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          PY
      - name: Upload convergence readback
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-chain-convergence-${{ github.sha }}
          retention-days: 7
          if-no-files-found: error
          path: /tmp/source-chain-convergence.json
