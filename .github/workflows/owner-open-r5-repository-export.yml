name: temporary owner-open R5 exact-head repository export

on:
  push:
    branches:
      - codex/owner-open-r5-gap-closure-20260829
    paths:
      - ".github/workflows/owner-open-r5-repository-export.yml"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Bind exact head and build source archive
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          commit="$(git rev-parse HEAD)"
          tree="$(git rev-parse HEAD^{tree})"
          archive="$RUNNER_TEMP/trillionnium-os-r5-${commit}.tar.gz"
          git archive --format=tar.gz --prefix=trillionnium-os-r5-${commit}/ --output="$archive" HEAD
          printf '%s\n' "$commit" > "$RUNNER_TEMP/EXACT_COMMIT"
          printf '%s\n' "$tree" > "$RUNNER_TEMP/EXACT_TREE"
          sha256sum "$archive" > "$RUNNER_TEMP/SHA256SUMS"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trillionnium-os-r5-repository-${{ github.sha }}
          path: |
            ${{ runner.temp }}/trillionnium-os-r5-${{ github.sha }}.tar.gz
            ${{ runner.temp }}/EXACT_COMMIT
            ${{ runner.temp }}/EXACT_TREE
            ${{ runner.temp }}/SHA256SUMS
          if-no-files-found: error
          retention-days: 3
