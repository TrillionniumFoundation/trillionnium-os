name: Owner-Open R15 reviewable source materializer

on:
  push:
    branches:
      - ops/owner-open-r15-source-materializer-20260831

permissions:
  contents: write

concurrency:
  group: owner-open-r15-source-materializer
  cancel-in-progress: false

env:
  BASE_COMMIT: 7ca4d64de1d5acee65a1592b0903a1b4c5bc11b0
  MATERIAL_BRANCH: ops/owner-open-r15-atomic-builder-20260831-v12
  MATERIAL_COMMIT: d4a02e9633df8889d59afe08adf11295c05014f5
  TARGET_BRANCH: codex/owner-open-r15-runtime-hardening-20260831
  PATCH_SHA256: f30cd81483225ebda3192aa8e7ce29a194e1086d290e2a8aae915e1bc5462ae3
  PYTHONDONTWRITEBYTECODE: "1"
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

jobs:
  materialize-and-qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out exact materializer commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: ${{ github.sha }}

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"

      - name: Set up Rust 1.93
        uses: dtolnay/rust-toolchain@d8dfd7155fea72af4ad34a8fe97364d210e2d020
        with:
          toolchain: "1.93.0"
          components: rustfmt, clippy

      - name: Materialize ordinary source diff and run repository gates
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "ops/owner-open-r15-source-materializer-20260831"
          test "$(git --no-replace-objects rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git --no-replace-objects status --porcelain=v1 --untracked-files=all)"

          git fetch --no-tags origin \
            "+refs/heads/$MATERIAL_BRANCH:refs/remotes/origin/$MATERIAL_BRANCH"
          test "$(git rev-parse refs/remotes/origin/$MATERIAL_BRANCH)" = "$MATERIAL_COMMIT"
          git cat-file -e "$BASE_COMMIT^{commit}"

          rm -f /tmp/owner-open-r15-runtime-hardening.patch.gz \
            /tmp/owner-open-r15-runtime-hardening.patch \
            /tmp/owner-open-r15-contract-fix.py
          for part in 00 01 02 03 04 05; do
            git show "$MATERIAL_COMMIT:.github/owner-open-r15-runtime-hardening.patch.gz.$part" \
              >> /tmp/owner-open-r15-runtime-hardening.patch.gz
          done
          echo "$PATCH_SHA256  /tmp/owner-open-r15-runtime-hardening.patch.gz" | sha256sum -c -
          gzip -dc /tmp/owner-open-r15-runtime-hardening.patch.gz \
            > /tmp/owner-open-r15-runtime-hardening.patch
          git show "$MATERIAL_COMMIT:.github/owner-open-r15-contract-fix-v11.py" \
            > /tmp/owner-open-r15-contract-fix.py
          chmod 600 /tmp/owner-open-r15-runtime-hardening.patch \
            /tmp/owner-open-r15-contract-fix.py
          python3 -m py_compile /tmp/owner-open-r15-contract-fix.py

          git switch --detach "$BASE_COMMIT"
          git switch -C "$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$BASE_COMMIT"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          git apply --index --whitespace=error /tmp/owner-open-r15-runtime-hardening.patch
          python3 /tmp/owner-open-r15-contract-fix.py
          cargo fmt --all
          git add -A

          cat > /tmp/r15-expected-paths.txt <<'EOF'
          .github/workflows/owner-open-r15-runtime-hardening.yml
          apps/trillionnium-agent-privilege-broker/src/linux_provider_post_exec_test_kernel.rs
          apps/trillionnium-owner-open-host/src/bin/r5_control_host_v6/entry.rs
          apps/trillionnium-owner-open-host/src/bin/r5_control_host_v7/entry.rs
          apps/trillionniumd/src/main.rs
          crates/trillionnium-owner-open-job-runtime/src/manager.rs
          crates/trillionnium-owner-open-job-runtime/src/process.rs
          crates/trillionnium-owner-open-job-runtime/src/types.rs
          crates/trillionnium-owner-open-job-runtime/tests/runtime.rs
          crates/trillionnium-owner-open-provider-jsonl/src/lib.rs
          crates/trillionnium-owner-open-runtime/src/process.rs
          crates/trillionnium-owner-open-runtime/src/types.rs
          crates/trillionnium-shell-exec/src/durable.rs
          docs/protocols/owner-open-jobs-v1.md
          tools/tests/test_owner_open_r15_runtime_hardening.py
          tools/verify-owner-open-r5-workflow-boundaries.py
          EOF
          sed -i 's/^          //' /tmp/r15-expected-paths.txt
          git diff --cached --name-only | LC_ALL=C sort > /tmp/r15-actual-paths.txt
          LC_ALL=C sort -o /tmp/r15-expected-paths.txt /tmp/r15-expected-paths.txt
          diff -u /tmp/r15-expected-paths.txt /tmp/r15-actual-paths.txt
          git diff --cached --check

          python3 tools/generate-owner-open-types.py --check
          python3 tools/verify-owner-open-r5.py --json
          python3 tools/verify-owner-open-r5-gap-evidence.py --json
          PYTHONWARNINGS=error::ResourceWarning \
            python3 -m unittest discover -s tools/tests -p 'test_*.py' -v

          cargo metadata --locked --format-version 1 > /tmp/r15-cargo-metadata.json
          cargo fmt --all -- --check
          cargo test --locked --workspace --all-targets
          cargo clippy --locked --workspace --all-targets -- -D warnings
          TRILLIONNIUM_P01_CONFORMANCE_BUILD_VARIANT=userdebug \
            cargo test --locked --package trillionnium-tool-runtime \
              --features p0-launch-package-provider-conformance --lib
          TRILLIONNIUM_P01_CONFORMANCE_BUILD_VARIANT=userdebug \
            cargo test --locked --package trillionniumd \
              --features p0-launch-package-device-conformance --all-targets
          TRILLIONNIUM_P01_CONFORMANCE_BUILD_VARIANT=userdebug \
            cargo clippy --locked --package trillionnium-tool-runtime \
              --features p0-launch-package-provider-conformance --all-targets -- -D warnings
          TRILLIONNIUM_P01_CONFORMANCE_BUILD_VARIANT=userdebug \
            cargo clippy --locked --package trillionniumd \
              --features p0-launch-package-device-conformance --all-targets -- -D warnings

          test -z "$(git diff --name-only)"
          git diff --cached --check
          git diff --cached --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(r15): harden runtime durability and resource admission"
          test "$(git rev-parse HEAD^)" = "$BASE_COMMIT"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
