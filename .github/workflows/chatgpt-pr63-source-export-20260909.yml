name: ChatGPT PR63 byte-custody repair

on:
  push:
    branches:
      - ops/chatgpt-pr63-source-export-20260909

permissions:
  contents: write

concurrency:
  group: chatgpt-pr63-byte-custody-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CONTROL_BRANCH: ops/chatgpt-pr63-source-export-20260909
      TARGET_BRANCH: codex/perf-harness-isolation-20260908
      EXPECTED_HEAD: e12a997e6af71c505bc7da07fdee1de1d3f4f733
      EXPECTED_TREE: 913dfa1abdaeb70ac89de416eccda3bb41dbb9a7
      CARRIER_SHA256: 977ac950366dc32de9a07ab741e563679fb74a35249e4daf04f428d2320b18c0
      GZIP_SHA256: 4f24f197e80ed2c79236bac8260bf2d4c79661621b208ac9a79bba1e3303e192
      PATCH_SHA256: 7f6e66a107f04a5d918c5725688fa307864602b91f76627df9a3fb3df34323ab
      PYTHONDONTWRITEBYTECODE: 1
    steps:
      - name: Check out exact PR63 head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ env.TARGET_BRANCH }}
          persist-credentials: true
      - name: Reassemble and apply byte-bound custody repair
        shell: bash
        run: |
          set -euo pipefail
          test "$(git --no-replace-objects rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git --no-replace-objects rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          if ! status="$(git --no-replace-objects status --porcelain=v1 --untracked-files=all --ignore-submodules=none)"; then
            exit 1
          fi
          test -z "$status"
          git config user.name 'Qian QI'
          git config user.email '102159240+ProfHepta@users.noreply.github.com'
          git fetch --no-tags origin "$CONTROL_BRANCH"
          carrier="${RUNNER_TEMP}/pr63-custody.patch.gz.b64"
          normalized="${RUNNER_TEMP}/pr63-custody.normalized.b64"
          archive="${RUNNER_TEMP}/pr63-custody.patch.gz"
          patch="${RUNNER_TEMP}/pr63-custody.patch"
          git show "origin/$CONTROL_BRANCH:ops/pr63-custody.patch.gz.b64" > "$carrier"
          tr -d '\r\n\t ' < "$carrier" > "$normalized"
          echo "$CARRIER_SHA256  $normalized" | sha256sum --check -
          base64 --decode "$normalized" > "$archive"
          echo "$GZIP_SHA256  $archive" | sha256sum --check -
          gzip --test "$archive"
          gzip --decompress --stdout "$archive" > "$patch"
          echo "$PATCH_SHA256  $patch" | sha256sum --check -
          git apply --check "$patch"
          git apply "$patch"
          git diff --check
          expected_paths="$(cat <<'PATHS'
          tools/build/README.md
          tools/build/_verify_host_reproducibility_core.py
          tools/build/verify_host_reproducibility.py
          tools/perf/README.md
          tools/perf/_run_product_baseline_core.py
          tools/perf/run_product_baseline.py
          tools/tests/test_run_product_baseline.py
          tools/tests/test_verify_host_reproducibility.py
          PATHS
          )"
          actual_paths="$(git diff --name-only | LC_ALL=C sort)"
          test "$actual_paths" = "$expected_paths"
      - name: Verify exact custody and existing lifecycle contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            tools/perf/run_product_baseline.py \
            tools/perf/_run_product_baseline_core.py \
            tools/build/verify_host_reproducibility.py \
            tools/build/_verify_host_reproducibility_core.py \
            tools/tests/test_run_product_baseline.py \
            tools/tests/test_verify_host_reproducibility.py
          python3 -m unittest \
            tools.tests.test_run_product_baseline \
            tools.tests.test_verify_host_reproducibility \
            tools.tests.test_product_baseline_process_group_cleanup -v
          python3 tools/docs/generate_global_docs.py --check
          python3 tools/docs/verify_global_docs.py
          python3 -m unittest \
            tools.tests.test_verify_global_docs_contracts \
            tools.tests.test_owner_open_workflow_exact_head -v
          python3 -m compileall -q tools
          git diff --check
      - name: Commit and publish repaired candidate
        shell: bash
        run: |
          set -euo pipefail
          git add \
            tools/build/README.md \
            tools/build/_verify_host_reproducibility_core.py \
            tools/build/verify_host_reproducibility.py \
            tools/perf/README.md \
            tools/perf/_run_product_baseline_core.py \
            tools/perf/run_product_baseline.py \
            tools/tests/test_run_product_baseline.py \
            tools/tests/test_verify_host_reproducibility.py
          git commit -m 'fix(perf): execute only admitted measurement bytes'
          git push origin "HEAD:$TARGET_BRANCH"
