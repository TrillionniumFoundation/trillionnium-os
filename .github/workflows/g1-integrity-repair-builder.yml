name: G1 integrity repair source validation

on:
  push:
    branches: [ops/g1-integrity-repair-builder-20260905]

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"
  BASE_COMMIT: 542b627ff4b63e629f97dfd814834d18a8cc40eb
  EXPECTED_TREE: d201342b00d8cdb457078583e91c6d0f0cb2e74e

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out immutable driver
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: driver
          persist-credentials: false
      - name: Check out pinned candidate parent
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 542b627ff4b63e629f97dfd814834d18a8cc40eb
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Decode digest-bound patch and verify exact tree
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -I - <<'PY'
          import base64, gzip, hashlib, os
          from pathlib import Path
          root = Path(os.environ['GITHUB_WORKSPACE']) / 'driver/build-support/g1-integrity-patch'
          encoded = ''.join((root / f'part-{i}.b64').read_text().strip() for i in range(6))
          packed = base64.b64decode(encoded, validate=True)
          assert hashlib.sha256(packed).hexdigest() == '892c1f1bea87ce6cd4f98941d3bb827ab9690c3edb31286f2f9546a2ed38d963'
          patch = gzip.decompress(packed)
          assert hashlib.sha256(patch).hexdigest() == '060e3b36f5cf1bee0293f821c1b58339b7fe489c977c45067c1c403116865856'
          (Path(os.environ['RUNNER_TEMP']) / 'repair.patch').write_bytes(patch)
          PY
          cd "$GITHUB_WORKSPACE/candidate"
          actual="$(git --no-replace-objects rev-parse HEAD)"
          test "$actual" = "$BASE_COMMIT"
          git apply --unidiff-zero --check --index "$RUNNER_TEMP/repair.patch"
          git apply --unidiff-zero --index "$RUNNER_TEMP/repair.patch"
          git diff --cached --check
          actual="$(git --no-replace-objects write-tree)"
          test "$actual" = "$EXPECTED_TREE"
          git -c user.name=g1-source-validation -c user.email=g1-source-validation@invalid commit -m 'Temporary source-only validation subject'
      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Run 111 focused regressions and permanent document gates
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest \
            tools.tests.test_owner_open_workflow_exact_head \
            tools.tests.test_verify_global_docs_contracts \
            tools.tests.test_verify_owner_open_r5_workflow_boundaries \
            tools.tests.test_verify_g1_repository_closure \
            tools.tests.test_verify_g1_gap_routing \
            tools.tests.test_owner_open_broker_module_documentation \
            tools.tests.test_repository_governance_baseline \
            tools.tests.test_verify_g1_review_index -v 2>&1 | tee "$RUNNER_TEMP/focused-regressions.log"
          python3 tools/docs/generate_global_docs.py --check
          python3 tools/docs/verify_global_docs.py
          python3 tools/docs/verify_module_documentation.py
          python3 tools/verify_g1_repository_closure.py
          python3 tools/verify_g1_gap_routing.py
          actual="$(git --no-replace-objects rev-parse HEAD^{tree})"
          test "$actual" = "$EXPECTED_TREE"
          state="$(git --no-replace-objects status --porcelain=v1 --untracked-files=all --ignore-submodules=none)"
          test -z "$state"
      - name: Retain source validation log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: g1-integrity-focused-validation
          if-no-files-found: error
          retention-days: 7
          path: ${{ runner.temp }}/focused-regressions.log

  stage-objects:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out immutable driver without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: driver
          persist-credentials: false
      - name: Check out pinned parent without executing source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 542b627ff4b63e629f97dfd814834d18a8cc40eb
          path: candidate
          persist-credentials: false
      - name: Reconstruct only the digest-bound candidate tree
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -I - <<'PY'
          import base64, gzip, hashlib, os
          from pathlib import Path
          root = Path(os.environ['GITHUB_WORKSPACE']) / 'driver/build-support/g1-integrity-patch'
          encoded = ''.join((root / f'part-{i}.b64').read_text().strip() for i in range(6))
          packed = base64.b64decode(encoded, validate=True)
          assert hashlib.sha256(packed).hexdigest() == '892c1f1bea87ce6cd4f98941d3bb827ab9690c3edb31286f2f9546a2ed38d963'
          patch = gzip.decompress(packed)
          assert hashlib.sha256(patch).hexdigest() == '060e3b36f5cf1bee0293f821c1b58339b7fe489c977c45067c1c403116865856'
          (Path(os.environ['RUNNER_TEMP']) / 'repair.patch').write_bytes(patch)
          PY
          cd "$GITHUB_WORKSPACE/candidate"
          actual="$(git --no-replace-objects rev-parse HEAD)"
          test "$actual" = "$BASE_COMMIT"
          git apply --unidiff-zero --check --index "$RUNNER_TEMP/repair.patch"
          git apply --unidiff-zero --index "$RUNNER_TEMP/repair.patch"
          actual="$(git --no-replace-objects write-tree)"
          test "$actual" = "$EXPECTED_TREE"
      - name: Stage verified Git objects only, never update a branch or create a commit
        env:
          OBJECT_STAGING_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          unset PYTHONPATH PYTHONHOME
          /usr/bin/python3 -I - <<'PY'
          import base64, hashlib, json, os, subprocess, urllib.request
          from pathlib import Path
          repo = Path(os.environ['GITHUB_WORKSPACE']) / 'candidate'
          base = '542b627ff4b63e629f97dfd814834d18a8cc40eb'
          tree = 'd201342b00d8cdb457078583e91c6d0f0cb2e74e'
          base_tree = '4445b6dc0684f896933207e395f74eeedbdf7fd0'
          def git(*args):
              return subprocess.check_output(['/usr/bin/git', '--no-replace-objects', '-C', str(repo), *args])
          assert git('rev-parse', 'HEAD').decode().strip() == base
          assert git('write-tree').decode().strip() == tree
          paths = [p.decode() for p in git('diff', '--cached', '--name-only', '-z').split(b'\0') if p]
          assert len(paths) == 22 and len(set(paths)) == 22
          api = 'https://api.github.com/repos/TrillionniumFoundation/trillionnium-os/git/'
          def post(kind, payload):
              assert kind in {'blobs', 'trees'}
              request = urllib.request.Request(api + kind, data=json.dumps(payload).encode(), method='POST', headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': 'Bearer ' + os.environ['OBJECT_STAGING_TOKEN'],
                  'X-GitHub-Api-Version': '2022-11-28',
                  'Content-Type': 'application/json',
              })
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)
          entries = []
          for path in paths:
              raw = git('ls-tree', '-z', tree, '--', path)
              metadata, actual_path = raw[:-1].split(b'\t', 1)
              mode, kind, sha = metadata.decode().split()
              assert actual_path.decode() == path and kind == 'blob'
              data = git('cat-file', 'blob', sha)
              actual = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
              assert actual == sha
              response = post('blobs', {'content': base64.b64encode(data).decode(), 'encoding': 'base64'})
              assert response['sha'] == sha
              entries.append({'path': path, 'mode': mode, 'type': kind, 'sha': sha})
          result = post('trees', {'base_tree': base_tree, 'tree': entries})
          assert result['sha'] == tree
          report = {'schema': 'g1-source-object-staging-v1', 'base_commit': base, 'tree': tree,
              'changed_paths': paths, 'validation': '111 focused tests and five document/topology checks passed in prerequisite job',
              'exact_head_qualification': False, 'independent_review': False, 'target_evidence': False,
              'gap_promotion': False, 'integration_authorized': False, 'public_release': False,
              'ref_updated': False, 'commit_created': False, 'workflow_run_id': os.environ['GITHUB_RUN_ID']}
          output = Path(os.environ['RUNNER_TEMP']) / 'staged-tree.json'
          output.write_text(json.dumps(report, indent=2) + '\n')
          print(json.dumps(report, indent=2))
          PY
      - name: Retain source-only object staging report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: g1-integrity-staged-tree
          if-no-files-found: error
          retention-days: 7
          path: ${{ runner.temp }}/staged-tree.json
