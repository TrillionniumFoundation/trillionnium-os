name: Owner-Open R7 workspace v3 qualification controller

on:
  push:
    branches:
      - ops/owner-open-r7-workspace-v3-controller-20260830
    paths:
      - .github/workflows/owner-open-r7-workspace-v3-controller.yml

permissions:
  actions: read
  checks: read
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: owner-open-r7-workspace-v3-controller
  cancel-in-progress: false

jobs:
  supervise:
    runs-on: ubuntu-24.04
    timeout-minutes: 260
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_BRANCH: codex/owner-open-r7-workspace-integrity-20260830-v3
      TARGET_WORKFLOW: Owner-Open R7 workspace integrity v3 executor
      TARGET_EXECUTOR: .github/workflows/owner-open-r7-workspace-integrity-v3-executor.yml
      SOURCE_BRANCH: codex/owner-open-r7-runtime-hardening-20260830-v4
      BASE_SHA: 34d8b731370b42f84fb50c34ecd6ca41b39f0d08

    steps:
      - name: Check out controller
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: ops/owner-open-r7-workspace-v3-controller-20260830

      - name: Observe executor and permanent workspace gate
        shell: bash
        run: |
          set -uo pipefail
          owner="${GITHUB_REPOSITORY%%/*}"
          mkdir -p out
          deadline=$((SECONDS + 14400))
          run_id=""
          run_status=""
          run_conclusion=""
          while [ "$SECONDS" -lt "$deadline" ]; do
            runs="$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/runs" \
              -f branch="$TARGET_BRANCH" -F per_page=100 2>/dev/null || printf '{"workflow_runs":[]}')"
            row="$(jq -c --arg name "$TARGET_WORKFLOW" \
              '[.workflow_runs[] | select(.name == $name)] | sort_by(.created_at) | last // empty' \
              <<<"$runs")"
            if [ -n "$row" ]; then
              run_id="$(jq -r .id <<<"$row")"
              run_status="$(jq -r .status <<<"$row")"
              run_conclusion="$(jq -r '.conclusion // ""' <<<"$row")"
              [ "$run_status" = completed ] && break
            fi
            sleep 30
          done

          branch="$(gh api "repos/$GITHUB_REPOSITORY/branches/$TARGET_BRANCH" 2>/dev/null || printf '{}')"
          target_sha="$(jq -r '.commit.sha // empty' <<<"$branch")"
          executor_present=false
          gh api "repos/$GITHUB_REPOSITORY/contents/$TARGET_EXECUTOR?ref=$TARGET_BRANCH" \
            >/dev/null 2>&1 && executor_present=true
          permanent_present=false
          gh api "repos/$GITHUB_REPOSITORY/contents/.github/workflows/owner-open-workspace-integrity.yml?ref=$TARGET_BRANCH" \
            >/dev/null 2>&1 && permanent_present=true
          pr_number="$(gh api --method GET "repos/$GITHUB_REPOSITORY/pulls" \
            -f state=all -f head="$owner:$TARGET_BRANCH" -F per_page=20 2>/dev/null \
            | jq -r '.[0].number // empty' || true)"

          if [ "$run_status" != completed ] || [ "$run_conclusion" != success ] \
            || [ -z "$target_sha" ] || [ "$target_sha" = "$BASE_SHA" ] \
            || [ "$executor_present" = true ] || [ "$permanent_present" != true ]; then
            failed_log=""
            if [ -n "$run_id" ]; then
              failed_log="$(gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --log-failed 2>/dev/null \
                | tail -c 16000 || true)"
            fi
            printf '%s\n' "$failed_log" > out/failed.log
            jq -n --arg outcome workspace_executor_not_qualified \
              --arg run_id "$run_id" --arg status "$run_status" \
              --arg conclusion "$run_conclusion" --arg target_sha "$target_sha" \
              --argjson executor_present "$executor_present" \
              --argjson permanent_present "$permanent_present" \
              '{outcome:$outcome,run_id:$run_id,status:$status,conclusion:$conclusion,target_sha:$target_sha,executor_present:$executor_present,permanent_present:$permanent_present}' \
              > out/result.json
            if [ -n "$pr_number" ]; then
              gh pr comment "$pr_number" --repo "$GITHUB_REPOSITORY" \
                --body "Workspace v3 controller: source qualification did not produce a proven self-deleted persistent head (run=\`$run_id\`, status=\`$run_status\`, conclusion=\`$run_conclusion\`). No workspace-integrity claim was accepted." || true
              gh pr close "$pr_number" --repo "$GITHUB_REPOSITORY" \
                --comment "Closed fail-closed after complete-workspace qualification did not pass." || true
            fi
            if [ -n "$failed_log" ]; then
              existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
                --search 'R7 complete workspace qualification diagnostic in:title' \
                --json number --jq '.[0].number // empty' 2>/dev/null || true)"
              body="Complete-workspace executor run \`$run_id\` failed closed.\n\n<details><summary>Failed log tail</summary>\n\n\`\`\`text\n$failed_log\n\`\`\`\n</details>"
              if [ -n "$existing" ]; then
                gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body" || true
              else
                gh issue create --repo "$GITHUB_REPOSITORY" \
                  --title "R7 complete workspace qualification diagnostic" \
                  --body "$body" || true
              fi
            fi
          else
            if [ -z "$pr_number" ]; then
              gh pr create --repo "$GITHUB_REPOSITORY" --draft \
                --base "$SOURCE_BRANCH" --head "$TARGET_BRANCH" \
                --title "ci(r7): enforce complete Rust workspace integrity" \
                --body "Exact-head complete-workspace tests and strict Clippy. L1 only; no L2-L6 claim." \
                >/dev/null || true
              pr_number="$(gh api --method GET "repos/$GITHUB_REPOSITORY/pulls" \
                -f state=open -f head="$owner:$TARGET_BRANCH" -F per_page=20 \
                | jq -r '.[0].number // empty' || true)"
            fi

            checks_deadline=$((SECONDS + 5400))
            stable=0
            previous=""
            total=0
            pending=1
            bad=0
            workspace_seen=0
            checks='{"total_count":0,"check_runs":[]}'
            while [ "$SECONDS" -lt "$checks_deadline" ]; do
              checks="$(gh api -H 'Accept: application/vnd.github+json' \
                "repos/$GITHUB_REPOSITORY/commits/$target_sha/check-runs?per_page=100" \
                2>/dev/null || printf '{"total_count":0,"check_runs":[]}')"
              total="$(jq -r '.total_count // 0' <<<"$checks")"
              pending="$(jq '[.check_runs[] | select(.status != "completed")] | length' <<<"$checks")"
              bad="$(jq '[.check_runs[] | select(.status == "completed") | select((.conclusion // "") as $c | ($c != "success" and $c != "neutral" and $c != "skipped"))] | length' <<<"$checks")"
              workspace_seen="$(jq '[.check_runs[] | select(.name == "L1 Rust 1.93 complete workspace tests and strict Clippy") | select(.status == "completed" and .conclusion == "success")] | length' <<<"$checks")"
              signature="$(jq -r '[.check_runs[] | [.name,.status,(.conclusion // "")] | join(":")] | sort | join("|")' <<<"$checks")"
              if [ "$total" -ge 10 ] && [ "$pending" -eq 0 ] \
                && [ "$workspace_seen" -ge 1 ] && [ "$signature" = "$previous" ]; then
                stable=$((stable + 1))
              else
                stable=0
              fi
              previous="$signature"
              [ "$stable" -ge 2 ] && break
              sleep 30
            done
            jq '{total_count,check_runs:[.check_runs[]|{name,status,conclusion,html_url}]}' \
              <<<"$checks" > out/checks.json

            if [ "$total" -ge 10 ] && [ "$pending" -eq 0 ] && [ "$bad" -eq 0 ] \
              && [ "$workspace_seen" -ge 1 ]; then
              jq -n --arg outcome qualified --arg run_id "$run_id" \
                --arg target_sha "$target_sha" --argjson checks "$total" \
                '{outcome:$outcome,run_id:$run_id,target_sha:$target_sha,checks:$checks}' \
                > out/result.json
              if [ -n "$pr_number" ]; then
                gh pr ready "$pr_number" --repo "$GITHUB_REPOSITORY" || true
                gh pr edit "$pr_number" --repo "$GITHUB_REPOSITORY" \
                  --add-reviewer ProfHepta --add-label ready-for-review >/dev/null 2>&1 || true
                gh pr comment "$pr_number" --repo "$GITHUB_REPOSITORY" \
                  --body "Workspace v3 controller: exact head \`$target_sha\` passed source run \`$run_id\`, the permanent complete-workspace gate, and $total stable permanent checks. Ready for independent review; no L2-L6 claim promoted." || true
              fi
            else
              jq -n --arg outcome permanent_checks_not_green \
                --arg run_id "$run_id" --arg target_sha "$target_sha" \
                --argjson total "$total" --argjson pending "$pending" \
                --argjson bad "$bad" --argjson workspace_seen "$workspace_seen" \
                '{outcome:$outcome,run_id:$run_id,target_sha:$target_sha,total:$total,pending:$pending,bad:$bad,workspace_seen:$workspace_seen}' \
                > out/result.json
              if [ -n "$pr_number" ]; then
                failures="$(jq -r '[.check_runs[] | select(.status != "completed" or ((.conclusion // "") as $c | ($c != "success" and $c != "neutral" and $c != "skipped"))) | "- " + .name + ": " + .status + "/" + (.conclusion // "pending")] | join("\n")' <<<"$checks")"
                gh pr comment "$pr_number" --repo "$GITHUB_REPOSITORY" \
                  --body "Workspace v3 controller: source executor passed at \`$target_sha\`, but the permanent matrix is not fully green; the PR remains draft.\n\n$failures" || true
              fi
            fi
          fi
          cat out/result.json

      - name: Retire controller
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/owner-open-r7-workspace-v3-controller.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "ops(r7): retire workspace v3 controller"
          git push origin HEAD:ops/owner-open-r7-workspace-v3-controller-20260830
