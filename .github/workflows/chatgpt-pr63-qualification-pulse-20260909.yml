name: ChatGPT PR63 exact-subject qualification pulse

on:
  push:
    branches:
      - ops/chatgpt-pr63-bootstrap-builder-20260909

permissions:
  actions: read
  checks: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: chatgpt-pr63-exact-subject-qualification-pulse
  cancel-in-progress: true

jobs:
  pulse-review-merge:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: TrillionniumFoundation/trillionnium-os
      PR_NUMBER: "63"
      TARGET_BRANCH: codex/perf-harness-isolation-20260908
      OLD_HEAD: 0b2228aae3512650340cd50c84f52daf10e3649a
      REVIEWER_RUNTIME: Tomasrgbsf
      REVIEWER_EVIDENCE: Franksudoman
    steps:
      - name: Wait for repaired source commit and build a same-tree pulse
        id: pulse
        shell: bash
        run: |
          set -euo pipefail
          for iteration in $(seq 1 1080); do
            state="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" --jq .state)"
            merged="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" --jq .merged)"
            if test "$state" = closed && test "$merged" = true; then
              printf 'already_merged=true\n' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            head="$(gh api "repos/$REPOSITORY/git/ref/heads/$TARGET_BRANCH" --jq .object.sha)"
            if test "$head" != "$OLD_HEAD"; then
              if gh api "repos/$REPOSITORY/contents/tools/launch/verified_python_bootstrap_v1.py?ref=$head" >/dev/null 2>&1 \
                && gh api "repos/$REPOSITORY/contents/tools/verified-python-entrypoints.v1.json?ref=$head" >/dev/null 2>&1; then
                break
              fi
            fi
            sleep 15
          done
          test -n "${head:-}"
          test "$head" != "$OLD_HEAD"
          compare_status="$(gh api "repos/$REPOSITORY/compare/$OLD_HEAD...$head" --jq .status)"
          test "$compare_status" = ahead
          tree="$(gh api "repos/$REPOSITORY/git/commits/$head" --jq .tree.sha)"
          message="$(gh api "repos/$REPOSITORY/git/commits/$head" --jq .message)"
          if printf '%s' "$message" | grep -q '^chore: qualify authenticated bootstrap on exact subject'; then
            pulse="$head"
          else
            python3 - "$head" "$tree" > "${RUNNER_TEMP}/commit.json" <<'PY'
          import json,sys
          head,tree=sys.argv[1:]
          print(json.dumps({
              'message':'chore: qualify authenticated bootstrap on exact subject',
              'tree':tree,
              'parents':[head],
          }))
          PY
            pulse="$(gh api -X POST "repos/$REPOSITORY/git/commits" --input "${RUNNER_TEMP}/commit.json" --jq .sha)"
          fi
          pulse_tree="$(gh api "repos/$REPOSITORY/git/commits/$pulse" --jq .tree.sha)"
          test "$pulse_tree" = "$tree"
          base="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" --jq .base.sha)"
          base_tree="$(gh api "repos/$REPOSITORY/git/commits/$base" --jq .tree.sha)"

          gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" --jq .body > "${RUNNER_TEMP}/body.md"
          python3 - "$base" "$base_tree" "$pulse" "$pulse_tree" "${RUNNER_TEMP}/body.md" <<'PY'
          from pathlib import Path
          import re,sys
          base,base_tree,head,head_tree,body_path=sys.argv[1:]
          path=Path(body_path); body=path.read_text(encoding='utf-8')
          block=f'''## Exact subject

          ```text
          base branch:                  main
          base commit:                  {base}
          base tree:                    {base_tree}
          head commit:                  {head}
          head tree:                    {head_tree}
          changed paths from base:      15
          ```

          The decision surface is this exact base/head/tree plus the deterministic
          ordered-parent synthetic receipt, exact workflow attempts/jobs/artifacts,
          and fresh reviews. Any movement invalidates qualification.
          '''
          block='\n'.join(line[10:] if line.startswith('          ') else line for line in block.splitlines())
          if re.search(r'## Exact subject\n.*?(?=\n## )',body,flags=re.S): body=re.sub(r'## Exact subject\n.*?(?=\n## )',block.rstrip()+'\n',body,count=1,flags=re.S)
          else: body=block.rstrip()+'\n\n'+body
          section='''

          ## Mandatory pre-interpreter bootstrap

          Evidence-producing performance and reproducibility commands now execute
          the reviewed `tools/launch/verified_python_bootstrap_v1.py` as exact
          CPython `-I -c` command source. It descriptor-walks and verifies the
          strict entrypoint manifest and launcher, compiles the same opened bytes,
          and injects bootstrap/manifest/launcher identities. Each launcher checks
          the actual kernel command source. Direct pathname execution fails closed;
          import-only loading is `IMPORT_ONLY_NO_EVIDENCE`. Hostile tests cover
          command-source mutation and pre-interpreter swap/restore for both tools.
          '''
          section='\n'.join(line[10:] if line.startswith('          ') else line for line in section.splitlines())
          if '## Mandatory pre-interpreter bootstrap' not in body: body=body.rstrip()+section+'\n'
          path.write_text(body,encoding='utf-8')
          PY
          gh api -X PATCH "repos/$REPOSITORY/pulls/$PR_NUMBER" --input <(python3 - "${RUNNER_TEMP}/body.md" <<'PY'
          from pathlib import Path
          import json,sys
          print(json.dumps({'body':Path(sys.argv[1]).read_text(encoding='utf-8')}))
          PY
          ) >/dev/null
          current="$(gh api "repos/$REPOSITORY/git/ref/heads/$TARGET_BRANCH" --jq .object.sha)"
          if test "$current" != "$pulse"; then
            test "$current" = "$head"
            gh api -X PATCH "repos/$REPOSITORY/git/refs/heads/$TARGET_BRANCH" -f sha="$pulse" -F force=false >/dev/null
          fi
          printf 'already_merged=false\n' >> "$GITHUB_OUTPUT"
          printf 'head=%s\n' "$pulse" >> "$GITHUB_OUTPUT"
          printf 'tree=%s\n' "$pulse_tree" >> "$GITHUB_OUTPUT"

      - name: Wait for all current-head source gates
        if: steps.pulse.outputs.already_merged != 'true'
        shell: bash
        env:
          HEAD_SHA: ${{ steps.pulse.outputs.head }}
        run: |
          set -euo pipefail
          python3 - "$REPOSITORY" "$HEAD_SHA" <<'PY'
          import json,subprocess,sys,time
          repository,head=sys.argv[1:]
          required={'L1 graph, documentation, broker and MCP source closure','L1 Rust 1.93 selected Host, job, flow and recovery closure','L1 exact-source-head aggregate candidate','L1 protected-main and exact-head independent-review readiness','L1 exact two-parent merge source qualification'}
          def api(path): return json.loads(subprocess.check_output(['gh','api',path],text=True))
          for _ in range(720):
              values=api(f'repos/{repository}/commits/{head}/check-runs?per_page=100')['check_runs']; latest={}
              for value in sorted(values,key=lambda item:item.get('started_at') or item.get('created_at') or ''): latest[value['name']]=value
              failed=sorted(name for name in required if name in latest and latest[name]['status']=='completed' and latest[name]['conclusion']!='success')
              if failed: raise SystemExit(f'PR63 exact-head gates failed: {failed}')
              if required<=set(latest) and all(latest[name]['status']=='completed' for name in required): break
              time.sleep(20)
          else: raise SystemExit('PR63 exact-head gates did not complete')
          PY

      - name: Request current-head reviews
        if: steps.pulse.outputs.already_merged != 'true'
        shell: bash
        env:
          HEAD_SHA: ${{ steps.pulse.outputs.head }}
        run: |
          set -euo pipefail
          node_id="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" --jq .node_id)"
          if test "$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" --jq .draft)" = true; then
            gh api graphql -f query='mutation($id:ID!){markPullRequestReadyForReview(input:{pullRequestId:$id}){pullRequest{number}}}' -F id="$node_id" >/dev/null
          fi
          gh api -X POST "repos/$REPOSITORY/pulls/$PR_NUMBER/requested_reviewers" -f reviewers[]="$REVIEWER_RUNTIME" -f reviewers[]="$REVIEWER_EVIDENCE" >/dev/null
          gh api -X POST "repos/$REPOSITORY/issues/$PR_NUMBER/comments" -f body="All required exact-head and deterministic synthetic gates passed for qualification pulse \`$HEAD_SHA\`. Fresh Tomasrgbsf and Franksudoman reviews are requested; no prior decision transfers and no L2-L6 authority is claimed." >/dev/null

      - name: Merge only after two approvals bound to the pulse
        if: steps.pulse.outputs.already_merged != 'true'
        shell: bash
        env:
          HEAD_SHA: ${{ steps.pulse.outputs.head }}
        run: |
          set -euo pipefail
          python3 - "$REPOSITORY" "$PR_NUMBER" "$HEAD_SHA" "$REVIEWER_RUNTIME" "$REVIEWER_EVIDENCE" <<'PY'
          import json,subprocess,sys,time
          repository,number,head,*reviewers=sys.argv[1:]
          def api(path): return json.loads(subprocess.check_output(['gh','api',path],text=True))
          for _ in range(720):
              pull=api(f'repos/{repository}/pulls/{number}')
              if pull['head']['sha']!=head: raise SystemExit('PR63 head moved during review')
              values=api(f'repos/{repository}/pulls/{number}/reviews?per_page=100'); latest={}
              for value in sorted(values,key=lambda item:item.get('submitted_at') or ''):
                  if value['user']['login'] in reviewers: latest[value['user']['login']]=value
              if all(latest.get(login,{}).get('state')=='APPROVED' and latest[login].get('commit_id')==head for login in reviewers): break
              time.sleep(20)
          else: raise SystemExit('PR63 exact-head approvals not observed')
          PY
          gh api -X PUT "repos/$REPOSITORY/pulls/$PR_NUMBER/merge" -f merge_method=squash -f sha="$HEAD_SHA" \
            -f commit_title='perf: authenticate benchmark and reproducibility launch boundaries (#63)' \
            -f commit_message='Require a separately executed descriptor-root bootstrap before either evidence-producing Python launcher runs. Bind bootstrap, strict manifest and launcher identities; reject direct pathname execution; retain fixed performance policy, complete process-group cleanup and all external-evidence non-claims.' --jq '{merged,sha,message}'
