name: one-shot owner-open R6 foundation PR draft guard

on:
  push:
    branches:
      - ops/owner-open-r6-pr-ready-20260830
    paths:
      - ".github/workflows/owner-open-r6-foundation-draft-one-shot.yml"

permissions:
  contents: write
  pull-requests: write

jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ops/owner-open-r6-pr-ready-20260830

      - name: Validate isolated metadata surface
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          actual="$(git diff --name-only "${GITHUB_SHA}^" "$GITHUB_SHA")"
          test "$actual" = ".github/workflows/owner-open-r6-foundation-draft-one-shot.yml"

      - name: Hold the lower foundation PR as Draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/TrillionniumFoundation/trillionnium-os/pulls/1 --jq .head.sha)" = \
            "844a5dc4537c35144b105a93dce053fb64e936ba"
          test "$(gh api repos/TrillionniumFoundation/trillionnium-os/pulls/1 --jq .draft)" = "false"
          gh pr ready 1 --undo --repo TrillionniumFoundation/trillionnium-os
          test "$(gh api repos/TrillionniumFoundation/trillionnium-os/pulls/1 --jq .draft)" = "true"

      - name: Remove transient workflow
        run: |
          set -euo pipefail
          rm -f .github/workflows/owner-open-r6-foundation-draft-one-shot.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          test "$(git diff --cached --name-only)" = ".github/workflows/owner-open-r6-foundation-draft-one-shot.yml"
          git commit -m "chore(governance): remove foundation draft workflow"
          git push origin HEAD:ops/owner-open-r6-pr-ready-20260830
