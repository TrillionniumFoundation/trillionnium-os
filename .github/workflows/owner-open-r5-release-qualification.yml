name: owner-open R5 release-candidate qualification

on:
  pull_request:
    paths:
      - "tools/owner-open/**"
      - "tools/tests/test_release_qualification_paths_v2.py"
      - "tools/tests/test_supervise_codex_mcp_qualification_release.py"
      - "tools/tests/test_verify_owner_open_selected_paths.py"
      - "tools/verify-owner-open-selected-paths.py"
      - "docs/contracts/owner-open-r5-selected-python-paths-v1.json"
      - "docs/plan/owner-open-r5-batch-e-release-selection.md"
      - "docs/status/owner-open-r5-batch-e-status.json"
      - ".github/workflows/owner-open-r5-release-qualification.yml"
  push:
    branches:
      - main
      - "codex/**"
    paths:
      - "tools/owner-open/**"
      - "tools/tests/test_release_qualification_paths_v2.py"
      - "tools/tests/test_supervise_codex_mcp_qualification_release.py"
      - "tools/tests/test_verify_owner_open_selected_paths.py"
      - "tools/verify-owner-open-selected-paths.py"
      - "docs/contracts/owner-open-r5-selected-python-paths-v1.json"
      - "docs/plan/owner-open-r5-batch-e-release-selection.md"
      - "docs/status/owner-open-r5-batch-e-status.json"
      - ".github/workflows/owner-open-r5-release-qualification.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: owner-open-r5-release-qualification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-python-paths:
    name: Release-candidate Codex and ADB mechanics
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Parse selection and status
        run: |
          python3 -m json.tool docs/contracts/owner-open-r5-selected-python-paths-v1.json >/dev/null
          python3 -m json.tool docs/status/owner-open-r5-batch-e-status.json >/dev/null
      - name: Compile release-candidate source
        run: |
          python3 -m py_compile \
            tools/verify-owner-open-selected-paths.py \
            tools/owner-open/trace_mcp_stdio.py \
            tools/owner-open/qualify_codex_mcp_jobs.py \
            tools/owner-open/supervise_codex_mcp_qualification_release.py \
            tools/owner-open/adb_smart_socket_relay_release.py \
            tools/owner-open/qualify_owner_open_adb_release.py \
            tools/tests/test_verify_owner_open_selected_paths.py \
            tools/tests/test_supervise_codex_mcp_qualification_release.py \
            tools/tests/test_release_qualification_paths_v2.py
      - name: Verify exact selected paths
        run: |
          python3 tools/verify-owner-open-selected-paths.py --json \
            | tee owner-open-r5-selected-paths.json
      - name: Run selected-path verifier tests
        run: |
          python3 -m unittest \
            tools.tests.test_verify_owner_open_selected_paths \
            -v 2>&1 | tee owner-open-r5-selected-path-tests.txt
      - name: Run release Codex qualification lifecycle tests
        env:
          PYTHONWARNINGS: error::ResourceWarning
        run: |
          python3 -m unittest \
            tools.tests.test_codex_mcp_qualification_lifecycle \
            tools.tests.test_supervise_codex_mcp_qualification_release \
            -v 2>&1 | tee owner-open-r5-release-codex-tests.txt
      - name: Run release ADB relay and exact-argv tests
        env:
          PYTHONWARNINGS: error::ResourceWarning
        run: |
          python3 -m unittest \
            tools.tests.test_release_qualification_paths_v2 \
            -v 2>&1 | tee owner-open-r5-release-adb-tests.txt
      - uses: actions/upload-artifact@v4
        with:
          name: owner-open-r5-release-qualification-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            owner-open-r5-selected-paths.json
            owner-open-r5-selected-path-tests.txt
            owner-open-r5-release-codex-tests.txt
            owner-open-r5-release-adb-tests.txt
