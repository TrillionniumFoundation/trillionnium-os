name: G1 isolated source inspection
on:
  push:
    branches: [ops/g1-source-inspection-20260905]
permissions:
  contents: read
jobs:
  source-bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 17990958e11af59c625b52ad7677168537410456
          fetch-depth: 0
          persist-credentials: false
      - name: Capture immutable source objects without credentials or checkout configuration
        shell: bash
        run: |
          set -euo pipefail
          test "$(git --no-replace-objects rev-parse HEAD)" = 17990958e11af59c625b52ad7677168537410456
          mkdir -p "$RUNNER_TEMP/g1-inspection"
          git --no-replace-objects bundle create "$RUNNER_TEMP/g1-inspection/source.bundle" HEAD
          git bundle verify "$RUNNER_TEMP/g1-inspection/source.bundle"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/g1-inspection/subject.txt"
          printf '%s\n' 'SOURCE_INSPECTION_ONLY' 'public_release=false' 'promotion_authorized=false' 'No target or installed evidence is produced.' >> "$RUNNER_TEMP/g1-inspection/subject.txt"
          sha256sum "$RUNNER_TEMP/g1-inspection/source.bundle" > "$RUNNER_TEMP/g1-inspection/source.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: g1-source-inspection-17990958
          path: ${{ runner.temp }}/g1-inspection/
          if-no-files-found: error
          retention-days: 1
