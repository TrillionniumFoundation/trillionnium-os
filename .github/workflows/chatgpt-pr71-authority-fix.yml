name: ChatGPT PR71 authority fix

on:
  push:
    branches:
      - ops/chatgpt-pr63-source-export-20260909

permissions:
  contents: write

concurrency:
  group: chatgpt-pr71-authority-fix
  cancel-in-progress: false

jobs:
  fix-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TARGET_BRANCH: codex/repository-truth-profiles-20260908
      EXPECTED_HEAD: b2ae0c37c2079cdaf7623ef7799ce4bf35cb13af
    steps:
      - name: Check out exact PR71 head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ env.TARGET_BRANCH }}
          persist-credentials: true

      - name: Apply authority parser repair and hostile tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(git --no-replace-objects rev-parse HEAD)" = "$EXPECTED_HEAD"
          python3 - <<'PY'
          from pathlib import Path

          verifier = Path('tools/docs/verify_repository_authority.py')
          source = verifier.read_text(encoding='utf-8')

          old = '''BARE_AUTHORITY_PATH_RE = re.compile(\n    r"(?<![A-Za-z0-9_.+/-])((?:(?:docs|governance|schemas|apps|crates|tools|packaging|"\n    r"android-integration|evidence|foundations|planned|platform|profile)/"\n    r"[A-Za-z0-9_.+@~/-]+|README\\.md|SECURITY\\.md|CONTRIBUTING\\.md)"\n    r"(?:#[A-Za-z0-9_.:+-]+)?)"\n)'''
          new = '''BARE_AUTHORITY_PATH_RE = re.compile(\n    r"(?<![A-Za-z0-9_.+/-])((?:(?:\\.{1,2}/)+)?(?:(?:docs|governance|schemas|apps|crates|tools|packaging|"\n    r"android-integration|evidence|foundations|planned|platform|profile|machine|modules|generated)/"\n    r"[A-Za-z0-9_.+@~/-]+|README\\.md|SECURITY\\.md|CONTRIBUTING\\.md|"\n    r"TRILLIONNIUM_CANONICAL_DEVELOPMENT_PLAN\\.md)(?:#[A-Za-z0-9_.:+-]+)?)"\n)'''
          if old not in source:
              raise SystemExit('bare authority regex subject drifted')
          source = source.replace(old, new, 1)

          old = '''AUTHORITY_DIRECTORY_ROOTS = frozenset({\n    "docs/machine",\n    "docs/modules",\n    "docs/generated",\n    "schemas",\n})\n\n\ndef _semantic_visible_text(paragraph: str) -> str:\n    """Normalize rendered prose for authority-phrase classification.\n\n    Link extraction still uses the original paragraph so target/source ranges are\n    unchanged.  Semantic matching, however, must treat ordinary Markdown line\n    wrapping, emphasis and character entities as the visible text a reviewer\n    reads.  HTML tags are removed rather than trusted as semantic separators.\n    """\n    value = html.unescape(paragraph)\n    value = re.sub(r"<[^>]*>", " ", value)\n    value = value.translate(str.maketrans("", "", "*_~[]"))\n    return re.sub(r"\\s+", " ", value).strip()\n\n\ndef _registered_authority(target: str, authority_targets: set[str]) -> bool:\n    # Directory landing pages are explicit navigation roots.  No descendant is\n    # trusted merely because it lives under one of these directories.\n    return target in authority_targets or target in AUTHORITY_DIRECTORY_ROOTS\n'''
          new = '''def _semantic_visible_text(paragraph: str) -> str:\n    """Normalize rendered prose for authority-phrase classification.\n\n    Target extraction still uses the original paragraph. Semantic matching uses\n    rendered labels rather than Markdown destinations, so link syntax cannot\n    split a visible authority phrase. HTML tags are removed while their visible\n    text remains, character entities are decoded, and ordinary whitespace and\n    emphasis are normalized.\n    """\n    value = html.unescape(paragraph)\n    value = INLINE_LINK_RE.sub(lambda match: match.group(1), value)\n    value = REFERENCE_LINK_RE.sub(lambda match: match.group(1), value)\n    value = BRACKET_RE.sub(lambda match: match.group(1), value)\n    value = re.sub(r"<[^>]*>", " ", value)\n    value = value.translate(str.maketrans("", "", "*_~"))\n    return re.sub(r"\\s+", " ", value).strip()\n\n\ndef _registered_authority(target: str, authority_targets: set[str]) -> bool:\n    # Authority is granted only to exact registered file identities. Directory\n    # roots remain valid navigation targets, but never authority targets.\n    return target in authority_targets\n'''
          if old not in source:
              raise SystemExit('semantic/authority subject drifted')
          source = source.replace(old, new, 1)

          old = '''                if syntax == "bare authority path":\n                    resolved = resolve_bare_repository_target(\n                        root, normalized_target,\n                        f"{relative}: visible line {paragraph_line} {syntax}",\n                    )\n                else:\n                    resolved = resolve_markdown_target(\n                        root, path, normalized_target,\n                        f"{relative}: visible line {paragraph_line} {syntax}",\n                    )'''
          new = '''                if syntax == "bare authority path" and not normalized_target.startswith(("./", "../")):\n                    resolved = resolve_bare_repository_target(\n                        root, normalized_target,\n                        f"{relative}: visible line {paragraph_line} {syntax}",\n                    )\n                else:\n                    resolved = resolve_markdown_target(\n                        root, path, normalized_target,\n                        f"{relative}: visible line {paragraph_line} {syntax}",\n                    )'''
          if old not in source:
              raise SystemExit('bare resolution subject drifted')
          source = source.replace(old, new, 1)
          verifier.write_text(source, encoding='utf-8')

          tests = Path('tools/tests/test_repository_authority.py')
          test_source = tests.read_text(encoding='utf-8')
          marker = '''    def test_active_profile_cannot_select_sealed_component(self) -> None:\n'''
          if marker not in test_source:
              raise SystemExit('test insertion marker drifted')
          additions = r'''    def test_inline_link_label_participates_in_authority_phrase(self) -> None:
        path = self.root / "README.md"
        path.write_text(path.read_text() + "\nCanonical [plan](README.md) governs this tree.\n")
        with self.assertRaisesRegex(VERIFY.VerificationError, "unregistered target"):
            VERIFY.verify(self.root)

    def test_reference_link_label_participates_in_authority_phrase(self) -> None:
        path = self.root / "README.md"
        path.write_text(
            path.read_text()
            + "\nCanonical [plan][self] governs this tree.\n\n[self]: README.md\n"
        )
        with self.assertRaisesRegex(VERIFY.VerificationError, "unregistered target"):
            VERIFY.verify(self.root)

    def test_shortcut_link_label_participates_in_authority_phrase(self) -> None:
        path = self.root / "README.md"
        path.write_text(
            path.read_text()
            + "\nCanonical [plan] governs this tree.\n\n[plan]: README.md\n"
        )
        with self.assertRaisesRegex(VERIFY.VerificationError, "unregistered target"):
            VERIFY.verify(self.root)

    def test_navigation_directory_is_not_authority_target(self) -> None:
        path = self.root / "README.md"
        path.write_text(path.read_text() + "\nCanonical source is [machine docs](docs/machine/).\n")
        with self.assertRaisesRegex(VERIFY.VerificationError, "unregistered target"):
            VERIFY.verify(self.root)

    def test_navigation_directory_remains_valid_non_authority_link(self) -> None:
        path = self.root / "README.md"
        path.write_text(path.read_text() + "\nNavigation: [machine docs](docs/machine/).\n")
        VERIFY.verify(self.root)

    def test_source_relative_bare_authority_path_is_validated(self) -> None:
        self.add_forbidden_document()
        path = self.root / "docs/START_HERE.md"
        path.write_text(
            path.read_text()
            + "\nCanonical plan is ./TRILLIONNIUM_CANONICAL_DEVELOPMENT_PLAN.md.\n"
        )
        with self.assertRaisesRegex(VERIFY.VerificationError, "forbidden authority path"):
            VERIFY.verify(self.root)

'''
          test_source = test_source.replace(marker, additions + marker, 1)
          tests.write_text(test_source, encoding='utf-8')
          PY
          python3 -m py_compile tools/docs/verify_repository_authority.py tools/tests/test_repository_authority.py
          git diff --check

      - name: Run repository authority qualification
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest tools.tests.test_repository_authority -v
          python3 tools/docs/generate_global_docs.py --check
          python3 tools/docs/verify_repository_authority.py
          python3 tools/docs/verify_global_docs.py
          python3 -m unittest tools.tests.test_verify_global_docs_contracts tools.tests.test_owner_open_broker_module_documentation -v

      - name: Commit exact repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Qian QI'
          git config user.email '102159240+ProfHepta@users.noreply.github.com'
          git add tools/docs/verify_repository_authority.py tools/tests/test_repository_authority.py
          git diff --cached --check
          git commit -m 'docs: close rendered authority target bypasses'
          git push origin "HEAD:$TARGET_BRANCH"
