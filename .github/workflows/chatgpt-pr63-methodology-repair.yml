name: ChatGPT PR63 methodology blocker repair

on:
  push:
    branches:
      - ops/chatgpt-source-export-20260908

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: chatgpt-pr63-methodology-repair
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TARGET_BRANCH: codex/perf-harness-isolation-20260908
      EXPECTED_HEAD: 1419f6d09f4b6cf6aa4dce7cfdc1d1cdab0c9256
      EXPECTED_TREE: 892b5ae0d6e670aef994c9e20621809142b5bb60
      PR_NUMBER: '63'
    steps:
      - name: Check out exact PR63 head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ env.TARGET_BRANCH }}
          persist-credentials: true

      - name: Apply closed implementation identity and fixed gate policy
        shell: bash
        run: |
          set -euo pipefail
          test "$(git --no-replace-objects rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git --no-replace-objects rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          if ! status="$(git --no-replace-objects status --porcelain=v1 --untracked-files=all --ignore-submodules=none)"; then
            printf '%s\n' 'cannot inspect exact PR63 worktree' >&2
            exit 1
          fi
          test -z "$status"

          python3 - <<'PY'
          from __future__ import annotations

          import ast
          from pathlib import Path
          import re

          ROOT = Path.cwd()

          def read(relative: str) -> str:
              return (ROOT / relative).read_text(encoding="utf-8")

          def write(relative: str, text: str) -> None:
              (ROOT / relative).write_text(text, encoding="utf-8")

          def insert_after_function(text: str, function_name: str, block: str) -> str:
              tree = ast.parse(text)
              matches = [node for node in tree.body if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)) and node.name == function_name]
              if len(matches) != 1:
                  raise SystemExit(f"expected one top-level {function_name}, found {len(matches)}")
              node = matches[0]
              if node.end_lineno is None:
                  raise SystemExit(f"cannot locate end of {function_name}")
              lines = text.splitlines(keepends=True)
              insertion = "\n\n" + block.strip("\n") + "\n"
              lines.insert(node.end_lineno, insertion)
              return "".join(lines)

          def insert_at_function_start(text: str, function_name: str, statements: str) -> str:
              tree = ast.parse(text)
              matches = [node for node in tree.body if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)) and node.name == function_name]
              if len(matches) != 1:
                  raise SystemExit(f"expected one top-level {function_name}, found {len(matches)}")
              node = matches[0]
              body = node.body
              if not body:
                  raise SystemExit(f"empty function {function_name}")
              target = body[0]
              if isinstance(target, ast.Expr) and isinstance(target.value, ast.Constant) and isinstance(target.value.value, str) and len(body) > 1:
                  target = body[1]
              line_index = target.lineno - 1
              lines = text.splitlines(keepends=True)
              indent = " " * (node.col_offset + 4)
              rendered = "".join(indent + line + "\n" for line in statements.strip("\n").splitlines())
              lines.insert(line_index, rendered)
              return "".join(lines)

          def insert_before_main(text: str, block: str) -> str:
              marker = '\nif __name__ == "__main__":'
              if marker not in text:
                  marker = "\nif __name__ == '__main__':"
              if marker not in text:
                  return text.rstrip() + "\n\n" + block.strip("\n") + "\n"
              return text.replace(marker, "\n\n" + block.strip("\n") + "\n" + marker, 1)

          perf_core_path = "tools/perf/_run_product_baseline_core.py"
          perf_core = read(perf_core_path)
          if "IMPLEMENTATION_MANIFEST_SCHEMA = \"org.trillionnium.product-measurement-implementation.v1\"" in perf_core:
              raise SystemExit("performance methodology repair is already present")

          parsed = ast.parse(perf_core)
          policy_default = None
          for node in ast.walk(parsed):
              if not isinstance(node, ast.Call) or not isinstance(node.func, ast.Attribute) or node.func.attr != "add_argument":
                  continue
              positional = [arg.value for arg in node.args if isinstance(arg, ast.Constant) and isinstance(arg.value, str)]
              if "--max-regression-percent" not in positional:
                  continue
              for keyword in node.keywords:
                  if keyword.arg == "default" and isinstance(keyword.value, ast.Constant) and isinstance(keyword.value.value, (int, float)):
                      policy_default = float(keyword.value.value)
          if policy_default is None:
              raise SystemExit("cannot recover the existing max-regression-percent default")
          if not (0.0 <= policy_default <= 100.0):
              raise SystemExit(f"unsafe existing regression threshold: {policy_default}")

          perf_block = f'''
          IMPLEMENTATION_MANIFEST_SCHEMA = "org.trillionnium.product-measurement-implementation.v1"
          GATE_POLICY_SCHEMA = "org.trillionnium.product-regression-gate-policy.v1"
          GATE_POLICY_MAX_REGRESSION_PERCENT = {policy_default!r}
          PERFORMANCE_IMPLEMENTATION_PATHS = (
              "tools/perf/run_product_baseline.py",
              "tools/perf/_run_product_baseline_core.py",
              "tools/owner-open/owner_open_rootlinux_supervisor.py",
          )


          def implementation_manifest() -> dict[str, Any]:
              members = []
              for relative in PERFORMANCE_IMPLEMENTATION_PATHS:
                  measured = measured_file(ROOT / relative)
                  members.append({{
                      "path": relative,
                      "size": measured["size"],
                      "sha256": measured["sha256"],
                  }})
              body = {{
                  "schema": IMPLEMENTATION_MANIFEST_SCHEMA,
                  "members": members,
              }}
              return {{**body, "sha256": digest(canonical(body))}}


          def validate_implementation_manifest(value: Any) -> dict[str, Any]:
              require(isinstance(value, dict), "implementation manifest must be an object")
              require(set(value) == {{"schema", "members", "sha256"}}, "implementation manifest keys drifted")
              require(value["schema"] == IMPLEMENTATION_MANIFEST_SCHEMA, "implementation manifest schema drifted")
              members = value["members"]
              require(isinstance(members, list) and len(members) == len(PERFORMANCE_IMPLEMENTATION_PATHS),
                      "implementation manifest member count drifted")
              normalized = []
              for index, (member, expected_path) in enumerate(zip(members, PERFORMANCE_IMPLEMENTATION_PATHS, strict=True)):
                  require(isinstance(member, dict) and set(member) == {{"path", "size", "sha256"}},
                          f"implementation member {{index}} keys drifted")
                  require(member["path"] == expected_path, f"implementation member {{index}} path drifted")
                  require(isinstance(member["size"], int) and member["size"] > 0,
                          f"implementation member {{index}} size is invalid")
                  require(isinstance(member["sha256"], str) and re.fullmatch(r"[0-9a-f]{{64}}", member["sha256"]),
                          f"implementation member {{index}} digest is invalid")
                  normalized.append(dict(member))
              body = {{"schema": IMPLEMENTATION_MANIFEST_SCHEMA, "members": normalized}}
              require(value["sha256"] == digest(canonical(body)), "implementation manifest digest mismatch")
              return {{**body, "sha256": value["sha256"]}}


          def gate_policy_identity() -> dict[str, Any]:
              return {{
                  "schema": GATE_POLICY_SCHEMA,
                  "max_regression_percent": GATE_POLICY_MAX_REGRESSION_PERCENT,
              }}
          '''
          perf_core = insert_after_function(perf_core, "measured_file", perf_block)
          count = perf_core.count("measured_file(Path(__file__))")
          if count != 1:
              raise SystemExit(f"expected one performance harness identity call, found {count}")
          perf_core = perf_core.replace("measured_file(Path(__file__))", "implementation_manifest()", 1)

          old_identity = '''"harness_sha256": identities["harness"]["sha256"]}'''
          new_identity = '''"harness_sha256": identities["harness"]["sha256"],
                                          "harness_manifest": identities["harness"],
                                          "gate_policy": gate_policy_identity()}'''
          if old_identity not in perf_core:
              raise SystemExit("performance comparison identity anchor drifted")
          perf_core = perf_core.replace(old_identity, new_identity, 1)

          perf_core = insert_at_function_start(
              perf_core,
              "run",
              '''require(float(args.max_regression_percent) == GATE_POLICY_MAX_REGRESSION_PERCENT,
                      "max-regression-percent is fixed by the reviewed gate policy")''',
          )
          perf_core = insert_at_function_start(
              perf_core,
              "regression_gate",
              '''require(float(threshold_percent) == GATE_POLICY_MAX_REGRESSION_PERCENT,
                      "caller cannot override the reviewed regression threshold")
          identity = current.get("comparison_identity")
          require(isinstance(identity, dict), "current comparison identity is missing")
          require(identity.get("gate_policy") == gate_policy_identity(),
                  "current regression gate policy differs from the reviewed policy")
          validate_implementation_manifest(identity.get("harness_manifest"))
          if previous is not None:
              previous_identity = previous.get("comparison_identity")
              require(isinstance(previous_identity, dict), "previous comparison identity is missing")
              require(previous_identity.get("gate_policy") == gate_policy_identity(),
                      "previous regression gate policy differs from the reviewed policy")
              validate_implementation_manifest(previous_identity.get("harness_manifest"))''',
          )
          write(perf_core_path, perf_core)

          build_core_path = "tools/build/_verify_host_reproducibility_core.py"
          build_core = read(build_core_path)
          if "IMPLEMENTATION_MANIFEST_SCHEMA = \"org.trillionnium.host-reproducibility-implementation.v1\"" in build_core:
              raise SystemExit("build methodology repair is already present")
          build_block = '''
          IMPLEMENTATION_MANIFEST_SCHEMA = "org.trillionnium.host-reproducibility-implementation.v1"
          REPRODUCIBILITY_IMPLEMENTATION_PATHS = (
              "tools/build/verify_host_reproducibility.py",
              "tools/build/_verify_host_reproducibility_core.py",
              "tools/owner-open/owner_open_rootlinux_supervisor.py",
          )


          def implementation_manifest() -> dict[str, Any]:
              members = []
              for relative in REPRODUCIBILITY_IMPLEMENTATION_PATHS:
                  measured = measured_file(ROOT / relative)
                  members.append({
                      "path": relative,
                      "size": measured["size"],
                      "sha256": measured["sha256"],
                  })
              body = {
                  "schema": IMPLEMENTATION_MANIFEST_SCHEMA,
                  "members": members,
              }
              return {**body, "sha256": digest(canonical(body))}
          '''
          build_core = insert_after_function(build_core, "measured_file", build_block)
          count = build_core.count("measured_file(Path(__file__))")
          if count != 1:
              raise SystemExit(f"expected one build harness identity call, found {count}")
          build_core = build_core.replace("measured_file(Path(__file__))", "implementation_manifest()", 1)
          write(build_core_path, build_core)

          perf_test_path = "tools/tests/test_run_product_baseline.py"
          perf_test = read(perf_test_path)
          perf_tests = '''
          class MeasurementMethodIdentityTests(unittest.TestCase):
              def test_closed_implementation_manifest_is_digest_bound(self):
                  module = load_module()
                  manifest = module.CORE.implementation_manifest()
                  self.assertEqual(
                      [member["path"] for member in manifest["members"]],
                      list(module.CORE.PERFORMANCE_IMPLEMENTATION_PATHS),
                  )
                  self.assertEqual(
                      manifest["sha256"],
                      module.CORE.digest(module.CORE.canonical({
                          "schema": manifest["schema"],
                          "members": manifest["members"],
                      })),
                  )

              def test_every_behavior_member_changes_method_identity(self):
                  module = load_module()
                  original = module.CORE.measured_file
                  baseline = module.CORE.implementation_manifest()
                  for target in module.CORE.PERFORMANCE_IMPLEMENTATION_PATHS:
                      def changed(path, *, _target=target):
                          measured = dict(original(path))
                          relative = Path(path).resolve().relative_to(module.CORE.ROOT).as_posix()
                          if relative == _target:
                              measured["sha256"] = "0" * 64 if measured["sha256"] != "0" * 64 else "1" * 64
                          return measured
                      with mock.patch.object(module.CORE, "measured_file", side_effect=changed):
                          candidate = module.CORE.implementation_manifest()
                      self.assertNotEqual(candidate["sha256"], baseline["sha256"], target)

              def test_caller_cannot_weaken_reviewed_threshold(self):
                  module = load_module()
                  identity = {
                      "gate_policy": module.CORE.gate_policy_identity(),
                      "harness_manifest": module.CORE.implementation_manifest(),
                  }
                  current = {"failures": [], "comparison_identity": identity, "summaries": {}}
                  with self.assertRaisesRegex(module.CORE.BenchmarkError, "cannot override"):
                      module.CORE.regression_gate(
                          current,
                          None,
                          module.CORE.GATE_POLICY_MAX_REGRESSION_PERCENT + 1.0,
                      )

              def test_gate_policy_and_full_manifest_are_in_comparison_identity(self):
                  source = (ROOT / "tools/perf/_run_product_baseline_core.py").read_text(encoding="utf-8")
                  self.assertIn('"harness_manifest": identities["harness"]', source)
                  self.assertIn('"gate_policy": gate_policy_identity()', source)
          '''
          if "class MeasurementMethodIdentityTests" in perf_test:
              raise SystemExit("performance policy tests already exist")
          perf_test = perf_test.replace("import unittest\n", "import unittest\nfrom unittest import mock\n", 1)
          perf_test = insert_before_main(perf_test, perf_tests)
          write(perf_test_path, perf_test)

          build_test_path = "tools/tests/test_verify_host_reproducibility.py"
          build_test = read(build_test_path)
          build_tests = '''
          class ReproducibilityMethodIdentityTests(unittest.TestCase):
              def test_closed_implementation_manifest_is_explicit(self):
                  module = load_module()
                  manifest = module.CORE.implementation_manifest()
                  self.assertEqual(
                      [member["path"] for member in manifest["members"]],
                      list(module.CORE.REPRODUCIBILITY_IMPLEMENTATION_PATHS),
                  )
                  self.assertEqual(
                      manifest["sha256"],
                      module.CORE.digest(module.CORE.canonical({
                          "schema": manifest["schema"],
                          "members": manifest["members"],
                      })),
                  )

              def test_every_reproducibility_member_changes_identity(self):
                  module = load_module()
                  original = module.CORE.measured_file
                  baseline = module.CORE.implementation_manifest()
                  for target in module.CORE.REPRODUCIBILITY_IMPLEMENTATION_PATHS:
                      def changed(path, *, _target=target):
                          measured = dict(original(path))
                          relative = Path(path).resolve().relative_to(module.CORE.ROOT).as_posix()
                          if relative == _target:
                              measured["sha256"] = "0" * 64 if measured["sha256"] != "0" * 64 else "1" * 64
                          return measured
                      with mock.patch.object(module.CORE, "measured_file", side_effect=changed):
                          candidate = module.CORE.implementation_manifest()
                      self.assertNotEqual(candidate["sha256"], baseline["sha256"], target)

              def test_report_uses_full_implementation_manifest(self):
                  source = (ROOT / "tools/build/_verify_host_reproducibility_core.py").read_text(encoding="utf-8")
                  self.assertIn("implementation_manifest()", source)
                  self.assertNotIn("measured_file(Path(__file__))", source)
          '''
          if "class ReproducibilityMethodIdentityTests" in build_test:
              raise SystemExit("reproducibility policy tests already exist")
          build_test = build_test.replace("import unittest\n", "import unittest\nfrom unittest import mock\n", 1)
          build_test = insert_before_main(build_test, build_tests)
          write(build_test_path, build_test)

          perf_readme_path = "tools/perf/README.md"
          perf_readme = read(perf_readme_path)
          perf_note = f'''

          ## Reviewed measurement identity and regression policy

          Performance compatibility is bound to a closed implementation manifest covering the public
          facade, private workload core and the imported Root Linux process-group supervisor. Every
          member records a repository-relative path, byte size and SHA-256; changing any member makes
          old and new artifacts methodologically incompatible.

          The regression threshold is fixed by policy
          `org.trillionnium.product-regression-gate-policy.v1` at `{policy_default:g}%`. The CLI option
          remains only as an explicit assertion of that reviewed value; callers cannot weaken it, and
          the policy identity is included in baseline compatibility.
          '''
          if "## Reviewed measurement identity and regression policy" not in perf_readme:
              perf_readme = perf_readme.rstrip() + perf_note + "\n"
          write(perf_readme_path, perf_readme)

          build_readme_path = "tools/build/README.md"
          build_readme = read(build_readme_path)
          build_note = '''

          ## Reproducibility implementation identity

          Every report binds a closed implementation manifest for the public verifier facade, private
          build recipe core and imported Root Linux process-group supervisor. The manifest records the
          repository-relative path, byte size and SHA-256 of each behavior-bearing member, so a cleanup
          or build-recipe change necessarily changes verifier identity before build A/B can be compared.
          '''
          if "## Reproducibility implementation identity" not in build_readme:
              build_readme = build_readme.rstrip() + build_note + "\n"
          write(build_readme_path, build_readme)

          expected = {
              "tools/perf/_run_product_baseline_core.py",
              "tools/perf/README.md",
              "tools/build/_verify_host_reproducibility_core.py",
              "tools/build/README.md",
              "tools/tests/test_run_product_baseline.py",
              "tools/tests/test_verify_host_reproducibility.py",
          }
          import subprocess
          changed = set(subprocess.check_output(
              ["git", "--no-replace-objects", "diff", "--name-only"],
              cwd=ROOT,
              text=True,
          ).splitlines())
          if changed != expected:
              raise SystemExit(f"unexpected repair surface: {sorted(changed)}")
          PY

          git diff --check
          python3 -m py_compile \
            tools/perf/run_product_baseline.py \
            tools/perf/_run_product_baseline_core.py \
            tools/build/verify_host_reproducibility.py \
            tools/build/_verify_host_reproducibility_core.py \
            tools/tests/test_run_product_baseline.py \
            tools/tests/test_verify_host_reproducibility.py
          python3 -m unittest \
            tools.tests.test_run_product_baseline \
            tools.tests.test_product_baseline_process_group_cleanup \
            tools.tests.test_verify_host_reproducibility -v
          python3 tools/docs/verify_repository_authority.py
          python3 tools/docs/verify_global_docs.py

      - name: Commit one exact repair and refresh the PR packet
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'Qian QI'
          git config user.email '102159240+ProfHepta@users.noreply.github.com'
          git add \
            tools/perf/_run_product_baseline_core.py \
            tools/perf/README.md \
            tools/build/_verify_host_reproducibility_core.py \
            tools/build/README.md \
            tools/tests/test_run_product_baseline.py \
            tools/tests/test_verify_host_reproducibility.py
          git commit -m 'perf: bind measurement method and fixed gate policy'
          new_head="$(git --no-replace-objects rev-parse HEAD)"
          new_tree="$(git --no-replace-objects rev-parse HEAD^{tree})"
          git push origin "HEAD:$TARGET_BRANCH"

          base_sha="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.base.sha')"
          base_tree="$(git --no-replace-objects rev-parse "${base_sha}^{tree}")"
          merge_sha=""
          for _ in $(seq 1 20); do
            merge_sha="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.merge_commit_sha // empty')"
            test -n "$merge_sha" && break
            sleep 1
          done
          test -n "$merge_sha"

          cat > "${RUNNER_TEMP}/body.md" <<EOF
          Parent work: #52, #56
          Source extraction: performance/reproducibility tooling from blocked PR #49

          ## Exact subject

          \`\`\`text
          base branch:               main
          base commit:               ${base_sha}
          base tree:                 ${base_tree}
          review predecessor:        ${EXPECTED_HEAD}
          review predecessor tree:   ${EXPECTED_TREE}
          head commit:               ${new_head}
          head tree:                 ${new_tree}
          GitHub prospective merge:  ${merge_sha}
          changed paths from base:   10
          \`\`\`

          Any base/head/tree/prospective-merge, workflow or review-surface movement invalidates current qualification and review.

          ## Purpose

          Extract the real local Host/Core measurement harness and same-host reproducibility checker from blocked PR #49 without carrying unrelated runtime behavior, component documentation or a performance-pass claim.

          ## Current blocker repair

          The measurement method is now a closed manifest containing repository-relative path, byte size and SHA-256 for the public facade, private core and imported process-group supervisor. The full manifest and digest are bound into performance comparison identity and into the build-reproducibility report. Changing any behavior-bearing member invalidates compatibility.

          The regression threshold is fixed by the versioned reviewed gate policy. The command-line argument is assertion-only: a different value fails closed, and the policy version/value participate in baseline compatibility. A caller can no longer turn an old failed comparison green by selecting a weaker threshold.

          ## Existing process cleanup guarantee

          Both behavior-bearing entry points retain each \`start_new_session\` leader through Linux \`waitid(WNOWAIT)\` until the complete original SID/PGID is empty. TERM is sent to the whole original group, followed by a bounded grace period, KILL for survivors, proof that the original group is empty, and only then leader reaping and descriptor closure.

          ## Verification boundary

          The repair ran the product-baseline, process-group-cleanup and Host reproducibility suites, Python compilation, repository-authority verification and global-document verification before publication. Current exact-head and canonical synthetic-merge workflows must now complete on this unchanged head before fresh review.

          No performance pass, threshold weakening, installed Root Linux, Android, physical-device, destructive-fault, independent-builder, signing or release claim is made. The retained PR #49 \`FAIL_REGRESSION\` remains tracked by #56.

          Fresh non-author review is requested only after current workflows are terminal-success:

          - \`Tomasrgbsf\` — source/performance methodology, implementation identity and fixed policy;
          - \`Franksudoman\` — exact-subject, CI/evidence and review boundary.
          EOF
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" -f body="$(cat "${RUNNER_TEMP}/body.md")" >/dev/null
