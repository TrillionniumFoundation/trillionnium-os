name: ChatGPT issue57 protected observe-shadow integrator

on:
  push:
    branches:
      - ops/chatgpt-source-export-20260908
    paths:
      - .github/workflows/chatgpt-issue57-protected-integrator.yml

permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: read
  actions: read

concurrency:
  group: chatgpt-issue57-protected-integrator
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      SOURCE_BRANCH: codex/observe-shadow-telemetry-v1-20260909
      TARGET_BRANCH: codex/observe-shadow-telemetry-v2-20260909
      DEPENDENCY_ISSUE: '56'
      ISSUE_NUMBER: '57'
    steps:
      - name: Wait for performance source closure
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS+4200))
          while ((SECONDS<deadline)); do
            if test "$(gh api "repos/${GITHUB_REPOSITORY}/issues/${DEPENDENCY_ISSUE}" --jq '.state')" = closed; then
              main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq '.commit.sha')"
              grep_check="$(gh api -H 'Accept: application/vnd.github.raw+json' "repos/${GITHUB_REPOSITORY}/contents/tools/perf/_run_product_baseline_core.py?ref=${main_sha}" 2>/dev/null || true)"
              grep -q 'GATE_POLICY_MAX_REGRESSION_PERCENT' <<<"$grep_check"
              printf '%s\n' "$main_sha" > "${RUNNER_TEMP}/base"
              exit 0
            fi
            sleep 15
          done
          exit 1

      - name: Check out exact current main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: main
          persist-credentials: true

      - name: Extract frozen issue57 delta
        shell: bash
        run: |
          set -euo pipefail
          base="$(cat "${RUNNER_TEMP}/base")"; test "$(git rev-parse HEAD)" = "$base"
          git ls-remote --exit-code --heads origin "$SOURCE_BRANCH" >/dev/null
          git fetch --no-tags origin "$SOURCE_BRANCH"
          source_head="$(git rev-parse "origin/${SOURCE_BRANCH}^{commit}")"; source_tree="$(git rev-parse "${source_head}^{tree}")"; source_parent="$(git rev-parse "${source_head}^1")"
          test "$(git rev-list --parents -n1 "$source_head"|wc -w)" -eq 2
          git log -1 --format=%s "$source_head" | grep -Eiq '(telemetry|shadow|observe|metric|control)'
          git diff --binary "$source_parent..$source_head" > "${RUNNER_TEMP}/issue57.patch"; test -s "${RUNNER_TEMP}/issue57.patch"
          printf '%s\n' "$source_head" > "${RUNNER_TEMP}/source-head"; printf '%s\n' "$source_tree" > "${RUNNER_TEMP}/source-tree"; printf '%s\n' "$source_parent" > "${RUNNER_TEMP}/source-parent"
          git switch -c "$TARGET_BRANCH"; git apply --3way --index "${RUNNER_TEMP}/issue57.patch"; git diff --cached --check
          git config user.name 'Qian QI'; git config user.email '102159240+ProfHepta@users.noreply.github.com'; git commit -m 'telemetry: add metric authority and deterministic observe shadow control'

      - name: Verify bounded telemetry and non-active control
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/machine/metric-catalog.v1.json
          grep -q 'cardinality' docs/machine/metric-catalog.v1.json
          grep -q 'privacy' docs/machine/metric-catalog.v1.json
          grep -q 'clock' docs/machine/metric-catalog.v1.json
          grep -Rqs 'OBSERVE' docs tools planned crates
          grep -Rqs 'SHADOW' docs tools planned crates
          grep -Rqs 'proposal_digest\|proposal digest' docs tools planned crates
          grep -Rqs 'objective.*delta\|global_objective_delta' docs tools planned crates
          grep -Rqs 'oscillation' docs tools planned crates
          grep -Rqs 'rollback' docs tools planned crates
          if grep -Rqs 'active_control[" ]*:[" ]*true\|"ACTIVE"[[:space:]]*,[[:space:]]*"enabled"[[:space:]]*:[[:space:]]*true' docs/machine tools planned crates; then
            printf '%s\n' 'active control was enabled before L2/shadow authorization' >&2
            exit 1
          fi
          mapfile -t tests < <(find tools/tests -maxdepth 1 -type f \( -iname '*telemetry*.py' -o -iname '*metric*.py' -o -iname '*shadow*.py' -o -iname '*control*.py' \) -printf '%f\n' | sed 's/\.py$//' | sort -u)
          test "${#tests[@]}" -gt 0
          modules=(); for t in "${tests[@]}"; do modules+=("tools.tests.${t}"); done
          python3 -m unittest "${modules[@]}" -v
          python3 tools/docs/generate_global_docs.py --check
          python3 tools/docs/verify_repository_authority.py
          python3 tools/docs/verify_global_docs.py
          python3 tools/docs/verify_effect_lifecycle.py --model-check --json
          if ! status="$(git status --porcelain=v1 --untracked-files=all --ignore-submodules=none)"; then exit 1; fi; test -z "$status"

      - name: Publish exact draft PR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base="$(cat "${RUNNER_TEMP}/base")"; source_head="$(cat "${RUNNER_TEMP}/source-head")"; source_tree="$(cat "${RUNNER_TEMP}/source-tree")"; source_parent="$(cat "${RUNNER_TEMP}/source-parent")"; head="$(git rev-parse HEAD)"; tree="$(git rev-parse HEAD^{tree})"
          git push origin "HEAD:$TARGET_BRANCH"
          pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls?state=all&head=${GITHUB_REPOSITORY_OWNER}%3A${TARGET_BRANCH}" --jq '.[0].number // empty')"; if test -z "$pr"; then pr="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/pulls" -f title='telemetry: add metric authority and deterministic observe shadow control' -f head="$TARGET_BRANCH" -f base=main -F draft=true -f body='Issue #57 exact observe-shadow candidate.' --jq '.number')"; fi
          printf '%s\n' "$pr" > "${RUNNER_TEMP}/pr"; printf '%s\n' "$head" > "${RUNNER_TEMP}/head"
          merge_sha=""; for _ in $(seq 1 30); do merge_sha="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr}" --jq '.merge_commit_sha // empty')"; test -n "$merge_sha" && break; sleep 1; done; test -n "$merge_sha"
          base_tree="$(git rev-parse "${base}^{tree}")"; count="$(git diff --name-only "$base...$head"|wc -l|tr -d ' ')"
          cat > "${RUNNER_TEMP}/body.md" <<EOF
          Parent program: #51
          Closes source work: #57
          Depends on protected source closure of #55 and #56

          ## Exact subject

          \`\`\`text
          base:                    main@${base}
          base tree:               ${base_tree}
          source candidate:        ${source_head}
          source candidate tree:   ${source_tree}
          source candidate parent: ${source_parent}
          head:                    ${head}
          head tree:               ${tree}
          GitHub prospective merge:${merge_sha}
          changed paths:           ${count}
          \`\`\`

          The integration extracts only the final frozen issue57 delta and reapplies it to current protected main.

          ## Observe/shadow closure

          The metric catalog defines unit, type, source, collection point, aggregation, retention, cardinality ceiling, privacy class, dimensions, sampling, missing-data meaning and clock source. Typed ingestion is bounded and validates units, epochs and clock jumps; incomplete coverage remains explicit. Observe mode emits current allocation, utilization, violations and a deterministic proposal without effects. Shadow mode records predicted-versus-actual outcome, global-objective delta, hard-constraint violations, oscillation and rollback triggers without applying a proposal.

          \`ADVISORY\`, \`ACTIVE_CANARY\` and \`ACTIVE\` remain forbidden until installed L2 evidence and later independent authorization. Metrics never become semantic/effect authority.

          ## Claim ceiling

          Source observe/shadow closure only; active control remains false. No installed target, device, destructive-fault, signing, OTA or release evidence is claimed. Fresh exact-head review by \`Tomasrgbsf\` and \`Franksudoman\` is required.
          EOF
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/pulls/${pr}" -f body="$(cat "${RUNNER_TEMP}/body.md")" >/dev/null

      - name: Qualify, review and merge normally
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pr="$(cat "${RUNNER_TEMP}/pr")"; head="$(cat "${RUNNER_TEMP}/head")"
          required=('L1 graph, documentation, broker and MCP source closure' 'L1 Rust 1.93 selected Host, job, flow and recovery closure' 'L1 exact-head direct-source aggregate' 'L1 exact two-parent merge source qualification' 'L1 exact-source-head aggregate candidate' 'L1 protected-main and exact-head independent-review readiness')
          deadline=$((SECONDS+2100)); passed=false
          while ((SECONDS<deadline)); do
            test "$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr}" --jq '.head.sha')" = "$head"
            gh api --paginate "repos/${GITHUB_REPOSITORY}/commits/${head}/check-runs?per_page=100" --jq '.check_runs[]|[.name,.status,(.conclusion//""),.id]|@tsv' > "${RUNNER_TEMP}/checks"
            if python3 - "${RUNNER_TEMP}/checks" "${required[@]}" <<'PY'
          from pathlib import Path
          import sys
          latest={}
          for line in Path(sys.argv[1]).read_text().splitlines():
              n,s,c,i=line.split('\t'); v=(int(i),s,c)
              if n not in latest or v[0]>latest[n][0]: latest[n]=v
          failures=[n for n,(_,s,c) in latest.items() if s=='completed' and c not in {'success','neutral','skipped'}]
          if failures: print(failures); raise SystemExit(2)
          if not all(latest.get(n,(0,'',''))[1:]==('completed','success') for n in sys.argv[2:]): raise SystemExit(1)
          PY
            then passed=true; break; else rc=$?; test "$rc" -ne 2 || exit 1; fi; sleep 15
          done
          test "$passed" = true
          node="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr}" --jq '.node_id')"; gh api graphql -f query='mutation($id:ID!){markPullRequestReadyForReview(input:{pullRequestId:$id}){pullRequest{number}}}' -f id="$node" >/dev/null
          gh api --method POST "repos/${GITHUB_REPOSITORY}/pulls/${pr}/requested_reviewers" -f reviewers[]='Tomasrgbsf' -f reviewers[]='Franksudoman' >/dev/null
          deadline=$((SECONDS+1200)); states=''
          while ((SECONDS<deadline)); do
            test "$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr}" --jq '.head.sha')" = "$head"
            states="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${pr}/reviews?per_page=100" --jq '.[]|select(.commit_id=="'"$head"'")|[.user.login,.state,.id]|@tsv'|sort -k1,1 -k3,3n|awk -F'\t' '$1=="Tomasrgbsf"||$1=="Franksudoman"{s[$1]=$2} END{print s["Tomasrgbsf"],s["Franksudoman"]}')"; test "$states" = 'APPROVED APPROVED' && break; sleep 15
          done
          test "$states" = 'APPROVED APPROVED'
          unresolved="$(gh api graphql -f owner="${GITHUB_REPOSITORY_OWNER}" -f name="${GITHUB_REPOSITORY#*/}" -F number="$pr" -f query='query($owner:String!,$name:String!,$number:Int!){repository(owner:$owner,name:$name){pullRequest(number:$number){reviewThreads(first:100){nodes{isResolved}}}}}' --jq '[.data.repository.pullRequest.reviewThreads.nodes[]|select(.isResolved==false)]|length')"; test "$unresolved" = 0
          result="$(gh api --method PUT "repos/${GITHUB_REPOSITORY}/pulls/${pr}/merge" -f merge_method=squash -f sha="$head" -f commit_title='telemetry: add deterministic observe and shadow control' -f commit_message='Close issue #57 at source observe/shadow level. Active control and all L2-L6 evidence remain disabled.')"; jq -e '.merged==true'<<<"$result" >/dev/null
          merge_sha="$(jq -r '.sha'<<<"$result")"; gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" -f body="Protected observe/shadow source integration completed at ${merge_sha}. Active control remains false and L2-L6 evidence remains separate." >/dev/null; gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}" -f state=closed >/dev/null
