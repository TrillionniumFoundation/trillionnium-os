name: G1 PR47 exact blocker materializer

on:
  push:
    branches:
      - codex/g1-full-gap-closure-20260907

permissions:
  contents: write

concurrency:
  group: g1-pr47-exact-blocker-materializer
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  apply:
    name: Apply exact component-documentation blocker repair
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: >-
      github.repository == 'TrillionniumFoundation/trillionnium-os' &&
      github.ref_name == 'codex/g1-full-gap-closure-20260907'
    steps:
      - name: Check out bootstrap commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
          persist-credentials: true

      - name: Verify exact bootstrap provenance
        shell: bash
        run: |
          set -euo pipefail
          test "$(git --no-replace-objects rev-parse HEAD^)" = "d5675aba3fc7b4d10bef9025b8c150784d38c129"
          test "$(git --no-replace-objects diff --name-only HEAD^ HEAD)" = ".github/workflows/g1-pr47-blocker-materializer.yml"

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"

      - name: Apply checksum-bound repair
        shell: bash
        run: |
          set -euo pipefail
          cat > "${RUNNER_TEMP:?}/pr47.patch.gz.b64" <<'PATCH_B64'
          
          PATCH_B64
          base64 --decode "${RUNNER_TEMP:?}/pr47.patch.gz.b64" > "${RUNNER_TEMP:?}/pr47.patch.gz"
          echo "10f4830f5cf6a42ad591490edcf45a0003e9c354a2076628bf97fe13763958b0  ${RUNNER_TEMP:?}/pr47.patch.gz" | sha256sum --check --strict
          gzip --decompress --stdout "${RUNNER_TEMP:?}/pr47.patch.gz" > "${RUNNER_TEMP:?}/pr47.patch"
          git apply --check "${RUNNER_TEMP:?}/pr47.patch"
          git apply --index "${RUNNER_TEMP:?}/pr47.patch"

      - name: Remove materializer and verify repair
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/g1-pr47-blocker-materializer.yml
          git diff --cached --check
          python3 tools/docs/verify_component_documentation.py
          python3 tools/docs/generate_global_docs.py --check
          python3 tools/docs/verify_global_docs.py
          python3 -m unittest tools.tests.test_owner_open_broker_component_documentation -v
          python3 -m unittest tools.tests.test_verify_g1_review_index -v
          python3 -m json.tool governance/pr41-review-index.v1.json >/dev/null
          test -z "$(git status --porcelain --untracked-files=all | grep '^??' || true)"

      - name: Commit and push exact repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(g1): close component documentation admission blockers"
          test -z "$(git status --porcelain --untracked-files=all)"
          git push origin "HEAD:${GITHUB_REF_NAME}"
