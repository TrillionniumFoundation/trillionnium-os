name: Owner-Open R7 runtime v4 retry preparation

on:
  push:
    branches:
      - ops/owner-open-r7-runtime-v4-retry-prep-20260830
    paths:
      - .github/workflows/owner-open-r7-runtime-v4-retry-prep.yml

permissions:
  actions: write
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out preparation branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: ops/owner-open-r7-runtime-v4-retry-prep-20260830
      - name: Cancel only superseded v4 producer and controller runs
        shell: bash
        run: |
          set -u
          for branch in \
            codex/owner-open-r7-runtime-hardening-20260830-v4 \
            ops/owner-open-r7-runtime-v4-controller-20260830
          do
            runs="$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/runs" -f branch="$branch" -F per_page=100 2>/dev/null || printf '{"workflow_runs":[]}')"
            jq -r '.workflow_runs[] | select(.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "pending") | .id' <<<"$runs" \
              | while read -r run_id; do
                  [ -n "$run_id" ] || continue
                  gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/cancel" >/dev/null 2>&1 || true
                done
          done
          sleep 20
      - name: Retire preparation branch workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/owner-open-r7-runtime-v4-retry-prep.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "ops(r7): retire runtime v4 retry preparation"
          git push origin HEAD:ops/owner-open-r7-runtime-v4-retry-prep-20260830
