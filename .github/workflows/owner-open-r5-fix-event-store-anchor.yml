name: owner-open R5 fix event-store repair preimage

on:
  push:
    branches:
      - "codex/owner-open-r5-tool-loop-20260827"
    paths:
      - ".github/workflows/owner-open-r5-fix-event-store-anchor.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/owner-open-r5-tool-loop-20260827
          persist-credentials: true
          fetch-depth: 1

      - name: Bind the exact current event-store source block
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("tools/owner-open/apply_r5_runner_repair_candidate.py")
          text = path.read_text(encoding="utf-8")
          old = '''        "    let read = reader\\n"
        "        .take(maximum as u64 + 2)\\n"
        "        .read_until(b'\\\\n', &mut line)?;\\n",
'''
          new = '''        "    let read = reader\\n"
        "        .take(maximum as u64 + 2)\\n"
        "        .read_until(b'\\\\n', &mut line)\\n"
        "        .map_err(|error| EventStoreError::Io(error.to_string()))?;\\n",
'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"expected one event-store repair preimage, observed {count}")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
          python3 -m py_compile tools/owner-open/apply_r5_runner_repair_candidate.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/owner-open/apply_r5_runner_repair_candidate.py
          git commit -m "tools: bind full event-store read error chain"
          git push origin HEAD:refs/heads/codex/owner-open-r5-tool-loop-20260827
