name: G1 clock-domain exact-head publisher v3

"on":
  push:
    branches:
      - ops/g1-synthetic-retirement-fix-20260906
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g1-clock-domain-publisher-v3
  cancel-in-progress: false

env:
  TARGET_BRANCH: codex/g1-all-gap-closure-20260904
  BASELINE_HEAD: 9420aac7ec2a8c88416f00115031885f72227ccc
  PYTHONDONTWRITEBYTECODE: "1"
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate canonical clock-domain repair
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    outputs:
      target_head: ${{ steps.prepare.outputs.target_head }}
      result_tree: ${{ steps.prepare.outputs.result_tree }}
      patch_sha256: ${{ steps.prepare.outputs.patch_sha256 }}
      changed_paths_sha256: ${{ steps.prepare.outputs.changed_paths_sha256 }}
    steps:
      - name: Checkout isolated publisher control branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install fixed source-test prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=2 update
          sudo apt-get -o Acquire::Retries=2 install --yes --no-install-recommends acl

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"

      - name: Set up Rust 1.93.0
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.93.0 --profile minimal --component rustfmt --component clippy --no-self-update
          rustup default 1.93.0
          rustc --version | grep -F 'rustc 1.93.0 '
          cargo --version | grep -F 'cargo 1.93.0 '

      - name: Prepare exact target and canonical patch
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          target_head="$(git --no-replace-objects rev-parse "refs/remotes/origin/${TARGET_BRANCH}^{commit}")"
          git --no-replace-objects merge-base --is-ancestor "$BASELINE_HEAD" "$target_head"
          mapfile -t prior_paths < <(git --no-replace-objects diff --name-only "$BASELINE_HEAD..$target_head")
          for path in "${prior_paths[@]}"; do
            case "$path" in
              __schema_probe__|tools/owner-open/build_owner_open_rootfs_image_release_v2.py|tools/owner-open/jsonl_provider_runtime.py) ;;
              *) echo "unexpected target drift since baseline: $path" >&2; exit 1 ;;
            esac
          done
          work="${RUNNER_TEMP}/g1-clock-domain-target"
          test ! -e "$work"
          git worktree add --detach "$work" "$target_head"
          cd "$work"
          rm -f -- __schema_probe__
          python3 - <<'PY'
          from pathlib import Path

          def patch(path: Path, start_marker: str, end_marker: str) -> None:
              text = path.read_text(encoding="utf-8")
              alias = (
                  "from time import monotonic as _retirement_monotonic\n"
                  "from time import sleep as _retirement_sleep\n"
              )
              if alias not in text:
                  marker = "import time\n"
                  if text.count(marker) != 1:
                      raise SystemExit(f"unexpected time import shape: {path}")
                  text = text.replace(marker, marker + alias, 1)
              start = text.index(start_marker)
              end = text.index(end_marker, start)
              region = text[start:end]
              region = region.replace("time.monotonic()", "_retirement_monotonic()")
              region = region.replace("time.sleep(", "_retirement_sleep(")
              if "time.monotonic()" in region or "time.sleep(" in region:
                  raise SystemExit(f"retirement clock remained coupled: {path}")
              path.write_text(text[:start] + region + text[end:], encoding="utf-8")

          patch(
              Path("tools/owner-open/build_owner_open_rootfs_image_release_v2.py"),
              "def _quiet_group(",
              "\n\ndef bounded_command(",
          )
          patch(
              Path("tools/owner-open/jsonl_provider_runtime.py"),
              "def _group_quiet(",
              "\n\ndef _status(",
          )
          PY
          mapfile -t changed < <(git diff --name-only)
          printf '%s\n' "${changed[@]}" > "${RUNNER_TEMP}/changed-paths.txt"
          python3 - <<'PY'
          from pathlib import Path
          allowed = {
              "__schema_probe__",
              "tools/owner-open/build_owner_open_rootfs_image_release_v2.py",
              "tools/owner-open/jsonl_provider_runtime.py",
          }
          paths = [line for line in Path(__import__('os').environ['RUNNER_TEMP']).joinpath('changed-paths.txt').read_text().splitlines() if line]
          if not set(paths) <= allowed:
              raise SystemExit(f"unexpected changed paths: {paths}")
          required = {
              "tools/owner-open/build_owner_open_rootfs_image_release_v2.py",
              "tools/owner-open/jsonl_provider_runtime.py",
          }
          # An already-patched head may require only probe cleanup or no new source diff.
          for item in required:
              text = Path(item).read_text(encoding='utf-8')
              if 'from time import monotonic as _retirement_monotonic' not in text:
                  raise SystemExit(f'missing canonical alias: {item}')
          PY
          git diff --check
          git diff --binary --full-index > "${RUNNER_TEMP}/clock-domain.patch"
          patch_sha256="$(sha256sum "${RUNNER_TEMP}/clock-domain.patch" | awk '{print $1}')"
          changed_paths_sha256="$(sha256sum "${RUNNER_TEMP}/changed-paths.txt" | awk '{print $1}')"
          git add -A -- __schema_probe__ tools/owner-open/build_owner_open_rootfs_image_release_v2.py tools/owner-open/jsonl_provider_runtime.py
          result_tree="$(git --no-replace-objects write-tree)"
          {
            echo "target_head=$target_head"
            echo "result_tree=$result_tree"
            echo "patch_sha256=$patch_sha256"
            echo "changed_paths_sha256=$changed_paths_sha256"
          } >> "$GITHUB_OUTPUT"

      - name: Run exact regressions and lifecycle suites
        working-directory: ${{ runner.temp }}/g1-clock-domain-target
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest tools.tests.test_build_owner_open_rootfs_image_release_v2.RootfsCommandBoundaryTest.test_timeout_after_descendant_readiness_retires_group -v
          python3 -m unittest tools.tests.test_jsonl_provider_runtime.ProviderRetirementTest.test_handler_timeout_fences_its_response -v
          python3 -m unittest tools.tests.test_build_owner_open_rootfs_image_release_v2.RootfsCommandBoundaryTest -v
          python3 -m unittest tools.tests.test_jsonl_provider_runtime.ProviderRetirementTest -v

      - name: Run full source qualification
        working-directory: ${{ runner.temp }}/g1-clock-domain-target
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/docs/generate_global_docs.py --check
          python3 tools/docs/verify_global_docs.py
          python3 -m unittest discover -s tools/tests -p 'test*.py' -v
          cargo fmt --all -- --check
          cargo test --locked --all-targets
          cargo clippy --locked --all-targets -- -D warnings
          cargo fmt --manifest-path planned/Cargo.toml --all -- --check
          cargo test --locked --manifest-path planned/Cargo.toml --workspace --all-targets
          cargo clippy --locked --manifest-path planned/Cargo.toml --workspace --all-targets -- -D warnings
          python3 tools/perf/run_global_baseline.py --output "${RUNNER_TEMP}/g1-clock-domain-baseline.json" --repetitions 1
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          artifact = json.loads((Path(os.environ['RUNNER_TEMP']) / 'g1-clock-domain-baseline.json').read_text())
          clone = dict(artifact)
          clone['artifact_digest'] = ''
          encoded = json.dumps(clone, sort_keys=True, separators=(',', ':'), ensure_ascii=True).encode()
          assert artifact['artifact_digest'] == hashlib.sha256(encoded).hexdigest()
          assert artifact['qualification'] == 'SOURCE_EVIDENCE_ONLY'
          assert artifact['gate']['passed'] is False
          PY

      - name: Rebind post-test tree
        working-directory: ${{ runner.temp }}/g1-clock-domain-target
        shell: bash
        env:
          EXPECTED_TREE: ${{ steps.prepare.outputs.result_tree }}
          EXPECTED_PATCH: ${{ steps.prepare.outputs.patch_sha256 }}
          EXPECTED_PATHS: ${{ steps.prepare.outputs.changed_paths_sha256 }}
        run: |
          set -euo pipefail
          git diff --check
          git diff --binary --full-index > "${RUNNER_TEMP}/clock-domain-post.patch"
          test "$(sha256sum "${RUNNER_TEMP}/clock-domain-post.patch" | awk '{print $1}')" = "$EXPECTED_PATCH"
          git diff --name-only > "${RUNNER_TEMP}/changed-paths-post.txt"
          test "$(sha256sum "${RUNNER_TEMP}/changed-paths-post.txt" | awk '{print $1}')" = "$EXPECTED_PATHS"
          git add -A -- __schema_probe__ tools/owner-open/build_owner_open_rootfs_image_release_v2.py tools/owner-open/jsonl_provider_runtime.py
          test "$(git --no-replace-objects write-tree)" = "$EXPECTED_TREE"

  publish:
    name: Publish exact validated tree with lease
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout isolated publisher control branch without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Reconstruct and bind canonical tree without executing candidate code
        id: reconstruct
        shell: bash
        env:
          EXPECTED_HEAD: ${{ needs.validate.outputs.target_head }}
          EXPECTED_TREE: ${{ needs.validate.outputs.result_tree }}
          EXPECTED_PATCH: ${{ needs.validate.outputs.patch_sha256 }}
          EXPECTED_PATHS: ${{ needs.validate.outputs.changed_paths_sha256 }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          current="$(git --no-replace-objects rev-parse "refs/remotes/origin/${TARGET_BRANCH}^{commit}")"
          test "$current" = "$EXPECTED_HEAD"
          work="${RUNNER_TEMP}/g1-clock-domain-publish"
          test ! -e "$work"
          git worktree add --detach "$work" "$current"
          cd "$work"
          rm -f -- __schema_probe__
          python3 - <<'PY'
          from pathlib import Path

          def patch(path: Path, start_marker: str, end_marker: str) -> None:
              text = path.read_text(encoding="utf-8")
              alias = (
                  "from time import monotonic as _retirement_monotonic\n"
                  "from time import sleep as _retirement_sleep\n"
              )
              if alias not in text:
                  marker = "import time\n"
                  if text.count(marker) != 1:
                      raise SystemExit(f"unexpected time import shape: {path}")
                  text = text.replace(marker, marker + alias, 1)
              start = text.index(start_marker)
              end = text.index(end_marker, start)
              region = text[start:end]
              region = region.replace("time.monotonic()", "_retirement_monotonic()")
              region = region.replace("time.sleep(", "_retirement_sleep(")
              if "time.monotonic()" in region or "time.sleep(" in region:
                  raise SystemExit(f"retirement clock remained coupled: {path}")
              path.write_text(text[:start] + region + text[end:], encoding="utf-8")

          patch(Path("tools/owner-open/build_owner_open_rootfs_image_release_v2.py"), "def _quiet_group(", "\n\ndef bounded_command(")
          patch(Path("tools/owner-open/jsonl_provider_runtime.py"), "def _group_quiet(", "\n\ndef _status(")
          PY
          git diff --check
          git diff --binary --full-index > "${RUNNER_TEMP}/clock-domain-publish.patch"
          git diff --name-only > "${RUNNER_TEMP}/changed-paths-publish.txt"
          test "$(sha256sum "${RUNNER_TEMP}/clock-domain-publish.patch" | awk '{print $1}')" = "$EXPECTED_PATCH"
          test "$(sha256sum "${RUNNER_TEMP}/changed-paths-publish.txt" | awk '{print $1}')" = "$EXPECTED_PATHS"
          git add -A -- __schema_probe__ tools/owner-open/build_owner_open_rootfs_image_release_v2.py tools/owner-open/jsonl_provider_runtime.py
          test "$(git --no-replace-objects write-tree)" = "$EXPECTED_TREE"
          if git diff --cached --quiet; then
            echo "commit=$current" >> "$GITHUB_OUTPUT"
            echo "no_change=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'OpenAI Codex'
          git config user.email 'noreply@openai.com'
          git commit -m 'fix(runtime): isolate execution and retirement clocks' \
            -m 'Bind TERM/KILL observation to independent monotonic callables so deterministic execution-time jumps cannot expire cleanup confirmation. Cleanup remains fail-closed. Full Python and Rust source qualification passed in the read-only validation job; no target, device, fault, signing, promotion, or release claim is made.' \
            -m 'Signed-off-by: OpenAI Codex <noreply@openai.com>'
          commit="$(git --no-replace-objects rev-parse HEAD)"
          test "$(git --no-replace-objects rev-parse HEAD^)" = "$current"
          test "$(git --no-replace-objects rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "no_change=false" >> "$GITHUB_OUTPUT"

      - name: Push once with exact lease
        if: ${{ steps.reconstruct.outputs.no_change != 'true' }}
        working-directory: ${{ runner.temp }}/g1-clock-domain-publish
        shell: bash
        env:
          EXPECTED_HEAD: ${{ needs.validate.outputs.target_head }}
          RESULT_COMMIT: ${{ steps.reconstruct.outputs.commit }}
          G1_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk 'NR==1 {print $1}')" = "$EXPECTED_HEAD"
          auth="$(printf 'x-access-token:%s' "$G1_TOKEN" | base64 -w0)"
          git -c "http.extraheader=AUTHORIZATION: basic ${auth}" push \
            "--force-with-lease=refs/heads/${TARGET_BRANCH}:${EXPECTED_HEAD}" \
            origin "${RESULT_COMMIT}:refs/heads/${TARGET_BRANCH}"
          unset G1_TOKEN auth
