name: G1 PR47 parser repair materializer

on:
  push:
    branches:
      - ops/pr47-parser-repair-20260908
    paths:
      - .github/workflows/g1-pr47-parser-repair-materializer.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact target branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: codex/g1-full-gap-closure-20260907
          fetch-depth: 0
          persist-credentials: true
      - name: Require exact target head
        shell: bash
        run: test "$(git rev-parse HEAD)" = "b8e875d8d01893d894ae0666db9e4efdcc106d59"
      - name: Fetch and execute reviewed repair script
        shell: bash
        run: |
          set -euo pipefail
          git show b416fede3c5c68324e278432e1ad16bdfb464283:.github/scripts/pr47_parser_repair.py > /tmp/pr47_parser_repair.py
          python3 /tmp/pr47_parser_repair.py
          test "$(git diff --name-only | sort)" = $'tools/docs/verify_component_documentation.py\ntools/tests/test_owner_open_broker_component_documentation.py'
          git diff --check
      - name: Run focused fail-closed qualification
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/docs/verify_component_documentation.py tools/tests/test_owner_open_broker_component_documentation.py
          python3 -m unittest tools.tests.test_owner_open_broker_component_documentation -v
          python3 tools/docs/verify_component_documentation.py
          python3 tools/docs/generate_global_docs.py --check
          python3 tools/docs/verify_global_docs.py
          git diff --check
      - name: Publish exact repair with lease
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/docs/verify_component_documentation.py tools/tests/test_owner_open_broker_component_documentation.py
          git commit -m 'fix(docs): require exact maximal inline-code delimiter runs'
          git push origin HEAD:refs/heads/codex/g1-full-gap-closure-20260907 --force-with-lease=refs/heads/codex/g1-full-gap-closure-20260907:b8e875d8d01893d894ae0666db9e4efdcc106d59
