name: owner-open R5 Android Root Linux payload profile

on:
  pull_request:
    paths:
      - "android-integration/owner-open-profile/profile-v2.json"
      - "android-integration/owner-open-profile/generated/owner_open_packages_v2.mk"
      - "android-integration/working-tree/vendor/trillionnium/config/common.mk"
      - "tools/generate-owner-open-android-profile-v3.py"
      - "tools/verify-owner-open-android-profile.py"
      - "tools/verify-owner-open-android-profile-v2.py"
      - "tools/verify-owner-open-android-profile-v3.py"
      - "tools/tests/test_verify_owner_open_android_profile_v3.py"
      - "docs/architecture/2026-08-28-owner-open-rootlinux-payload-packaging.md"
      - "docs/plan/owner-open-r5-batch-e-rootlinux-payload-profile.md"
      - "docs/contracts/owner-open-r5-android-profile-selection-v1.json"
      - ".github/workflows/owner-open-r5-android-profile-v3.yml"
  push:
    branches:
      - main
      - "codex/**"
    paths:
      - "android-integration/owner-open-profile/profile-v2.json"
      - "android-integration/owner-open-profile/generated/owner_open_packages_v2.mk"
      - "android-integration/working-tree/vendor/trillionnium/config/common.mk"
      - "tools/generate-owner-open-android-profile-v3.py"
      - "tools/verify-owner-open-android-profile.py"
      - "tools/verify-owner-open-android-profile-v2.py"
      - "tools/verify-owner-open-android-profile-v3.py"
      - "tools/tests/test_verify_owner_open_android_profile_v3.py"
      - "docs/architecture/2026-08-28-owner-open-rootlinux-payload-packaging.md"
      - "docs/plan/owner-open-r5-batch-e-rootlinux-payload-profile.md"
      - "docs/contracts/owner-open-r5-android-profile-selection-v1.json"
      - ".github/workflows/owner-open-r5-android-profile-v3.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: owner-open-r5-android-profile-v3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rootlinux-payload-profile:
    name: Android Root Linux payload profile and holds
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Parse and compile canonical source
        run: |
          python3 -m json.tool android-integration/owner-open-profile/profile-v2.json >/dev/null
          python3 -m json.tool docs/contracts/owner-open-r5-android-profile-selection-v1.json >/dev/null
          python3 -m py_compile \
            tools/generate-owner-open-android-profile-v3.py \
            tools/verify-owner-open-android-profile.py \
            tools/verify-owner-open-android-profile-v2.py \
            tools/verify-owner-open-android-profile-v3.py \
            tools/verify-owner-open-android-profile-selection.py \
            tools/tests/test_verify_owner_open_android_profile_v3.py \
            tools/tests/test_verify_owner_open_android_profile_selection.py
      - name: Check generated Root Linux payload package fragment
        run: python3 tools/generate-owner-open-android-profile-v3.py --check
      - name: Verify exact Android profile source selection
        run: |
          python3 tools/verify-owner-open-android-profile-selection.py --json \
            | tee owner-open-r5-android-profile-selection.json
      - name: Verify foundation consistency and capture exact holds
        run: |
          python3 tools/verify-owner-open-android-profile-v3.py --json \
            | tee owner-open-r5-android-profile-v3-foundation.json
      - name: Prove the current unbound profile cannot be promoted as strict
        run: |
          set +e
          python3 tools/verify-owner-open-android-profile-v3.py --strict --json \
            > owner-open-r5-android-profile-v3-strict.json 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "current unselected/unbound Root Linux payload profile unexpectedly passed strict verification" >&2
            exit 1
          fi
      - name: Run Root Linux payload profile state-machine tests
        run: |
          python3 -m unittest \
            tools.tests.test_verify_owner_open_android_profile_v3 \
            tools.tests.test_verify_owner_open_android_profile_selection \
            -v 2>&1 | tee owner-open-r5-android-profile-v3-tests.txt
      - uses: actions/upload-artifact@v4
        with:
          name: owner-open-r5-android-profile-v3-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            owner-open-r5-android-profile-selection.json
            owner-open-r5-android-profile-v3-foundation.json
            owner-open-r5-android-profile-v3-strict.json
            owner-open-r5-android-profile-v3-tests.txt
