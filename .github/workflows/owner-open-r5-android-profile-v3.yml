name: owner-open R5 Android Root Linux payload profile

on:
  pull_request:
    paths:
      - "android-integration/owner-open-profile/**"
      - "android-integration/working-tree/vendor/trillionnium/config/common.mk"
      - "android-integration/working-tree/vendor/trillionnium/config/common_owner_open.mk"
      - "android-integration/working-tree/vendor/trillionnium/owner-open/**"
      - "packaging/owner-open-rootfs/rootlinux-supervisor.json"
      - "tools/generate-owner-open-android-profile-v3.py"
      - "tools/verify-owner-open-android-profile.py"
      - "tools/verify-owner-open-android-profile-v2.py"
      - "tools/verify-owner-open-android-profile-v3.py"
      - "tools/verify-owner-open-android-profile-selection.py"
      - "tools/verify-owner-open-android-source-closure.py"
      - "tools/verify-owner-open-android-source-closure-v2.py"
      - "tools/tests/test_verify_owner_open_android_profile_v3.py"
      - "tools/tests/test_verify_owner_open_android_profile_selection.py"
      - "tools/tests/test_verify_owner_open_android_source_closure.py"
      - "tools/tests/test_owner_open_bootstrap_manifest_contract.py"
      - "tools/tests/test_owner_open_ingress_contract.py"
      - "tools/tests/test_owner_open_manifest_naming.py"
      - "tools/tests/test_owner_open_android_client_reconnect.py"
      - "tools/tests/test_owner_open_init_timing.py"
      - "docs/architecture/2026-08-28-owner-open-rootlinux-payload-packaging.md"
      - "docs/plan/owner-open-r5-batch-e-rootlinux-payload-profile.md"
      - "docs/contracts/owner-open-r5-android-profile-selection-v1.json"
      - ".github/workflows/owner-open-r5-android-profile-v3.yml"
  push:
    branches:
      - main
      - "codex/**"
    paths:
      - "android-integration/owner-open-profile/**"
      - "android-integration/working-tree/vendor/trillionnium/config/common.mk"
      - "android-integration/working-tree/vendor/trillionnium/config/common_owner_open.mk"
      - "android-integration/working-tree/vendor/trillionnium/owner-open/**"
      - "packaging/owner-open-rootfs/rootlinux-supervisor.json"
      - "tools/generate-owner-open-android-profile-v3.py"
      - "tools/verify-owner-open-android-profile.py"
      - "tools/verify-owner-open-android-profile-v2.py"
      - "tools/verify-owner-open-android-profile-v3.py"
      - "tools/verify-owner-open-android-profile-selection.py"
      - "tools/verify-owner-open-android-source-closure.py"
      - "tools/verify-owner-open-android-source-closure-v2.py"
      - "tools/tests/test_verify_owner_open_android_profile_v3.py"
      - "tools/tests/test_verify_owner_open_android_profile_selection.py"
      - "tools/tests/test_verify_owner_open_android_source_closure.py"
      - "tools/tests/test_owner_open_bootstrap_manifest_contract.py"
      - "tools/tests/test_owner_open_ingress_contract.py"
      - "tools/tests/test_owner_open_manifest_naming.py"
      - "tools/tests/test_owner_open_android_client_reconnect.py"
      - "tools/tests/test_owner_open_init_timing.py"
      - "docs/architecture/2026-08-28-owner-open-rootlinux-payload-packaging.md"
      - "docs/plan/owner-open-r5-batch-e-rootlinux-payload-profile.md"
      - "docs/contracts/owner-open-r5-android-profile-selection-v1.json"
      - ".github/workflows/owner-open-r5-android-profile-v3.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: owner-open-r5-android-profile-v3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rootlinux-payload-profile:
    name: Android Root Linux payload source closure and external holds
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONWARNINGS: error::ResourceWarning
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact source-head checkout
        env:
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git --no-replace-objects rev-parse HEAD)" = "$SOURCE_HEAD_SHA"
          test -n "$(git --no-replace-objects rev-parse HEAD^{tree})"
          test -z "$(git --no-replace-objects status --porcelain=v1 --untracked-files=all)"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Parse canonical machine documents and compile verifiers
        run: |
          set -euo pipefail
          python3 -m json.tool android-integration/owner-open-profile/profile-v2.json >/dev/null
          python3 -m json.tool android-integration/working-tree/vendor/trillionnium/owner-open/config/profile-v3.json >/dev/null
          python3 -m json.tool packaging/owner-open-rootfs/rootlinux-supervisor.json >/dev/null
          python3 -m json.tool docs/contracts/owner-open-r5-android-profile-selection-v1.json >/dev/null
          python3 -m py_compile \
            tools/generate-owner-open-android-profile-v3.py \
            tools/verify-owner-open-android-profile.py \
            tools/verify-owner-open-android-profile-v2.py \
            tools/verify-owner-open-android-profile-v3.py \
            tools/verify-owner-open-android-profile-selection.py \
            tools/verify-owner-open-android-source-closure.py \
            tools/verify-owner-open-android-source-closure-v2.py \
            tools/tests/test_verify_owner_open_android_profile_v3.py \
            tools/tests/test_verify_owner_open_android_profile_selection.py \
            tools/tests/test_verify_owner_open_android_source_closure.py \
            tools/tests/test_owner_open_bootstrap_manifest_contract.py \
            tools/tests/test_owner_open_ingress_contract.py \
            tools/tests/test_owner_open_manifest_naming.py \
            tools/tests/test_owner_open_android_client_reconnect.py \
            tools/tests/test_owner_open_init_timing.py
      - name: Check generated Root Linux payload package fragment
        run: python3 tools/generate-owner-open-android-profile-v3.py --check
      - name: Verify exact Android profile source selection
        run: |
          set -euo pipefail
          python3 tools/verify-owner-open-android-profile-selection.py --json \
            | tee owner-open-r5-android-profile-selection.json
      - name: Verify complete Android and Root Linux authored source closure
        run: |
          set -euo pipefail
          python3 tools/verify-owner-open-android-source-closure-v2.py --json \
            | tee owner-open-r5-android-source-closure.json
      - name: Verify foundation consistency and capture external holds
        run: |
          set -euo pipefail
          python3 tools/verify-owner-open-android-profile-v3.py --json \
            | tee owner-open-r5-android-profile-v3-foundation.json
      - name: Prove unbuilt source cannot be promoted as strict image evidence
        run: |
          set -euo pipefail
          set +e
          python3 tools/verify-owner-open-android-profile-v3.py --strict --json \
            > owner-open-r5-android-profile-v3-strict.json 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "unselected/unbuilt source unexpectedly passed strict Android verification" >&2
            exit 1
          fi
      - name: Run profile, selection and source-closure regressions
        run: |
          set -euo pipefail
          python3 -m unittest \
            tools.tests.test_verify_owner_open_android_profile_v3 \
            tools.tests.test_verify_owner_open_android_profile_selection \
            tools.tests.test_verify_owner_open_android_source_closure \
            tools.tests.test_owner_open_bootstrap_manifest_contract \
            tools.tests.test_owner_open_ingress_contract \
            tools.tests.test_owner_open_manifest_naming \
            tools.tests.test_owner_open_android_client_reconnect \
            tools.tests.test_owner_open_init_timing \
            -v 2>&1 | tee owner-open-r5-android-source-tests.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: owner-open-r5-android-source-closure-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            owner-open-r5-android-profile-selection.json
            owner-open-r5-android-source-closure.json
            owner-open-r5-android-profile-v3-foundation.json
            owner-open-r5-android-profile-v3-strict.json
            owner-open-r5-android-source-tests.txt
