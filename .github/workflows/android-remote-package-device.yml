name: Android desktop build and real-device test

# This repository is public.  A persistent self-hosted machine must never
# execute source from a pull request.  The only automatic trigger is a commit
# already merged into protected main; workflow_dispatch is intentionally
# admitted only when the selected ref is main (see the job condition below).
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # The handset and the external Android checkout are single-writer resources.
  group: android-desktop-build-device-${{ github.repository }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  # The control checkout, Android checkout, OUT_DIR, cache, temporary files,
  # APKs, receipts, and logs all live below this external mount.  The runner's
  # small default workspace is deliberately not used for source or builds.
  TRILLINNIUM_EXTERNAL_ROOT: /data/toshiba-dev/TrillionniumOS
  TRILLINNIUM_ANDROID_ROOT: /data/toshiba-dev/TrillionniumOS/rootfs/home/qian-qi/android/lineage-fogos
  TRILLINNIUM_RUN_ROOT: /data/toshiba-dev/TrillionniumOS/.android-ci-runs/${{ github.run_id }}
  TRILLINNIUM_CONTROL_ROOT: /data/toshiba-dev/TrillionniumOS/.android-ci-runs/${{ github.run_id }}/control
  TRILLINNIUM_LOCK: /data/toshiba-dev/TrillionniumOS/.android-ci-desktop.lock
  TRILLINNIUM_DEVICE_SERIAL: ${{ vars.TRILLINNIUM_DEVICE_SERIAL }}
  TRILLINNIUM_ADB_PATH: ${{ vars.TRILLINNIUM_ADB_PATH || '/opt/android-sdk/platform-tools/adb' }}
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  desktop-build-device-test:
    name: External-disk Android build → APK → device test
    if: ${{ github.repository == 'TrillionniumFoundation/trillionnium-os' && github.ref == 'refs/heads/main' }}
    # The desktop label is intentionally required.  Do not replace it with
    # generic real-device: ROG is in the same runner group but has no adb/phone.
    runs-on:
      group: trillionnium-real-devices
      labels:
        - self-hosted
        - linux
        - x64
        - desktop
    environment:
      name: android-real-device
    timeout-minutes: 2160
    steps:
      - name: Prepare exact control commit on the external disk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          umask 077
          export HOME="$TRILLINNIUM_RUN_ROOT/home"
          export TMPDIR="$TRILLINNIUM_RUN_ROOT/tmp"
          export TMP="$TMPDIR"
          export TEMP="$TMPDIR"
          export XDG_CACHE_HOME="$TRILLINNIUM_RUN_ROOT/cache"
          mkdir -p "$TRILLINNIUM_RUN_ROOT" "$TMPDIR" "$HOME" "$XDG_CACHE_HOME"
          test "$(findmnt -no UUID -T "$TRILLINNIUM_EXTERNAL_ROOT")" = "63df6e1a-baf3-4680-8bbb-8019fb025341"
          test "$(findmnt -no UUID -T "$TRILLINNIUM_ANDROID_ROOT")" = "63df6e1a-baf3-4680-8bbb-8019fb025341"
          test ! -e "$TRILLINNIUM_CONTROL_ROOT"
          export GIT_CONFIG_NOSYSTEM=1
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.extraHeader
          export GIT_CONFIG_VALUE_0="Authorization: Bearer ${GITHUB_TOKEN}"
          git clone --no-checkout --no-tags --filter=blob:none \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$TRILLINNIUM_CONTROL_ROOT"
          git -C "$TRILLINNIUM_CONTROL_ROOT" fetch --depth=1 origin "$GITHUB_SHA"
          git -C "$TRILLINNIUM_CONTROL_ROOT" checkout --detach "$GITHUB_SHA"
          test "$(git -C "$TRILLINNIUM_CONTROL_ROOT" rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git -C "$TRILLINNIUM_CONTROL_ROOT" status --porcelain=v1 --untracked-files=all)"
          {
            printf 'source_commit=%s\n' "$(git -C "$TRILLINNIUM_CONTROL_ROOT" rev-parse HEAD)"
            printf 'source_tree=%s\n' "$(git -C "$TRILLINNIUM_CONTROL_ROOT" rev-parse HEAD^{tree})"
            printf 'control_root=%s\n' "$TRILLINNIUM_CONTROL_ROOT"
            printf 'android_root=%s\n' "$TRILLINNIUM_ANDROID_ROOT"
            printf 'external_uuid=%s\n' "$(findmnt -no UUID -T "$TRILLINNIUM_EXTERNAL_ROOT")"
          } | tee "$TRILLINNIUM_RUN_ROOT/bootstrap.txt"

      - name: Build, verify, install, and function-test on the desktop
        run: |
          set -Eeuo pipefail
          umask 077
          export HOME="$TRILLINNIUM_RUN_ROOT/home"
          export TMPDIR="$TRILLINNIUM_RUN_ROOT/tmp"
          export TMP="$TMPDIR"
          export TEMP="$TMPDIR"
          export XDG_CACHE_HOME="$TRILLINNIUM_RUN_ROOT/cache"
          export CCACHE_DIR="$TRILLINNIUM_RUN_ROOT/ccache"
          mkdir -p "$HOME" "$TMPDIR" "$XDG_CACHE_HOME" "$CCACHE_DIR"
          python3 "$TRILLINNIUM_CONTROL_ROOT/tools/android_ci_desktop_build.py" run \
            --external-root "$TRILLINNIUM_EXTERNAL_ROOT" \
            --android-root "$TRILLINNIUM_ANDROID_ROOT" \
            --control-root "$TRILLINNIUM_CONTROL_ROOT" \
            --run-root "$TRILLINNIUM_RUN_ROOT" \
            --lock-path "$TRILLINNIUM_LOCK" \
            --adb "$TRILLINNIUM_ADB_PATH" \
            --serial "$TRILLINNIUM_DEVICE_SERIAL" \
            --source-commit "$GITHUB_SHA" \
            --min-free-gib 400 \
            --jobs 8 \
            --build-timeout-minutes 2160

      - name: Upload external-disk receipts and bounded logs
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-desktop-build-device-${{ github.run_id }}
          path: /data/toshiba-dev/TrillionniumOS/.android-ci-runs/${{ github.run_id }}/
          if-no-files-found: warn
          retention-days: 14
