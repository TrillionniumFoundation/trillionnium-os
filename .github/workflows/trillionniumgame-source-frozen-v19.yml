name: TrillionniumGame source-frozen adapters v19

on:
  push:
    branches: [ci/trillionniumgame-exact-head-relay-v1]
    paths: ['.github/workflows/trillionniumgame-source-frozen-v19.yml']
  workflow_dispatch:

permissions:
  contents: read

env:
  TARGET_REPOSITORY: TrillionniumFoundation/TrillionniumGame
  EXPECTED_HEAD: df5cff4eebbc5d8e79be40d2dd646ca50b02d463

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ env.TARGET_REPOSITORY }}
          ref: ${{ env.EXPECTED_HEAD }}
          path: source
          persist-credentials: false
      - name: Install exact Rust
        run: |
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.85.1
      - name: Add explicit source-frozen policies
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          for directory in \
            crates/trnm-persistence-pg \
            crates/trnm-token-jwt-adapter \
            crates/trnm-token-jwt-adapter-gate \
            crates/trnm-token-jwt-adapter-gate-v2; do
            cat > "$directory/rustfmt.toml" <<'EOF'
          disable_all_formatting = true
          EOF
          done
          cargo generate-lockfile
      - name: Validate root workspace
        working-directory: source
        run: |
          set -o pipefail
          cargo fmt --all -- --check
          cargo test --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Validate isolated adapters
        working-directory: source
        run: |
          set -o pipefail
          for manifest in \
            crates/trnm-token-jwt-adapter/Cargo.toml \
            crates/trnm-token-jwt-adapter-gate/Cargo.toml \
            crates/trnm-token-jwt-adapter-gate-v2/Cargo.toml; do
            cargo fmt --manifest-path "$manifest" -- --check
            cargo test --manifest-path "$manifest" --all-targets --locked
            cargo clippy --manifest-path "$manifest" --all-targets --locked -- -D warnings
          done
      - name: Verify source freeze is narrow and explicit
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          test "$(find crates -name rustfmt.toml | wc -l)" -eq 4
          find crates -name rustfmt.toml -print0 | sort -z | xargs -0 sha256sum
