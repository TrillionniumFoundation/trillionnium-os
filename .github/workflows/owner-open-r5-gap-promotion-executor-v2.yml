name: one-shot owner-open R5 exact-source gap promotion executor v2

on:
  push:
    branches:
      - codex/owner-open-r5-gap-closure-20260829
    paths:
      - ".github/workflows/owner-open-r5-gap-promotion-executor-v2.yml"

permissions:
  contents: write

jobs:
  promote-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/owner-open-r5-gap-closure-20260829
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Execute the evidence-supported promotion script
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path(
              ".github/workflows/owner-open-r5-gap-promotion-one-shot.yml"
          ).read_text(encoding="utf-8")
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = source.find(start_marker)
          if start < 0:
              raise SystemExit("promotion script start marker is absent")
          start += len(start_marker)
          end = source.find(end_marker, start)
          if end < 0:
              raise SystemExit("promotion script end marker is absent")
          raw = source[start:end]
          script = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in raw.splitlines()
          )
          exec(
              compile(
                  script,
                  ".github/workflows/owner-open-r5-gap-promotion-one-shot.yml#script",
                  "exec",
              ),
              {},
          )
          PY
      - name: Align L1 source-closure verifier semantics
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          verifier = Path("tools/verify-owner-open-r5.py")
          text = verifier.read_text(encoding="utf-8")
          old = '''        if state == "CLOSED":
                      closed.add(identifier)
                      evidence = item.get("evidence")
                      report.check(
                          isinstance(evidence, list) and bool(evidence),
                          f"closed R5 gap has no evidence: {identifier}",
                      )
          '''
          old = "\n".join(line[10:] if line.startswith("          ") else line for line in old.splitlines()) + "\n"
          new = '''        if state == "CLOSED":
                      closed.add(identifier)
                      if level == "L1":
                          report.check(
                              isinstance(item.get("source_evidence"), dict),
                              f"closed L1 R5 gap has no source evidence: {identifier}",
                          )
                      else:
                          evidence = item.get("evidence")
                          report.check(
                              isinstance(evidence, list) and bool(evidence),
                              f"closed R5 gap has no evidence: {identifier}",
                          )
          '''
          new = "\n".join(line[10:] if line.startswith("          ") else line for line in new.splitlines()) + "\n"
          if new not in text:
              if text.count(old) != 1:
                  raise SystemExit(
                      f"closed-gap verifier anchor drifted: observed {text.count(old)}"
                  )
              verifier.write_text(text.replace(old, new), encoding="utf-8")

          test = Path("tools/tests/test_verify_owner_open_r5_gap_closure.py")
          value = test.read_text(encoding="utf-8")
          marker = "    def test_l1_source_closed_gap_accepts_source_evidence(self) -> None:\n"
          if marker not in value:
              anchor = '''    def test_external_lane_cannot_close_without_real_evidence(self) -> None:
          '''
              addition = '''    def test_l1_source_closed_gap_accepts_source_evidence(self) -> None:
                      gap = copy.deepcopy(self.gap)
                      gap["gaps"][0]["status"] = "CLOSED"
                      gap["gaps"][0]["source_evidence"] = {}
                      report = self.verify(gap=gap)
                      self.assertEqual(report.errors, [])

                  def test_external_lane_cannot_close_without_real_evidence(self) -> None:
          '''
              addition = "\n".join(
                  line[10:] if line.startswith("          ") else line
                  for line in addition.splitlines()
              ) + "\n"
              if value.count(anchor) != 1:
                  raise SystemExit(
                      f"L1 closure test anchor drifted: observed {value.count(anchor)}"
                  )
              test.write_text(value.replace(anchor, addition), encoding="utf-8")

          status_path = Path("docs/status/owner-open-r5-status.json")
          status = json.loads(status_path.read_text(encoding="utf-8"))
          for item in status.get("source_closed_pending_evidence", []):
              issue = item.get("issue")
              if isinstance(issue, list) and len(issue) == 1:
                  item["issue"] = issue[0]
          status_path.write_text(
              json.dumps(status, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Verify promoted truth without overclaim
        run: |
          set -euo pipefail
          python3 -m json.tool docs/status/owner-open-r5-gap-closure.json >/dev/null
          python3 -m json.tool docs/status/owner-open-r5-status.json >/dev/null
          python3 tools/verify-owner-open-r5.py --json | tee /tmp/r5.json
          python3 tools/verify-owner-open-r5-gap-evidence.py --json | tee /tmp/r5-gap.json
          python3 -m unittest \
            tools.tests.test_verify_owner_open_r5_gap_closure \
            tools.tests.test_verify_owner_open_r5_gap_evidence \
            tools.tests.test_generate_owner_open_l1_candidate \
            -v
          python3 - <<'PY'
          import json
          from pathlib import Path
          gaps = json.loads(Path('docs/status/owner-open-r5-gap-closure.json').read_text())
          states = {item['id']: item['status'] for item in gaps['gaps']}
          assert states['R5-GAP-JOB-ADMISSION-001'] == 'CLOSED'
          assert states['R5-GAP-GOVERNANCE-001'] == 'EXTERNAL_HOLD'
          assert sum(value == 'SOURCE_CLOSED_PENDING_EVIDENCE' for value in states.values()) == 5
          assert sum(value == 'EXTERNAL_HOLD' for value in states.values()) == 7
          status = json.loads(Path('docs/status/owner-open-r5-status.json').read_text())
          assert status['zero_gap'] is False
          assert status['public_release'] is False
          assert status['automatic_redispatch'] is False
          assert all(isinstance(item['issue'], int) for item in status['source_closed_pending_evidence'])
          PY
          git diff --check
      - name: Commit evidence-supported promotion
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            tools/verify-owner-open-r5.py \
            tools/tests/test_verify_owner_open_r5_gap_closure.py \
            docs/status/owner-open-r5-gap-closure.json \
            docs/status/owner-open-r5-status.json \
            docs/status/owner-open-r5-source-closure-evidence-2026-08-29.md \
            docs/OWNER_OPEN_R5_START_HERE.md \
            docs/README.md \
            docs/TRILLIONNIUM_OWNER_OPEN_R5_EXECUTION_PLAN.md
          git diff --cached --check
          git commit -m "docs(r5): bind exact-source closure and remaining holds"
          git push origin HEAD:codex/owner-open-r5-gap-closure-20260829
