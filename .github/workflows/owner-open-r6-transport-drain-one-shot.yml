name: one-shot owner-open R6 transport drain convergence repair

on:
  push:
    branches:
      - codex/owner-open-r5-gap-closure-20260829
    paths:
      - ".github/workflows/owner-open-r6-transport-drain-one-shot.yml"

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: codex/owner-open-r5-gap-closure-20260829

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"

      - name: Validate one-shot staging boundary
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          actual="$(git diff --name-only "${GITHUB_SHA}^" "$GITHUB_SHA" | sort)"
          expected=".github/workflows/owner-open-r6-transport-drain-one-shot.yml"
          test "$actual" = "$expected"

      - name: Install locked Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install 1.93.0 \
            --profile minimal \
            --component rustfmt \
            --component clippy
          rustup default 1.93.0
          rustc --version
          cargo --version

      - name: Apply ordered core drain and descendant cleanup repair
        run: |
          set -euo pipefail
          python3 - <<'PY'
