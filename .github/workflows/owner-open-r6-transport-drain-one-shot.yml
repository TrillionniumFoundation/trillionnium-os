name: one-shot owner-open R6 transport drain convergence repair

on:
  push:
    branches:
      - codex/owner-open-r5-gap-closure-20260829
    paths:
      - ".github/workflows/owner-open-r6-transport-drain-one-shot.yml"

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: codex/owner-open-r5-gap-closure-20260829

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"

      - name: Validate one-shot staging boundary
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          actual="$(git diff --name-only "${GITHUB_SHA}^" "$GITHUB_SHA" | sort)"
          expected=".github/workflows/owner-open-r6-transport-drain-one-shot.yml"
          test "$actual" = "$expected"
          test -f tools/patch-owner-open-r6-transport-drain.py

      - name: Install locked Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install 1.93.0 \
            --profile minimal \
            --component rustfmt \
            --component clippy
          rustup default 1.93.0
          rustc --version
          cargo --version

      - name: Apply ordered core drain repair
        run: |
          set -euo pipefail
          python3 tools/patch-owner-open-r6-transport-drain.py
          cargo fmt --all
          python3 -m unittest \
            tools.tests.test_owner_open_transport_core_drain -v
          git diff --check

      - name: Stress final-frame drain and descendant cleanup
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            echo "transport drain attempt ${attempt}/12"
            cargo test --locked \
              -p trillionnium-owner-open-host \
              --test r5_transport_core_drain \
              transport_drains_the_final_core_frame_and_reaps_the_descendant_group \
              -- --exact
          done

      - name: Remove transient write surface
        run: |
          set -euo pipefail
          rm -f .github/workflows/owner-open-r6-transport-drain-one-shot.yml
          rm -f tools/patch-owner-open-r6-transport-drain.py

      - name: Verify package and canonical boundaries
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo test --locked -p trillionnium-owner-open-host --all-targets
          cargo clippy --locked \
            -p trillionnium-owner-open-host \
            --all-targets \
            -- -D warnings
          python3 tools/verify-owner-open-r5-workflow-boundaries.py --json
          python3 tools/verify-owner-open-r5.py --json
          python3 tools/verify-owner-open-r5-gap-evidence.py --json
          git diff --check

      - name: Commit the source repair
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          actual="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' \
            .github/workflows/owner-open-r6-transport-drain-one-shot.yml \
            apps/trillionnium-owner-open-host/src/bin/r5_transport_host/entry/imports.rs \
            apps/trillionnium-owner-open-host/src/bin/r5_transport_host/entry/state.rs \
            apps/trillionnium-owner-open-host/src/bin/r5_transport_host/process/io.rs \
            apps/trillionnium-owner-open-host/src/bin/r5_transport_host/process/run.rs \
            apps/trillionnium-owner-open-host/tests/r5_transport_core_drain.rs \
            tools/patch-owner-open-r6-transport-drain.py \
            tools/tests/test_owner_open_transport_core_drain.py | sort)"
          test "$actual" = "$expected"
          git commit -m "fix(host): drain core frames before transport exit"
          git push origin HEAD:codex/owner-open-r5-gap-closure-20260829
