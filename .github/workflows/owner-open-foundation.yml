name: owner-open foundation

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "apps/trillionnium-owner-open-host/**"
      - "Cargo.lock"
      - "crates/trillionnium-owner-open-types/**"
      - "docs/TRILLIONNIUM_OWNER_OPEN_R4_EXECUTION_PLAN.md"
      - "docs/status/owner-open-r4-*"
      - "docs/security/owner-open-threat-model.md"
      - "docs/protocols/owner-open-direct-agent-host-v1.md"
      - "docs/architecture/2026-08-27-owner-open-raw-adb-transparent-host-relay.md"
      - "docs/contracts/owner-open-forbidden-default-graph-v1.json"
      - "docs/contracts/codex-sovereign-direct-tools-v1.json"
      - "schemas/codex-sovereign-direct-tools.schema.json"
      - "tools/generate-owner-open-types.py"
      - "tools/owner-open-adb-relay-bootstrap.py"
      - "tools/verify-owner-open-foundation.py"
      - "tools/tests/**"
      - ".github/workflows/owner-open-foundation.yml"
  push:
    branches:
      - main
      - "codex/**"
    paths:
      - "Cargo.toml"
      - "apps/trillionnium-owner-open-host/**"
      - "Cargo.lock"
      - "crates/trillionnium-owner-open-types/**"
      - "docs/TRILLIONNIUM_OWNER_OPEN_R4_EXECUTION_PLAN.md"
      - "docs/status/owner-open-r4-*"
      - "docs/security/owner-open-threat-model.md"
      - "docs/protocols/owner-open-direct-agent-host-v1.md"
      - "docs/architecture/2026-08-27-owner-open-raw-adb-transparent-host-relay.md"
      - "docs/contracts/owner-open-forbidden-default-graph-v1.json"
      - "docs/contracts/codex-sovereign-direct-tools-v1.json"
      - "schemas/codex-sovereign-direct-tools.schema.json"
      - "tools/generate-owner-open-types.py"
      - "tools/owner-open-adb-relay-bootstrap.py"
      - "tools/verify-owner-open-foundation.py"
      - "tools/tests/**"
      - ".github/workflows/owner-open-foundation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: owner-open-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    name: L0-L2 owner-open foundation
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact source-head checkout
        env:
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git --no-replace-objects rev-parse HEAD)" = "$SOURCE_HEAD_SHA"
          test -n "$(git --no-replace-objects rev-parse HEAD^{tree})"
          test -z "$(git --no-replace-objects status --porcelain=v1 --untracked-files=all)"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Set up Rust 1.93
        uses: dtolnay/rust-toolchain@d8dfd7155fea72af4ad34a8fe97364d210e2d020
        with:
          toolchain: "1.93.0"
          components: rustfmt

      - name: Validate JSON and Python syntax
        run: |
          python3 -m json.tool docs/status/owner-open-r4-status.json >/dev/null
          python3 -m json.tool docs/contracts/owner-open-forbidden-default-graph-v1.json >/dev/null
          python3 -m json.tool schemas/codex-sovereign-direct-tools.schema.json >/dev/null
          python3 -m py_compile \
            tools/generate-owner-open-types.py \
            tools/owner-open-adb-relay-bootstrap.py \
            tools/verify-owner-open-foundation.py \
            tools/tests/test_owner_open_adb_relay_bootstrap.py \
            tools/tests/test_verify_owner_open_foundation.py

      - name: Verify generated codec constants
        run: python3 tools/generate-owner-open-types.py --check

      - name: Verify owner-open default graph and status
        run: python3 tools/verify-owner-open-foundation.py --json | tee owner-open-foundation-report.json

      - name: Run Python foundation and ADB relay tests
        run: python3 -m unittest discover -s tools/tests -p 'test_*.py' -v

      - name: Check isolated Rust formatting
        run: |
          cargo fmt --package trillionnium-owner-open-types -- --check
          cargo fmt --package trillionnium-owner-open-host -- --check

      - name: Test isolated owner-open packages without mutating the lock
        run: |
          test -s Cargo.lock
          cp Cargo.lock owner-open-reviewed-Cargo.lock
          cargo test --locked --package trillionnium-owner-open-types
          cargo test --locked --package trillionnium-owner-open-host
          cmp --silent Cargo.lock owner-open-reviewed-Cargo.lock
          git --no-replace-objects diff --exit-code -- Cargo.lock

      - name: Capture Cargo graph and generated lock
        run: |
          cargo metadata --locked --format-version 1 > owner-open-cargo-metadata.json
          cargo tree --locked -e features -p trillionnium-owner-open-types > owner-open-cargo-tree.txt
          cargo tree --locked -e features -p trillionnium-owner-open-host >> owner-open-cargo-tree.txt
          git --no-replace-objects diff -- Cargo.lock > owner-open-cargo-lock.patch
          test ! -s owner-open-cargo-lock.patch

      - name: Upload L0-L2 foundation evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: owner-open-foundation-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            Cargo.lock
            owner-open-foundation-report.json
            owner-open-cargo-metadata.json
            owner-open-cargo-tree.txt
            owner-open-cargo-lock.patch
