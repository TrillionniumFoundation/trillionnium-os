name: Owner-Open R6 apply main protection (ops)

on:
  push:
    branches:
      - codex/owner-open-r6-governance-control-plane-20260830
    paths:
      - .github/workflows/owner-open-r6-apply-main-protection-ops.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: owner-open-r6-main-protection
  cancel-in-progress: false

jobs:
  apply-and-verify:
    name: Apply and verify exact Owner-Open main protection
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ADMIN_TOKEN: ${{ secrets.OWNER_OPEN_R5_ADMIN_TOKEN }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - name: Require dedicated Administration token
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${ADMIN_TOKEN:-}" ]; then
            echo '::error::OWNER_OPEN_R5_ADMIN_TOKEN is not configured. Refusing to fall back to GITHUB_TOKEN.'
            exit 78
          fi

      - name: Apply exact main branch protection
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          api="https://api.github.com/repos/${REPOSITORY}/branches/main/protection"
          payload="$RUNNER_TEMP/main-protection-request.json"
          response="$RUNNER_TEMP/main-protection-response.json"
          jq -n '{
            required_status_checks: {
              strict: true,
              contexts: [
                "L1 graph, documentation, broker and MCP source closure",
                "L1 Rust 1.93 selected Host, job, flow and recovery closure",
                "L1 exact-source-head aggregate candidate",
                "L1 owner-open product entrypoint source contract"
              ]
            },
            enforce_admins: true,
            required_pull_request_reviews: {
              dismiss_stale_reviews: true,
              require_code_owner_reviews: false,
              required_approving_review_count: 1,
              require_last_push_approval: true
            },
            restrictions: null,
            required_conversation_resolution: true,
            required_linear_history: false,
            allow_force_pushes: false,
            allow_deletions: false,
            block_creations: false,
            lock_branch: false,
            allow_fork_syncing: true
          }' > "$payload"
          curl --fail-with-body --silent --show-error --location \
            --request PUT \
            --header "Authorization: Bearer ${ADMIN_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --data-binary "@${payload}" \
            "$api" > "$response"
          jq -e . "$response" >/dev/null

      - name: Verify live control-plane state
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          api="https://api.github.com/repos/${REPOSITORY}"
          header=(
            --header "Authorization: Bearer ${ADMIN_TOKEN}"
            --header 'Accept: application/vnd.github+json'
            --header 'X-GitHub-Api-Version: 2022-11-28'
          )
          curl --fail-with-body --silent --show-error --location \
            "${header[@]}" "$api/branches/main" > "$RUNNER_TEMP/main-branch.json"
          curl --fail-with-body --silent --show-error --location \
            "${header[@]}" "$api/branches/main/protection" > "$RUNNER_TEMP/main-protection.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          temp = Path(os.environ['RUNNER_TEMP'])
          branch = json.loads((temp / 'main-branch.json').read_text())
          protection = json.loads((temp / 'main-protection.json').read_text())
          expected = {
              'L1 graph, documentation, broker and MCP source closure',
              'L1 Rust 1.93 selected Host, job, flow and recovery closure',
              'L1 exact-source-head aggregate candidate',
              'L1 owner-open product entrypoint source contract',
          }
          actual = set(protection['required_status_checks']['contexts'])
          reviews = protection['required_pull_request_reviews']
          checks = {
              'branch_protected': branch.get('protected') is True,
              'strict_status_checks': protection['required_status_checks'].get('strict') is True,
              'required_contexts_exact': actual == expected,
              'minimum_one_approval': reviews.get('required_approving_review_count', 0) >= 1,
              'dismiss_stale_reviews': reviews.get('dismiss_stale_reviews') is True,
              'require_last_push_approval': reviews.get('require_last_push_approval') is True,
              'enforce_admins': protection.get('enforce_admins', {}).get('enabled') is True,
              'conversation_resolution': protection.get('required_conversation_resolution', {}).get('enabled') is True,
              'force_push_blocked': protection.get('allow_force_pushes', {}).get('enabled') is False,
              'deletion_blocked': protection.get('allow_deletions', {}).get('enabled') is False,
          }
          summary = {
              'schema': 'org.trillionnium.owner-open-r6.main-protection-ops.v1',
              'repository': os.environ['REPOSITORY'],
              'branch': 'main',
              'checks': checks,
              'ready': all(checks.values()),
          }
          (temp / 'main-protection-verification.json').write_text(
              json.dumps(summary, indent=2, sort_keys=True) + '\n'
          )
          print(json.dumps(summary, indent=2, sort_keys=True))
          if not summary['ready']:
              raise SystemExit('live main protection differs from the exact Owner-Open policy')
          PY

      - name: Upload non-secret governance verification
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: owner-open-r6-main-protection-verification-${{ github.run_id }}
          path: ${{ runner.temp }}/main-protection-verification.json
          if-no-files-found: error
          retention-days: 30
