name: one-shot owner-open R5 exact-source evidence promotion

on:
  push:
    branches:
      - codex/owner-open-r5-gap-closure-20260829
    paths:
      - ".github/workflows/owner-open-r5-60c6-source-evidence-promotion-one-shot.yml"

permissions:
  contents: write

jobs:
  promote:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: codex/owner-open-r5-gap-closure-20260829

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"

      - name: Apply state-only exact-source binding
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          actual_staging="$(git diff --name-only 60c6d1581d2ef2a17cb8515bc27f6dd038f9d5b6..HEAD | sort)"
          expected_staging="$(printf '%s\n' \
            .github/workflows/owner-open-r5-60c6-source-evidence-promotion-one-shot.yml \
            tools/patch-owner-open-r5-60c6-promotion.py | sort)"
          test "$actual_staging" = "$expected_staging"
          PROMOTION_RUN_ID="$GITHUB_RUN_ID" \
            python3 tools/patch-owner-open-r5-60c6-promotion.py
          rm -f \
            .github/workflows/owner-open-r5-60c6-source-evidence-promotion-one-shot.yml \
            tools/patch-owner-open-r5-60c6-promotion.py
          git diff --check

      - name: Verify canonical truth and promotion boundaries
        run: |
          set -euo pipefail
          python3 -m json.tool docs/status/owner-open-r5-gap-closure.json >/dev/null
          python3 -m json.tool docs/status/owner-open-r5-status.json >/dev/null
          python3 tools/verify-owner-open-r5-workflow-boundaries.py --json
          python3 tools/verify-owner-open-r5.py --json
          python3 tools/verify-owner-open-r5-gap-evidence.py --json
          python3 -m unittest \
            tools.tests.test_verify_owner_open_r5_gap_closure \
            tools.tests.test_verify_owner_open_r5_gap_evidence \
            tools.tests.test_generate_owner_open_l1_candidate \
            tools.tests.test_generate_owner_open_r5_resume_packet \
            tools.tests.test_promote_owner_open_r5_evidence \
            tools.tests.test_verify_owner_open_r5_workflow_boundaries \
            -v
          git diff --check

      - name: Commit state-only exact-source promotion
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          actual="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' \
            .github/workflows/owner-open-r5-60c6-source-evidence-promotion-one-shot.yml \
            docs/OWNER_OPEN_R5_START_HERE.md \
            docs/TRILLIONNIUM_OWNER_OPEN_R5_EXECUTION_PLAN.md \
            docs/status/owner-open-r5-gap-closure.json \
            docs/status/owner-open-r5-source-closure-evidence-2026-08-29.md \
            docs/status/owner-open-r5-status.json \
            tools/patch-owner-open-r5-60c6-promotion.py | sort)"
          test "$actual" = "$expected"
          git commit -m "docs(r5): bind exact L1 source evidence"
          git push origin HEAD:codex/owner-open-r5-gap-closure-20260829
