name: Ops telemetry contract regeneration

on:
  push:
    branches:
      - "ops/telemetry-contract-regenerate-20260912"

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: true
      - name: Regenerate executable module contracts
        run: |
          set -euo pipefail
          python3 tools/contracts/generate_module_contracts.py --write
          git diff --binary -- . ':!.github/workflows/ops-telemetry-contract-regenerate.yml' > "${RUNNER_TEMP}/generated.patch"
          git diff --name-only -- . ':!.github/workflows/ops-telemetry-contract-regenerate.yml' > "${RUNNER_TEMP}/generated.paths"
          test -s "${RUNNER_TEMP}/generated.patch"
          cat "${RUNNER_TEMP}/generated.paths"
      - name: Commit generated delta on ops branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/machine/module-contract-catalog.v1.json schemas/modules/telemetry/compatibility.json tools/contracts/module-contracts.lock.json
          git commit -m 'ops: materialize telemetry generated contract delta'
          git push origin HEAD:refs/heads/ops/telemetry-contract-regenerate-20260912
      - name: Upload generated delta
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: telemetry-contract-regenerated-${{ github.sha }}
          if-no-files-found: error
          retention-days: 3
          path: |
            ${{ runner.temp }}/generated.patch
            ${{ runner.temp }}/generated.paths
