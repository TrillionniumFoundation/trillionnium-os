name: ChatGPT retire superseded PR63 controllers

on:
  push:
    branches:
      - ops/chatgpt-source-export-20260908

permissions:
  contents: write

concurrency:
  group: chatgpt-control-pr63-cleanup
  cancel-in-progress: true

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out control branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ops/chatgpt-source-export-20260908
          persist-credentials: true
      - name: Remove obsolete export and broken repair workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Qian QI'
          git config user.email '102159240+ProfHepta@users.noreply.github.com'
          git rm -f --ignore-unmatch \
            .github/workflows/chatgpt-pr63-source-export.yml \
            .github/workflows/chatgpt-source-export.yml \
            .github/workflows/chatgpt-pr63-methodology-repair.yml \
            .github/workflows/chatgpt-pr63-methodology-repair-v2.yml \
            .github/workflows/chatgpt-control-pr63-cleanup.yml
          git diff --cached --quiet && exit 0
          git commit -m 'ops: retire superseded PR63 control workflows'
          git push origin HEAD:ops/chatgpt-source-export-20260908
