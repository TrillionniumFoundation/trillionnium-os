name: G1 materialize registry sharding v2

on:
  push:
    branches:
      - codex/g1-gap-closure-r1-20260831
    paths:
      - .github/workflows/g1-materialize-registry-sharding-v2.yml

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: codex/g1-gap-closure-r1-20260831
      - uses: dtolnay/rust-toolchain@d8dfd7155fea72af4ad34a8fe97364d210e2d020
        with:
          toolchain: "1.93.0"
          components: rustfmt,clippy
      - name: Recover the reviewed registry patch and fix deterministic shard selection
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, gzip, re
          from pathlib import Path
          workflow = Path('.github/workflows/g1-materialize-registry-sharding.yml').read_text()
          match = re.search(r'^\s*PATCH_GZ_B64:\s*(\S+)\s*$', workflow, re.MULTILINE)
          if match is None:
              raise SystemExit('embedded registry patch is missing')
          Path('/tmp/registry-sharding.patch').write_bytes(gzip.decompress(base64.b64decode(match.group(1))))
          manager = Path('crates/trillionnium-owner-open-job-runtime/src/manager.rs')
          source = manager.read_text()
          old = '''        let key_a = key("job-a");
                  let key_b = key("job-b");
          '''
          new = '''        let key_a = key("job-a");
                  let shard_a = start_shard_index(&key_a);
                  let key_b = (0_u32..10_000)
                      .map(|index| key(&format!("job-b-{index}")))
                      .find(|candidate| start_shard_index(candidate) != shard_a)
                      .expect("at least one deterministic job key must map to another start shard");
          '''
          if old not in source:
              raise SystemExit('job shard test preimage changed')
          manager.write_text(source.replace(old, new, 1))
          PY
          git apply --index /tmp/registry-sharding.patch
          git add crates/trillionnium-owner-open-job-runtime/src/manager.rs
          cargo fmt --all
          cargo test --locked -p trillionnium-owner-open-call-registry --all-targets
          cargo test --locked -p trillionnium-owner-open-job-registry --all-targets
          cargo test --locked -p trillionnium-owner-open-job-runtime --all-targets
          cargo clippy --locked -p trillionnium-owner-open-call-registry --all-targets -- -D warnings
          cargo clippy --locked -p trillionnium-owner-open-job-registry --all-targets -- -D warnings
          cargo clippy --locked -p trillionnium-owner-open-job-runtime --all-targets -- -D warnings
      - name: Commit verified materialization
        run: |
          set -euo pipefail
          rm .github/workflows/g1-materialize-registry-sharding.yml
          rm .github/workflows/g1-materialize-registry-sharding-v2.yml
          git add -A
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "feat(g1): shard call and job registries" -m "Use a stable 64-way shard function with global bounded entry accounting and atomic generation allocation, preserving per-key linearity while allowing unrelated keys to progress independently." -m "Signed-off-by: OpenAI Codex <noreply@openai.com>"
          git push origin HEAD:codex/g1-gap-closure-r1-20260831
