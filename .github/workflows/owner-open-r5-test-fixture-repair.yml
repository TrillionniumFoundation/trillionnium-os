name: one-shot owner-open R5 job test fixture repair

on:
  push:
    branches:
      - codex/owner-open-r5-gap-closure-20260829
    paths:
      - ".github/workflows/owner-open-r5-test-fixture-repair.yml"

permissions:
  contents: write

jobs:
  repair-format-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/owner-open-r5-gap-closure-20260829
      - uses: dtolnay/rust-toolchain@1.93.0
        with:
          components: rustfmt
      - name: Replace invalid non-hex request-digest fixture seeds
        run: |
          set -euo pipefail
          test_file=crates/trillionnium-owner-open-job-runtime/tests/runtime.rs
          sed -i \
            -e "s/request('g', \"pipe\")/request('a', \"pipe\")/" \
            -e "s/request('h', \"pipe\")/request('b', \"pipe\")/" \
            -e "s/request('i', \"pipe\")/request('c', \"pipe\")/" \
            -e "s/request('j', \"pipe\")/request('d', \"pipe\")/" \
            -e "s/request('k', \"pipe\")/request('e', \"pipe\")/" \
            "$test_file"
          ! grep -Eq "request\('[g-k]'" "$test_file"
          cargo fmt --all
      - name: Commit deterministic fixture correction
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/trillionnium-owner-open-job-runtime/tests/runtime.rs
          git commit -m "test(job): use valid SHA-256 fixture seeds"
          git push origin HEAD:codex/owner-open-r5-gap-closure-20260829
