name: ChatGPT PR63 authenticated-bootstrap repair v2

on:
  push:
    branches:
      - ops/chatgpt-pr63-bootstrap-builder-20260909

permissions:
  contents: write

concurrency:
  group: chatgpt-pr63-authenticated-bootstrap-repair-v2
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CONTROL_BRANCH: ops/chatgpt-pr63-bootstrap-builder-20260909
      TARGET_BRANCH: codex/perf-harness-isolation-20260908
      EXPECTED_HEAD: 0b2228aae3512650340cd50c84f52daf10e3649a
      EXPECTED_TREE: 61e43db3904b0d08e10a3e49e6cce47a4d7edade
      BASE_COMMIT: d323a685c752b5bccc045a82728fd0c93c015163
      PYTHONDONTWRITEBYTECODE: 1
    steps:
      - name: Check out exact PR63 head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ env.TARGET_BRANCH }}
          persist-credentials: true

      - name: Apply canonical authenticated-bootstrap repair
        shell: bash
        run: |
          set -euo pipefail
          test "$(git --no-replace-objects rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git --no-replace-objects rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          if ! status="$(git --no-replace-objects status --porcelain=v1 --untracked-files=all --ignore-submodules=none)"; then
            printf '%s\n' 'cannot inspect initial worktree' >&2
            exit 1
          fi
          test -z "$status"
          git config user.name 'Qian QI'
          git config user.email '102159240+ProfHepta@users.noreply.github.com'
          git fetch --no-tags origin "$CONTROL_BRANCH"
          control_commit="$(git --no-replace-objects rev-parse FETCH_HEAD)"
          test "$control_commit" = "$GITHUB_SHA"
          git show "$control_commit:ops/pr63-bootstrap-apply.py" > "${RUNNER_TEMP}/pr63-bootstrap-apply.py"
          git show "$control_commit:ops/pr63-bootstrap-apply-v2.py" > "${RUNNER_TEMP}/pr63-bootstrap-apply-v2.py"
          test -s "${RUNNER_TEMP}/pr63-bootstrap-apply.py"
          test -s "${RUNNER_TEMP}/pr63-bootstrap-apply-v2.py"
          python3 "${RUNNER_TEMP}/pr63-bootstrap-apply-v2.py" "$PWD" "${RUNNER_TEMP}/pr63-bootstrap-apply.py"
          git diff --check

      - name: Verify launcher trust ordering and hostile boundaries
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            tools/launch/verified_python_bootstrap_v1.py \
            tools/perf/run_product_baseline.py \
            tools/perf/_run_product_baseline_facade.py \
            tools/perf/_run_product_baseline_core.py \
            tools/build/verify_host_reproducibility.py \
            tools/build/_verify_host_reproducibility_facade.py \
            tools/build/_verify_host_reproducibility_core.py \
            tools/tests/test_verified_python_bootstrap.py
          if python3 tools/perf/run_product_baseline.py --help; then
            printf '%s\n' 'direct performance launcher unexpectedly succeeded' >&2
            exit 1
          fi
          if python3 tools/build/verify_host_reproducibility.py --help; then
            printf '%s\n' 'direct reproducibility launcher unexpectedly succeeded' >&2
            exit 1
          fi
          python3 -I -c "$(cat tools/launch/verified_python_bootstrap_v1.py)" "$PWD" product-baseline -- --help >/dev/null
          python3 -I -c "$(cat tools/launch/verified_python_bootstrap_v1.py)" "$PWD" host-reproducibility -- --help >/dev/null
          python3 -m unittest \
            tools.tests.test_verified_python_bootstrap \
            tools.tests.test_run_product_baseline \
            tools.tests.test_verify_host_reproducibility \
            tools.tests.test_product_baseline_process_group_cleanup \
            tools.tests.test_verify_g1_review_index \
            tools.tests.test_verify_global_docs_contracts \
            tools.tests.test_owner_open_workflow_exact_head -v

      - name: Verify complete repository source gates
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/docs/generate_global_docs.py --check
          python3 tools/docs/verify_global_docs.py
          python3 tools/docs/verify_repository_authority.py
          python3 -m unittest discover -s tools/tests -p 'test*.py' -v
          cargo fmt --all -- --check
          cargo test --workspace --all-targets
          cargo clippy --workspace --all-targets -- -D warnings
          git diff --check
          expected="$(cat <<'PATHS'
          governance/pr41-review-index.v1.json
          tools/build/README.md
          tools/build/_verify_host_reproducibility_core.py
          tools/build/_verify_host_reproducibility_facade.py
          tools/build/verify_host_reproducibility.py
          tools/launch/verified_python_bootstrap_v1.py
          tools/perf/README.md
          tools/perf/_run_product_baseline_core.py
          tools/perf/_run_product_baseline_facade.py
          tools/perf/run_product_baseline.py
          tools/tests/test_product_baseline_process_group_cleanup.py
          tools/tests/test_run_product_baseline.py
          tools/tests/test_verified_python_bootstrap.py
          tools/tests/test_verify_host_reproducibility.py
          tools/verified-python-entrypoints.v1.json
          PATHS
          )"
          actual="$(git diff --name-only "$BASE_COMMIT" | LC_ALL=C sort)"
          test "$actual" = "$expected"
          if ! status="$(git --no-replace-objects status --porcelain=v1 --untracked-files=all --ignore-submodules=none)"; then
            printf '%s\n' 'cannot inspect final worktree' >&2
            exit 1
          fi
          test -n "$status"

      - name: Commit and publish repaired exact head
        shell: bash
        run: |
          set -euo pipefail
          git add \
            governance/pr41-review-index.v1.json \
            tools/build/README.md \
            tools/build/_verify_host_reproducibility_core.py \
            tools/build/_verify_host_reproducibility_facade.py \
            tools/build/verify_host_reproducibility.py \
            tools/launch/verified_python_bootstrap_v1.py \
            tools/perf/README.md \
            tools/perf/_run_product_baseline_core.py \
            tools/perf/_run_product_baseline_facade.py \
            tools/perf/run_product_baseline.py \
            tools/tests/test_product_baseline_process_group_cleanup.py \
            tools/tests/test_run_product_baseline.py \
            tools/tests/test_verified_python_bootstrap.py \
            tools/tests/test_verify_host_reproducibility.py \
            tools/verified-python-entrypoints.v1.json
          git commit -m 'fix(perf): authenticate launchers before Python execution'
          git push origin "HEAD:$TARGET_BRANCH"
