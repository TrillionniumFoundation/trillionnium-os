name: Temporary L2-L6 live prerequisite audit

on:
  push:
    branches:
      - ops/l2-l6-live-prerequisite-audit-20260911

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: temporary-l2-l6-live-prerequisite-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Read names and protection metadata only
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP:?}"
          unset PYTHONPATH PYTHONHOME
          /usr/bin/python3 -I - <<'PY'
          from __future__ import annotations

          import json
          import os
          import urllib.error
          import urllib.request

          repository = os.environ["REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "trillionnium-l2-l6-live-prerequisite-audit",
          }
          api = f"https://api.github.com/repos/{repository}"

          def get(path):
              request = urllib.request.Request(f"{api}{path}", headers=headers)
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      return response.status, json.load(response)
              except urllib.error.HTTPError as error:
                  return error.code, None

          environment_status, environment_value = get("/environments?per_page=100")
          runner_status, runner_value = get("/actions/runners?per_page=100")
          variable_status, variable_value = get("/actions/variables?per_page=100")
          environments = {
              item.get("name"): item
              for item in (environment_value or {}).get("environments", [])
              if item.get("name")
          }
          runners = (runner_value or {}).get("runners", [])
          variables = {
              item.get("name")
              for item in (variable_value or {}).get("variables", [])
              if item.get("name")
          }

          rows = []
          all_ready = True
          for level in range(2, 7):
              name = f"owner-open-r5-l{level}"
              environment = environments.get(name)
              reviewers = []
              wait_timer = None
              branch_policy = False
              if environment:
                  detail_status, detail = get(f"/environments/{name}")
                  if detail_status == 200 and detail:
                      wait_timer = detail.get("protection_rules")
                      for rule in detail.get("protection_rules") or []:
                          if rule.get("type") == "required_reviewers":
                              reviewers.extend(
                                  reviewer.get("reviewer", {}).get("login")
                                  for reviewer in rule.get("reviewers") or []
                                  if reviewer.get("reviewer", {}).get("login")
                              )
                          if rule.get("type") == "branch_policy":
                              branch_policy = True
              eligible = []
              for runner in runners:
                  labels = {label.get("name") for label in runner.get("labels") or []}
                  if runner.get("status") == "online" and not runner.get("busy") and name in labels:
                      eligible.append({"id": runner.get("id"), "name": runner.get("name")})
              required_variables = {
                  f"TRILLIONNIUM_L{level}_ADAPTER_PATH",
                  f"TRILLIONNIUM_L{level}_ADAPTER_SHA256",
                  f"TRILLIONNIUM_L{level}_OPERATOR_IDENTITY",
                  f"TRILLIONNIUM_L{level}_TARGET_ID",
              }
              missing = sorted(required_variables - variables)
              ready = bool(environment and reviewers and eligible and not missing)
              all_ready = all_ready and ready
              rows.append({
                  "level": f"L{level}",
                  "environment": name,
                  "environment_present": bool(environment),
                  "required_reviewers": sorted(set(reviewers)),
                  "branch_policy": branch_policy,
                  "online_eligible_runners": eligible,
                  "missing_variable_names": missing,
                  "ready": ready,
              })

          report = {
              "schema": "org.trillionnium.l2-l6-live-prerequisite-audit.v1",
              "repository": repository,
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "environment_api_status": environment_status,
              "runner_api_status": runner_status,
              "variable_api_status": variable_status,
              "levels": rows,
              "all_levels_ready": all_ready,
              "dispatch_performed": False,
              "target_contact_performed": False,
              "secret_values_read": False,
              "automatic_redispatch": False,
              "zero_gap": False,
              "public_release": False,
          }
          lines = [
              "## 2026-09-11 live L2-L6 prerequisite audit",
              "",
              "```text",
              f"run:                    {report['run_id']}",
              f"environment API:        {environment_status}",
              f"runner API:             {runner_status}",
              f"variable-name API:      {variable_status}",
              f"all levels ready:       {all_ready}",
              "dispatch performed:     false",
              "target contact:         false",
              "secret values read:     false",
              "```",
              "",
              "| Level | Environment/reviewers | Online eligible runner | Missing variable names | Ready |",
              "|---|---|---|---|---|",
          ]
          for row in rows:
              environment = "present" if row["environment_present"] else "missing"
              reviewers = ",".join(row["required_reviewers"]) or "none"
              runner_names = ",".join(str(item["name"]) for item in row["online_eligible_runners"]) or "none observed"
              missing = ", ".join(row["missing_variable_names"]) or "none"
              lines.append(
                  f"| `{row['level']}` | `{row['environment']}` {environment}; reviewers={reviewers} | "
                  f"{runner_names} | {missing} | `{row['ready']}` |"
              )
          lines.extend([
              "",
              "This audit reads metadata and variable names only. It does not read secret values, allocate a target, execute an adapter, contact a device, inject a fault, sign an artifact, consume a nonce, promote a gap or authorize release. A 403/404 is an observability limit and never proof of readiness. Real capture remains prohibited until the exact level has a protected environment, independent reviewer, eligible registered runner, fixed adapter identity and target identity.",
              "",
              "`automatic_redispatch=false`; `zero_gap=false`; `public_release=false`.",
          ])
          body = "\n".join(lines)
          request = urllib.request.Request(
              f"{api}/issues/68/comments",
              data=json.dumps({"body": body}).encode(),
              method="POST",
              headers=headers,
          )
          with urllib.request.urlopen(request, timeout=30):
              pass
          print(json.dumps(report, sort_keys=True))
          PY
