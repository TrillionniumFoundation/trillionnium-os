name: Temporary module-contract v2 preflight

on:
  push:
    branches:
      - ops/module-contracts-v2-preflight-20260909

permissions:
  contents: write

concurrency:
  group: temporary-module-contracts-v2-preflight
  cancel-in-progress: true

jobs:
  generate-test-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      BASE_SHA: b9f7b13bd431d8e6fe58eb6c5a532c2939c023c1
      CANDIDATE_BRANCH: codex/executable-module-contracts-v2-20260909
      PYTHONDONTWRITEBYTECODE: "1"
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out exact preflight controller
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: true

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"

      - name: Set up Rust 1.93
        uses: dtolnay/rust-toolchain@d8dfd7155fea72af4ad34a8fe97364d210e2d020
        with:
          toolchain: "1.93.0"
          components: rustfmt,clippy

      - name: Materialize exact reviewed source bundle
        shell: bash
        run: |
          set -euo pipefail
          git --no-replace-objects merge-base --is-ancestor "$BASE_SHA" HEAD
          observed_paths="$(git --no-replace-objects diff --name-only "$BASE_SHA"...HEAD | LC_ALL=C sort)"
          expected_paths="$(printf '%s\n' '.github/workflows/tmp-module-contracts-v2-preflight.yml' 'ops/module-contracts-v2-source.zip' | LC_ALL=C sort)"
          test "$observed_paths" = "$expected_paths"
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import hashlib, io, json, os, zipfile

          archive = Path('ops/module-contracts-v2-source.zip')
          archive_raw = archive.read_bytes()
          print(json.dumps({
              'carrier_bytes': len(archive_raw),
              'carrier_sha256': hashlib.sha256(archive_raw).hexdigest(),
              'semantic_binding': 'fixed_manifest_and_per_file_sha256',
          }, sort_keys=True))

          extracted = []
          with zipfile.ZipFile(io.BytesIO(archive_raw)) as z:
              names = z.namelist()
              if names.count('MANIFEST.json') != 1 or len(names) != len(set(names)):
                  raise SystemExit('bundle inventory is ambiguous')
              manifest_raw = z.read('MANIFEST.json')
              if hashlib.sha256(manifest_raw).hexdigest() != '2e95393d04e7f5990d74bd61c21b9a9d3f552bfc24f74a49670e694e3ff1a19a':
                  raise SystemExit('bundle manifest digest differs')
              manifest = json.loads(manifest_raw)
              if manifest.get('schema') != 'org.trillionnium.module-contract-source-bundle.v1':
                  raise SystemExit('bundle schema differs')
              if manifest.get('base_commit') != 'b9f7b13bd431d8e6fe58eb6c5a532c2939c023c1':
                  raise SystemExit('bundle base differs')
              if manifest.get('automatic_redispatch') is not False or manifest.get('public_release') is not False:
                  raise SystemExit('bundle claim ceiling differs')
              expected = [entry['path'] for entry in manifest['entries']]
              if sorted(names) != sorted(expected + ['MANIFEST.json']):
                  raise SystemExit('bundle member set differs')
              if len(expected) != 20 or len(expected) != len(set(expected)):
                  raise SystemExit('bundle source-file count differs')
              total = 0
              for entry in manifest['entries']:
                  rel = entry['path']
                  pure = PurePosixPath(rel)
                  if pure.is_absolute() or rel != pure.as_posix() or '.' in pure.parts or '..' in pure.parts or '\\' in rel:
                      raise SystemExit(f'unsafe bundle path: {rel}')
                  info = z.getinfo(rel)
                  mode = (info.external_attr >> 16) & 0o170000
                  if info.is_dir() or mode == 0o120000 or info.flag_bits & 0x1:
                      raise SystemExit(f'unsupported bundle member: {rel}')
                  raw = z.read(info)
                  total += len(raw)
                  if len(raw) != entry['bytes'] or hashlib.sha256(raw).hexdigest() != entry['sha256']:
                      raise SystemExit(f'bundle identity differs: {rel}')
                  extracted.append((rel, raw, int(entry['mode'], 8)))
              if total != 293894:
                  raise SystemExit('bundle semantic byte count differs')

          for rel, raw, mode in extracted:
              target = Path(rel)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(raw)
              os.chmod(target, mode)
          PY
          rm -f -- ops/module-contracts-v2-source.zip .github/workflows/tmp-module-contracts-v2-preflight.yml
          rmdir ops 2>/dev/null || true
          git diff --check

      - name: Generate, verify and cross-consume every contract
        shell: bash
        run: |
          set -euo pipefail
          rustc --version | grep -F 'rustc 1.93.0 '
          cargo fmt --all
          python3 tools/contracts/generate_module_contracts.py --write
          python3 tools/docs/generate_global_docs.py
          python3 tools/contracts/generate_module_contracts.py --check
          python3 tools/contracts/generate_module_contracts.py --verify
          python3 tools/contracts/check_module_contract_compatibility.py --base-ref "$BASE_SHA"
          python3 tools/docs/generate_global_docs.py --check
          python3 tools/docs/verify_global_docs.py
          python3 -m unittest tools.tests.test_module_contracts -v
          python3 -m unittest discover -s tools/tests -p 'test*.py' -v
          cargo fmt --all -- --check
          cargo test --locked -p trillionnium-owner-open-types --all-targets
          cargo clippy --locked -p trillionnium-owner-open-types --all-targets -- -D warnings
          git diff --check

      - name: Publish generated laboratory candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Qian QI'
          git config user.email '102159240+ProfHepta@users.noreply.github.com'
          git add -A
          test -n "$(git diff --cached --name-only)"
          git diff --cached --check
          git commit -m 'feat(contracts): generate executable module API state and error contracts'
          final="$(git --no-replace-objects rev-parse HEAD)"
          tree="$(git --no-replace-objects rev-parse HEAD^{tree})"
          git push --force origin "HEAD:$CANDIDATE_BRANCH"
          printf 'candidate_head=%s\ncandidate_tree=%s\n' "$final" "$tree"
