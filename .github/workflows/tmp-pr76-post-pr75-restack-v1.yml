name: Temporary PR76 post-PR75 restack v2

on:
  push:
    branches:
      - ops/pr76-post-pr75-restack-v1-20260911

permissions:
  contents: write
  pull-requests: read
  actions: read

concurrency:
  group: temporary-pr76-post-pr75-restack-v2
  cancel-in-progress: true

jobs:
  restack-qualify-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      REPOSITORY: TrillionniumFoundation/trillionnium-os
      OLD_BASE: b681cd856fccac1189496576f25d259752d2dcce
      CLEAN_SOURCE_HEAD: ffd81a68a5480be206b8cbb3d9724fc6362237cf
      EXPECTED_CANDIDATE_HEAD: d91e25471169abfd5879c6353421bd6d2702cdb1
      NEW_MAIN: 8c51837f545270ca31ee7c0e09250eeda01880d2
      CANDIDATE_BRANCH: codex/performance-measurement-v2-20260910
      PYTHONDONTWRITEBYTECODE: "1"
      CARGO_TERM_COLOR: always

    steps:
      - name: Check out exact isolated controller
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: true

      - name: Bind protected main and exact candidate lease
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/heads/${CANDIDATE_BRANCH}:refs/remotes/origin/${CANDIDATE_BRANCH}"
          test "$(git rev-parse refs/remotes/origin/main)" = "$NEW_MAIN"
          test "$(git rev-parse refs/remotes/origin/${CANDIDATE_BRANCH})" = "$EXPECTED_CANDIDATE_HEAD"
          git merge-base --is-ancestor "$CLEAN_SOURCE_HEAD" "$EXPECTED_CANDIDATE_HEAD"
          python3 - <<'PY'
          import json, os, urllib.request
          token = os.environ["GITHUB_TOKEN"]
          repo = os.environ["REPOSITORY"]
          expected = os.environ["NEW_MAIN"]
          h = {"Accept":"application/vnd.github+json","Authorization":f"Bearer {token}","X-GitHub-Api-Version":"2022-11-28","User-Agent":"pr76-restack-v2"}
          def get(path):
              req=urllib.request.Request(f"https://api.github.com/repos/{repo}{path}",headers=h)
              with urllib.request.urlopen(req,timeout=30) as r: return json.load(r)
          branch=get('/branches/main')
          if branch.get('commit',{}).get('sha') != expected: raise SystemExit('protected main moved')
          commit=get(f'/git/commits/{expected}')
          if commit.get('verification',{}).get('verified') is not True: raise SystemExit('new main is not signature verified')
          print('PASS_PROTECTED_MAIN_BINDING', expected, commit.get('tree',{}).get('sha'))
          PY

      - name: Materialize clean eight-path PR76 source on new main
        shell: bash
        run: |
          set -euo pipefail
          cat > "${RUNNER_TEMP}/expected-paths.txt" <<'EOF'
          docs/PERFORMANCE_AND_OPTIMIZATION.md
          tools/perf/README.md
          tools/perf/performance_qualification.py
          tools/perf/performance_qualification_policy_registry.v1.json
          tools/tests/test_performance_qualification.py
          tools/tests/test_product_baseline_process_group_cleanup.py
          tools/tests/test_verify_init_agent_activation.py
          tools/verify_init_agent_activation.py
          EOF
          git diff --name-only "$OLD_BASE"..."$CLEAN_SOURCE_HEAD" | LC_ALL=C sort > "${RUNNER_TEMP}/source-paths.txt"
          diff -u "${RUNNER_TEMP}/expected-paths.txt" "${RUNNER_TEMP}/source-paths.txt"
          git diff --binary --full-index "$OLD_BASE"..."$CLEAN_SOURCE_HEAD" > "${RUNNER_TEMP}/pr76.patch"
          test -s "${RUNNER_TEMP}/pr76.patch"
          git checkout --detach "$NEW_MAIN"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git apply --check --3way --whitespace=error-all "${RUNNER_TEMP}/pr76.patch"
          git apply --3way --whitespace=error-all "${RUNNER_TEMP}/pr76.patch"
          git reset
          git diff --check

      - name: Apply fail-closed descriptor-relative publication repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/perf/performance_qualification.py')
          s=p.read_text()
          marker='import sys\nfrom typing import Any, Iterable, Mapping, Sequence\n'
          replacement='import sys\nfrom typing import Any, Iterable, Mapping, Sequence\n\n_OS_LINK_SUPPORTS_DIR_FD = os.link in os.supports_dir_fd\n_OS_LINK_SUPPORTS_FOLLOW_SYMLINKS = os.link in os.supports_follow_symlinks\n'
          if marker not in s: raise SystemExit('import marker not found')
          s=s.replace(marker,replacement,1)
          old='''    for operation in (os.open, os.stat, os.unlink, os.link):\n        _require(operation in os.supports_dir_fd, "platform lacks required dir_fd semantics")\n    _require(os.link in os.supports_follow_symlinks, "platform lacks link follow-symlink control")\n'''
          new='''    for operation in (os.open, os.stat, os.unlink):\n        _require(operation in os.supports_dir_fd, "platform lacks required dir_fd semantics")\n    _require(_OS_LINK_SUPPORTS_DIR_FD, "platform lacks required link dir_fd semantics")\n    _require(_OS_LINK_SUPPORTS_FOLLOW_SYMLINKS, "platform lacks link follow-symlink control")\n'''
          if old not in s: raise SystemExit('capability block not found')
          s=s.replace(old,new,1)
          old='''        descriptor_path = f"/proc/self/fd/{descriptor}"\n        descriptor_target = os.stat(descriptor_path)\n        _require(\n            (descriptor_target.st_dev, descriptor_target.st_ino) == staged_dev_ino,\n            "descriptor publication path does not bind staging inode",\n        )\n        os.link(\n            descriptor_path,\n            absolute.name,\n            dst_dir_fd=parent_descriptor,\n            follow_symlinks=True,\n        )\n        published = True\n\n        final_before = os.stat(absolute.name, dir_fd=parent_descriptor, follow_symlinks=False)\n        _require(\n            (final_before.st_dev, final_before.st_ino) == staged_dev_ino\n            and stat.S_ISREG(final_before.st_mode)\n            and stat.S_IMODE(final_before.st_mode) == 0o600\n            and final_before.st_uid == os.geteuid()\n            and final_before.st_nlink == 2\n            and final_before.st_size == len(payload),\n            "published output identity differs from admitted staging inode",\n        )\n'''
          new='''        os.link(\n            temporary_name,\n            absolute.name,\n            src_dir_fd=parent_descriptor,\n            dst_dir_fd=parent_descriptor,\n            follow_symlinks=False,\n        )\n        published = True\n\n        final_before = os.stat(absolute.name, dir_fd=parent_descriptor, follow_symlinks=False)\n        if (final_before.st_dev, final_before.st_ino) != staged_dev_ino:\n            os.unlink(absolute.name, dir_fd=parent_descriptor)\n            published = False\n            raise QualificationError("staging pathname was replaced during publication")\n        _require(\n            stat.S_ISREG(final_before.st_mode)\n            and stat.S_IMODE(final_before.st_mode) == 0o600\n            and final_before.st_uid == os.geteuid()\n            and final_before.st_nlink == 2\n            and final_before.st_size == len(payload),\n            "published output identity differs from admitted staging inode",\n        )\n'''
          if old not in s: raise SystemExit('publication block not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          git diff --check

      - name: Run focused hostile and repository qualification
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/perf/performance_qualification.py tools/tests/test_performance_qualification.py tools/verify_init_agent_activation.py
          python3 -m unittest tools.tests.test_performance_qualification tools.tests.test_product_baseline_process_group_cleanup tools.tests.test_verify_init_agent_activation -v
          python3 tools/docs/generate_global_docs.py
          python3 tools/docs/generate_global_docs.py --check
          python3 tools/docs/verify_global_docs.py
          python3 tools/docs/verify_repository_authority.py
          python3 -m unittest discover -s tools/tests -p 'test*.py' -v
          cargo fmt --all -- --check
          cargo test --locked --workspace --all-targets
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
          if test -f planned/Cargo.toml; then
            cargo fmt --manifest-path planned/Cargo.toml --all -- --check
            cargo test --manifest-path planned/Cargo.toml --locked --workspace --all-targets
            cargo clippy --manifest-path planned/Cargo.toml --locked --workspace --all-targets --all-features -- -D warnings
          fi
          git diff --check
          git diff --name-only | LC_ALL=C sort > "${RUNNER_TEMP}/final-paths.txt"
          diff -u "${RUNNER_TEMP}/expected-paths.txt" "${RUNNER_TEMP}/final-paths.txt"

      - name: Publish one direct-child restack with exact force-with-lease
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/PERFORMANCE_AND_OPTIMIZATION.md tools/perf/README.md tools/perf/performance_qualification.py tools/perf/performance_qualification_policy_registry.v1.json tools/tests/test_performance_qualification.py tools/tests/test_product_baseline_process_group_cleanup.py tools/tests/test_verify_init_agent_activation.py tools/verify_init_agent_activation.py
          git diff --cached --check
          test "$(git rev-parse HEAD)" = "$NEW_MAIN"
          git commit -m 'perf: restack controlled qualification on executable contracts'
          new_head="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "$NEW_MAIN"
          git push origin "HEAD:refs/heads/${CANDIDATE_BRANCH}" --force-with-lease="refs/heads/${CANDIDATE_BRANCH}:${EXPECTED_CANDIDATE_HEAD}"
          echo "PUBLISHED_PR76_RESTACK=${new_head}"
