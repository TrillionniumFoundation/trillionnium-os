name: one-shot owner-open R5 permanent evidence-program tree export
# retry: permanent-evidence-program-v8

on:
  push:
    branches:
      - codex/owner-open-r5-gap-closure-20260829
    paths:
      - ".github/workflows/owner-open-r5-gap-promotion-one-shot.yml"

permissions:
  contents: read

jobs:
  export-reviewed-tree:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/owner-open-r5-gap-closure-20260829
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Expand reviewed evidence-program source package
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/r5-evidence-program-v1.tar.gz"
          cat .github/r5-bootstrap/r5_evidence_program_v1.tar.gz.b64.part-* \
            | base64 --decode > "$archive"
          echo "d9f89f42530e8208005172bbb37477242ecc2bc9600052d44ca168c4ce37097c  $archive" \
            | sha256sum --check --strict
          python3 - <<'PY'
          import os
          import tarfile
          from pathlib import PurePosixPath

          with tarfile.open(
              os.path.join(os.environ["RUNNER_TEMP"], "r5-evidence-program-v1.tar.gz"),
              "r:gz",
          ) as archive:
              for member in archive.getmembers():
                  path = PurePosixPath(member.name)
                  if path.is_absolute() or any(
                      part in {"", ".", ".."} for part in path.parts
                  ):
                      raise SystemExit(f"unsafe archive member: {member.name}")
                  if not (member.isfile() or member.isdir()):
                      raise SystemExit(f"unsupported archive node: {member.name}")
          PY
          tar -xzf "$archive" --no-same-owner --no-same-permissions
      - name: Apply fail-closed permanent evidence integration
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 tools/owner-open/apply_r5_evidence_program_v1.py --apply \
            | tee /tmp/r5-evidence-bootstrap.json
      - name: Validate patched source and machine truth
        run: |
          set -euo pipefail
          python3 -m py_compile \
            tools/verify-owner-open-r5.py \
            tools/verify-owner-open-r5-gap-evidence.py \
            tools/generate-owner-open-r5-resume-packet.py \
            tools/owner_open_r5_evidence_bundle.py \
            tools/finalize-owner-open-r5-evidence-bundle.py \
            tools/verify-owner-open-r5-evidence-bundle.py \
            tools/capture-owner-open-r5-target-evidence.py \
            tools/promote-owner-open-r5-evidence.py \
            tools/verify-owner-open-r5-governance-readiness.py
          python3 -m json.tool docs/status/owner-open-r5-gap-closure.json >/dev/null
          python3 -m json.tool docs/status/owner-open-r5-status.json >/dev/null
          python3 tools/verify-owner-open-r5.py --json | tee /tmp/verify-r5.json
          python3 tools/verify-owner-open-r5-gap-evidence.py --json \
            | tee /tmp/verify-r5-evidence.json
          python3 -m unittest \
            tools.tests.test_owner_open_r5_evidence_bundle \
            tools.tests.test_promote_owner_open_r5_evidence \
            tools.tests.test_verify_owner_open_r5_gap_evidence \
            tools.tests.test_verify_owner_open_r5_governance_readiness \
            tools.tests.test_verify_owner_open_r5_gap_closure \
            tools.tests.test_generate_owner_open_r5_resume_packet \
            -v | tee /tmp/evidence-tests.log
          python3 - <<'PY'
          from pathlib import Path

          for name in (
              "docs/OWNER_OPEN_R5_START_HERE.md",
              "docs/README.md",
              "docs/TRILLIONNIUM_OWNER_OPEN_R5_EXECUTION_PLAN.md",
          ):
              path = Path(name)
              path.write_text(
                  path.read_text(encoding="utf-8").rstrip("\n") + "\n",
                  encoding="utf-8",
              )
          PY
          git diff --check
      - name: Retire bootstrap payload and patcher
        run: |
          set -euo pipefail
          git rm --ignore-unmatch \
            .github/workflows/owner-open-r5-evidence-program-bootstrap.yml
          rm -f tools/owner-open/apply_r5_evidence_program_v1.py
          rm -rf .github/r5-bootstrap
      - name: Build verified local commit and export its exact changed tree
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "feat(r5): enforce reviewed target evidence promotion"
          export_dir="$RUNNER_TEMP/owner-open-r5-reviewed-tree"
          mkdir -p "$export_dir/files"
          git format-patch -1 --stdout > "$export_dir/commit.patch"
          git show -s --format='%H%n%T%n%P%n%s' HEAD > "$export_dir/commit.txt"
          cp /tmp/r5-evidence-bootstrap.json "$export_dir/"
          cp /tmp/verify-r5.json "$export_dir/"
          cp /tmp/verify-r5-evidence.json "$export_dir/"
          cp /tmp/evidence-tests.log "$export_dir/"
          python3 - "$export_dir" <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          from pathlib import Path
          import shutil
          import subprocess
          import sys

          out = Path(sys.argv[1])
          raw = subprocess.check_output(
              ["git", "diff", "--name-status", "-z", "HEAD^", "HEAD"]
          ).decode("utf-8")
          tokens = raw.split("\0")
          if tokens and tokens[-1] == "":
              tokens.pop()
          entries = []
          deletions = []
          index = 0
          while index < len(tokens):
              status = tokens[index]
              index += 1
              code = status[0]
              if code in {"R", "C"}:
                  raise SystemExit(f"rename/copy is not permitted in export: {status}")
              if code not in {"A", "M", "D"}:
                  raise SystemExit(f"unsupported change status: {status}")
              if index >= len(tokens):
                  raise SystemExit("truncated name-status stream")
              path = tokens[index]
              index += 1
              if path.startswith("/") or ".." in Path(path).parts:
                  raise SystemExit(f"unsafe changed path: {path}")
              if code == "D":
                  deletions.append(path)
                  continue
              source = Path(path)
              if not source.is_file():
                  raise SystemExit(f"changed file missing after commit: {path}")
              target = out / "files" / path
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(source, target)
              mode = subprocess.check_output(
                  ["git", "ls-tree", "HEAD", "--", path], text=True
              ).split()[0]
              payload = source.read_bytes()
              entries.append(
                  {
                      "path": path,
                      "mode": mode,
                      "bytes": len(payload),
                      "sha256": hashlib.sha256(payload).hexdigest(),
                  }
              )
          manifest = {
              "schema": "org.trillionnium.owner-open-r5.reviewed-tree-export.v1",
              "base_commit": subprocess.check_output(
                  ["git", "rev-parse", "HEAD^"], text=True
              ).strip(),
              "base_tree": subprocess.check_output(
                  ["git", "rev-parse", "HEAD^^{tree}"], text=True
              ).strip(),
              "local_commit": subprocess.check_output(
                  ["git", "rev-parse", "HEAD"], text=True
              ).strip(),
              "local_tree": subprocess.check_output(
                  ["git", "rev-parse", "HEAD^{tree}"], text=True
              ).strip(),
              "entries": sorted(entries, key=lambda item: item["path"]),
              "deletions": sorted(deletions),
          }
          (out / "manifest.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          (out / "deletions.txt").write_text(
              "".join(f"{path}\n" for path in manifest["deletions"]),
              encoding="utf-8",
          )
          PY
          (
            cd "$export_dir"
            find . -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          )
          tar -C "$RUNNER_TEMP" -czf \
            "$RUNNER_TEMP/owner-open-r5-reviewed-tree-${GITHUB_SHA}.tar.gz" \
            owner-open-r5-reviewed-tree
      - uses: actions/upload-artifact@v4
        with:
          name: owner-open-r5-reviewed-tree-${{ github.sha }}
          path: ${{ runner.temp }}/owner-open-r5-reviewed-tree-${{ github.sha }}.tar.gz
          if-no-files-found: error
          retention-days: 30
