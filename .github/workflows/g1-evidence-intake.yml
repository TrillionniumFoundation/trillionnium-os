name: G1 evidence intake qualification

# Evidence qualification is an explicit promotion activity. It is intentionally
# not triggered for every pull request and is not a transitive source gate.
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact protected-main-reachable source commit to qualify
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: g1-evidence-${{ inputs.source_sha }}
  cancel-in-progress: true

env:
  SOURCE_HEAD_SHA: ${{ inputs.source_sha }}
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  source-evidence:
    name: L1 strict evidence intake on exact protected-main source
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Validate selected source identity
        run: |
          set -euo pipefail
          [[ "$SOURCE_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
      - name: Check out selected source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ env.SOURCE_HEAD_SHA }}
          persist-credentials: false
      - name: Bind selected source to protected main
        run: |
          set -euo pipefail
          test "$(git --no-replace-objects rev-parse HEAD^{commit})" = "$SOURCE_HEAD_SHA"
          git --no-replace-objects cat-file -e "$SOURCE_HEAD_SHA^{commit}"
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          git --no-replace-objects merge-base --is-ancestor \
            "$SOURCE_HEAD_SHA" refs/remotes/origin/main
          if ! worktree_status="$(git --no-replace-objects -C "${GITHUB_WORKSPACE:?}" status --porcelain=v1 --untracked-files=all --ignore-submodules=none)"; then
            printf '%s\n' 'Cannot verify repository worktree state' >&2
            exit 1
          fi
          test -z "$worktree_status"
      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Verify evidence contracts and non-mutating promotion plan
        run: |
          set -euo pipefail
          test "$(git --no-replace-objects rev-parse HEAD^{commit})" = "$SOURCE_HEAD_SHA"
          python3 -m py_compile \
            tools/evidence/g1_evidence_contract.py \
            tools/evidence/g1_evidence_types.py \
            tools/evidence/g1_evidence_core.py \
            tools/evidence/g1_evidence.py \
            tools/verify-g1-evidence.py \
            tools/verify-g1-evidence-live.py
          python3 -m unittest \
            tools.tests.test_g1_evidence \
            tools.tests.test_g1_evidence_live \
            tools.tests.test_g1_evidence_live_binding -v
          python3 tools/verify-g1-evidence.py \
            --current-source-commit "$SOURCE_HEAD_SHA" \
            --report "${RUNNER_TEMP}/g1-evidence-report.json" \
            --promotion-plan "${RUNNER_TEMP}/g1-promotion-plan.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(
              Path(os.environ["RUNNER_TEMP"], "g1-evidence-report.json")
              .read_text(encoding="utf-8")
          )
          plan = json.loads(
              Path(os.environ["RUNNER_TEMP"], "g1-promotion-plan.json")
              .read_text(encoding="utf-8")
          )
          assert report["schema"] == "org.trillionnium.g1.evidence-verification-report.v2"
          assert plan["schema"] == "org.trillionnium.g1.gap-promotion-plan.v1"
          assert report["current_source_commit"] == os.environ["SOURCE_HEAD_SHA"]
          assert plan["current_source_commit"] == os.environ["SOURCE_HEAD_SHA"]
          assert report["gap_specs_sha256"] == plan["gap_specs_sha256"]
          assert report["unresolved_gaps"] == plan["unresolved_gaps"]
          assert report["public_release"] is False
          assert report["automatic_redispatch"] is False
          assert plan["public_release_after_plan"] is False
          assert plan["automatic_redispatch"] is False
          PY
          git diff --check
          if ! worktree_status="$(git --no-replace-objects -C "${GITHUB_WORKSPACE:?}" status --porcelain=v1 --untracked-files=all --ignore-submodules=none)"; then
            printf '%s\n' 'Cannot verify repository worktree state after intake' >&2
            exit 1
          fi
          test -z "$worktree_status"
      - name: Upload promotion evidence report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: g1-evidence-source-${{ env.SOURCE_HEAD_SHA }}
          if-no-files-found: error
          retention-days: 30
          path: |
            ${{ runner.temp }}/g1-evidence-report.json
            ${{ runner.temp }}/g1-promotion-plan.json
