name: Owner-open R5 final evidence-program converger v5

on:
  push:
    branches:
      - codex/owner-open-r5-gap-closure-20260829
    paths:
      - ".github/workflows/owner-open-r5-final-converger-v5.yml"

permissions:
  contents: write

concurrency:
  group: owner-open-r5-final-converger-v5
  cancel-in-progress: false

jobs:
  converge:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Apply or verify the evidence hardening migration
        run: |
          set -euo pipefail
          if test -f tools/owner-open/apply_r5_evidence_hardening_v4.py; then
            python3 - <<'PY'
            from pathlib import Path
            path = Path('tools/owner-open/apply_r5_evidence_hardening_v4.py')
            text = path.read_text()
            text = text.replace(
                'replace_between(path, "def exact_source_evidence(", "def verify(", replacement + "def verify(")',
                'replace_between(path, "def exact_source_evidence(", "def verify(", replacement)',
            )
            text = text.replace(
                '''        digest = artifact.get("digest")
                    if not isinstance(digest, str) or not digest.startswith("sha256:") or HEX64.fullmatch(digest[7:]) is None:
                        raise ValueError("artifact digest is malformed")''',
                '''        digest = artifact.get("digest")
                    if isinstance(digest, str) and HEX64.fullmatch(digest) is not None:
                        digest = "sha256:" + digest
                        artifact["digest"] = digest
                    if not isinstance(digest, str) or not digest.startswith("sha256:") or HEX64.fullmatch(digest[7:]) is None:
                        raise ValueError("artifact digest is malformed")''',
            )
            text = text.replace(
                '''    manifest_path = manifest_path if manifest_path.is_absolute() else root / manifest_path
                stable_file(manifest_path, root)
                manifest, manifest_raw = read_object(manifest_path)''',
                '''    manifest_path = manifest_path if manifest_path.is_absolute() else root / manifest_path
                manifest_container = manifest_path.parent.resolve(strict=True)
                stable_file(manifest_path, manifest_container)
                manifest, manifest_raw = read_object(manifest_path)''',
            )
            text = text.replace(
                '        "manifest": str(manifest_path.relative_to(root)),',
                '        "manifest": str(manifest_path.relative_to(root)) if manifest_path.is_relative_to(root) else str(manifest_path),',
            )
            path.write_text(text)
            PY
            python3 tools/owner-open/apply_r5_evidence_hardening_v4.py
          fi
          test -f tools/owner-open/owner_open_r5_evidence_bundle.py
          test -f tools/owner-open/promote_owner_open_r5_evidence.py
          test -f tools/owner-open/bind_owner_open_r5_source_evidence.py
          test -f tools/owner-open/verify_owner_open_r5_workflow_identity.py
          test -f .github/workflows/owner-open-r5-exact-source-binder-v4.yml
      - name: Normalize every permanent R5 checkout to full exact-head history
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          workflow_dir = Path('.github/workflows')
          transient = {
              'owner-open-r5-evidence-hardening-migration-v4.yml',
              'owner-open-r5-evidence-hardening-watchdog-v4.yml',
              'owner-open-r5-history-hardening-v4.yml',
              'owner-open-r5-history-converger-v4.yml',
              'owner-open-r5-final-converger-v5.yml',
          }
          for path in sorted(workflow_dir.glob('owner-open-r5*.yml')):
              if path.name in transient:
                  continue
              original = path.read_text()
              lines = original.splitlines()
              output = []
              index = 0
              while index < len(lines):
                  line = lines[index]
                  output.append(line)
                  if re.match(r'^\s*- uses: actions/checkout@v4\s*$', line):
                      indent = len(line) - len(line.lstrip())
                      end = index + 1
                      while end < len(lines):
                          stripped = lines[end].strip()
                          current = len(lines[end]) - len(lines[end].lstrip())
                          if stripped and current <= indent and stripped.startswith('-'):
                              break
                          if stripped and current < indent:
                              break
                          end += 1
                      block = lines[index + 1:end]
                      has_with = next((i for i, value in enumerate(block) if value.strip() == 'with:'), None)
                      additions = []
                      if not any(value.strip().startswith('fetch-depth:') for value in block):
                          additions.append(' ' * (indent + 4) + 'fetch-depth: 0')
                      if additions:
                          if has_with is None:
                              output.append(' ' * (indent + 2) + 'with:')
                              output.extend(additions)
                              output.extend(block)
                          else:
                              output.extend(block[:has_with + 1])
                              output.extend(additions)
                              output.extend(block[has_with + 1:])
                          index = end
                          continue
                  index += 1
              path.write_text('\n'.join(output) + ('\n' if original.endswith('\n') else ''))
          for name in transient:
              (workflow_dir / name).unlink(missing_ok=True)
          for name in (
              'owner-open-r5-external-closure-semantics-executor.yml',
              'owner-open-r5-gap-promotion-one-shot.yml',
              'owner-open-r5-gap-promotion-executor-v2.yml',
          ):
              (workflow_dir / name).unlink(missing_ok=True)
          Path('tools/owner-open/apply_r5_evidence_hardening_v4.py').unlink(missing_ok=True)
          PY
      - name: Execute the complete migrated Python contract
        env:
          OWNER_OPEN_R5_BINDING_SOURCE_SHA: ${{ github.sha }}
          PYTHONWARNINGS: error::ResourceWarning
        run: |
          set -euo pipefail
          python3 -m compileall -q tools
          python3 -m unittest \
            tools.tests.test_owner_open_r5_evidence_bundle \
            tools.tests.test_bind_owner_open_r5_source_evidence \
            tools.tests.test_verify_owner_open_r5_workflow_identity \
            tools.tests.test_verify_owner_open_r5_gap_evidence \
            tools.tests.test_verify_owner_open_r5_gap_closure \
            tools.tests.test_generate_owner_open_r5_resume_packet \
            tools.tests.test_verify_owner_open_r5 \
            -v
          python3 tools/generate-owner-open-types.py --check
          python3 tools/verify-owner-open-r5.py --json >/tmp/verify-r5.json
          python3 tools/verify-owner-open-r5-gap-evidence.py --json >/tmp/verify-gap.json
          python3 tools/owner-open/verify_owner_open_r5_workflow_identity.py --json >/tmp/verify-workflows.json
          python3 -m json.tool docs/status/owner-open-r5-target-readiness.json >/dev/null
          python3 - <<'PY'
          from pathlib import Path
          import re
          errors = []
          for path in sorted(Path('.github/workflows').glob('owner-open-r5*.yml')):
              lines = path.read_text().splitlines()
              for index, line in enumerate(lines):
                  if re.match(r'^\s*- uses: actions/checkout@v4\s*$', line):
                      indent = len(line) - len(line.lstrip())
                      block = []
                      for following in lines[index + 1:]:
                          stripped = following.strip()
                          current = len(following) - len(following.lstrip())
                          if stripped and current <= indent and stripped.startswith('-'):
                              break
                          if stripped and current < indent:
                              break
                          block.append(following)
                      if 'fetch-depth: 0' not in '\n'.join(block):
                          errors.append(f'{path}:{index + 1}')
          if errors:
              raise SystemExit('missing fetch-depth: 0: ' + ', '.join(errors))
          PY
          git diff --check
      - name: Publish one serialized source commit with remote-head CAS
        run: |
          set -euo pipefail
          remote="$(git ls-remote origin refs/heads/codex/owner-open-r5-gap-closure-20260829 | awk '{print $1}')"
          test "$remote" = "$GITHUB_SHA"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          test -n "$(git diff --cached --name-only)"
          git diff --cached --check
          git commit -m "feat(r5): converge fail-closed evidence and exact-source program"
          git push origin HEAD:codex/owner-open-r5-gap-closure-20260829
