name: one-shot owner-open R6 provider terminal ordering repair

on:
  push:
    branches:
      - codex/owner-open-r5-gap-closure-20260829
    paths:
      - ".github/workflows/owner-open-r6-provider-terminal-order-one-shot.yml"

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: codex/owner-open-r5-gap-closure-20260829

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"

      - name: Validate one-shot staging boundary
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          actual="$(git diff --name-only "${GITHUB_SHA}^" "$GITHUB_SHA" | sort)"
          expected=".github/workflows/owner-open-r6-provider-terminal-order-one-shot.yml"
          test "$actual" = "$expected"
          test -f tools/patch-owner-open-r6-provider-terminal-order.py

      - name: Install locked Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install 1.93.0 \
            --profile minimal \
            --component rustfmt \
            --component clippy
          rustup default 1.93.0
          rustc --version
          cargo --version

      - name: Apply ordered provider terminal repair
        run: |
          set -euo pipefail
          python3 tools/patch-owner-open-r6-provider-terminal-order.py
          cargo fmt --all
          python3 -m unittest \
            tools.tests.test_owner_open_provider_terminal_order -v
          git diff --check

      - name: Stress direct and end-to-end terminal ordering
        run: |
          set -euo pipefail
          for attempt in $(seq 1 8); do
            echo "provider adapter ordering attempt ${attempt}/8"
            cargo test --locked \
              -p trillionnium-owner-open-provider-jsonl \
              --test terminal_ordering \
              immediate_provider_exit_cannot_overtake_its_terminal_line \
              -- --exact
          done
          for attempt in $(seq 1 32); do
            echo "Host flow ordering attempt ${attempt}/32"
            cargo test --locked \
              -p trillionnium-owner-open-host \
              --test r5_stream_flow_control \
              flow_control_without_durable_store_is_rejected_without_stopping_the_turn \
              -- --exact
          done

      - name: Remove transient write surface
        run: |
          set -euo pipefail
          rm -f .github/workflows/owner-open-r6-provider-terminal-order-one-shot.yml
          rm -f tools/patch-owner-open-r6-provider-terminal-order.py

      - name: Verify packages and canonical boundaries
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo test --locked \
            -p trillionnium-owner-open-provider-jsonl \
            -p trillionnium-owner-open-host \
            --all-targets
          cargo clippy --locked \
            -p trillionnium-owner-open-provider-jsonl \
            -p trillionnium-owner-open-host \
            --all-targets \
            -- -D warnings
          python3 tools/verify-owner-open-r5-workflow-boundaries.py --json
          python3 tools/verify-owner-open-r5.py --json
          python3 tools/verify-owner-open-r5-gap-evidence.py --json
          git diff --check

      - name: Commit the source repair
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          actual="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' \
            .github/workflows/owner-open-r6-provider-terminal-order-one-shot.yml \
            crates/trillionnium-owner-open-provider-jsonl/src/lib.rs \
            crates/trillionnium-owner-open-provider-jsonl/tests/terminal_ordering.rs \
            tools/patch-owner-open-r6-provider-terminal-order.py \
            tools/tests/test_owner_open_provider_terminal_order.py | sort)"
          test "$actual" = "$expected"
          git commit -m "fix(provider): order terminal delivery after stdout"
          git push origin HEAD:codex/owner-open-r5-gap-closure-20260829
