name: Temporary PR75 contract-boundary repair v1

on:
  push:
    branches:
      - ops/pr75-contract-boundary-repair-v1-20260910

permissions:
  actions: read
  contents: write

concurrency:
  group: pr75-contract-boundary-repair-v1
  cancel-in-progress: false

jobs:
  repair-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      TARGET_BRANCH: codex/executable-module-contracts-v3-main-20260910
      TARGET_HEAD: e84227a9cce92bcda45e66c9e9060036f424c4cd
      TARGET_BASE: b681cd856fccac1189496576f25d259752d2dcce
      PYTHONDONTWRITEBYTECODE: "1"
      CARGO_TERM_COLOR: always
      PATCH_ZLIB_B64: |
          
    steps:
      - name: Check out immutable repair controller
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          ref: ${{ github.sha }}
          path: controller
          persist-credentials: false

      - name: Check out exact PR candidate with publication credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ env.TARGET_BRANCH }}
          path: candidate
          persist-credentials: true

      - name: Assert exact immutable input tuple
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git --no-replace-objects rev-parse HEAD)" = "$TARGET_HEAD"
          test "$(git --no-replace-objects rev-parse HEAD^)" = "$TARGET_BASE"
          test "$(git --no-replace-objects rev-parse origin/main)" = "$TARGET_BASE"
          test -z "$(git status --porcelain=v1 --untracked-files=all --ignore-submodules=none)"

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"

      - name: Set up Rust 1.93
        uses: dtolnay/rust-toolchain@d8dfd7155fea72af4ad34a8fe97364d210e2d020
        with:
          toolchain: "1.93.0"
          components: rustfmt,clippy

      - name: Apply four-review-finding repair and regenerate exact artifacts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path
          import zlib

          encoded = os.environ["PATCH_ZLIB_B64"]
          raw = zlib.decompress(base64.b64decode(encoded))
          target = Path(os.environ["RUNNER_TEMP"]) / "repair_pr75_contract_boundaries.py"
          target.write_bytes(raw)
          target.chmod(0o700)
          PY
          python3 "$RUNNER_TEMP/repair_pr75_contract_boundaries.py" "$GITHUB_WORKSPACE/candidate"
          cd "$GITHUB_WORKSPACE/candidate"
          python3 -m py_compile \
            tools/contracts/generate_module_contracts.py \
            tools/contracts/check_module_contract_compatibility.py \
            android-integration/module-contracts/verify_vectors.py \
            tools/tests/test_module_contracts.py
          python3 tools/contracts/generate_module_contracts.py --write
          python3 tools/contracts/generate_module_contracts.py --check
          python3 tools/contracts/generate_module_contracts.py --verify
          python3 tools/contracts/check_module_contract_compatibility.py --base-ref origin/main
          python3 android-integration/module-contracts/verify_vectors.py

      - name: Execute focused hostile controls and full source matrix
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest tools.tests.test_module_contracts -v
          python3 tools/docs/generate_global_docs.py --check
          python3 tools/docs/verify_global_docs.py
          python3 tools/docs/verify_repository_authority.py
          python3 -m unittest discover -s tools/tests -p 'test*.py' -v

      - name: Execute locked Rust and planned-workspace matrices
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo test --locked --workspace --all-targets
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo fmt --manifest-path planned/Cargo.toml --all -- --check
          cargo test --locked --manifest-path planned/Cargo.toml --workspace --all-targets
          cargo clippy --locked --manifest-path planned/Cargo.toml --workspace --all-targets -- -D warnings

      - name: Publish one exact fast-forward repair commit
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git --no-replace-objects rev-parse HEAD)" = "$TARGET_HEAD"
          test -z "$(git diff --name-only -- 'ops/**' '.github/workflows/tmp-*')"
          git diff --check
          git config user.name 'Qian QI'
          git config user.email '102159240+ProfHepta@users.noreply.github.com'
          git add -A
          test -n "$(git diff --cached --name-only)"
          test -z "$(git diff --cached --name-only | grep -E '^(ops/|\.github/workflows/tmp-)' || true)"
          git diff --cached --check
          git commit \
            -m 'fix(contracts): close reviewed parser and compatibility boundaries' \
            -m 'Fail closed on unresolved base refs, preserve annotation-named schema properties, reject exponent overflow, and enforce one UTF-8 byte/control domain across Python, Rust and Android vectors. Preserve automatic_redispatch=false and the L1-only claim ceiling.'
          final="$(git --no-replace-objects rev-parse HEAD)"
          test "$(git --no-replace-objects rev-parse HEAD^)" = "$TARGET_HEAD"
          git push --force-with-lease="refs/heads/$TARGET_BRANCH:$TARGET_HEAD" \
            origin "HEAD:refs/heads/$TARGET_BRANCH"
          printf 'published_head=%s\n' "$final"
