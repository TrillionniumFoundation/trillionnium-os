name: Owner-open R5 terminal truth probe v1

on:
  push:
    branches:
      - codex/owner-open-r5-gap-closure-20260829
    paths:
      - ".github/workflows/owner-open-r5-terminal-probe-v1.yml"

permissions:
  contents: write
  actions: read
  pull-requests: write
  issues: write

concurrency:
  group: owner-open-r5-terminal-truth-probe-v1
  cancel-in-progress: false

jobs:
  probe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@1.93.0
        with:
          components: rustfmt, clippy
      - name: Restore the candidate source tree and execute all gates
        env:
          OWNER_OPEN_R5_BINDING_SOURCE_SHA: ${{ github.sha }}
          PYTHONWARNINGS: error::ResourceWarning
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm .github/workflows/owner-open-r5-terminal-probe-v1.yml
          python3 - <<'PY'
          from __future__ import annotations
          from collections import Counter
          from datetime import datetime, timezone
          import json
          import os
          from pathlib import Path
          import subprocess
          import urllib.error
          import urllib.request

          root = Path('.').resolve()
          parent = subprocess.check_output(['git', 'rev-parse', 'HEAD^'], text=True).strip()
          parent_tree = subprocess.check_output(['git', 'rev-parse', 'HEAD^^{tree}'], text=True).strip()
          commands = [
              ['python3', '-m', 'compileall', '-q', 'tools'],
              ['python3', 'tools/generate-owner-open-types.py', '--check'],
              ['python3', 'tools/verify-owner-open-r5.py', '--json'],
              ['python3', 'tools/verify-owner-open-r5-gap-evidence.py', '--json'],
              ['python3', 'tools/owner-open/verify_owner_open_r5_workflow_identity.py', '--json'],
              ['python3', '-m', 'unittest',
               'tools.tests.test_owner_open_r5_evidence_bundle',
               'tools.tests.test_bind_owner_open_r5_source_evidence',
               'tools.tests.test_verify_owner_open_r5_workflow_identity',
               'tools.tests.test_verify_owner_open_r5_gap_evidence',
               'tools.tests.test_verify_owner_open_r5_gap_closure',
               'tools.tests.test_generate_owner_open_r5_resume_packet',
               'tools.tests.test_verify_owner_open_r5', '-v'],
              ['cargo', 'fmt', '--all', '--', '--check'],
              ['cargo', 'test', '--locked', '--all-targets'],
              ['cargo', 'clippy', '--locked', '--all-targets', '--', '-D', 'warnings'],
          ]
          results = []
          environment = dict(os.environ)
          for argv in commands:
              completed = subprocess.run(argv, cwd=root, env=environment, text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, timeout=3600)
              output = completed.stdout or ''
              results.append({
                  'argv': argv,
                  'returncode': completed.returncode,
                  'output_tail': '\n'.join(output.splitlines()[-80:]),
              })

          def read(path: str):
              return json.loads((root / path).read_text())

          gaps = read('docs/status/owner-open-r5-gap-closure.json')
          status = read('docs/status/owner-open-r5-status.json')
          readiness = read('docs/status/owner-open-r5-target-readiness.json') if (root / 'docs/status/owner-open-r5-target-readiness.json').is_file() else {}
          entries = [item for item in gaps.get('gaps', []) if isinstance(item, dict)]
          states = Counter(item.get('status') for item in entries)
          source_evidence = entries[0].get('source_evidence', {}) if entries else {}

          token = os.environ.get('GH_TOKEN', '')
          repository = os.environ['GITHUB_REPOSITORY']
          headers = {'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'}
          if token:
              headers['Authorization'] = f'Bearer {token}'

          def api(path: str):
              request = urllib.request.Request(f'https://api.github.com/repos/{repository}/{path}', headers=headers)
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      return {'ok': True, 'status': response.status, 'value': json.load(response)}
              except urllib.error.HTTPError as error:
                  return {'ok': False, 'status': error.code, 'error': error.read().decode(errors='replace')[-2048:]}
              except Exception as error:
                  return {'ok': False, 'status': None, 'error': str(error)}

          main_branch = api('branches/main')
          rulesets = api('rulesets')
          pull = api('pulls/21')
          reviews = api('pulls/21/reviews?per_page=100')
          runners = api('actions/runners?per_page=100')
          source_runs = api(f'actions/runs?head_sha={source_evidence.get("commit", "")}&per_page=100')

          independent_exact_head_approval = False
          requested_head = None
          author = None
          if pull.get('ok'):
              requested_head = pull['value'].get('head', {}).get('sha')
              author = pull['value'].get('user', {}).get('login')
          if reviews.get('ok') and isinstance(reviews.get('value'), list):
              latest = {}
              for review in reviews['value']:
                  login = review.get('user', {}).get('login')
                  if login:
                      latest[login] = review
              independent_exact_head_approval = any(
                  login != author
                  and not login.endswith('[bot]')
                  and review.get('state') == 'APPROVED'
                  and review.get('commit_id') == requested_head
                  for login, review in latest.items()
              )

          rule_values = rulesets.get('value') if rulesets.get('ok') else []
          main_protected = bool(main_branch.get('ok') and main_branch['value'].get('protected'))
          ruleset_count = len(rule_values) if isinstance(rule_values, list) else 0
          runner_values = runners.get('value', {}).get('runners', []) if runners.get('ok') else []
          online_labels = sorted({label.get('name') for runner in runner_values if runner.get('status') == 'online' for label in runner.get('labels', []) if label.get('name')})
          required_labels = sorted({item.get('runner_label') for item in readiness.get('environments', []) if isinstance(item, dict) and item.get('runner_label')})
          capture_ready = [item.get('environment') for item in readiness.get('environments', []) if isinstance(item, dict) and item.get('capture_ready') is True]
          bundle_manifests = sorted(str(path.relative_to(root)) for path in (root / 'evidence/owner-open-r5').glob('**/manifest.json')) if (root / 'evidence/owner-open-r5').is_dir() else []
          program_ok = all(item['returncode'] == 0 for item in results)
          all_closed = bool(entries) and all(item.get('status') == 'CLOSED' for item in entries)
          terminal = 'MODULE_CLOSED_CANDIDATE' if all_closed and status.get('zero_gap') is True and status.get('public_release') is True else 'RESUME_REQUIRED'
          report = {
              'schema': 'org.trillionnium.owner-open-r5.agent-terminal.v1',
              'captured_at': datetime.now(timezone.utc).isoformat().replace('+00:00', 'Z'),
              'plan_revision': status.get('active_plan_revision'),
              'probe_trigger_sha': os.environ['GITHUB_SHA'],
              'candidate_head_before_probe': parent,
              'candidate_tree_before_probe': parent_tree,
              'source_evidence': source_evidence,
              'program_checks_ok': program_ok,
              'checks': results,
              'gap_count': len(entries),
              'gap_state_counts': dict(sorted(states.items())),
              'zero_gap': status.get('zero_gap'),
              'public_release': status.get('public_release'),
              'automatic_redispatch': status.get('automatic_redispatch'),
              'terminal': terminal,
              'governance': {
                  'main_protected': main_protected,
                  'ruleset_count': ruleset_count,
                  'independent_exact_head_approval': independent_exact_head_approval,
                  'main_branch_api': main_branch,
                  'rulesets_api': rulesets,
                  'pull_head_at_probe': requested_head,
                  'pull_author': author,
                  'review_api': reviews,
              },
              'target_readiness': {
                  'runner_inventory_api': runners,
                  'online_runner_labels': online_labels,
                  'required_runner_labels': required_labels,
                  'missing_online_runner_labels': sorted(set(required_labels) - set(online_labels)),
                  'capture_ready_environments': capture_ready,
                  'bundle_manifests': bundle_manifests,
              },
              'source_workflow_runs_api': source_runs,
              'negative_claims': [
                  'a passing source probe does not establish L2-L6',
                  'requested review is not approval',
                  'artifact upload is not gap closure',
                  'no automatic redispatch was authorized',
              ],
          }
          output = root / 'docs/status/owner-open-r5-agent-terminal.json'
          output.write_text(json.dumps(report, indent=2, ensure_ascii=False, sort_keys=True) + '\n')
          (root / '/tmp' if False else root).joinpath('terminal-summary.txt').write_text(
              f'terminal={terminal}\nprogram_ok={program_ok}\ngap_states={dict(states)}\nzero_gap={status.get("zero_gap")}\npublic_release={status.get("public_release")}\nmain_protected={main_protected}\nrulesets={ruleset_count}\nindependent_exact_head_approval={independent_exact_head_approval}\ncapture_ready={capture_ready}\nmissing_runner_labels={sorted(set(required_labels) - set(online_labels))}\n'
          )
          PY
          git diff --check
      - name: Publish status-only terminal truth
        id: publish
        run: |
          set -euo pipefail
          remote="$(git ls-remote origin refs/heads/codex/owner-open-r5-gap-closure-20260829 | awk '{print $1}')"
          test "$remote" = "$GITHUB_SHA"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f terminal-summary.txt
          git add docs/status/owner-open-r5-agent-terminal.json .github/workflows/owner-open-r5-terminal-probe-v1.yml
          test -z "$(git diff --cached --name-only | grep -v -E '^(docs/status/owner-open-r5-agent-terminal.json|.github/workflows/owner-open-r5-terminal-probe-v1.yml)$' || true)"
          git diff --cached --check
          git commit -m "docs(r5): record current terminal truth"
          git push origin HEAD:codex/owner-open-r5-gap-closure-20260829
          echo "final_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Move green source candidate to independent review without merging
        env:
          GH_TOKEN: ${{ github.token }}
          FINAL_SHA: ${{ steps.publish.outputs.final_sha }}
        run: |
          set -euo pipefail
          program_ok="$(python3 -c 'import json; print(str(json.load(open("docs/status/owner-open-r5-agent-terminal.json"))["program_checks_ok"]).lower())')"
          terminal="$(python3 -c 'import json; print(json.load(open("docs/status/owner-open-r5-agent-terminal.json"))["terminal"])')"
          states="$(python3 -c 'import json; print(json.dumps(json.load(open("docs/status/owner-open-r5-agent-terminal.json"))["gap_state_counts"], sort_keys=True))')"
          if test "$program_ok" = true; then
            gh pr ready 21 || true
            gh api --method POST "repos/$GITHUB_REPOSITORY/pulls/21/requested_reviewers" -f 'reviewers[]=ProfHepta' || true
          fi
          gh pr comment 21 --body "<!-- owner-open-r5-terminal-probe -->
          Exact final probe commit: \`$FINAL_SHA\`

          - source/program gates: \`$program_ok\`
          - terminal: \`$terminal\`
          - gap states: \`$states\`
          - automatic redispatch: \`false\`
          - self-merge: not performed

          The exact machine report is \`docs/status/owner-open-r5-agent-terminal.json\`. External target, device, fault, governance and release lanes remain fail-closed until their reviewed recursive bundles exist."
