name: Temporary init activation atime identity repair v2

on:
  push:
    branches:
      - ops/init-activation-atime-identity-repair-v2-20260911

permissions:
  contents: write

concurrency:
  group: temporary-init-activation-atime-identity-repair-v2
  cancel-in-progress: true

env:
  BASE_SHA: b681cd856fccac1189496576f25d259752d2dcce
  TARGET_BRANCH: codex/init-activation-atime-identity-20260911
  PYTHONDONTWRITEBYTECODE: "1"
  CARGO_TERM_COLOR: always

jobs:
  repair-qualify-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out immutable controller
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: true

      - name: Authenticate controller
        shell: bash
        run: |
          set -euo pipefail
          test "$(git --no-replace-objects rev-parse HEAD^)" = "$BASE_SHA"
          test "$(git --no-replace-objects diff --name-only "$BASE_SHA"...HEAD)" = '.github/workflows/tmp-init-activation-atime-identity-repair-v2.yml'

      - name: Install source-test prerequisites
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/sudo /usr/bin/apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          /usr/bin/sudo /usr/bin/apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install --yes --no-install-recommends acl

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"

      - name: Set up Rust 1.93
        uses: dtolnay/rust-toolchain@d8dfd7155fea72af4ad34a8fe97364d210e2d020
        with:
          toolchain: "1.93.0"
          components: rustfmt,clippy

      - name: Apply stable pathname identity projection
        shell: bash
        run: |
          set -euo pipefail
          git --no-replace-objects checkout --detach "$BASE_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all --ignore-submodules=none)"
          python3 - <<'PY'
          from pathlib import Path
          import re
          from textwrap import dedent

          source = Path('tools/verify_init_agent_activation.py')
          text = source.read_text(encoding='utf-8')
          marker = 'def read_regular('
          if text.count(marker) != 1:
              raise SystemExit('expected exactly one read_regular definition')
          helper = dedent(
              '''\
              def _stable_stat_identity(value: object) -> tuple[int, ...]:
                  """Return pathname identity and mutation fields, excluding read-induced atime."""
                  return (
                      int(value.st_dev),
                      int(value.st_ino),
                      int(value.st_mode),
                      int(value.st_nlink),
                      int(value.st_uid),
                      int(value.st_gid),
                      int(value.st_size),
                      int(value.st_mtime_ns),
                      int(value.st_ctime_ns),
                  )


              '''
          )
          text = text.replace(marker, helper + marker, 1)
          pattern = re.compile(
              r'(?P<indent>^[ \t]+)current = os\.lstat\(path\)\n'
              r'(?P=indent)if current != before:\n'
              r'(?P=indent)    raise ContractError\((?P<message>[^\n]+)\)\n',
              re.MULTILINE,
          )
          matches = list(pattern.finditer(text))
          if len(matches) != 1:
              raise SystemExit(f'expected one full-stat pathname comparison, found {len(matches)}')
          match = matches[0]
          indent = match.group('indent')
          replacement = (
              f'{indent}current = os.lstat(path)\n'
              f'{indent}if _stable_stat_identity(current) != _stable_stat_identity(before):\n'
              f'{indent}    raise ContractError({match.group("message")})\n'
          )
          text = text[:match.start()] + replacement + text[match.end():]
          source.write_text(text, encoding='utf-8')

          test_path = Path('tools/tests/test_verify_init_agent_activation_atime.py')
          if test_path.exists():
              raise SystemExit('atime regression test path already exists')
          test_path.write_text(
              dedent(
                  '''\
                  from __future__ import annotations

                  import os
                  import stat
                  import unittest

                  from tools import verify_init_agent_activation as target


                  class StableStatIdentityTests(unittest.TestCase):
                      @staticmethod
                      def _record(
                          *,
                          inode: int = 23,
                          size: int = 17,
                          atime: int = 100,
                          mtime: int = 200,
                          ctime: int = 300,
                      ) -> os.stat_result:
                          return os.stat_result((
                              stat.S_IFREG | 0o600,
                              inode,
                              11,
                              1,
                              1000,
                              1000,
                              size,
                              atime,
                              mtime,
                              ctime,
                          ))

                      def test_read_induced_atime_drift_is_not_pathname_drift(self) -> None:
                          before = self._record(atime=100)
                          after = self._record(atime=101)
                          self.assertEqual(
                              target._stable_stat_identity(before),
                              target._stable_stat_identity(after),
                          )

                      def test_identity_and_content_metadata_drift_remain_rejected(self) -> None:
                          before = self._record()
                          for after in (
                              self._record(inode=24),
                              self._record(size=18),
                              self._record(mtime=201),
                              self._record(ctime=301),
                          ):
                              with self.subTest(after=after):
                                  self.assertNotEqual(
                                      target._stable_stat_identity(before),
                                      target._stable_stat_identity(after),
                                  )


                  if __name__ == '__main__':
                      unittest.main()
                  '''
              ),
              encoding='utf-8',
          )
          PY
          observed="$(git status --porcelain=v1 --untracked-files=all --ignore-submodules=none | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            ' M tools/verify_init_agent_activation.py' \
            '?? tools/tests/test_verify_init_agent_activation_atime.py' | LC_ALL=C sort)"
          test "$observed" = "$expected"
          python3 -m py_compile \
            tools/verify_init_agent_activation.py \
            tools/tests/test_verify_init_agent_activation_atime.py
          git diff --check

      - name: Execute focused portability matrix
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest \
            tools.tests.test_verify_init_agent_activation \
            tools.tests.test_verify_init_agent_activation_atime -v

      - name: Execute complete repository qualification matrix
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/docs/generate_global_docs.py --check
          python3 tools/docs/verify_global_docs.py
          python3 tools/docs/verify_repository_authority.py
          python3 -m unittest discover -s tools/tests -p 'test*.py' -v
          cargo fmt --all -- --check
          cargo test --locked --all-targets
          cargo clippy --locked --all-targets -- -D warnings
          cargo fmt --manifest-path planned/Cargo.toml --all -- --check
          cargo test --locked --manifest-path planned/Cargo.toml --workspace --all-targets
          cargo clippy --locked --manifest-path planned/Cargo.toml --workspace --all-targets -- -D warnings
          git diff --check
          observed="$(git status --porcelain=v1 --untracked-files=all --ignore-submodules=none | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            ' M tools/verify_init_agent_activation.py' \
            '?? tools/tests/test_verify_init_agent_activation_atime.py' | LC_ALL=C sort)"
          test "$observed" = "$expected"

      - name: Publish focused candidate through absence lease
        shell: bash
        run: |
          set -euo pipefail
          test "$(git --no-replace-objects rev-parse HEAD)" = "$BASE_SHA"
          test ! -e .github/workflows/tmp-init-activation-atime-identity-repair-v2.yml
          git config user.name 'Qian QI'
          git config user.email '102159240+ProfHepta@users.noreply.github.com'
          git add \
            tools/verify_init_agent_activation.py \
            tools/tests/test_verify_init_agent_activation_atime.py
          observed="$(git diff --cached --name-only | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            'tools/tests/test_verify_init_agent_activation_atime.py' \
            'tools/verify_init_agent_activation.py' | LC_ALL=C sort)"
          test "$observed" = "$expected"
          git diff --cached --check
          git commit \
            -m 'fix(init): exclude atime from pathname identity checks' \
            -m 'Compare stable device, inode, mode, link, owner, size, mtime and ctime fields after bounded descriptor reads. Read-induced atime movement is not pathname replacement, while real identity and content-metadata drift remain fail-closed. Add positive atime and negative mutation regressions.'
          final="$(git --no-replace-objects rev-parse HEAD)"
          git push \
            --force-with-lease="refs/heads/${TARGET_BRANCH}:" \
            origin "HEAD:refs/heads/${TARGET_BRANCH}"
          printf 'published_head=%s\n' "$final"
