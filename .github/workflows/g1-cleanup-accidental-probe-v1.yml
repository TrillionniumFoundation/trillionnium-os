name: G1 cleanup accidental schema-probe objects

"on":
  push:
    branches:
      - ops/g1-final-governor-v12-20260906
    paths:
      - .github/workflows/g1-cleanup-accidental-probe-v1.yml
  workflow_dispatch:

permissions: {}

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Close only exact accidental objects
        shell: bash
        env:
          G1_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request, urllib.error
          repo=os.environ['GITHUB_REPOSITORY']
          root=f'https://api.github.com/repos/{repo}'
          token=os.environ['G1_TOKEN']
          headers={
              'Authorization':f'Bearer {token}',
              'Accept':'application/vnd.github+json',
              'X-GitHub-Api-Version':'2022-11-28',
              'User-Agent':'g1-accidental-probe-cleanup',
          }
          def request(method,path,payload=None):
              data=None if payload is None else json.dumps(payload,separators=(',',':')).encode()
              h=dict(headers)
              if data is not None:h['Content-Type']='application/json'
              req=urllib.request.Request(root+path,method=method,data=data,headers=h)
              with urllib.request.urlopen(req,timeout=30) as response:
                  raw=response.read()
                  return None if not raw else json.loads(raw)
          closed=[]
          for issue in request('GET','/issues?state=open&per_page=100'):
              if issue.get('pull_request'):
                  continue
              if issue.get('title') != 'DO NOT CREATE - schema probe':
                  continue
              number=int(issue['number'])
              request('POST',f'/issues/{number}/comments',{
                  'body':'Closed immediately: this object was created by an accidental connector schema-routing probe and carries no project requirement, evidence, or authority.'
              })
              request('PATCH',f'/issues/{number}',{'state':'closed','state_reason':'not_planned'})
              closed.append({'type':'issue','number':number})
          owner=repo.split('/',1)[0]
          head=urllib.parse.quote(f'{owner}:ops/g1-final-governor-v12-20260906',safe='')
          for pr in request('GET',f'/pulls?state=open&head={head}&per_page=100'):
              if pr.get('title') != 'ops(g1): final exact-head closure governor v12':
                  continue
              number=int(pr['number'])
              request('POST',f'/issues/{number}/comments',{
                  'body':'Closed without merge: this temporary control PR was created by an accidental connector routing attempt. The ops branch remains an isolated workflow control surface only.'
              })
              request('PATCH',f'/pulls/{number}',{'state':'closed'})
              closed.append({'type':'pull_request','number':number})
          print(json.dumps({'closed':closed},sort_keys=True))
          PY
