name: G1 CodeQL alert read-only inspection v1

on:
  push:
    branches:
      - ops/g1-adb-race-v11-20260906
    paths:
      - .github/workflows/g1-codeql-alert-inspect-v1.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: g1-codeql-alert-inspect-v1
  cancel-in-progress: false

jobs:
  inspect:
    name: Read PR CodeQL alert metadata without candidate checkout
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      checks: read
      security-events: read
    steps:
      - name: Fetch and minimize exact failed-check annotations
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: "41"
          CHECK_RUN_ID: "101417158260"
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          out="${RUNNER_TEMP}/g1-codeql-alerts"
          install -d -m 0700 "$out"
          curl --fail-with-body --silent --show-error --location \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${REPOSITORY}/code-scanning/alerts?pr=${PR_NUMBER}&state=open&per_page=100" \
            --output "$out/alerts.raw.json"
          curl --fail-with-body --silent --show-error --location \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${REPOSITORY}/check-runs/${CHECK_RUN_ID}" \
            --output "$out/check.raw.json"
          curl --fail-with-body --silent --show-error --location \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${REPOSITORY}/check-runs/${CHECK_RUN_ID}/annotations?per_page=100" \
            --output "$out/annotations.raw.json"
          cd "$RUNNER_TEMP"
          unset PYTHONPATH PYTHONHOME
          /usr/bin/python3 -I - \
            "$out/alerts.raw.json" "$out/check.raw.json" "$out/annotations.raw.json" \
            "$out/minimized.json" <<'PY'
          import json
          from pathlib import Path
          import sys

          alerts = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          check = json.loads(Path(sys.argv[2]).read_text(encoding="utf-8"))
          annotations = json.loads(Path(sys.argv[3]).read_text(encoding="utf-8"))
          if not isinstance(alerts, list) or not isinstance(check, dict) or not isinstance(annotations, list):
              raise SystemExit("CodeQL inspection endpoints returned unexpected shapes")

          compact_alerts = []
          for alert in alerts:
              rule = alert.get("rule") or {}
              instance = alert.get("most_recent_instance") or {}
              location = instance.get("location") or {}
              message = instance.get("message") or {}
              compact_alerts.append({
                  "number": alert.get("number"),
                  "state": alert.get("state"),
                  "rule_id": rule.get("id"),
                  "rule_name": rule.get("name"),
                  "security_severity_level": rule.get("security_severity_level"),
                  "severity": rule.get("severity"),
                  "description": rule.get("description"),
                  "tool": (alert.get("tool") or {}).get("name"),
                  "ref": instance.get("ref"),
                  "commit_sha": instance.get("commit_sha"),
                  "path": location.get("path"),
                  "start_line": location.get("start_line"),
                  "end_line": location.get("end_line"),
                  "message": message.get("text"),
                  "classifications": instance.get("classifications"),
              })

          compact_annotations = []
          matched_numbers = set()
          for annotation in annotations:
              path = annotation.get("path")
              start = annotation.get("start_line")
              end = annotation.get("end_line")
              matches = [
                  alert for alert in compact_alerts
                  if alert["path"] == path
                  and alert["start_line"] == start
                  and (alert["end_line"] == end or end is None)
              ]
              for match in matches:
                  matched_numbers.add(match["number"])
              compact_annotations.append({
                  "path": path,
                  "start_line": start,
                  "end_line": end,
                  "annotation_level": annotation.get("annotation_level"),
                  "title": annotation.get("title"),
                  "message": annotation.get("message"),
                  "raw_details": annotation.get("raw_details"),
                  "matched_alerts": matches,
              })

          output = check.get("output") or {}
          value = {
              "schema": "org.trillionnium.g1-codeql-failed-check-inspection.v2",
              "repository": "TrillionniumFoundation/trillionnium-os",
              "pull_request": 41,
              "check_run": {
                  "id": check.get("id"),
                  "name": check.get("name"),
                  "head_sha": check.get("head_sha"),
                  "status": check.get("status"),
                  "conclusion": check.get("conclusion"),
                  "output_title": output.get("title"),
                  "annotations_count": output.get("annotations_count"),
              },
              "annotation_count": len(compact_annotations),
              "annotations": compact_annotations,
              "matched_alert_numbers": sorted(number for number in matched_numbers if number is not None),
              "open_alert_count": len(compact_alerts),
              "read_only": True,
              "candidate_checkout_performed": False,
              "candidate_code_executed": False,
          }
          if value["check_run"]["head_sha"] != "bf8671a0ccc3d511e33a696f4406d7d06a0613de":
              raise SystemExit("CodeQL check does not bind the expected exact PR head")
          if value["annotation_count"] != value["check_run"]["annotations_count"]:
              raise SystemExit("annotation pagination/count mismatch")
          Path(sys.argv[4]).write_text(
              json.dumps(value, sort_keys=True, indent=2) + "\n", encoding="utf-8"
          )
          print(json.dumps(value, sort_keys=True))
          PY
          rm -f "$out/alerts.raw.json" "$out/check.raw.json" "$out/annotations.raw.json"

      - name: Upload minimized inspection receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: g1-codeql-failed-check-inspection-pr41-${{ github.run_id }}
          path: ${{ runner.temp }}/g1-codeql-alerts/minimized.json
          if-no-files-found: error
          retention-days: 7
