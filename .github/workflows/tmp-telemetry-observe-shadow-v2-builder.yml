name: Temporary telemetry observe shadow v2 builder

on:
  push:
    branches:
      - ops/telemetry-observe-shadow-v2-builder-20260910
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: telemetry-observe-shadow-v2-builder
  cancel-in-progress: false

env:
  CONTROLLER_BRANCH: ops/telemetry-observe-shadow-v2-builder-20260910
  TARGET_BASE_SHA: b681cd856fccac1189496576f25d259752d2dcce
  TARGET_BASE_TREE: f96f88a9749c61b3ce0dde7167303c8261788f22
  CANDIDATE_BRANCH: codex/observe-shadow-telemetry-v2-20260910
  PART00_SHA256: d96ac0bbd13cc899e806286332fdd8e337b1a741a28e3c758dd82a882448da32
  PART01_SHA256: 1bb6d6706a3177765c06b966858fd669e9ad01988cb58311458afba081ced8ed
  PART02_SHA256: 6bcbabaefa3789b4275fc8088e720c0bd7591f19188b7af26057f1f5a38302db
  PART03_SHA256: 09721576d76036d41c1164e48cdee685868050b315c69d5b40fe9b6065bfef8f
  PAYLOAD_B64_BYTES: "23896"
  PAYLOAD_B64_SHA256: 07f4195881d3e3a0e21b77283c52f7eba6d2f33f50cc97fdc4bfca0fcf8c275b
  PAYLOAD_XZ_BYTES: "17920"
  PAYLOAD_XZ_SHA256: 77d8a9230e78971a909cc7f1223f6f898dbb3a333f11a5a5c94d5929146f27ad
  PAYLOAD_PATCH_BYTES: "139023"
  PAYLOAD_PATCH_SHA256: 34df83df8c67848128e07b3e7c8c65f838a53144adab89678c5362c8e9503cf2
  PYTHONDONTWRITEBYTECODE: "1"
  CARGO_TERM_COLOR: always

jobs:
  qualify-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact controller
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: true

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"

      - name: Set up Rust 1.93
        uses: dtolnay/rust-toolchain@d8dfd7155fea72af4ad34a8fe97364d210e2d020
        with:
          toolchain: "1.93.0"
          components: rustfmt,clippy

      - name: Authenticate, format, qualify and publish exact source
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME:?}" = "$CONTROLLER_BRANCH"
          test "$(git --no-replace-objects rev-parse HEAD)" = "${GITHUB_SHA:?}"

          parts=(
            ops/telemetry-observe-shadow-v2.part00.b64
            ops/telemetry-observe-shadow-v2.part01.b64
            ops/telemetry-observe-shadow-v2.part02.b64
            ops/telemetry-observe-shadow-v2.part03.b64
          )
          sizes=(6000 6000 6000 5896)
          digests=(
            "$PART00_SHA256"
            "$PART01_SHA256"
            "$PART02_SHA256"
            "$PART03_SHA256"
          )
          for index in 0 1 2 3; do
            path="${parts[$index]}"
            test -f "$path"
            test ! -L "$path"
            test "$(wc -c < "$path" | tr -d ' ')" = "${sizes[$index]}"
            printf '%s  %s\n' "${digests[$index]}" "$path" | sha256sum --check --strict
          done

          payload_b64="${RUNNER_TEMP:?}/telemetry-observe-shadow-v2.patch.xz.b64"
          payload_xz="${RUNNER_TEMP:?}/telemetry-observe-shadow-v2.patch.xz"
          payload_patch="${RUNNER_TEMP:?}/telemetry-observe-shadow-v2.patch"
          cat "${parts[@]}" > "$payload_b64"
          test "$(wc -c < "$payload_b64" | tr -d ' ')" = "$PAYLOAD_B64_BYTES"
          printf '%s  %s\n' "$PAYLOAD_B64_SHA256" "$payload_b64" | sha256sum --check --strict
          base64 --decode "$payload_b64" > "$payload_xz"
          test "$(wc -c < "$payload_xz" | tr -d ' ')" = "$PAYLOAD_XZ_BYTES"
          printf '%s  %s\n' "$PAYLOAD_XZ_SHA256" "$payload_xz" | sha256sum --check --strict
          xz --decompress --stdout "$payload_xz" > "$payload_patch"
          test "$(wc -c < "$payload_patch" | tr -d ' ')" = "$PAYLOAD_PATCH_BYTES"
          printf '%s  %s\n' "$PAYLOAD_PATCH_SHA256" "$payload_patch" | sha256sum --check --strict

          git --no-replace-objects cat-file -e "${TARGET_BASE_SHA}^{commit}"
          test "$(git --no-replace-objects rev-parse "${TARGET_BASE_SHA}^{tree}")" = "$TARGET_BASE_TREE"
          if git ls-remote --exit-code --heads origin "refs/heads/${CANDIDATE_BRANCH}" >/dev/null 2>&1; then
            echo "candidate branch already exists; absence lease refused" >&2
            exit 1
          fi

          worktree="${RUNNER_TEMP:?}/telemetry-observe-shadow-v2-source"
          git worktree add --detach "$worktree" "$TARGET_BASE_SHA"
          cd "$worktree"
          test "$(git --no-replace-objects rev-parse HEAD)" = "$TARGET_BASE_SHA"
          test "$(git --no-replace-objects rev-parse HEAD^{tree})" = "$TARGET_BASE_TREE"
          test -z "$(git status --porcelain=v1 --untracked-files=all --ignore-submodules=none)"
          git apply --binary --index --check "$payload_patch"
          git apply --binary --index "$payload_patch"

          cargo fmt --manifest-path planned/Cargo.toml --all
          git add -- \
            planned/crates/trillionnium-telemetry/src/catalog.rs \
            planned/crates/trillionnium-telemetry/src/lib.rs

          expected="${RUNNER_TEMP:?}/telemetry-observe-shadow-v2.expected"
          actual="${RUNNER_TEMP:?}/telemetry-observe-shadow-v2.actual"
          printf '%s\n' \
            'docs/START_HERE.md' \
            'docs/generated/METRIC_STATUS.md' \
            'docs/generated/TRACEABILITY.tsv' \
            'docs/machine/doc-set.v1.json' \
            'docs/machine/metric-catalog.v1.json' \
            'docs/machine/requirement-graph.v1.json' \
            'docs/modules/MOD-GLOBAL-CONTROL.md' \
            'docs/modules/MOD-TELEMETRY.md' \
            'planned/crates/trillionnium-telemetry/src/catalog.rs' \
            'planned/crates/trillionnium-telemetry/src/lib.rs' \
            'tools/docs/generate_global_docs.py' \
            'tools/docs/verify_global_docs.py' \
            'tools/tests/test_metric_catalog.py' > "$expected"
          git diff --cached --name-only | LC_ALL=C sort > "$actual"
          diff --unified "$expected" "$actual"
          git diff --cached --check

          python3 -m unittest tools.tests.test_metric_catalog -v
          python3 tools/docs/generate_global_docs.py --check
          python3 tools/docs/verify_global_docs.py
          python3 tools/docs/verify_repository_authority.py
          cargo fmt --manifest-path planned/Cargo.toml --all -- --check
          cargo test --locked --manifest-path planned/Cargo.toml -p trillionnium-telemetry --all-targets
          cargo clippy --locked --manifest-path planned/Cargo.toml -p trillionnium-telemetry --all-targets -- -D warnings
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
          git diff --cached --check

          git config user.name 'Qian QI'
          git config user.email '102159240+ProfHepta@users.noreply.github.com'
          git commit -m 'feat(telemetry): add catalog-bound observe and shadow metrics' \
            -m 'Add a 43-metric machine authority, generated status, catalog-aware bounded ingestion, explicit sequence/clock/eviction gaps, dimension cardinality and privacy enforcement, durable-complete projection receipts, and deterministic OBSERVE/SHADOW-only decisions. Preserve semantic_authority=false, automatic_redispatch=false and active_control=false.'
          candidate_head="$(git --no-replace-objects rev-parse HEAD)"
          candidate_tree="$(git --no-replace-objects rev-parse HEAD^{tree})"
          test "$(git --no-replace-objects rev-parse HEAD^)" = "$TARGET_BASE_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all --ignore-submodules=none)"
          git push --force-with-lease="refs/heads/${CANDIDATE_BRANCH}:" \
            origin "HEAD:refs/heads/${CANDIDATE_BRANCH}"

          receipt="${RUNNER_TEMP:?}/telemetry-observe-shadow-v2-candidate.env"
          {
            printf 'schema=org.trillionnium.telemetry-observe-shadow-builder-receipt.v1\n'
            printf 'controller_head=%s\n' "${GITHUB_SHA:?}"
            printf 'target_base=%s\n' "$TARGET_BASE_SHA"
            printf 'target_base_tree=%s\n' "$TARGET_BASE_TREE"
            printf 'candidate_branch=%s\n' "$CANDIDATE_BRANCH"
            printf 'candidate_head=%s\n' "$candidate_head"
            printf 'candidate_tree=%s\n' "$candidate_tree"
            printf 'payload_patch_sha256=%s\n' "$PAYLOAD_PATCH_SHA256"
            printf 'metric_count=43\n'
            printf 'changed_file_count=13\n'
            printf 'semantic_authority=false\n'
            printf 'automatic_redispatch=false\n'
            printf 'active_control=false\n'
            printf 'public_release=false\n'
            printf 'qualification=L1_SOURCE_ONLY\n'
          } > "$receipt"
          cat "$receipt"

      - name: Upload non-authorizing builder receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: telemetry-observe-shadow-v2-builder-${{ github.sha }}
          path: ${{ runner.temp }}/telemetry-observe-shadow-v2-candidate.env
          if-no-files-found: error
          retention-days: 30
