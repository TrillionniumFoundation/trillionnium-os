name: one-shot owner-open R5 PR ready transition

on:
  push:
    branches:
      - codex/owner-open-r5-gap-closure-20260829
    paths:
      - ".github/workflows/owner-open-r5-ready-transition-one-shot.yml"

permissions:
  contents: read
  pull-requests: write

jobs:
  mark-ready:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Mark PR 21 ready for independent review
        run: |
          set -euo pipefail
          gh api graphql \
            -f query='mutation($id: ID!) { markPullRequestReadyForReview(input: {pullRequestId: $id}) { pullRequest { number isDraft } } }' \
            -f id='PR_kwDOUFzoVc8AAAABBbvdJg'
          test "$(gh api repos/TrillionniumFoundation/trillionnium-os/pulls/21 --jq '.draft')" = "false"
