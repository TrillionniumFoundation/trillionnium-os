name: one-shot owner-open R6 worker terminal ordering repair

on:
  push:
    branches:
      - codex/owner-open-r5-gap-closure-20260829
    paths:
      - ".github/workflows/owner-open-r6-terminal-ordering-one-shot.yml"

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: codex/owner-open-r5-gap-closure-20260829

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"

      - name: Validate one-shot staging boundary
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          actual="$(git diff --name-only "${GITHUB_SHA}^" "$GITHUB_SHA" | sort)"
          expected=".github/workflows/owner-open-r6-terminal-ordering-one-shot.yml"
          test "$actual" = "$expected"

      - name: Install locked Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install 1.93.0 \
            --profile minimal \
            --component rustfmt \
            --component clippy
          rustup default 1.93.0
          rustc --version
          cargo --version

      - name: Apply ordered terminal delivery repair
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path("apps/trillionnium-owner-open-host/src/bin/r5_control_host_v2.rs")
          regression = Path("tools/tests/test_owner_open_worker_terminal_order.py")

          old_import = 'use std::path::PathBuf;\n'
          new_import = 'use std::panic::{AssertUnwindSafe, catch_unwind};\nuse std::path::PathBuf;\n'
          old_worker = '                            .spawn(move || {\n                                let runner = TurnRunner::new(worker_registry);\n                                let event_sender = worker_sender.clone();\n                                let mut sink = move |event: &TurnEvent| -> Result<(), String> {\n                                    event_sender\n                                        .send(HostMessage::TurnEvent(Box::new(event.clone())))\n                                        .map_err(|_| "Host event receiver disconnected".to_string())\n                                };\n                                let result = runner\n                                    .run_with_sink_and_cancellation(\n                                        loop_request,\n                                        &mut provider,\n                                        &worker_cancellation,\n                                        &mut sink,\n                                    )\n                                    .map(|run| run.terminal)\n                                    .map_err(|error| error.to_string());\n                                let _ = worker_sender.send(HostMessage::TurnComplete(result));\n                            })\n'
          new_worker = '                            .spawn(move || {\n                                let result = catch_unwind(AssertUnwindSafe(|| {\n                                    let runner = TurnRunner::new(worker_registry);\n                                    let event_sender = worker_sender.clone();\n                                    let mut sink = move |event: &TurnEvent| -> Result<(), String> {\n                                        event_sender\n                                            .send(HostMessage::TurnEvent(Box::new(event.clone())))\n                                            .map_err(|_| {\n                                                "Host event receiver disconnected".to_string()\n                                            })\n                                    };\n                                    runner\n                                        .run_with_sink_and_cancellation(\n                                            loop_request,\n                                            &mut provider,\n                                            &worker_cancellation,\n                                            &mut sink,\n                                        )\n                                        .map(|run| run.terminal)\n                                        .map_err(|error| error.to_string())\n                                }))\n                                .unwrap_or_else(|_| {\n                                    Err("active turn worker panicked".to_string())\n                                });\n                                let _ = worker_sender.send(HostMessage::TurnComplete(result));\n                            })\n'
          old_timeout = '            Err(RecvTimeoutError::Timeout) => {\n                let worker_finished = active\n                    .as_ref()\n                    .and_then(|active_turn| active_turn.worker.as_ref())\n                    .is_some_and(JoinHandle::is_finished);\n                if worker_finished {\n                    let mut active_turn = active.take().expect("finished worker has an active turn");\n                    let worker_result = active_turn\n                        .worker\n                        .take()\n                        .expect("active turn has a worker")\n                        .join();\n                    let result = match worker_result {\n                        Ok(()) => Err(\n                            "active turn worker exited without a terminal message".to_string(),\n                        ),\n                        Err(_) => Err("active turn worker panicked".to_string()),\n                    };\n                    finish_active_turn(\n                        active_turn,\n                        result,\n                        &mut writer,\n                        &mut output,\n                        persistence,\n                        limits.max_frame_bytes,\n                        &mut delivery_attached,\n                        &mut delivery_error,\n                    );\n                }\n            }\n'
          new_timeout = '            Err(RecvTimeoutError::Timeout) => {}\n'
          regression_source = '"""Lock the single-channel terminal ordering invariant in the R5 Host."""\n\nfrom pathlib import Path\nimport unittest\n\n\nSOURCE = Path(\n    "apps/trillionnium-owner-open-host/src/bin/r5_control_host_v2.rs"\n)\n\n\nclass WorkerTerminalOrderingTests(unittest.TestCase):\n    def test_terminal_delivery_cannot_bypass_the_host_message_queue(self) -> None:\n        text = SOURCE.read_text(encoding="utf-8")\n        self.assertIn("catch_unwind(AssertUnwindSafe(|| {", text)\n        self.assertIn(\n            "worker_sender.send(HostMessage::TurnComplete(result))",\n            text,\n        )\n        self.assertIn("Err(RecvTimeoutError::Timeout) => {}", text)\n        self.assertNotIn("JoinHandle::is_finished", text)\n        self.assertNotIn(\n            "active turn worker exited without a terminal message",\n            text,\n        )\n\n\nif __name__ == "__main__":\n    unittest.main()\n'


          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"{label}: expected exactly one source match, observed {count}"
                  )
              return text.replace(old, new, 1)


          text = source.read_text(encoding="utf-8")
          text = replace_once(text, old_import, new_import, "panic import")
          text = replace_once(text, old_worker, new_worker, "worker terminal path")
          text = replace_once(text, old_timeout, new_timeout, "timeout bypass")
          source.write_text(text, encoding="utf-8")

          if regression.exists():
              raise SystemExit(f"refusing to overwrite existing regression: {regression}")
          regression.write_text(regression_source, encoding="utf-8")
          PY
          cargo fmt --all
          python3 -m unittest \
            tools.tests.test_owner_open_worker_terminal_order -v
          git diff --check

      - name: Stress the formerly racy terminal path
        run: |
          set -euo pipefail
          for attempt in $(seq 1 32); do
            echo "terminal-ordering attempt ${attempt}/32"
            cargo test --locked \
              -p trillionnium-owner-open-host \
              --test r5_stream_flow_control \
              flow_control_without_durable_store_is_rejected_without_stopping_the_turn \
              -- --exact
          done

      - name: Remove transient write surface
        run: |
          set -euo pipefail
          rm -f .github/workflows/owner-open-r6-terminal-ordering-one-shot.yml

      - name: Verify Rust and canonical source boundaries
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo clippy --locked \
            -p trillionnium-owner-open-host \
            --all-targets \
            -- -D warnings
          python3 tools/verify-owner-open-r5-workflow-boundaries.py --json
          python3 tools/verify-owner-open-r5.py --json
          python3 tools/verify-owner-open-r5-gap-evidence.py --json
          git diff --check

      - name: Commit the source repair
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          actual="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' \
            .github/workflows/owner-open-r6-terminal-ordering-one-shot.yml \
            apps/trillionnium-owner-open-host/src/bin/r5_control_host_v2.rs \
            tools/tests/test_owner_open_worker_terminal_order.py | sort)"
          test "$actual" = "$expected"
          git commit -m "fix(host): serialize worker terminal delivery"
          git push origin HEAD:codex/owner-open-r5-gap-closure-20260829
