name: G1 materialize registry sharding

on:
  push:
    branches:
      - codex/g1-gap-closure-r1-20260831
    paths:
      - .github/workflows/g1-materialize-registry-sharding.yml

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: codex/g1-gap-closure-r1-20260831
      - uses: dtolnay/rust-toolchain@d8dfd7155fea72af4ad34a8fe97364d210e2d020
        with:
          toolchain: "1.93.0"
          components: rustfmt,clippy
      - name: Apply, format, and verify registry sharding patch
        env:
          PATCH_GZ_B64: 
        run: |
          set -euo pipefail
          printf '%s' "$PATCH_GZ_B64" | base64 -d | gzip -d > /tmp/registry-sharding.patch
          git apply --index /tmp/registry-sharding.patch
          cargo fmt --all
          cargo test --locked -p trillionnium-owner-open-call-registry --all-targets
          cargo test --locked -p trillionnium-owner-open-job-registry --all-targets
          cargo clippy --locked -p trillionnium-owner-open-call-registry --all-targets -- -D warnings
          cargo clippy --locked -p trillionnium-owner-open-job-registry --all-targets -- -D warnings
      - name: Commit verified materialization
        run: |
          set -euo pipefail
          rm .github/workflows/g1-materialize-registry-sharding.yml
          git add -A
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "feat(g1): shard call and job registries" -m "Use a stable 64-way shard function with global bounded entry accounting and atomic generation allocation, preserving per-key linearity while allowing unrelated keys to progress independently." -m "Signed-off-by: OpenAI Codex <noreply@openai.com>"
          git push origin HEAD:codex/g1-gap-closure-r1-20260831
