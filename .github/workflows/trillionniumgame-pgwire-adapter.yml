# Current-head refresh: 2026-08-29
name: TrillionniumGame PG-wire persistence adapter

on:
  push:
    branches:
      - ci/trillionniumgame-exact-head-relay-v1
    paths:
      - '.github/workflows/trillionniumgame-pgwire-adapter.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trillionniumgame-pgwire-adapter-${{ github.ref }}
  cancel-in-progress: false

env:
  TARGET_REPOSITORY: TrillionniumFoundation/TrillionniumGame
  TARGET_SHA: bcee51bc0c80ced445b19b0111cadf04f9540280
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse

jobs:
  materialize-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact adapter head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ env.TARGET_REPOSITORY }}
          ref: ${{ env.TARGET_SHA }}
          path: source
          fetch-depth: 1
          persist-credentials: false
      - name: Install Rust 1.85.1
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.85.1
      - name: Materialize lockfile and validate exact head
        working-directory: source
        run: bash scripts/ci-pgwire-persistence-adapter.sh materialize
      - name: Upload materialized source evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trillionniumgame-pgwire-materialized-${{ env.TARGET_SHA }}-run-${{ github.run_number }}
          path: source/pgwire-evidence/materialize
          if-no-files-found: error
          retention-days: 30

  postgresql-live:
    needs: materialize-and-validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact adapter head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ env.TARGET_REPOSITORY }}
          ref: ${{ env.TARGET_SHA }}
          path: source
          fetch-depth: 1
          persist-credentials: false
      - name: Install Rust 1.85.1
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal
          rustup default 1.85.1
      - name: Execute live PostgreSQL adapter contract
        working-directory: source
        run: bash scripts/ci-pgwire-persistence-adapter.sh postgresql
      - name: Upload PostgreSQL adapter evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trillionniumgame-pgwire-postgresql-${{ env.TARGET_SHA }}-run-${{ github.run_number }}
          path: source/pgwire-evidence/postgresql
          if-no-files-found: error
          retention-days: 30

  cockroachdb-live:
    needs: materialize-and-validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact adapter head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ env.TARGET_REPOSITORY }}
          ref: ${{ env.TARGET_SHA }}
          path: source
          fetch-depth: 1
          persist-credentials: false
      - name: Install Rust 1.85.1
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal
          rustup default 1.85.1
      - name: Execute live CockroachDB adapter contract
        working-directory: source
        run: bash scripts/ci-pgwire-persistence-adapter.sh cockroachdb
      - name: Upload CockroachDB adapter evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trillionniumgame-pgwire-cockroachdb-${{ env.TARGET_SHA }}-run-${{ github.run_number }}
          path: source/pgwire-evidence/cockroachdb
          if-no-files-found: error
          retention-days: 30
