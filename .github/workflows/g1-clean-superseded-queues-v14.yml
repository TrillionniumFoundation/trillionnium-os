name: G1 cancel superseded consolidation queues v14

on:
  push:
    branches: [ops/g1-exact-source-recover-v13-20260906]
    paths: [.github/workflows/g1-clean-superseded-queues-v14.yml]

permissions:
  actions: write
  contents: read
  pull-requests: read

concurrency:
  group: g1-clean-superseded-consolidation-queues-v14
  cancel-in-progress: false

env:
  REPOSITORY: TrillionniumFoundation/trillionnium-os
  TARGET_HEAD: 4b9af095813df1a83b65d029d061d889b882d5e7
  TARGET_BRANCH: codex/g1-all-gap-closure-20260904
  SUPERSEDED_PREFIX: codex/g1-live-consolidation

jobs:
  cancel:
    name: Cancel only queued runs on superseded consolidation branches
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify current subject and cancel exact superseded queue entries
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          api="https://api.github.com/repos/${REPOSITORY}"
          headers=(
            -H "Authorization: Bearer ${GH_TOKEN}"
            -H 'Accept: application/vnd.github+json'
            -H 'X-GitHub-Api-Version: 2022-11-28'
          )
          /usr/bin/curl --fail-with-body --silent --show-error --proto '=https' --tlsv1.2 \
            "${headers[@]}" "${api}/git/ref/heads/${TARGET_BRANCH}" > "$RUNNER_TEMP/ref.json"
          /usr/bin/curl --fail-with-body --silent --show-error --proto '=https' --tlsv1.2 \
            "${headers[@]}" "${api}/pulls/41" > "$RUNNER_TEMP/pr.json"
          /usr/bin/curl --fail-with-body --silent --show-error --proto '=https' --tlsv1.2 \
            "${headers[@]}" "${api}/actions/runs?status=queued&per_page=100" > "$RUNNER_TEMP/queued.json"
          /usr/bin/python3 -I - "$RUNNER_TEMP/ref.json" "$RUNNER_TEMP/pr.json" "$RUNNER_TEMP/queued.json" "$RUNNER_TEMP/selected.json" <<'PY'
          import json, os, sys
          from pathlib import Path
          ref, pr, queued = [json.loads(Path(p).read_text()) for p in sys.argv[1:4]]
          assert ref["object"]["sha"] == os.environ["TARGET_HEAD"]
          assert pr["state"] == "open" and pr["draft"] is True
          assert pr["head"]["sha"] == os.environ["TARGET_HEAD"]
          selected = []
          for run in queued.get("workflow_runs", []):
              branch = run.get("head_branch") or ""
              if not branch.startswith(os.environ["SUPERSEDED_PREFIX"]):
                  continue
              assert run["status"] == "queued"
              assert run["head_sha"] != os.environ["TARGET_HEAD"]
              selected.append({
                  "id": run["id"],
                  "name": run["name"],
                  "head_branch": branch,
                  "head_sha": run["head_sha"],
                  "created_at": run["created_at"],
              })
          Path(sys.argv[4]).write_text(json.dumps(selected, sort_keys=True))
          print(json.dumps({"selected_count": len(selected), "selected": selected}, sort_keys=True))
          PY
          /usr/bin/python3 -I - "$RUNNER_TEMP/selected.json" > "$RUNNER_TEMP/ids" <<'PY'
          import json, sys
          from pathlib import Path
          for item in json.loads(Path(sys.argv[1]).read_text()):
              print(item["id"])
          PY
          : > "$RUNNER_TEMP/results.jsonl"
          while IFS= read -r run_id; do
            test -n "$run_id" || continue
            code="$(/usr/bin/curl --silent --show-error --proto '=https' --tlsv1.2 \
              "${headers[@]}" --request POST --output "$RUNNER_TEMP/cancel-${run_id}.json" \
              --write-out '%{http_code}' "${api}/actions/runs/${run_id}/cancel")"
            test "$code" = 202 || test "$code" = 409
            printf '{"run_id":%s,"http_status":%s}\n' "$run_id" "$code" >> "$RUNNER_TEMP/results.jsonl"
          done < "$RUNNER_TEMP/ids"
          /usr/bin/python3 -I - "$RUNNER_TEMP/selected.json" "$RUNNER_TEMP/results.jsonl" > "$RUNNER_TEMP/receipt.json" <<'PY'
          import json, os, sys
          from pathlib import Path
          selected = json.loads(Path(sys.argv[1]).read_text())
          results = [json.loads(line) for line in Path(sys.argv[2]).read_text().splitlines() if line]
          assert len(selected) == len(results)
          print(json.dumps({
              "schema": "org.trillionnium.g1-superseded-queue-cleanup.v1",
              "repository": os.environ["REPOSITORY"],
              "current_target_head": os.environ["TARGET_HEAD"],
              "superseded_branch_prefix": os.environ["SUPERSEDED_PREFIX"],
              "selected": selected,
              "results": results,
              "current_candidate_touched": False,
              "external_evidence_lane_touched": False,
              "administrator_bypass": False,
              "public_release": False,
          }, sort_keys=True))
          PY
          cat "$RUNNER_TEMP/receipt.json"

      - name: Retain bounded cleanup receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: g1-superseded-queue-cleanup-v14
          path: ${{ runner.temp }}/receipt.json
          if-no-files-found: error
          retention-days: 7
