name: Owner-Open R13 runner scheduling probe

on:
  push:
    branches:
      - ops/owner-open-r13-runner-probe-20260831
    paths:
      - .github/workflows/owner-open-r13-runner-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record runner identity
        shell: bash
        run: |
          set -euo pipefail
          printf 'runner_os=%s\nrunner_arch=%s\nrunner_name=%s\n' "$RUNNER_OS" "$RUNNER_ARCH" "$RUNNER_NAME"
