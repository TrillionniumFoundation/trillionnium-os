name: ChatGPT PR63 carrier identity diagnostic

on:
  push:
    branches:
      - ops/chatgpt-pr63-openat-builder-20260909

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CARRIER_BRANCH: ops/chatgpt-pr63-openat-carrier-20260909
      CARRIER_COMMIT: eca76fd0fe0fcc235d1581942340d32e0fd5528c
    steps:
      - name: Check out diagnostic source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Print normalized carrier identities
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$CARRIER_BRANCH"
          test "$(git --no-replace-objects rev-parse FETCH_HEAD)" = "$CARRIER_COMMIT"
          carrier="${RUNNER_TEMP}/carrier"
          : > "$carrier"
          for part in 00 01 02 03 04 05 06; do
            raw="${RUNNER_TEMP}/${part}.raw"
            normalized="${RUNNER_TEMP}/${part}.b64"
            git show "$CARRIER_COMMIT:ops/pr63-openat.part${part}" > "$raw"
            tr -d '\r\n\t ' < "$raw" > "$normalized"
            printf 'part%s bytes=' "$part"
            wc -c < "$normalized" | tr -d ' '
            printf 'part%s sha256=' "$part"
            sha256sum "$normalized" | cut -d' ' -f1
            cat "$normalized" >> "$carrier"
          done
          printf 'carrier bytes='
          wc -c < "$carrier" | tr -d ' '
          printf 'carrier sha256='
          sha256sum "$carrier" | cut -d' ' -f1
