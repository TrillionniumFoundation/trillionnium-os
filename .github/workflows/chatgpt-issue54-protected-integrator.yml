name: ChatGPT issue54 protected lifecycle integrator

on:
  push:
    branches:
      - ops/chatgpt-source-export-20260908
    paths:
      - .github/workflows/chatgpt-issue54-protected-integrator.yml

permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: read
  actions: read

concurrency:
  group: chatgpt-issue54-protected-integrator
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CONTROL_BRANCH: ops/chatgpt-source-export-20260908
      RECOVERED_PATCH_SHA256: d85a86d6a6bd513bdbc6646d850e2cd5317158191ffe7df24be6367a451c9fa2
      TARGET_BRANCH: codex/effect-lifecycle-v2-20260909
      ISSUE_NUMBER: '54'
      DEPENDENCY_ISSUE: '53'
    steps:
      - name: Wait for issue53 protected integration
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 2700))
          while (( SECONDS < deadline )); do
            if test "$(gh api "repos/${GITHUB_REPOSITORY}/issues/${DEPENDENCY_ISSUE}" --jq '.state')" = closed; then
              main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq '.commit.sha')"
              if gh api -H 'Accept: application/vnd.github.raw+json' \
                "repos/${GITHUB_REPOSITORY}/contents/docs/machine/product-profile-catalog.v1.json?ref=${main_sha}" \
                | grep -q 'org.trillionnium.product-profile-catalog.v1'; then
                printf '%s\n' "$main_sha" > "${RUNNER_TEMP}/base"
                exit 0
              fi
            fi
            sleep 15
          done
          exit 1

      - name: Check out exact current main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: main
          persist-credentials: true

      - name: Recover and apply the bound lifecycle patch
        shell: bash
        run: |
          set -euo pipefail
          base="$(cat "${RUNNER_TEMP}/base")"
          test "$(git --no-replace-objects rev-parse HEAD)" = "$base"
          git fetch --no-tags origin "$CONTROL_BRANCH"
          git show "origin/$CONTROL_BRANCH:ops/issue54.patch.gz.b64" > "${RUNNER_TEMP}/carrier.txt"
          python3 - <<'PY'
          import base64
          import hashlib
          import os
          from pathlib import Path
          import zlib

          source = Path(os.environ["RUNNER_TEMP"]) / "carrier.txt"
          output = Path(os.environ["RUNNER_TEMP"]) / "issue54.patch"
          alphabet = frozenset("ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=")
          encoded = "".join(ch for ch in source.read_text(encoding="ascii") if ch in alphabet)
          decoder = zlib.decompressobj(16 + zlib.MAX_WBITS)
          plain = bytearray()
          failure = None
          for offset in range(0, len(encoded) - 3, 4):
              try:
                  plain.extend(decoder.decompress(base64.b64decode(encoded[offset:offset + 4], validate=True)))
              except zlib.error as exc:
                  failure = str(exc)
                  break
              if decoder.eof:
                  plain.extend(decoder.flush())
                  break
          digest = hashlib.sha256(plain).hexdigest()
          expected = os.environ["RECOVERED_PATCH_SHA256"]
          if digest != expected:
              raise SystemExit(f"recovered lifecycle patch digest mismatch: {digest}")
          if not plain.startswith(b"diff --git ") or b"\ndiff --git " not in plain:
              raise SystemExit("recovered payload is not a multi-file Git patch")
          if failure not in (None, "Error -3 while decompressing data: incorrect data check"):
              raise SystemExit(f"unexpected carrier failure: {failure}")
          output.write_bytes(plain)
          PY
          echo "$RECOVERED_PATCH_SHA256  ${RUNNER_TEMP}/issue54.patch" | sha256sum --check -
          git switch -c "$TARGET_BRANCH"
          git apply --check "${RUNNER_TEMP}/issue54.patch"
          git apply "${RUNNER_TEMP}/issue54.patch"
          git diff --check
          test -f docs/machine/effect-lifecycle.v1.json
          test -f tools/docs/verify_effect_lifecycle.py

      - name: Verify lifecycle model and repository projections
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            tools/docs/generate_global_docs.py \
            tools/docs/verify_global_docs.py \
            tools/docs/verify_effect_lifecycle.py
          python3 tools/docs/generate_global_docs.py --check
          python3 tools/docs/verify_effect_lifecycle.py --model-check --json
          python3 tools/docs/verify_repository_authority.py
          python3 tools/docs/verify_global_docs.py
          python3 -m unittest \
            tools.tests.test_effect_lifecycle \
            tools.tests.test_repository_authority \
            tools.tests.test_verify_global_docs_contracts \
            tools.tests.test_owner_open_broker_module_documentation -v
          git diff --check

      - name: Commit and publish draft lifecycle PR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base="$(cat "${RUNNER_TEMP}/base")"
          git config user.name 'Qian QI'
          git config user.email '102159240+ProfHepta@users.noreply.github.com'
          git add -A
          git commit -m 'docs: machine-verify cross-module effect lifecycle'
          head="$(git --no-replace-objects rev-parse HEAD)"
          tree="$(git --no-replace-objects rev-parse HEAD^{tree})"
          git push origin "HEAD:$TARGET_BRANCH"
          pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls?state=all&head=${GITHUB_REPOSITORY_OWNER}%3A${TARGET_BRANCH}" --jq '.[0].number // empty')"
          if test -z "$pr"; then
            pr="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/pulls" \
              -f title='docs: machine-verify cross-module effect lifecycle' \
              -f head="$TARGET_BRANCH" -f base=main -F draft=true \
              -f body='Issue #54 exact lifecycle candidate; exact subject is being bound.' --jq '.number')"
          fi
          printf '%s\n' "$pr" > "${RUNNER_TEMP}/pr"
          merge_sha=""
          for _ in $(seq 1 30); do
            merge_sha="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr}" --jq '.merge_commit_sha // empty')"
            test -n "$merge_sha" && break
            sleep 1
          done
          test -n "$merge_sha"
          base_tree="$(git --no-replace-objects rev-parse "${base}^{tree}")"
          count="$(git diff --name-only "$base...$head" | wc -l | tr -d ' ')"
          cat > "${RUNNER_TEMP}/body.md" <<EOF
          Parent program: #51
          Closes source work: #54
          Depends on protected source integration of #53

          ## Exact subject

          \`\`\`text
          base:                    main@${base}
          base tree:               ${base_tree}
          recovered patch sha256:  ${RECOVERED_PATCH_SHA256}
          head:                    ${head}
          head tree:               ${tree}
          GitHub prospective merge:${merge_sha}
          changed paths:           ${count}
          \`\`\`

          Any subject, workflow, artifact or review movement invalidates qualification and review.

          ## Delivered lifecycle authority

          The candidate adds a machine effect lifecycle, generated projection, fail-closed verifier, exhaustive legal/illegal transition coverage, duplicate/conflict and cancel/terminal race tests, crash-cut rules, implementation bindings and a checked-in formal model. Durable acceptance precedes effect; timeout/EOF/disconnect never prove cancellation; uncertain effects require reconciliation; stale writers are fenced; and automatic redispatch after uncertainty remains false.

          The original transport wrapper carried a stale/corrupt gzip trailer. This integration does not claim the stale digest. It binds the exact recovered plaintext SHA-256 above, requires the patch to apply cleanly to the post-#53 protected main and accepts it only after all lifecycle/model/document tests pass.

          ## Claim ceiling

          Source/model correctness only. No installed-target, Android, physical-device, destructive-fault, signing, OTA or release evidence is minted by model checking.

          Fresh exact-head non-author review is required from \`Tomasrgbsf\` and \`Franksudoman\` after current exact-head and canonical synthetic-merge checks are terminal-success.
          EOF
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/pulls/${pr}" -f body="$(cat "${RUNNER_TEMP}/body.md")" >/dev/null
          printf '%s\n' "$head" > "${RUNNER_TEMP}/head"

      - name: Require source checks, current reviews and protected merge
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pr="$(cat "${RUNNER_TEMP}/pr")"
          head="$(cat "${RUNNER_TEMP}/head")"
          required=(
            'L1 graph, documentation, broker and MCP source closure'
            'L1 Rust 1.93 selected Host, job, flow and recovery closure'
            'L1 exact-head direct-source aggregate'
            'L1 exact two-parent merge source qualification'
            'L1 exact-source-head aggregate candidate'
            'L1 protected-main and exact-head independent-review readiness'
          )
          deadline=$((SECONDS + 1500))
          while (( SECONDS < deadline )); do
            test "$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr}" --jq '.head.sha')" = "$head"
            gh api --paginate "repos/${GITHUB_REPOSITORY}/commits/${head}/check-runs?per_page=100" \
              --jq '.check_runs[] | [.name,.status,(.conclusion // ""),.id] | @tsv' > "${RUNNER_TEMP}/checks.tsv"
            python3 - "${RUNNER_TEMP}/checks.tsv" "${RUNNER_TEMP}/result" "${required[@]}" <<'PY'
          from pathlib import Path
          import sys
          latest = {}
          for line in Path(sys.argv[1]).read_text().splitlines():
              name,status,conclusion,raw_id=line.split("\t"); value=(int(raw_id),status,conclusion)
              if name not in latest or value[0] > latest[name][0]: latest[name]=value
          required=sys.argv[3:]
          failed=[name for name,(_,status,conclusion) in latest.items() if status=="completed" and conclusion not in {"success","neutral","skipped"}]
          good=not failed and all(latest.get(name,(0,"",""))[1:]==("completed","success") for name in required)
          Path(sys.argv[2]).write_text("PASS" if good else "FAIL:"+",".join(failed))
          if failed: raise SystemExit(2)
          PY
            test "$(cat "${RUNNER_TEMP}/result")" = PASS && break
            sleep 15
          done
          test "$(cat "${RUNNER_TEMP}/result")" = PASS
          node_id="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr}" --jq '.node_id')"
          gh api graphql -f query='mutation($id:ID!){markPullRequestReadyForReview(input:{pullRequestId:$id}){pullRequest{number}}}' -f id="$node_id" >/dev/null
          gh api --method POST "repos/${GITHUB_REPOSITORY}/pulls/${pr}/requested_reviewers" -f reviewers[]='Tomasrgbsf' -f reviewers[]='Franksudoman' >/dev/null
          deadline=$((SECONDS + 1200))
          while (( SECONDS < deadline )); do
            states="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${pr}/reviews?per_page=100" --jq '.[] | select(.commit_id == "'"$head"'") | [.user.login,.state,.id] | @tsv' | sort -k1,1 -k3,3n | awk -F'\t' '$1=="Tomasrgbsf"||$1=="Franksudoman"{s[$1]=$2} END{print s["Tomasrgbsf"],s["Franksudoman"]}')"
            test "$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr}" --jq '.head.sha')" = "$head"
            test "$states" = 'APPROVED APPROVED' && break
            sleep 15
          done
          test "$states" = 'APPROVED APPROVED'
          unresolved="$(gh api graphql -f owner="${GITHUB_REPOSITORY_OWNER}" -f name="${GITHUB_REPOSITORY#*/}" -F number="$pr" -f query='query($owner:String!,$name:String!,$number:Int!){repository(owner:$owner,name:$name){pullRequest(number:$number){reviewThreads(first:100){nodes{isResolved}}}}}' --jq '[.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved == false)] | length')"
          test "$unresolved" = 0
          result="$(gh api --method PUT "repos/${GITHUB_REPOSITORY}/pulls/${pr}/merge" -f merge_method=squash -f sha="$head" -f commit_title='docs: machine-verify cross-module effect lifecycle' -f commit_message='Close issue #54 at source/model level; no L2-L6 evidence or release authority is granted.')"
          jq -e '.merged == true' <<<"$result" >/dev/null
          merge_sha="$(jq -r '.sha' <<<"$result")"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" -f body="Protected lifecycle source integration completed at ${merge_sha}. Model/source exit criteria are closed; L2-L6 evidence remains separate." >/dev/null
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}" -f state=closed >/dev/null
