name: G1 clock-domain exact-head publisher v4

"on":
  push:
    branches:
      - ops/g1-synthetic-retirement-fix-20260906
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g1-clock-domain-publisher-v4
  cancel-in-progress: false

env:
  TARGET_BRANCH: codex/g1-all-gap-closure-20260904
  BASELINE_HEAD: 9420aac7ec2a8c88416f00115031885f72227ccc
  PYTHONDONTWRITEBYTECODE: "1"
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Read-only full validation
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    outputs:
      target_head: ${{ steps.finalize.outputs.target_head }}
      result_tree: ${{ steps.finalize.outputs.result_tree }}
      patch_sha256: ${{ steps.finalize.outputs.patch_sha256 }}
      paths_sha256: ${{ steps.finalize.outputs.paths_sha256 }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fixed prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=2 update
          sudo apt-get -o Acquire::Retries=2 install --yes --no-install-recommends acl

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"

      - name: Fixed Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.93.0 --profile minimal --component rustfmt --component clippy --no-self-update
          rustup default 1.93.0
          rustc --version | grep -F 'rustc 1.93.0 '
          cargo --version | grep -F 'cargo 1.93.0 '

      - name: Construct candidate in isolated worktree
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          target_head="$(git --no-replace-objects rev-parse "refs/remotes/origin/${TARGET_BRANCH}^{commit}")"
          git --no-replace-objects merge-base --is-ancestor "$BASELINE_HEAD" "$target_head"
          mapfile -t prior_paths < <(git --no-replace-objects diff --name-only "$BASELINE_HEAD..$target_head")
          for path in "${prior_paths[@]}"; do
            case "$path" in
              __schema_probe__|tools/owner-open/build_owner_open_rootfs_image_release_v2.py|tools/owner-open/jsonl_provider_runtime.py) ;;
              *) echo "unexpected target drift since baseline: $path" >&2; exit 1 ;;
            esac
          done
          work="${RUNNER_TEMP}/g1-clock-domain-target-v4"
          test ! -e "$work"
          git worktree add --detach "$work" "$target_head"
          printf '%s\n' "$target_head" > "${RUNNER_TEMP}/target-head-v4"
          cd "$work"
          rm -f -- __schema_probe__
          python3 - <<'PY'
          from pathlib import Path

          def patch(path: Path, start_marker: str, end_marker: str) -> None:
              text = path.read_text(encoding="utf-8")
              alias = (
                  "from time import monotonic as _retirement_monotonic\n"
                  "from time import sleep as _retirement_sleep\n"
              )
              if alias not in text:
                  marker = "import time\n"
                  if text.count(marker) != 1:
                      raise SystemExit(f"unexpected time import shape: {path}")
                  text = text.replace(marker, marker + alias, 1)
              start = text.index(start_marker)
              end = text.index(end_marker, start)
              region = text[start:end]
              region = region.replace("time.monotonic()", "_retirement_monotonic()")
              region = region.replace("time.sleep(", "_retirement_sleep(")
              if "time.monotonic()" in region or "time.sleep(" in region:
                  raise SystemExit(f"retirement clock remained coupled: {path}")
              path.write_text(text[:start] + region + text[end:], encoding="utf-8")

          patch(Path("tools/owner-open/build_owner_open_rootfs_image_release_v2.py"), "def _quiet_group(", "\n\ndef bounded_command(")
          patch(Path("tools/owner-open/jsonl_provider_runtime.py"), "def _group_quiet(", "\n\ndef _status(")
          PY
          git diff --check
          mapfile -t changed < <(git diff --name-only)
          printf '%s\n' "${changed[@]}"
          for path in "${changed[@]}"; do
            case "$path" in
              __schema_probe__|tools/owner-open/build_owner_open_rootfs_image_release_v2.py|tools/owner-open/jsonl_provider_runtime.py) ;;
              *) echo "unexpected constructed path: $path" >&2; exit 1 ;;
            esac
          done
          grep -F 'from time import monotonic as _retirement_monotonic' tools/owner-open/build_owner_open_rootfs_image_release_v2.py
          grep -F 'from time import monotonic as _retirement_monotonic' tools/owner-open/jsonl_provider_runtime.py

      - name: Exact regressions and lifecycle suites
        working-directory: ${{ runner.temp }}/g1-clock-domain-target-v4
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest tools.tests.test_build_owner_open_rootfs_image_release_v2.RootfsCommandBoundaryTest.test_timeout_after_descendant_readiness_retires_group -v
          python3 -m unittest tools.tests.test_jsonl_provider_runtime.ProviderRetirementTest.test_handler_timeout_fences_its_response -v
          python3 -m unittest tools.tests.test_build_owner_open_rootfs_image_release_v2.RootfsCommandBoundaryTest -v
          python3 -m unittest tools.tests.test_jsonl_provider_runtime.ProviderRetirementTest -v

      - name: Full Python, Rust and baseline qualification
        working-directory: ${{ runner.temp }}/g1-clock-domain-target-v4
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/docs/generate_global_docs.py --check
          python3 tools/docs/verify_global_docs.py
          python3 -m unittest discover -s tools/tests -p 'test*.py' -v
          cargo fmt --all -- --check
          cargo test --locked --all-targets
          cargo clippy --locked --all-targets -- -D warnings
          cargo fmt --manifest-path planned/Cargo.toml --all -- --check
          cargo test --locked --manifest-path planned/Cargo.toml --workspace --all-targets
          cargo clippy --locked --manifest-path planned/Cargo.toml --workspace --all-targets -- -D warnings
          python3 tools/perf/run_global_baseline.py --output "${RUNNER_TEMP}/g1-clock-domain-baseline-v4.json" --repetitions 1
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          p = Path(os.environ['RUNNER_TEMP']) / 'g1-clock-domain-baseline-v4.json'
          artifact = json.loads(p.read_text())
          clone = dict(artifact); clone['artifact_digest'] = ''
          encoded = json.dumps(clone, sort_keys=True, separators=(',', ':'), ensure_ascii=True).encode()
          assert artifact['artifact_digest'] == hashlib.sha256(encoded).hexdigest()
          assert artifact['qualification'] == 'SOURCE_EVIDENCE_ONLY'
          assert artifact['gate']['passed'] is False
          PY

      - name: Finalize immutable result identity
        id: finalize
        working-directory: ${{ runner.temp }}/g1-clock-domain-target-v4
        shell: bash
        run: |
          set -euo pipefail
          target_head="$(cat "${RUNNER_TEMP}/target-head-v4")"
          git diff --check
          git add -A -- .
          git diff --cached --binary --full-index > "${RUNNER_TEMP}/clock-domain-v4.patch"
          git diff --cached --name-only > "${RUNNER_TEMP}/clock-domain-v4.paths"
          test -s "${RUNNER_TEMP}/clock-domain-v4.paths" || {
            # An already published canonical tree is a valid no-op identity.
            test "$(git --no-replace-objects write-tree)" = "$(git --no-replace-objects rev-parse HEAD^{tree})"
          }
          result_tree="$(git --no-replace-objects write-tree)"
          patch_sha256="$(sha256sum "${RUNNER_TEMP}/clock-domain-v4.patch" | awk '{print $1}')"
          paths_sha256="$(sha256sum "${RUNNER_TEMP}/clock-domain-v4.paths" | awk '{print $1}')"
          test -z "$(git diff --name-only)"
          {
            echo "target_head=$target_head"
            echo "result_tree=$result_tree"
            echo "patch_sha256=$patch_sha256"
            echo "paths_sha256=$paths_sha256"
          } >> "$GITHUB_OUTPUT"

  publish:
    name: Reconstruct and push with exact lease
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Reconstruct without executing repository programs
        id: reconstruct
        shell: bash
        env:
          EXPECTED_HEAD: ${{ needs.validate.outputs.target_head }}
          EXPECTED_TREE: ${{ needs.validate.outputs.result_tree }}
          EXPECTED_PATCH: ${{ needs.validate.outputs.patch_sha256 }}
          EXPECTED_PATHS: ${{ needs.validate.outputs.paths_sha256 }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          current="$(git --no-replace-objects rev-parse "refs/remotes/origin/${TARGET_BRANCH}^{commit}")"
          test "$current" = "$EXPECTED_HEAD"
          work="${RUNNER_TEMP}/g1-clock-domain-publish-v4"
          git worktree add --detach "$work" "$current"
          cd "$work"
          rm -f -- __schema_probe__
          python3 - <<'PY'
          from pathlib import Path

          def patch(path: Path, start_marker: str, end_marker: str) -> None:
              text = path.read_text(encoding="utf-8")
              alias = "from time import monotonic as _retirement_monotonic\nfrom time import sleep as _retirement_sleep\n"
              if alias not in text:
                  marker = "import time\n"
                  if text.count(marker) != 1:
                      raise SystemExit(f"unexpected time import shape: {path}")
                  text = text.replace(marker, marker + alias, 1)
              start = text.index(start_marker); end = text.index(end_marker, start)
              region = text[start:end].replace("time.monotonic()", "_retirement_monotonic()").replace("time.sleep(", "_retirement_sleep(")
              if "time.monotonic()" in region or "time.sleep(" in region:
                  raise SystemExit(f"retirement clock remained coupled: {path}")
              path.write_text(text[:start] + region + text[end:], encoding="utf-8")

          patch(Path("tools/owner-open/build_owner_open_rootfs_image_release_v2.py"), "def _quiet_group(", "\n\ndef bounded_command(")
          patch(Path("tools/owner-open/jsonl_provider_runtime.py"), "def _group_quiet(", "\n\ndef _status(")
          PY
          git diff --check
          git add -A -- .
          git diff --cached --binary --full-index > "${RUNNER_TEMP}/clock-domain-publish-v4.patch"
          git diff --cached --name-only > "${RUNNER_TEMP}/clock-domain-publish-v4.paths"
          test "$(sha256sum "${RUNNER_TEMP}/clock-domain-publish-v4.patch" | awk '{print $1}')" = "$EXPECTED_PATCH"
          test "$(sha256sum "${RUNNER_TEMP}/clock-domain-publish-v4.paths" | awk '{print $1}')" = "$EXPECTED_PATHS"
          test "$(git --no-replace-objects write-tree)" = "$EXPECTED_TREE"
          test -z "$(git diff --name-only)"
          if git diff --cached --quiet; then
            echo "no_change=true" >> "$GITHUB_OUTPUT"
            echo "commit=$current" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'OpenAI Codex'
          git config user.email 'noreply@openai.com'
          git commit -m 'fix(runtime): isolate execution and retirement clocks' \
            -m 'Bind TERM/KILL observation to independent monotonic callables so deterministic execution-time jumps cannot expire cleanup confirmation. Cleanup remains fail-closed. Full Python and Rust source qualification passed in the read-only validation job; no target, device, fault, signing, promotion, or release claim is made.' \
            -m 'Signed-off-by: OpenAI Codex <noreply@openai.com>'
          commit="$(git --no-replace-objects rev-parse HEAD)"
          test "$(git --no-replace-objects rev-parse HEAD^)" = "$current"
          test "$(git --no-replace-objects rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          echo "no_change=false" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Exact-lease push
        if: ${{ steps.reconstruct.outputs.no_change != 'true' }}
        working-directory: ${{ runner.temp }}/g1-clock-domain-publish-v4
        shell: bash
        env:
          EXPECTED_HEAD: ${{ needs.validate.outputs.target_head }}
          RESULT_COMMIT: ${{ steps.reconstruct.outputs.commit }}
          G1_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk 'NR==1 {print $1}')" = "$EXPECTED_HEAD"
          auth="$(printf 'x-access-token:%s' "$G1_TOKEN" | base64 -w0)"
          git -c "http.extraheader=AUTHORIZATION: basic ${auth}" push \
            "--force-with-lease=refs/heads/${TARGET_BRANCH}:${EXPECTED_HEAD}" \
            origin "${RESULT_COMMIT}:refs/heads/${TARGET_BRANCH}"
          unset G1_TOKEN auth
